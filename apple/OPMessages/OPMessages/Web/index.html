<!-- Aperçu de travail (16 novembre 2026) : le PROTOTYPE d'OP MESSAGES, CÔTÉ PRO, refait de A à Z à la demande de Justin (« refais tout, style
     Apple », « concentre-toi sur le côté pro »). Les rubriques sont celles de la vraie application : Tableau de bord, Messages, Contacts, Appels,
     Réunions, Agenda, Courrier, et le Profil. DONNÉES ENTIÈREMENT FICTIVES (« Clim Services 17 », adresses en .example), aucun appel à un serveur,
     rien ne s'enregistre. Ce n'est PAS OP MESSAGES : la vraie page est servie par server-msg/.
     ⛔ CETTE PAGE EST FABRIQUÉE : ses parties sont dans design/opmessages/prototype/ (assembler.sh). On modifie les parties, jamais ce fichier.
     ⛔ LE COURRIER N'EST PAS UNE MAQUETTE (Justin : « la boîte mail, je veux celle qui était ») : la rubrique monte le VRAI module opcourrier.js,
     chargé à côté de cette page, avec sa source de démonstration. -->
<style>
/* ══ PROTOTYPE D'OP MESSAGES, CÔTÉ PRO — REFONTE TOTALE (17 novembre 2026). Justin : « je vois pas vraiment de différence […] prends les meilleures
   applications pro pour les réunions, les appels, les messages, les mails, l'agenda, et fais-moi ça mieux. Je veux une refonte totale. »
   Ce qui change de forme, d'après Teams, Slack, Zoom, Spike et Superhuman : un CADRE bleu (rail d'icônes + barre de recherche) autour d'un espace de
   travail arrondi ; des messages en LIGNES (auteur, heure, texte) avec leurs gestes au survol, plus de bulles ; une liste de conversations en
   sections avec filtres ; un fil « Activité » ; un agenda en GRILLE HORAIRE ; des cartes bordées, des angles moins ronds, 14 px au bureau. ══ */
:root{
  --cadre:#0f1b47; --cadre2:#1b3384; --fond:#f6f7fb; --carte:#fff; --bord:#e3e6ee; --texte:#131a2c; --second:#5a6377; --faible:#99a1b3; --accent:#2d5be0; --fill:#2d5be0;
  --doux:#e7eeff; --champ:#eef0f6; --survol:#f1f3f8; --sel:#e3ebff; --vert:#12a150; --vert-doux:#e3f6ea; --rouge:#e5484d; --rouge-doux:#fde8e8; --orange:#d97706; --orange-doux:#fdf0d9;
  --ombre:0 10px 30px rgba(15,23,60,.14),0 1px 3px rgba(15,23,60,.08); --r:12px; --ressort:cubic-bezier(.2,.9,.25,1);
}
:root[data-theme="dark"]{
  --cadre:#050b1f; --cadre2:#050b1f; --fond:#0c1530; --carte:#131e40; --bord:#25325e; --texte:#eef2ff; --second:#a9b4d6; --faible:#6d7aa4; --accent:#9db9ff; --fill:#3f6df0;
  --doux:#1b2a58; --champ:#19254e; --survol:#18244b; --sel:#1f3068; --vert:#34c26a; --vert-doux:#143524; --rouge:#ff6b6f; --rouge-doux:#3d1a22; --orange:#f2a93b; --orange-doux:#3a2a12;
  --ombre:0 10px 30px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:14px/20px -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--texte);background:var(--cadre);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:inherit} a{color:inherit;text-decoration:none}
svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:17px;line-height:24px;font-weight:700;letter-spacing:-.01em} h2{font-size:20px;line-height:26px;font-weight:700;letter-spacing:-.01em} h3{font-size:12px;line-height:16px;font-weight:600;color:var(--second)}
.gris{color:var(--second)} .petit{font-size:12.5px;line-height:17px} .tab{font-variant-numeric:tabular-nums} .coupe{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ── le cadre : la barre du haut (recherche), le rail, l'espace de travail arrondi ── */
#cadre{position:fixed;inset:0;height:var(--haut,100%);display:grid;grid-template-columns:76px minmax(0,1fr);grid-template-rows:50px minmax(0,1fr);background:linear-gradient(165deg,var(--cadre2),var(--cadre) 55%)}
#haut{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 12px 0 14px;color:#fff}
.marque{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px;letter-spacing:.02em;white-space:nowrap;width:210px;flex:none}
.marque i{width:28px;height:28px;border-radius:8px;background:#fff;color:var(--cadre);display:grid;place-items:center;font-size:8px;line-height:9px;font-weight:800;font-style:normal;text-align:center;flex:none}
.marque em{font-size:9.5px;line-height:15px;font-weight:700;font-style:normal;letter-spacing:.06em;background:rgba(255,255,255,.2);padding:0 6px;border-radius:5px}
.chercher{flex:1;min-width:0;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:9px;background:rgba(255,255,255,.14);color:rgba(255,255,255,.85);font-size:13.5px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.chercher span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left} .chercher kbd{font:inherit;font-size:11.5px;padding:0 6px;border-radius:5px;background:rgba(255,255,255,.16)}
.h-droite{display:flex;align-items:center;gap:6px;width:210px;justify-content:flex-end;flex:none}
.h-btn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;position:relative} .h-btn em{position:absolute;top:1px;right:0;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--rouge);color:#fff;font-size:10.5px;line-height:16px;font-weight:700;font-style:normal;text-align:center}
.h-btn[aria-current]{background:rgba(255,255,255,.2)} .h-moi{border-radius:11px;padding:2px}
.cote{grid-column:1;grid-row:2;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 6px 10px;min-height:0;overflow-y:auto;scrollbar-width:none}
.cote a{display:flex;flex-direction:column;align-items:center;gap:3px;width:64px;padding:7px 0 5px;border-radius:11px;color:rgba(255,255,255,.72);font-size:10.5px;line-height:13px;font-weight:500;position:relative}
.cote a svg{width:22px;height:22px} .cote a[aria-current]{background:rgba(255,255,255,.17);color:#fff;font-weight:700}
.cote a em{position:absolute;top:3px;right:9px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--rouge);color:#fff;font-size:10.5px;line-height:16px;font-weight:700;font-style:normal;text-align:center}
.cote .creer{margin-top:auto;width:44px;height:44px;border-radius:14px;background:#fff;color:var(--cadre);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.25)} .cote .creer svg{width:22px;height:22px;stroke-width:2.2}
#app{grid-column:2;grid-row:2;margin:0 8px 8px 0;border-radius:14px;overflow:hidden;background:var(--fond);display:grid;min-width:0;min-height:0;position:relative}
#scene,#courrier-fixe{grid-area:1/1;min-width:0;min-height:0}
#scene{display:grid;grid-template-columns:minmax(0,1fr)} #scene.deux{grid-template-columns:clamp(290px,29vw,370px) minmax(0,1fr)}
.col{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--fond)} .col.liste{background:var(--carte);border-right:1px solid var(--bord)}
.barre{flex:none;min-height:56px;display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--carte);border-bottom:1px solid var(--bord);position:relative;z-index:2}
.col.liste .barre{border-bottom:0} .barre h1{flex:1;min-width:0} .barre .pousse{flex:1}
.defile{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.page{padding:22px 26px 34px;display:flex;flex-direction:column;gap:18px;max-width:1240px;width:100%;margin:0 auto}
.rond{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--second);flex:none;position:relative} .rond.plein{background:var(--fill);color:#fff} .rond.gris{background:var(--champ)}
.lien{color:var(--accent);font-weight:600;font-size:13.5px;padding:4px 2px} .retour{display:none}

/* ── les pièces ── */
.av{width:36px;height:36px;border-radius:30%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;background:linear-gradient(160deg,var(--a1,#4f78d6),var(--a2,#2a4a9c));position:relative;letter-spacing:.02em}
.av.p{width:26px;height:26px;font-size:10px} .av.m{width:30px;height:30px;font-size:11px} .av.g{width:56px;height:56px;font-size:20px} .av.xl{width:88px;height:88px;font-size:32px}
.av u{position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;border-radius:50%;background:var(--vert);border:2px solid var(--carte);text-decoration:none} .av u.occ{background:var(--orange)} .av u.abs{background:var(--faible)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:0 14px;border-radius:9px;background:var(--fill);color:#fff;font-weight:600;font-size:13.5px;white-space:nowrap;flex:none}
.btn.gris{background:var(--carte);color:var(--texte);box-shadow:inset 0 0 0 1px var(--bord)} .btn.rouge{background:var(--rouge)} .btn.vert{background:var(--vert)} .btn.large{width:100%;min-height:42px;font-size:14.5px}
.btn svg{width:16px;height:16px} .btn:disabled{opacity:.4;cursor:default}
.carte,.groupe,.tuile-b{background:var(--carte);border:1px solid var(--bord);border-radius:var(--r);overflow:hidden} .carte.pad{padding:14px 16px}
.rang{display:flex;align-items:center;gap:12px;min-height:46px;padding:9px 14px;width:100%;position:relative}
.rang+.rang{border-top:1px solid var(--bord)}
.rang .t{flex:1;min-width:0} .rang .t b{display:block;font-weight:600;font-size:14px;line-height:19px} .rang .t span{display:block;color:var(--second);font-size:12.5px;line-height:17px}
.rang .v{color:var(--second);font-size:13px;white-space:nowrap} .rang>svg.ch{width:14px;height:14px;color:var(--faible)}
.rang .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--fill)) 14%,transparent);color:var(--c,var(--fill));flex:none} .rang .ic svg{width:17px;height:17px}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--champ);max-width:100%} .seg button{min-height:28px;padding:0 14px;border-radius:7px;font-size:13px;font-weight:600;color:var(--second);white-space:nowrap;flex:1}
.seg button[aria-pressed="true"]{background:var(--carte);color:var(--texte);box-shadow:0 1px 3px rgba(15,23,60,.14)}
.filtres{display:flex;gap:6px;padding:2px 14px 10px;overflow-x:auto;scrollbar-width:none;flex:none} .filtres::-webkit-scrollbar{display:none}
.filtres button{flex:none;min-height:28px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--second);box-shadow:inset 0 0 0 1px var(--bord);white-space:nowrap} .filtres button[aria-pressed="true"]{background:var(--texte);color:var(--carte);box-shadow:none} .filtres button b{font-weight:700;opacity:.7;margin-left:4px}
.bascule{width:40px;height:24px;border-radius:12px;background:var(--faible);position:relative;flex:none;transition:background .2s} .bascule::after{content:"";position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .22s var(--ressort)}
.bascule[aria-checked="true"]{background:var(--vert)} .bascule[aria-checked="true"]::after{transform:translateX(16px)}
.cherche{display:flex;align-items:center;gap:7px;height:34px;padding:0 10px;border-radius:9px;background:var(--champ);color:var(--second);margin:0 14px 10px;flex:none} .cherche svg{width:15px;height:15px} .cherche input{flex:1;min-width:0;border:0;background:none;outline:0;color:var(--texte)}
.pastille{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:700;line-height:18px;background:var(--champ);color:var(--second);white-space:nowrap}
.pastille.b{background:var(--doux);color:var(--accent)} .pastille.r{background:var(--rouge-doux);color:var(--rouge)} .pastille.v{background:var(--vert-doux);color:var(--vert)} .pastille.o{background:var(--orange-doux);color:var(--orange)}
.vide{flex:1;display:grid;place-items:center;text-align:center;color:var(--second);padding:30px} .vide div{max-width:300px;display:flex;flex-direction:column;align-items:center;gap:12px}
.vide i{width:60px;height:60px;border-radius:18px;background:var(--doux);color:var(--accent);display:grid;place-items:center} .vide i svg{width:26px;height:26px}
.titre-s{padding:6px 2px 8px} .note{font-size:12.5px;line-height:17px;color:var(--second);padding:0 14px}
.champ{display:flex;flex-direction:column;gap:5px} .champ>span{font-size:12.5px;font-weight:600;color:var(--second)}
.champ input,.champ select,.champ textarea{min-height:38px;border-radius:9px;border:1px solid var(--bord);background:var(--carte);padding:7px 11px;outline:0;width:100%;resize:none} .champ input:focus,.champ textarea:focus,.champ select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--doux)}
.puces{display:flex;gap:6px;flex-wrap:wrap} .puce{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 11px 0 4px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--bord);font-size:13px;font-weight:500} .puce .av{width:24px;height:24px;font-size:9px}
.puce[aria-pressed="true"]{background:var(--fill);color:#fff;box-shadow:none}
.statut{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--second)} .statut i{width:8px;height:8px;border-radius:50%;background:var(--vert)} .statut.occ i{background:var(--orange)} .statut.abs i{background:var(--faible)} .statut.npd i{background:var(--rouge)}

/* ── Accueil : ma journée à gauche, ce qui attend à droite ── */
.bonjour{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap} .bonjour>div{flex:1;min-width:220px} .bonjour h2{font-size:26px;line-height:32px} .bonjour p{color:var(--second);margin-top:2px}
.gestes{display:flex;gap:8px;flex-wrap:wrap}
.acc{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.tuile-b>header{display:flex;align-items:center;gap:8px;padding:13px 16px 9px} .tuile-b>header h3{flex:1;font-size:14px;font-weight:700;color:var(--texte)} .tuile-b>header a,.tuile-b>header button{color:var(--accent);font-size:12.5px;font-weight:600}
.tuile-b .rien{padding:4px 16px 16px;color:var(--second)}
.prochaine{margin:0 12px 10px;padding:12px 14px;border-radius:11px;background:var(--fill);color:#fff;display:flex;align-items:center;gap:12px} .prochaine .t{flex:1;min-width:0} .prochaine b{display:block;font-size:15px;line-height:20px} .prochaine .t>span{display:block;font-size:12.5px;opacity:.85}
.prochaine .btn{background:#fff;color:var(--fill)}
.coche{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--faible);flex:none;display:grid;place-items:center;color:#fff;position:relative} .coche[aria-checked="true"]{background:var(--fill);border-color:var(--fill)} .coche svg{width:13px;height:13px;stroke-width:2.6;display:none} .coche[aria-checked="true"] svg{display:block}
.rang.fait .t b{color:var(--second);text-decoration:line-through;font-weight:500}
.presence{display:flex;gap:14px;padding:4px 16px 16px;flex-wrap:wrap} .presence a{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;width:60px;text-align:center}
.act{display:flex;gap:12px;padding:11px 16px;align-items:flex-start;position:relative} .act+.act{border-top:1px solid var(--bord)} .act .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.act .t{flex:1;min-width:0} .act .t b{display:block;font-weight:600} .act .t p{color:var(--second);font-size:13px;line-height:18px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden} .act time{font-size:12px;color:var(--faible);white-space:nowrap}
.act .ges{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap} .act .ges .btn{min-height:30px;padding:0 11px;font-size:12.5px}

/* ── listes : conversations (en sections), contacts, appels, réunions ── */
.section-l{display:flex;align-items:center;gap:6px;padding:12px 18px 5px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--faible)}
.ligne{display:flex;align-items:center;gap:11px;padding:8px 10px;margin:1px 8px;border-radius:10px;position:relative;width:calc(100% - 16px)}
.ligne .t{flex:1;min-width:0} .ligne .l1{display:flex;align-items:baseline;gap:8px} .ligne .l1 b{flex:1;min-width:0;font-weight:500;font-size:14px;line-height:19px} .ligne time,.ligne .h{font-size:12px;color:var(--faible);white-space:nowrap}
.ligne .ap{color:var(--second);font-size:13px;line-height:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ligne.nl .l1 b{font-weight:700} .ligne.nl .ap{color:var(--texte)} .ligne .n{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--fill);color:#fff;font-size:11.5px;font-weight:700;line-height:20px;text-align:center;flex:none}
.ligne[aria-current]{background:var(--sel);box-shadow:inset 3px 0 0 var(--accent)} .ligne.manque .l1 b{color:var(--rouge)}
.ligne .sens{width:14px;height:14px;margin-right:4px;vertical-align:-2px} .ligne .diese{width:36px;height:36px;border-radius:30%;display:grid;place-items:center;background:var(--champ);color:var(--second);font-weight:700;font-size:16px;flex:none}

/* ── la conversation : des LIGNES (auteur, heure, texte), les gestes au survol ── */
.qui{display:flex;align-items:center;gap:10px;min-width:0;flex:1} .qui>span:not(.av){min-width:0} .qui b{display:flex;align-items:center;gap:5px;font-size:15px;font-weight:700} .qui b svg{width:12px;height:12px;color:var(--faible)} .qui small{display:block;font-size:12px;color:var(--second);line-height:15px}
.fil{flex:1;min-height:0;overflow-y:auto;padding:10px 0 14px;display:flex;flex-direction:column;overscroll-behavior:contain;background:var(--carte)}
.jour{align-self:center;font-size:12px;font-weight:700;color:var(--second);padding:3px 12px;margin:10px 0 6px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--bord);background:var(--carte)}
.msg{display:grid;grid-template-columns:36px minmax(0,1fr);column-gap:11px;padding:5px 22px;position:relative} .msg.suite{padding-top:1px} .msg.suite>.av{visibility:hidden;height:0}
.msg .ent{display:flex;align-items:baseline;gap:8px;grid-column:2} .msg .ent b{font-weight:700} .msg .ent time{font-size:12px;color:var(--faible)} .msg.suite .ent{display:none}
.msg>.av{grid-row:1/span 4} .msg .corps{grid-column:2;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.bulle{font-size:14.5px;line-height:21px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%;cursor:default}
.msg .cite{display:block;font-size:13px;line-height:18px;color:var(--second);padding:1px 0 1px 9px;margin-bottom:3px;border-left:3px solid var(--bord)}
.msg .lu{font-size:12px;color:var(--faible)}
.reacs{display:flex;gap:4px} .reacs span{font-size:13px;line-height:22px;padding:0 8px;border-radius:999px;background:var(--doux);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent)}
.outils{display:none;position:absolute;right:20px;top:-14px;padding:3px;border-radius:10px;background:var(--carte);box-shadow:0 0 0 1px var(--bord),0 4px 12px rgba(15,23,60,.12);gap:1px;z-index:1}
.outils button{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--second);font-size:15px} .outils button svg{width:16px;height:16px}
.bulle.piece{padding:10px 12px;border-radius:12px;border:1px solid var(--bord);background:var(--carte)}

   Un seul fichier, aucune dépendance, aucun appel réseau de sa part — tout ce qu'il lit et écrit passe par l'ADAPTATEUR (la « source »)
   que l'hôte lui donne. Ce fichier ne contient AUCUNE donnée d'exemple : sans boîte connectée, il montre un état vide qui invite à en ajouter une.

   ── Monter ──────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
     var c = OPCourrier.monter(document.getElementById('zone'), {
       source: maSource,                 // OBLIGATOIRE — l'adaptateur de données (contrat plus bas)
       cotes: ['pro'],                   // ['pro'], ['perso'] ou les deux ; le sélecteur Pro / Perso n'apparaît que s'il y en a deux
       cote: 'pro',                      // côté ouvert au départ (sinon celui que la personne avait choisi)
       cleStockage: 'elanB_courrier',    // clé du localStorage (réglages, tri appris, brouillons) : UNE par entreprise et par appareil
       theme: function(){ return 'jour' }, // 'jour' | 'nuit' ; à défaut, l'appareil (prefers-color-scheme)
       titre: 'OP Courrier',             // nom affiché dans la barre latérale
       onCompter: function(n){},         // nombre de messages non lus en réception (pastille de l'hôte)
       son: 'sons/courrier.mp3',         // le son d'un nouveau mail (adresse relative à la page de l'hôte, même origine) ; false : pas de son, et le réglage « Son des nouveaux mails » n'est pas proposé
       titreDocument: false,             // true : « (n) » (non lus) s'écrit devant le titre de la page de l'hôte, qui lui est rendu au démontage
       intervalle: 60000                 // relevé automatique de la source, en ms (0 : jamais)
     });
     c.demonter();  c.cote('perso');  c.rafraichir();  c.rafraichir({donnees:false});   // thème + format seuls
     c.ecrire('contact@exemple.fr', 'Objet');   // ouvre un nouveau message vers cette adresse (rend faux, sans rien ouvrir, tant qu'aucune boîte n'est connectée)

   Le conteneur doit avoir une HAUTEUR définie (le module la remplit). Il vit dans un arbre d'ombre : sa feuille ne touche pas l'hôte, celle de
   l'hôte ne le touche pas. Les feuilles, menus et la notification passent dans la couche supérieure du navigateur (au-dessus de la barre de l'hôte).
   La mise en page (Mac ≥ 1000 px, iPad 700–999, iPhone < 700) se décide sur la LARGEUR DU CONTENEUR, pas sur celle de l'écran.

   ── Le contrat de l'adaptateur ───────────────────────────────────────────────────────────────────────────────────────────────────────────
   Toutes les méthodes sont asynchrones (elles rendent une promesse). Un échec = un rejet avec un Error dont le message est lisible : le module le DIT à l'écran.
   « Liste vide » et « on n'a pas pu savoir » ne se confondent jamais : un rejet n'est PAS un tableau vide.
     capacites()                 → { moi?:string (le nom sous lequel la personne connectée est « assignée » : « Assignés à moi »),  oauth, programmeServeur, signature, marquage, deplacement, reglagesServeur, simulation : booléens (faux par défaut),
                                     journalEnvois (le dossier « Envois TeamOP », lu par envois()), telechargerPiece (le bouton sur chaque pièce reçue, via piece()),
                                     suivi (le suivi d'une demande, via suivi()) : booléens, faux par défaut — le module ne promet RIEN qu'une source ne déclare pas,
                                     dossiers : ['inbox', …] les dossiers que la source remplit (les autres restent sur l'appareil),
                                     destinataires : nombre maximal par message, pj : { nombre, octets } }
     boites()                    → [ { id, email, nom, cote?:'pro'|'perso', fournisseur? } ]   (un rejet est une PANNE qui se dit ; sauf une erreur portant `calme:true` : ce n'est pas une panne,
                                     c'est un espace de test — le module dit son message tel quel, sans « Réessayer », et ne propose pas d'ajouter une boîte)
     messages({boite, dossier})  → [ { id, dossier?, de:{nom,email}, a, objet, apercu?, corps:string|[paragraphes] (absent : lire(id) à l'ouverture),
                                       date:ms, lu, drapeau, pj:[{nom,taille,type}], desinscription?, vip?, destinataires?:[email],
                                       automatique?:boolean (la source a lu les en-têtes : VRAI = envoi automatique ; FAUX = écrit par une personne, ce qui range en Principal ce que le moteur
                                       aurait pris pour une notification sur la seule forme de l'adresse ; absent = le moteur décide seul) } ]
     lire(id)                    → { corps, pj?:[{nom,taille,type,id?}], suivi? }  (facultatif ; pj[].id = l'identifiant de la pièce pour piece() ; suivi = { statut, assigne, par? })
     marquer(id,{lu,drapeau})    et   deplacer(id,dossier)                         (appelés seulement si capacites().marquage / .deplacement ; sinon l'état reste sur l'appareil)
     envoyer(mail)               → rien ; mail = { boite, de, nom, a, objet, texte, pieces:[File], enReponseA? }
                                     enReponseA = l'identifiant (celui de messages()) du message auquel on répond (Répondre, Répondre à tous, réponse rapide) : la source en fait les en-têtes
                                     In-Reply-To / References pour que le fil se reforme chez le destinataire. Absent pour un nouveau message ou un transfert.
     envois()                    → [ { id, a, objet, corps, date:ms, etat?:'echec'|'retard' } ]   (seulement avec capacites().journalEnvois : le journal des e-mails que le SERVEUR envoie, lecture seule)
     piece(idMessage, idPiece)   → Blob                                            (seulement avec capacites().telechargerPiece ; le nom est assaini ici, rien n'est ouvert ni exécuté)
     suivi(id,{statut?,assigne?})→ { statut:'aTraiter'|'enCours'|'resolu', assigne, par? }  (seulement avec capacites().suivi)
     traduire(texte,'fr')→ texte traduit (chaîne)  (seulement avec capacites().traduire : un geste, UN message, jamais tout seul ; rien n'est rangé)
     ajouterBoite(params)        → { id, email, … } ; params = { email, nom, mdp, fournisseur, cote, serveurs }
     retirerBoite(id)
     gererBoites()               → rien                                            (seulement avec capacites().gererBoites : l'hôte ouvre SA gestion des boîtes — liste, déconnexion, reconnexion ; le lien « Gérer les boîtes » n'existe qu'avec elle)
     lireMX(domaine)             → [serveurs]                                      (facultatif : sans lui, jamais d'appel réseau pour reconnaître un domaine d'entreprise)
     simuler(quoi, {boite})                                                        (source de démonstration seulement, avec capacites().simulation)
     signature                   → { envoyer, etat, relancer, annuler, signe, preuve }   (la VRAIE signature : un OBJET, lu seulement avec capacites().signature === true ET ses six méthodes ;
                                     sinon le parcours reste utilisable jusqu'à « Envoyer » et la demande est rangée « Prête »). Toutes asynchrones, un échec = un rejet lisible, que le module DIT.
         envoyer(demande, fichiers) → { id, etat, … }   demande = { titre, type, niveau:'avance'|'simple', jours:7|15|30, relances:boolean, signataires:[{nom,email,telephone}],
                                     contresignature?:{nom,email,telephone} } ; fichiers = [{ nom, blob }] (les PDF gardés sur l'appareil). La source crée, dépose, active : ou tout, ou rien.
                                     Le résultat est la VUE de la demande : { id, etat:'brouillon'|'en_attente'|'ouvert'|'a_contresigner'|'signe'|'refuse'|'annule'|'expire', echeance:ms,
                                     signataires:[{nom,email,contre,etat:'pending'|'viewed'|'signed'|'declined'}], documents:[{n,nom,signe}], preuves:nombre, evenements:[{t,x}] }
         etat(id) · relancer(id) · annuler(id)  → la même vue ;   signe(id, n) → Blob (le PDF signé du document n, à partir de 1) ;   preuve(id, i) → Blob (le dossier de preuve du signataire i, à partir de 1)
   ⛔ Toutes les fonctions de la maquette sont PRÉSENTES et UTILISABLES quelle que soit la source ; « Bientôt » ne s'écrit que sur le geste précis qui exige un service qui n'existe pas :
     oauth (connexion Google / Microsoft sans mot de passe), programmeServeur (envoi à l'heure dite APPLICATION FERMÉE : sinon il part page ouverte), signature (l'ENVOI réel du document à signer :
     le parcours est utilisable jusqu'à « Envoyer »), destinataires (plusieurs destinataires), reglagesServeur (réglages de serveur personnalisés).
*/

  .opc .att-btn{display:inline-flex;align-items:center;gap:6px}.opc .sign-maint{opacity:.6}.opc .sign-maint-note{margin:12px auto 0;max-width:34ch;font-size:13px;line-height:1.45;color:var(--label-2);text-align:center}

  .opc .sp .when{flex:none;font-size:12px;color:var(--label-2);white-space:nowrap}

  .opc .gcard .fld label{min-width:96px;color:var(--label)}
  .opc .sched-custom{gap:6px}
  .opc .gcard .fld.sched-custom label{flex:1 1 auto;min-width:0}
  .opc .sched-custom input{position:relative;flex:none;width:auto;height:26px;padding:0 8px;border-radius:6px;background:var(--fill);text-align:right;font-variant-numeric:tabular-nums;cursor:pointer}
  .opc .sched-custom input::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:auto;height:auto;margin:0;padding:0;opacity:0;cursor:pointer}
  .opc .sched-custom input::-webkit-datetime-edit{padding:0}

  .opc .sched-go{display:flex;justify-content:flex-end;padding:10px 0 0}
  .opc .sched-note{display:flex;gap:6px;align-items:flex-start;padding:10px 4px 0;font-size:11.5px;line-height:1.4;color:var(--label-2)}
  .opc .sched-note svg{width:13px;height:13px;margin-top:1px}
  .opc .sheet.rs{width:min(440px,100%)}
  .opc .sheet.rs .sched{padding:14px 16px 18px}
  .opc .sheet.rs .sched-head b{display:none}

  /* Ajouter un compte : listes groupées façon Réglages */
  .opc .sheet.acct{width:min(520px,100%)}
  .opc .prov-intro{text-align:center;padding:22px 24px 16px}
  .opc .det{display:flex;align-items:center;gap:12px;margin:10px 0 0;padding:11px 12px;border-radius:10px;background:var(--cell);border:var(--hair) solid var(--tint-soft-2)}
  .opc .det.ko{border-color:var(--red)}
  .opc .det .pn{min-width:0;display:flex;flex-direction:column;gap:2px}
  .opc .det .pn b{font-size:13.5px;font-weight:600;color:var(--label)}
  .opc .det .pn span{font-size:12px;line-height:1.35;color:var(--label-2)}
  .opc .det .ptile{flex:none}
  .opc .det .pn .ok-chip{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:700;background:var(--pro-soft);color:var(--label);vertical-align:1px}
  .opc .det .spin{flex:none;width:22px;height:22px;border-radius:50%;border:2.5px solid var(--fill);border-top-color:var(--tint);animation:opc-detspin .8s linear infinite}
  @keyframes opc-detspin {to{transform:rotate(360deg)}}
  .opc #aPassWrap,.opc #aAdv{margin-top:10px}
  .opc .adv-tog{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:40px;padding:0 12px;border-radius:10px;background:var(--cell);font-size:13px;color:var(--tint);font-weight:600}
  .opc .adv-tog svg{width:12px;height:12px;transition:transform .2s}
  .opc .adv-tog[aria-expanded="true"] svg{transform:rotate(90deg)}
  .opc .link-btn{display:block;margin:14px auto 4px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--tint);min-height:36px}
  @media (pointer:coarse) { .opc .adv-tog,.opc .link-btn{min-height:44px} }
  .opc .prov-intro .glyph{width:54px;height:54px;border-radius:13px;margin:0 auto 12px}
  .opc .prov-intro .glyph svg{width:30px;height:30px}
  .opc .prov-intro h3{font:700 19px/1.25 var(--font-d);margin-bottom:6px}
  .opc .prov-intro p{font-size:13px;color:var(--label-2);max-width:40ch;margin:0 auto}
  .opc .prov{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:8px 12px;text-align:left}
  .opc .prov::after{left:54px}
  .opc .prov:hover{background:var(--hover)}
  .opc .prov .ptile{width:30px;height:30px;border-radius:7px;font-size:15px}
  .opc .prov .ptile svg{width:18px;height:18px}
  .opc .prov .pn{flex:1 1 auto;min-width:0}
  .opc .prov .pn b{display:block;font-size:13px;font-weight:600}
  .opc .prov .pn span{display:block;font-size:12px;color:var(--label-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .opc .prov .go{color:var(--label-3)}
  .opc .prov .go svg{width:12px;height:12px}
  .opc .note-card{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--cell);font-size:13px;line-height:1.45}
  .opc .note-card svg{width:17px;height:17px;color:var(--tint);margin-top:1px}

  /* Menus contextuels et feuille d'actions */
  .opc .ov-menu{background:transparent;display:block;padding:0;animation:none}
  .opc .menu{position:fixed;z-index:2;min-width:240px;max-width:calc(100vw - 16px);padding:5px 0;border-radius:13px;background:var(--menu);-webkit-backdrop-filter:blur(50px) saturate(1.8);backdrop-filter:blur(50px) saturate(1.8);box-shadow:var(--shadow-pop);animation:opc-pop .22s var(--ease)}
  .opc .mtitle{padding:6px 16px 6px 44px;font-size:12px;color:var(--label-2)}
  .opc .mitem{position:relative;display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:0 16px 0 12px;font-size:15px;text-align:left;color:var(--label)}
  .opc .mitem + .mitem::before{content:"";position:absolute;left:0;right:0;top:0;height:var(--hair);background:var(--sep)}
  .opc .mitem:hover,.opc .mitem:focus-visible{background:var(--hover);outline:none}
  .opc .mitem:focus-visible{box-shadow:inset 0 0 0 2px var(--tint)}
  .opc .mitem .mck{width:24px;flex:none;display:grid;place-items:center;color:var(--label)}
  .opc .mitem .mck svg{width:16px;height:16px}
  .opc .mitem .mlbl{flex:1 1 auto}
  .opc .mitem .mic{color:var(--label)}
  .opc .mitem .mic svg{width:19px;height:19px}
  .opc .mitem.dng,.opc .mitem.dng .mic{color:var(--red-text)}
  .opc .ov-asheet{display:flex;align-items:flex-end;padding:0;background:var(--scrim)}
  .opc .asheet{width:100%;display:flex;flex-direction:column;gap:8px;padding:0 max(8px,var(--sa-right)) calc(8px + var(--sa-bottom)) max(8px,var(--sa-left));animation:opc-sheetUp .38s var(--ease)}
  .opc .ag{border-radius:14px;overflow:hidden;background:var(--menu);-webkit-backdrop-filter:saturate(1.8) blur(30px);backdrop-filter:saturate(1.8) blur(30px)}
  .opc .ag-title{padding:14px 16px;text-align:center;font-size:13px;color:var(--label-2);border-bottom:var(--hair) solid var(--sep)}
  .opc .ag .mitem{justify-content:center;min-height:56px;padding:0 16px;font-size:19px;color:var(--tint)}
  .opc .ag .mitem .mlbl{flex:none}
  .opc .ag .mitem.cancel{font-weight:600}
  .opc .ag .mitem.dng{color:var(--red-text)}

  /* ---------- Toast (HUD) ---------- */
  .opc .toast{position:fixed;left:calc(var(--opc-x,0px) + 16px);right:calc(var(--opc-r,0px) + 16px);margin:0 auto;width:fit-content;bottom:calc(22px + var(--opc-bas,0px) + var(--sa-bottom));z-index:200;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;border-radius:14px;background:var(--toast);color:#fff;font-size:13px;font-weight:500;-webkit-backdrop-filter:saturate(1.6) blur(20px);backdrop-filter:saturate(1.6) blur(20px);box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transform:translateY(14px);transition:opacity .22s,transform .3s var(--ease)}
  .opc .toast.show{opacity:1;transform:none}
  .opc .toast.show.act .undo{pointer-events:auto} /* le HUD ne capte jamais les touchers ; seuls « Annuler l'envoi » / « Annuler » sont cliquables */
  .opc .toast > span{min-width:0;overflow-wrap:anywhere}
  .opc .toast.two{flex-wrap:wrap;row-gap:8px}   /* « Annuler » + « Annuler l'envoi » : le texte sur sa ligne, les deux boutons dessous, à droite */
  .opc .toast.two > span:not(.ok){flex:1 1 calc(100% - 40px)}
  .opc .toast.two #tAct{margin-left:auto}   /* une longue adresse passe à la ligne au lieu de sortir du HUD */
  @media all {
    .opc:where([data-fmt="phone"],[data-fmt="pad"]) .toast .undo{position:relative}
    .opc:where([data-fmt="phone"],[data-fmt="pad"]) .toast .undo::before{content:"";position:absolute;inset:-8px -2px}   /* zone tactile de 44 pt (iPad, écrans tactiles) */
  }
  @media (pointer:coarse) {
    .opc .toast .undo{position:relative}
    .opc .toast .undo::before{content:"";position:absolute;inset:-8px -2px}   /* zone tactile de 44 pt (iPad, écrans tactiles) */
  }
  .opc .toast .ok{color:#4cd964;display:flex}
  .opc .toast .ok svg{width:16px;height:16px}
  .opc .toast .undo{flex:none;font-weight:600;color:var(--toast-link);background:rgba(255,255,255,.12);border-radius:8px;padding:6px 11px}
  .opc .toast .undo:focus-visible{outline-color:#fff}
  .opc .toast .ring{width:18px;height:18px}

  /* ---------- Pro / Perso ---------- */
  .opc .kbadge{flex:none;display:inline-block;vertical-align:1px;font-size:10.5px;line-height:15px;font-weight:700;letter-spacing:.02em;padding:0 5px;border-radius:4px;white-space:nowrap}
  .opc .kbadge.pro{color:var(--pro);background:var(--pro-soft)}
  .opc .kbadge.perso{color:var(--perso);background:var(--perso-soft)}
  .opc .sn-row{display:flex;align-items:center;gap:6px;min-width:0}
  .opc .sn-row .sn{min-width:0}   /* nom de compte long : abrégé, le badge reste visible */
  .opc .ptile.k-pro{background:var(--pro-tile)}
  .opc .ptile.k-perso{background:var(--perso-tile)}
  .opc .rmeta.rto{display:flex;align-items:center;gap:6px}
  .opc .rto-t{min-width:0;overflow:hidden;text-overflow:ellipsis}

  /* ---------- Catégories (tri automatique) ---------- */
  .opc [data-cat="principal"]{--cat-c:var(--cat-principal)}
  .opc [data-cat="notif"]{--cat-c:var(--cat-notif)}
  .opc [data-cat="recus"]{--cat-c:var(--cat-recus)}
  .opc [data-cat="voyages"]{--cat-c:var(--cat-voyages)}
  .opc [data-cat="promos"]{--cat-c:var(--cat-promos)}
  .opc [data-cat="tout"]{--cat-c:var(--cat-tout)}
  /* Barre façon Mail (iOS 18 / macOS 15) : la catégorie choisie montre son nom, les autres leur symbole et leurs non lus */
  .opc .catbar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:5px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scrollbar-width:none;scroll-padding:0 10px;padding:2px 10px 8px;border-right:var(--hair) solid var(--sep-mac)}
  .opc .catbar::-webkit-scrollbar{display:none}
  /* Tactile : la rangée défile ; un fondu indique qu'il reste des catégories hors champ */
  .opc .catbar.fade-r{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
  .opc .catbar.fade-l{-webkit-mask-image:linear-gradient(90deg,transparent,#000 28px);mask-image:linear-gradient(90deg,transparent,#000 28px)}
  .opc .catbar.fade-l.fade-r{-webkit-mask-image:linear-gradient(90deg,transparent,#000 28px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,transparent,#000 28px,#000 calc(100% - 28px),transparent)}
  .opc .cat{flex:none;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:38px;height:26px;padding:0 8px;border-radius:999px;background:var(--fill);color:var(--label);font-size:12px;font-weight:500;white-space:nowrap;transition:background-color .15s,color .15s}
  .opc .cat svg{width:15px;height:15px;color:var(--cat-c)}
  .opc .cat .cc{font-size:11.5px;color:var(--label-2);font-variant-numeric:tabular-nums}
  .opc .cat:hover{background:var(--fill-2);box-shadow:inset 0 0 0 1px var(--fill)}
  .opc .cat[aria-pressed="true"]{background:var(--cat-c);color:var(--on-cat);font-weight:600;box-shadow:none}
  .opc .cat[aria-pressed="true"] :is(svg,.cc){color:var(--on-cat)}
  .opc .cat:focus-visible{outline-offset:1px}
  /* Mac, colonne de liste étroite : toutes les pastilles en symboles sur une ligne (le nom de la catégorie reste dans l'en-tête) */
  @media (pointer:fine) {
    .opc:where([data-fmt="mac"]) .list{container-type:inline-size}
    @container (max-width:384px){
      .opc:where([data-fmt="mac"]) .cat[aria-pressed="true"] .cl{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
    }
    @container (max-width:300px){ .opc:where([data-fmt="mac"]) .catbar{gap:4px;padding-left:8px;padding-right:8px} .opc:where([data-fmt="mac"]) .cat{min-width:0;padding:0 6px;gap:4px} }
  }

  /* Lecture : catégorie, « Pourquoi ici ? », « Déplacer vers… » */
  .opc .rcat{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin:14px 0 0 52px}
  .opc .cat-chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px 0 6px;border-radius:6px;background:var(--fill-2);font-size:12px;font-weight:600;color:var(--label);white-space:nowrap}
  .opc .cat-chip svg{width:14px;height:14px;color:var(--cat-c)}
  /* Le suivi d'une demande : un groupe de trois états et le nom de qui s'en charge — sur la même rangée que la catégorie (mêmes réglages de mise en page) */
  .opc .rsuivi{align-items:center}
  .opc .rs-l{font-size:12px;font-weight:600;color:var(--label-2)}
  .opc .rs-seg{display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:var(--fill-2)}
  .opc .rs-b{min-height:26px;padding:0 10px;border:0;border-radius:7px;background:none;color:var(--label);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
  .opc .rs-b[aria-pressed="true"]{background:var(--tint);color:var(--on-tint);font-weight:600}
  .opc .rs-b:focus-visible,.opc .rs-a input:focus-visible{outline:2px solid var(--tint);outline-offset:1px}
  .opc .rs-a{display:inline-flex;align-items:center;gap:6px}
  .opc .rs-a input{width:140px;min-height:26px;padding:0 8px;border:0;border-radius:7px;background:var(--fill-2);color:var(--label);font:inherit;font-size:12px}
  .opc .rs-par{font-size:11px;color:var(--label-2)}
  @media (pointer:coarse){ .opc .rs-b{min-height:44px;padding:0 14px;font-size:14px} .opc .rs-a input{min-height:44px;font-size:16px;width:160px} }
  .opc .lnk{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--tint);border-radius:4px;white-space:nowrap}
  @media (hover:hover) { .opc .lnk:hover{text-decoration:underline;text-underline-offset:2px} }
  .opc .mv-short{display:none}
  .opc .lnk svg{width:12px;height:12px}
  .opc .lnk .chv svg{width:10px;height:10px;transition:transform .2s var(--ease)}
  .opc .lnk[aria-expanded="true"] .chv svg{transform:rotate(90deg)}
  .opc .why{margin:10px 0 0 52px;padding:10px 12px 10px 14px;border-radius:10px;background:var(--fill-2);font-size:12.5px;line-height:1.45;color:var(--label)}
  .opc .why-t{font-weight:600;margin-bottom:2px}
  .opc .why ul{margin:0;padding:0 0 0 16px}
  .opc .why li{margin:2px 0;overflow-wrap:anywhere}
  .opc .why-note{display:flex;gap:6px;align-items:flex-start;margin-top:8px;padding-top:8px;border-top:var(--hair) solid var(--sep-mac);font-size:11.5px;line-height:1.4;color:var(--label-2)}
  .opc .why-note svg{width:13px;height:13px;margin-top:1px}
  /* Bandeau « Classé en indésirable » */
  .opc .sched-banner.junk{background:var(--warn-soft)}
  .opc .sched-banner.junk .ic{background:var(--red);color:#fff}
  .opc .sched-banner .tx ul{margin:3px 0 0;padding:0 0 0 16px;font-size:12px;line-height:1.45;color:var(--label-2)}
  .opc .sched-banner .tx li{overflow-wrap:anywhere}

  /* Feuille « Déplacer vers… » */
  .opc .sheet.mv{width:min(460px,100%)}
  .opc .mv-from{padding:14px 12px 0;font-size:13px;font-weight:600;overflow-wrap:anywhere}
  .opc .mv-from span{display:block;font-weight:400;font-size:12px;color:var(--label-2)}
  .opc .sp.mvopt{justify-content:flex-start;gap:10px}
  .opc .mvopt .sp-l{flex:1 1 auto}
  .opc .mvic{flex:none;display:grid;place-items:center;width:20px;color:var(--cat-c)}
  .opc .mvic svg{width:17px;height:17px}
  .opc .mvopt .mck{flex:none;color:var(--tint);visibility:hidden}
  .opc .mvopt .mck svg{width:15px;height:15px}
  .opc .mvopt[aria-checked="true"] .mck{visibility:visible}
  .opc .mvopt[aria-checked="true"] b{font-weight:600}
  .opc .mv-card{margin-top:14px}
  .opc .swrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding:8px 12px;font-size:13px;cursor:pointer}
  .opc .swl{min-width:0;overflow-wrap:anywhere}
  .opc .switch{flex:none;position:relative;width:32px;height:19px;margin:0;border-radius:999px;background:var(--switch-off);-webkit-appearance:none;appearance:none;cursor:pointer;transition:background-color .2s}
  .opc .switch::before{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s var(--ease)}
  .opc .switch:checked{background:var(--switch-on)}
  .opc .switch:checked::before{transform:translateX(13px)}
  .opc .switch:focus-visible{outline:2px solid var(--tint);outline-offset:2px}

  /* Formulaire de connexion : type de boîte (obligatoire) */
  .opc .kind-card{padding:8px}
  .opc .kseg{display:flex;gap:2px;padding:2px;border-radius:9px;background:var(--fill)}
  .opc .kseg button{flex:1 1 0;min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:26px;border-radius:7px;font-size:13px;font-weight:500;color:var(--label);text-align:center;transition:background-color .15s}
  .opc .kseg button svg{width:15px;height:15px}
  .opc .kseg button[data-kind="pro"] svg{color:var(--pro)}
  .opc .kseg button[data-kind="perso"] svg{color:var(--perso)}
  .opc .kseg button[aria-checked="true"]{background:var(--seg-on);font-weight:600;box-shadow:0 0 0 .5px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.14)}
  .opc .kseg button:focus-visible{outline-offset:0}
  .opc .kseg.invalid{box-shadow:0 0 0 2px var(--red-text)}
  .opc .kind-err{display:flex;gap:6px;align-items:flex-start;padding:8px 12px 0;font-size:12px;font-weight:600;line-height:1.4;color:var(--red-text)}
  .opc .kind-err svg{width:14px;height:14px;margin-top:1px}

  @keyframes opc-fade {from{opacity:0}}
  @keyframes opc-sheetIn {from{opacity:0;transform:translateY(-10px) scale(.985)}}
  @keyframes opc-sheetUp {from{transform:translateY(100%)}}
  @keyframes opc-pop {from{opacity:0;transform:scale(.92)}}

  @media all {
    .opc:where([data-fmt="mac"]) .rq-lbl{display:block;margin-right:2px;font-size:12px;color:var(--label-2)}
    .opc:where([data-fmt="mac"]) .rquick button{height:28px;padding:0 12px;border-radius:7px;background:var(--btn);color:var(--label);font-weight:400;box-shadow:0 0 0 .5px var(--btn-edge),0 1px 1.5px rgba(0,0,0,.08);transition:filter .12s}
    .opc:where([data-fmt="mac"]) .rquick button:hover{background:var(--btn);filter:brightness(.96)}

    .opc:where([data-fmt="mac"]) .overlay:not(.ov-menu){place-items:start center;padding:52px 24px 24px;background:var(--scrim-mac)}
    .opc:where([data-fmt="mac"]) .sheet{max-height:calc(100vh - 76px);animation:opc-sheetDown .26s var(--ease)}
    .opc:where([data-fmt="mac"]) .sheet:not(.compose) .sheet-bar{height:44px}
    .opc:where([data-fmt="mac"]) .sheet-foot{flex:none;display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:12px 16px;border-top:var(--hair) solid var(--sep-mac);background:var(--sheet-bar)}
    .opc:where([data-fmt="mac"]) .sheet-foot:empty{display:none}
    .opc:where([data-fmt="mac"]) .sheet-foot .btn{min-width:76px}
    .opc:where([data-fmt="mac"]) .back-btn{width:28px;height:28px;padding:0;border-radius:6px;background:none;box-shadow:none;color:var(--glyph)}
    .opc:where([data-fmt="mac"]) .back-btn:hover{background:var(--hover);color:var(--label);filter:none}
    .opc:where([data-fmt="mac"]) .back-btn .lbl{display:none}
    .opc:where([data-fmt="mac"]) .back-btn svg{width:14px;height:14px}
    .opc:where([data-fmt="mac"]) #cSchedBack{display:none}

  // ---------- Le logo d'une boîte (choisi par la personne, rangé sur l'appareil, jamais sur le serveur) ----------
  // Une image PNG ou JPEG de 64 px au plus, en « data: » : elle se pose dans un <img src>, elle n'est JAMAIS exécutée (pas de SVG, pas de HTML), rien n'est chargé d'ailleurs.
  var LOGO_PX=64, LOGO_MAX=24000, LOGO_FICHIER_MAX=8*1024*1024;
  function logoValide(u){ return typeof u==="string"&&u.length<=LOGO_MAX&&/^data:image\/(png|jpeg);base64,[A-Za-z0-9+\/]+={0,2}$/.test(u); }
  // le carré centré qu'on garde d'une image l×h
  function logoCadre(w,h){ var c=Math.min(w,h); return {sx:Math.floor((w-c)/2),sy:Math.floor((h-c)/2),c:c}; }
  // sans logo : une pastille à l'initiale de l'adresse, d'une teinte STABLE (la même adresse a toujours la même couleur)
  function teinteAdresse(email){ var h=0,e=String(email||"").toLowerCase(); for(var i=0;i<e.length;i++) h=(h*31+e.charCodeAt(i))>>>0; return h%360; }
  function acctTile(a){ var u=SAVED.logos[a.id];
    if(logoValide(u)) return '<span class="ptile alogo" aria-hidden="true"><img src="'+u+'" alt="" draggable="false"></span>';
    var ini=String(a.email||"?").charAt(0).toUpperCase();
    return '<span class="ptile" style="background:hsl('+teinteAdresse(a.email)+' 46% 30%)" aria-hidden="true">'+H(ini)+'</span>'; }
  // fichier choisi → data URL carrée de 64 px (PNG, ou JPEG si l'image est une photo trop lourde). Refus DIT : mauvais type, trop gros, illisible.
  function logoDepuisFichier(f){
    return new Promise(function(ok,ko){
      if(!f||!/^image\/(png|jpeg)$/.test(f.type||"")){ ko(new Error("Choisissez une image PNG ou JPEG.")); return; }
      if(f.size>LOGO_FICHIER_MAX){ ko(new Error("Image trop lourde (8 Mo au plus).")); return; }
      if(typeof createImageBitmap!=="function"){ ko(new Error("Ce navigateur ne sait pas lire cette image.")); return; }
      createImageBitmap(f).then(function(img){ try{
        var w=img.width, h=img.height; if(!w||!h) throw new Error("x");
        var cd=logoCadre(w,h), cv=document.createElement("canvas"); cv.width=LOGO_PX; cv.height=LOGO_PX;
        var cx=cv.getContext("2d"); cx.drawImage(img,cd.sx,cd.sy,cd.c,cd.c,0,0,LOGO_PX,LOGO_PX); if(img.close) img.close();
        var u=cv.toDataURL("image/png"); if(!logoValide(u)) u=cv.toDataURL("image/jpeg",0.82); if(!logoValide(u)) u=cv.toDataURL("image/jpeg",0.6);
        if(logoValide(u)) ok(u); else ko(new Error("Image trop complexe : essayez une image plus simple."));
      }catch(e){ ko(new Error("Image illisible.")); } },function(){ ko(new Error("Image illisible.")); }); }); }

  // ---------- Ce que la source sait faire (SRC.capacites()) ----------
  // Tout est FAUX tant que la source ne dit pas le contraire : ce qu'elle ne sait pas faire, l'interface le dit (« Bientôt : … ») au lieu de faire semblant.
  var CAP={oauth:false,programmeServeur:false,signature:false,marquage:false,deplacement:false,simulation:false,reglagesServeur:false,mx:false,journalEnvois:false,telechargerPiece:false,suivi:false,signatureReelle:false,traduire:false,boutonsFournisseurs:false,gererBoites:false,

  function appliquerCapacites(c){
    c=c&&typeof c==="object"?c:{};
    ["oauth","programmeServeur","signature","marquage","deplacement","simulation","reglagesServeur"].forEach(function(k){ CAP[k]=c[k]===true; });
    // oauthVia (facultatif) : les fournisseurs que la source sait VRAIMENT connecter sans mot de passe (« Google », « Microsoft »…). Sans liste,
    // oauth:true vaut pour tous, comme avant. Un fournisseur hors liste garde le mot de passe d'application (Yahoo) ou dit « Bientôt » (Microsoft).
    CAP.oauthVia=CAP.oauth&&Array.isArray(c.oauthVia)?c.oauthVia.map(String):null;
    CAP.mx=typeof SRC.lireMX==="function";
    // Trois gestes qui exigent une MÉTHODE de la source en plus de la déclaration : sans elle, le module ne promet rien.
    CAP.journalEnvois=c.journalEnvois===true&&typeof SRC.envois==="function";
    CAP.telechargerPiece=c.telechargerPiece===true&&typeof SRC.piece==="function";
    CAP.suivi=c.suivi===true&&typeof SRC.suivi==="function";
    CAP.traduire=c.traduire===true&&typeof SRC.traduire==="function";   // « Traduire en français » (20 octobre 2026) : la source traduit, le module ne devine rien
    // La VRAIE signature exige la déclaration ET les six méthodes de l'objet `signature` : sans elles, le module ne promet rien de plus qu'avant.
    var sg=SRC.signature;
    CAP.signatureReelle=c.signature===true&&!!sg&&typeof sg==="object"&&["envoyer","etat","relancer","annuler","signe","preuve"].every(function(k){ return typeof sg[k]==="function"; });

    // `signatureMaintenance` : toute NOUVELLE demande, toute relance, tout « Signer maintenant » répond « en cours de maintenance » et rien ne part ;
    // les demandes déjà faites restent lisibles, annulables, et leurs PDF signés téléchargeables. Faux par défaut (un hôte qui ne dit rien garde l'ancien circuit).
    CAP.signatureMaintenance=c.signatureMaintenance===true;
    // 5 novembre 2026 (Justin : « je sais pas comment on déconnecte une boîte » / « pas de bouton Google ou Hotmail ») — deux gestes que seul l'HÔTE déclare :
    // · boutonsFournisseurs : la feuille « Ajouter une boîte mail » s'ouvre sur TROIS gros boutons (Google, Microsoft, Autre messagerie) au lieu d'un champ à deviner ;
    // · gererBoites : un lien « Gérer les boîtes » dans la liste des comptes, qui rend la main à l'hôte (SRC.gererBoites) — la gestion (liste, déconnexion) est la SIENNE.
    // Faux par défaut : OP MESSAGES, qui ne les déclare pas, garde exactement la feuille d'avant.
    CAP.boutonsFournisseurs=c.boutonsFournisseurs===true;
    CAP.gererBoites=c.gererBoites===true&&typeof SRC.gererBoites==="function";

  // Le suivi d'une demande (À traiter / En cours / Résolu, et qui s'en charge) : seulement sur un message reçu dont la source dit le suivi, et si elle sait l'enregistrer.
  function suiviHtml(m){
    if(!CAP.suivi||typeof SRC.suivi!=="function"||!m.src||m.folder!=="inbox"||!m.suivi) return "";
    var s=m.suivi;
    return '<div class="rcat rsuivi" role="group" aria-label="Suivi de la demande"><span class="rs-l">Suivi</span>'+

      (s.par?'<span class="rs-par">Dernier geste : '+H(s.par)+'</span>':'')+'</div>'; }
  // Se met à jour SUR PLACE (jamais en remplaçant la ligne) : la réponse du serveur arrive pendant que la personne tape un nom ou enchaîne un second geste, et ne doit pas lui voler le focus.
  function repeindreSuivi(m,focus){
    /* la LIGNE de la liste dit le suivi aussi (`suiviChip`) : elle se repeint sur place — pas toute la liste, le focus et le défilement restent où ils sont — et les compteurs du dossier « Suivi » suivent */
    if(m&&m.suivi){ var row=$('.msg[data-id="'+m.id+'"] .m-sub'); if(row){ $$('.sgchip[class*="sv-"], .sgchip[class*="sv-"] + .sr',row).forEach(function(x){ x.parentNode.removeChild(x); }); row.insertAdjacentHTML("afterbegin",suiviChip(m)); }
      try{ renderSidebar(); }catch(e){} compter(); }
    if(!m||!m.suivi||state.selected!==m.id) return; var el=$("#readScroll .rsuivi"); if(!el) return;
    var s=m.suivi;
    $$("[data-suivi]",el).forEach(function(b){ b.setAttribute("aria-pressed",String(b.getAttribute("data-suivi")===s.statut)); });
    var inp=$("#suiviAssigne",el); if(inp&&actif()!==inp) inp.value=s.assigne;
    var par=$(".rs-par",el);
    if(s.par){ if(!par){ par=document.createElement("span"); par.className="rs-par"; el.appendChild(par); } par.textContent="Dernier geste : "+s.par; } else if(par) par.parentNode.removeChild(par);
    if(focus){ var b=$('[data-suivi="'+focus+'"]',el); if(b) b.focus({preventScroll:true}); } }
  function changerSuivi(m,patch){
    if(!m||!m.src||!m.suivi||!CAP.suivi||typeof SRC.suivi!=="function") return;
    var avant=m.suivi, neuf={statut:patch.statut||avant.statut,assigne:patch.assigne!==undefined?patch.assigne:avant.assigne,par:avant.par};
    if(neuf.statut===avant.statut&&neuf.assigne===avant.assigne) return;
    m.suivi=neuf; repeindreSuivi(m,patch.statut||"");   // l'état s'applique d'abord ; le serveur le confirme (ou le refuse, et l'état d'avant revient)
    Promise.resolve().then(function(){ return SRC.suivi(m.sid,patch); }).then(function(r){
      var sv=suiviDe(r); if(sv) m.suivi=sv; if(vivant) repeindreSuivi(m);
    },function(e){ m.suivi=avant; if(vivant){ repeindreSuivi(m); toast("Suivi non enregistré : "+msgErr(e,"échec")); } }); }
  // Le fichier d'une pièce reçue : son nom vient de l'expéditeur, donc d'un inconnu — il ne sort jamais du dossier de téléchargement, ne cache pas son extension
  // derrière une inversion de sens d'écriture, ne porte aucun caractère de contrôle ni nom réservé de Windows, et reste d'une longueur raisonnable.
  function nomFichierSur(nom){
    var n=String(nom==null?"":nom).normalize("NFC")
      .replace(/[\u0000-\u001f\u007f-\u009f\u00ad\u061c\u200b-\u200f\u202a-\u202e\u2060-\u2069\ufeff]/g,"")
      .replace(/[\\\/:*?"<>|]+/g,"_").replace(/^[\s.]+|[\s.]+$/g,"");
    if(/^(con|prn|aux|nul|com[0-9]|lpt[0-9])(\..*)?$/i.test(n)) n="_"+n;
    if(n.length>120){ var d=n.lastIndexOf("."), ext=d>0&&n.length-d<=12?n.slice(d):""; n=n.slice(0,120-ext.length)+ext; }
    return n||"piece-jointe"; }
  // ---------- Le fichier d'une pièce, gardé sur CET appareil : l'aperçu d'un PDF avant d'envoyer (signature, message en rédaction) ----------
  // Avant, le module ne gardait que le nom et la taille : le document ne s'ouvrait nulle part, même rangé dans Signatures. Le fichier vit dans IndexedDB (une base par
  // clé de stockage : `<cleStockage>_fichiers`), JAMAIS dans localStorage (5 Mo partagés) ni dans les données de l'entreprise ; la pièce garde seulement `fid`, sa clé.
  // Borné à la limite d'un message (CAP.pj.octets, 25 Mo) PAR DEMANDE. Effacé avec la demande (annulée, retirée) ; au démarrage, ce qu'aucune pièce ne désigne plus est balayé.
  var idbP=null;
  function idbOuvrir(){
    if(idbP) return idbP;
    idbP=new Promise(function(ok,ko){ try{
      if(!window.indexedDB) throw new Error("rangement indisponible");
      var r=indexedDB.open(LS+"_fichiers",1);
      r.onupgradeneeded=function(){ r.result.createObjectStore("f"); };
      r.onsuccess=function(){ ok(r.result); }; r.onerror=r.onblocked=function(){ ko(r.error||new Error("rangement indisponible")); };
    }catch(e){ ko(e); } });
    idbP.catch(function(){ idbP=null; });   // un refus (navigation privée, rangement plein) ne ferme pas la porte pour toujours
    return idbP; }
  function idbFaire(mode,fn){ return idbOuvrir().then(function(db){ return new Promise(function(ok,ko){
    var tx=db.transaction("f",mode), rq=fn(tx.objectStore("f"));
    tx.oncomplete=function(){ ok(rq&&rq.result); }; tx.onerror=tx.onabort=function(){ ko(tx.error||new Error("rangement refusé")); }; }); }); }
  finis.push(function(){ if(idbP) idbP.then(function(db){ db.close(); },function(){}); });
  function fidNeuf(){ return "f"+Date.now().toString(36)+Math.random().toString(36).slice(2,9); }
  function fichierPoser(fid,fic){ return idbFaire("readwrite",function(st){ return st.put(new Blob([fic],{type:"application/pdf"}),fid); }); }
  function fichierLire(fid){ return idbFaire("readonly",function(st){ return st.get(fid); }); }
  // ce que la demande (ou le message) désigne ; `sauf` : les pièces qu'une autre demande reprend (une demande préparée qu'on rouvre)
  function fidsDe(m){ var l=[]; (m&&m.att||[]).forEach(function(a){ if(a&&a.fid&&l.indexOf(a.fid)<0) l.push(a.fid); }); return l; }
  function fichiersEffacer(fids){ if(!fids.length) return;
    idbFaire("readwrite",function(st){ fids.forEach(function(k){ st.delete(k); }); }).catch(function(){}); }
  function fichiersDe(m){ var f=fidsDe(m); MESSAGES.forEach(function(x){ if(x!==m) fidsDe(x).forEach(function(k){ var i=f.indexOf(k); if(i>=0) f.splice(i,1); }); }); return f; }
  // Le balayage : une pièce n'est « orpheline » que si AUCUN message de la mémoire ne la désigne, relu au retour de la liste des clés (le fichier est posé et la pièce désignée dans le même
  // instant, donc une clé vue ici est déjà désignée). Une demande ANNULÉE ne garde pas son fichier.
  function fichiersBalayer(){
    if(!vivant||!window.indexedDB) return;
    idbFaire("readonly",function(st){ return st.getAllKeys(); }).then(function(cles){
      var vus={}; MESSAGES.forEach(function(m){ if(m.sign&&m.sign.st==="cancelled") return; fidsDe(m).forEach(function(k){ vus[k]=1; }); });
      fichiersEffacer((cles||[]).filter(function(k){ return !vus[k]; })); }).catch(function(){}); }

  // La visionneuse : le PDF dans un cadre plein écran, au-dessus de la feuille qui l'a ouverte. Fermer, et Télécharger ; si l'appareil n'affiche pas les PDF dans une page (iPhone…), le texte
  // derrière le cadre le dit et le bouton reste. ⛔ PAS de `sandbox` sur ce cadre, et ce n'est pas un oubli : Chromium REFUSE d'afficher un PDF dans un cadre sandboxé, quelle que soit la valeur
  // (« This page has been blocked by Chromium », mesuré : vide, allow-same-origin, allow-scripts, les deux). Ce qui isole le PDF : le visualiseur du navigateur tourne HORS de la page (processus
  // à part), l'adresse est un blob: dont le type est FORCÉ à application/pdf (jamais lu comme une page HTML, donc aucun script du document n'atteint le module ni l'application), et la
  // politique de l'hôte n'ouvre que `frame-src blob:`.
  var pdfv=null;
  function fermerApercu(){
    if(!pdfv) return; var v=pdfv; pdfv=null;
    try{ URL.revokeObjectURL(v.url); }catch(e){}
    v.el.remove(); if(!$("#overlay")) app.inert=false;
    if(v.retour&&sr.contains(v.retour)&&v.retour!==document.body){ try{ v.retour.focus({preventScroll:true}); }catch(e){} } }
  finis.push(fermerApercu);
  function apercuPDF(blob,nom){
    fermerApercu();
    var retour=actif(), url=URL.createObjectURL(new Blob([blob],{type:"application/pdf"})), el=document.createElement("div");
    el.className="overlay ov-pdf"; el.id="pdfv"; el.setAttribute("role","dialog"); el.setAttribute("aria-modal","true"); el.setAttribute("aria-labelledby","pdfvT");
    el.innerHTML='<div class="pdfv"><div class="pdfv-bar"><button type="button" class="btn" data-pv="close">Fermer</button><h2 class="pdfv-t" id="pdfvT">'+H(nom)+'</h2>'+
      '<button type="button" class="btn primary" data-pv="dl">'+I.down+'<span>Télécharger</span></button></div>'+
      '<div class="pdfv-body"><p class="pdfv-repli">Ce document ne s’affiche pas dans la page sur cet appareil. Touchez « Télécharger » pour l’ouvrir.</p></div></div>';
    if(navigator.pdfViewerEnabled!==false){
      var f=document.createElement("iframe"); f.setAttribute("title","Aperçu : "+nom); f.setAttribute("referrerpolicy","no-referrer"); f.src=url;
      $(".pdfv-body",el).appendChild(f); }
    app.inert=true; $("#overlays").appendChild(el); pdfv={el:el,url:url,retour:retour,nom:nom};
    el.addEventListener("click",function(e){ var b=e.target.closest("[data-pv]"); if(!b) return;
      if(b.getAttribute("data-pv")==="close"){ fermerApercu(); return; }
      var l=document.createElement("a"); l.href=url; l.download=nomFichierSur(nom); l.rel="noopener"; l.hidden=true; el.appendChild(l); l.click(); l.remove(); });
    el.addEventListener("keydown",function(e){
      if(e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); fermerApercu(); return; }
      if(e.key!=="Tab") return;
      var c=$$("button, iframe",el).filter(function(x){ return !x.disabled; }); if(!c.length) return;
      var i=c.indexOf(sr.activeElement); if(e.shiftKey&&i<=0){ e.preventDefault(); c[c.length-1].focus(); } else if(!e.shiftKey&&i===c.length-1){ e.preventDefault(); c[0].focus(); } });
    var fermer=$('[data-pv="close"]',el); if(fermer) fermer.focus();
  }
  // Ouvre l'aperçu d'une pièce : le fichier en mémoire (celui qu'on vient de choisir), sinon celui que l'appareil a gardé (a.fid) ; sinon on le DIT.
  function apercuPiece(a){
    if(!a) return;
    if(a.file&&typeof a.file.size==="number"){ apercuPDF(a.file,a.name); return; }
    if(!a.fid){ toast("Fichier non conservé sur cet appareil"); return; }
    fichierLire(a.fid).then(function(b){
      if(!vivant) return;
      if(!b||typeof b.size!=="number") { toast("Fichier non conservé sur cet appareil"); return; }
      apercuPDF(b,a.name); },function(){ if(vivant) toast("Fichier non conservé sur cet appareil"); }); }
  function estPDF(a){ return !!a&&a.kind!=="img"&&!!(/\.pdf$/i.test(a.name||"")||(a.file&&a.file.type==="application/pdf")); }
  function boutonApercu(i,attr){ return '<button type="button" class="att-pv" '+attr+'="'+i+'">Aperçu</button>'; }
  function telechargerPiece(m,i,btn){
    var a=m&&m.att&&m.att[i];
    if(!a||a.id==null||!m.src||!CAP.telechargerPiece||typeof SRC.piece!=="function"||a.dl) return;
    a.dl=true; if(btn) btn.setAttribute("aria-busy","true");
    var fin=function(){ a.dl=false; if(btn) btn.removeAttribute("aria-busy"); };
    Promise.resolve().then(function(){ return SRC.piece(m.sid,a.id); }).then(function(b){
      fin(); if(!vivant) return;
      if(!b||typeof b.size!=="number"||typeof b.slice!=="function") throw new Error("pièce illisible");
      // Le contenu n'est jamais ouvert ici : un Blob neutre (octet-stream) enregistré sous un nom assaini, sans aperçu ni lien externe.
      var nom=nomFichierSur(a.name), url=URL.createObjectURL(new Blob([b],{type:"application/octet-stream"})), l=document.createElement("a");
      l.href=url; l.download=nom; l.rel="noopener"; l.hidden=true; sr.appendChild(l); l.click(); sr.removeChild(l);
      setTimeout(function(){ try{ URL.revokeObjectURL(url); }catch(e){} },30000);

    }).catch(function(e){ fin(); if(vivant) toast("Téléchargement impossible : "+msgErr(e,"échec")); }); }
  // Le tri est recalculé à chaque rendu complet : nouveaux messages, règles apprises et contacts (Envoyés) sont toujours à jour.
  function threadHtml(m){

      var paras=(x.body||[]).map(function(p){ return '<p>'+H(Array.isArray(p)?p[1]:p).replace(/\n/g,"<br>")+'</p>'; }).join("");
      return '<details class="th-item"><summary><span class="th-who">'+H(x.from?senderName(x):"Vous")+(x.folder==="sent"?' <span class="sr">(envoyé)</span>':'')+'</span><span class="th-date">'+H(fmtDate(tsOf(x)))+'</span><span class="th-prev">'+H(x.preview||firstLine(bodyText(x)))+'</span></summary>'+
        '<div class="th-body">'+paras+(x.att&&x.att.length?'<p class="th-date">'+I.attach.replace('<svg','<svg style="width:13px;height:13px;vertical-align:-2px"')+' '+H(x.att.map(function(a){return a.name;}).join(", "))+'</p>':'')+
        '<button type="button" class="lnk" data-open="'+x.id+'">Ouvrir ce message</button></div></details>'; }).join("")+'</section>';
  }

  /* (20 octobre 2026, Justin : « quand je vais en bas ça me remonte direct en haut ») : redessiner la liste (un relevé toutes les minutes) la remettait en haut — elle garde

  // Grand titre (iPad) : jamais à moitié défilé après avoir amené une ligne à l'écran (comme iOS, il est entier ou replié).
  var LT_FOLD=36;

    ls.scrollTop=y>y0?LT_FOLD+1:0; $("#list").classList.toggle("scrolled",ls.scrollTop>LT_FOLD); }
  function backToListMobile(){ if(isPhone()&&app.getAttribute("data-view")==="reading") go("list"); }
  function msgById(id){ if(!id) return null; for(var i=0;i<MESSAGES.length;i++) if(MESSAGES[i].id===id) return MESSAGES[i]; return null; }
  // uj : déplacé à la main — le tri automatique ne le renverra plus dans Indésirables.
  // Un message REÇU rangé dans Archive, Indésirables ou Corbeille peut revenir dans la Réception de SA boîte : à la place du geste « Archiver », la barre, le clic droit, la ligne et la

  function peutRemettre(m){ return !!m&&!!m.from&&!m.jr&&(m.folder==="archive"||m.folder==="trash"||m.folder==="junk"); }

  // `Annuler` rend le message à son dossier d'avant (la source en est prévenue par le persist() suivant, comme pour tout déplacement)
  function moveTo(m,folder,label){ var at=listIndex(m.id), av={f:m.folder,uj:m.uj,aj:m.aj,sendAt:m.sendAt}; m.folder=folder; m.uj=true; m.aj=false; if(m.sendAt!=null) delete m.sendAt; if(state.selected===m.id){ state.selected=null; } backToListMobile(); renderAll(); persist(); refocus(null,at);
    if(label) toast(label,{label:"Annuler",onAct:function(){ if(!msgById(m.id)) return; m.folder=av.f; m.uj=av.uj; m.aj=av.aj; if(av.sendAt!=null) m.sendAt=av.sendAt; refreshCls(); renderAll(); persist(); toast("Annulé"); }}); }
  // Après un rendu qui a remplacé l'élément actif (déplacer, supprimer, indésirable…), le focus clavier ne retombe pas sur le corps de la page :
  // il revient sur le contrôle demandé s'il existe encore, sinon sur la ligne qui a pris la place du message, sinon sur la liste.

  // Annulation d'un changement de tri : on ne rétablit que ce que ce changement a modifié (et qui n'a pas bougé depuis).
  function triSnap(){ var s={r:JSON.stringify(RULES),m:{}}; MESSAGES.forEach(function(x){ s.m[x.id]=[x.folder,x.co||"",!!x.uj,!!x.aj]; }); return s; }
  function undoable(change){
    var pre=triSnap(); change(); renderAll(); var post=triSnap(); persist();
    return function(){
      var r0=JSON.parse(pre.r), r1=JSON.parse(post.r);
      ["senders","domains"].forEach(function(k){ var keys={}; Object.keys(r0[k]).concat(Object.keys(r1[k])).forEach(function(x){ keys[x]=1; });
        Object.keys(keys).forEach(function(x){ if(r0[k][x]===r1[k][x]||RULES[k][x]!==r1[k][x]) return; if(r0[k][x]==null) delete RULES[k][x]; else RULES[k][x]=r0[k][x]; }); });
      MESSAGES.forEach(function(x){ var a=pre.m[x.id], b=post.m[x.id]; if(!a||!b||a.join()===b.join()) return;
        if([x.folder,x.co||"",!!x.uj,!!x.aj].join()!==b.join()) return;
        x.folder=a[0]; if(a[1]) x.co=a[1]; else delete x.co; x.uj=a[2]; x.aj=a[3]; });
      renderAll(); persist(); }; }
  // Indésirable à la main : le message part, et l'expéditeur est appris pour la suite (Annuler pendant quelques secondes).
  // Un message envoyé (sans expéditeur) n'est jamais jugé indésirable.
  function markJunk(m){
    if(!m||!m.from) return;
    var email=emailOf(m), at=listIndex(m.id);
    var undo=undoable(function(){ m.folder="junk"; m.uj=true; m.aj=false; if(email) RULES.senders[email]="junk"; if(state.selected===m.id) state.selected=null; backToListMobile(); });
    refocus(null,at);
    toast(email?"Déplacé dans Indésirables · expéditeur mémorisé":"Déplacé dans les indésirables",{label:"Annuler",onAct:function(){ undo(); toast("Déplacement annulé"); }});
  }
  // « Ce n'est pas un indésirable » : retour dans la réception, expéditeur appris, catégorie recalculée.
  // (Un message envoyé arrivé là par une version précédente retourne dans Envoyés.)
  function markNotJunk(m){
    if(!m) return;
    var email=emailOf(m), out=!m.from, at=listIndex(m.id);
    var undo=undoable(function(){ m.folder=out?"sent":"inbox"; m.uj=!out; m.aj=false; if(email) RULES.senders[email]="notjunk"; if(state.selected===m.id) state.selected=null; backToListMobile(); });
    refocus(null,at);
    toast(out?"Remis dans Envoyés":email?"Remis dans la réception · expéditeur mémorisé":"Remis dans la réception",{label:"Annuler",onAct:function(){ undo(); toast("Remis dans Indésirables"); }});
  }

  function doAct(act,id){
    var m=id?msgById(id):msgById(state.selected); if(!m||m.jr) return;   // le journal des envois se lit, il ne se range pas, ne se marque pas, ne reçoit pas de réponse
    if(act==="flag"){ m.flagged=!m.flagged; renderAll(); persist(); toast(m.flagged?"Message marqué":"Drapeau retiré"); }
    else if(act==="unread"){ m.read=false; state.selected=null; backToListMobile(); renderAll(); persist(); toast("Marqué comme non lu"); }
    else if(act==="archive") moveTo(m,"archive","Message archivé");
    else if(act==="toInbox"){ if(!peutRemettre(m)) return; if(m.folder==="junk") markNotJunk(m); else moveTo(m,"inbox","Remis dans la réception"); }
    else if(act==="junk") markJunk(m);
    else if(act==="notJunk") markNotJunk(m);
    else if(act==="traduire"){ if(!CAP.traduire) return; var t0=TRAD[m.id];
      if(t0&&t0.etat==="ok"){ t0.vue=!t0.vue; renderAll(); return; } if(t0) return;
      var mid=m.id, texte=(m.body||[]).map(function(p){ return entitesLues(Array.isArray(p)?p[1]:p); }).join("\n\n");
      TRAD[mid]={etat:"cours"}; renderAll();
      Promise.resolve().then(function(){ return SRC.traduire(texte,"fr"); }).then(function(r){
        var txt=String(r==null?"":r).trim(); if(!txt) throw new Error("réponse vide");
        TRAD[mid]={etat:"ok",vue:true,body:txt.split(/\n{2,}/)}; renderAll();
      },function(e){ delete TRAD[mid]; renderAll(); toast("Traduction impossible"+(e&&e.message?" : "+e.message:"")); }); }
    else if(act==="moveCat") openMoveCat(m);
    else if(act==="trash") moveTo(m,"trash","Message supprimé");
    else if(act==="reply") openCompose(replyModel(m,false));
    else if(act==="replyAll") openCompose(replyModel(m,true));
    else if(act==="forward") openCompose(forwardModel(m));
    else if(act==="editDraft") openCompose({to:m.to,subject:m.subject,body:bodyText(m),acct:m.acct,att:(m.att||[]).slice(),draftId:m.id,scheduled:m.folder==="scheduled",noTrust:m.noTrust||null,enReponseA:m.repA||null});
    else if(act==="sendNow"){ m.folder="outbox"; state.selected=null; backToListMobile(); renderAll(); commitOutbox(m,false); }
    else if(act==="unschedule"){ m.folder="drafts"; delete m.sendAt; m.at=Date.now(); m.user=true; state.selected=null; backToListMobile(); renderAll(); persist(); toast("Envoi annulé — le message est dans les brouillons"); }
    else if(act==="reschedule") openReschedule(m);
    else if(act.indexOf("sign")===0) signAct(act,m);
  }
  function bodyText(m){ return (m.body||[]).map(function(p){return Array.isArray(p)?p[1]:p;}).join("\n\n"); }
  function quoteOf(m){ return "\n\n\nLe "+fmtFull(tsOf(m))+", "+senderName(m)+" a écrit :\n> "+bodyText(m).replace(/\n/g,"\n> "); }
  // Répondre : à l'expéditeur ; « à tous » ajoute les autres destinataires (sauf soi) ; depuis Envoyés, aux mêmes destinataires.
  function replyModel(m,all){
    var subj=/^re\s*:/i.test(m.subject)?m.subject:"Re: "+m.subject, to;
    if(!m.from) to=m.to||"";
    else{ var me=acctOf(m.acct).email.toLowerCase(), list=[m.from.email], low=[m.from.email.toLowerCase()];
      if(all) (m.rcpt||[]).forEach(function(a){ var l=a.toLowerCase(); if(l!==me&&low.indexOf(l)<0){ list.push(a); low.push(l); } });
      to=list.join(", "); }
    // Répondre à un message rangé dans Indésirables ne fait pas de son expéditeur un contact de confiance.
    // enReponseA : le message reçu auquel on répond (celui de la source) — la source en fait les en-têtes du fil ; un message écrit ici n'en a pas.
    return {to:to,subject:subj,body:quoteOf(m),acct:m.acct,enReponseA:m.src?m.sid:null,noTrust:m.from&&m.folder==="junk"?[emailOf(m)]:null}; }
  function forwardModel(m){ var subj=/^(tr|fwd?)\s*:/i.test(m.subject)?m.subject:"Tr: "+m.subject; return {to:"",subject:subj,body:quoteOf(m),acct:m.acct,att:(m.att||[]).slice()}; }

  // ---------- Feuilles, menus : socle commun ----------
  var returnFocus=null;
  function tabbables(root){ return $$('button,input,select,textarea,[tabindex]:not([tabindex="-1"])',root).filter(function(x){
    return !x.disabled&&x.tabIndex>=0&&!x.closest("[inert],[hidden]")&&x.getClientRects().length>0&&getComputedStyle(x).visibility!=="hidden"; }); }
  function makeOverlay(kind){
    var ov=document.createElement("div"); ov.className="overlay ov-"+kind; ov.id="overlay";
    returnFocus=actif();
    $("#overlays").appendChild(ov);
    cadre.classList.add("has-sheet"); if(kind!=="menu") cadre.classList.add("sheet-under");
    app.inert=true;
    // Fond voilé : ne ferme que si l'appui ET le relâchement y ont lieu (une sélection de texte glissée hors de la feuille ne ferme rien).
    var downOnOv=false;
    ov.addEventListener("pointerdown",function(e){ downOnOv=e.target===ov; });
    ov.addEventListener("click",function(e){ var hit=e.target===ov&&downOnOv; downOnOv=false; if(hit) (ov.onBackdrop||closeOverlay)(); });
    // Focus piégé dans la feuille (Tab / Maj+Tab bouclent)
    ov.addEventListener("keydown",function(e){
      if(e.key!=="Tab") return;
      var f=tabbables(ov); if(!f.length) return;
      var i=f.indexOf(actif());
      if(e.shiftKey&&i<=0){ e.preventDefault(); f[f.length-1].focus(); }
      else if(!e.shiftKey&&(i<0||i===f.length-1)){ e.preventDefault(); f[0].focus(); }
    });
    return ov;
  }
  function closeOverlay(){
    fermerApercu();
    var had=false, o; while((o=$("#overlay"))){ o.remove(); had=true; }
    cadre.classList.remove("has-sheet","sheet-under"); app.inert=false; state.compose=null; rsOpenId=null;
    if(had&&returnFocus&&sr.contains(returnFocus)&&returnFocus!==document.body){ try{ returnFocus.focus({preventScroll:true}); }catch(e){} }
    returnFocus=null;
    if(had) setTimeout(flushScheduled,0);   // un envoi retenu pendant que sa feuille était ouverte part maintenant
  }
  function closeCompose(){ closeOverlay(); }
  function sheetBar(left,title,right,titleId){ return '<div class="sheet-bar"><div class="sb-l" data-slot="l">'+left+'</div><h2 class="sheet-title" id="'+titleId+'">'+title+'</h2><div class="sb-r" data-slot="r">'+right+'</div></div>'; }

  // Boutons des feuilles : barre de navigation sur iPad/iPhone (Annuler à gauche, action à droite),
  // pied de feuille sur Mac (Annuler puis bouton par défaut, en bas à droite). data-home = place tactile, data-mac = place Mac.
  function placeSheetChrome(){

      var key=function(el){ return +(el.getAttribute(mac&&el.hasAttribute("data-ordm")?"data-ordm":"data-ord")||0); };
      $$("[data-home]",sh).sort(function(x,y){ return key(x)-key(y); }).forEach(function(el){
        var where=mac&&el.hasAttribute("data-mac")?el.getAttribute("data-mac"):el.getAttribute("data-home");

  // Menu contextuel (Mac/iPad, filtre iPhone) ou feuille d'actions (iPhone)
  function openMenu(anchor,o){
    closeOverlay();
    var ov=makeOverlay("menu");
    var asSheet=!!o.sheet&&isPhone();
    var items=o.items.map(function(it){
      return '<button type="button" class="mitem'+(it.danger?" dng":"")+'" role="'+(it.radio?"menuitemradio":"menuitem")+'"'+(it.radio?' aria-checked="'+!!it.checked+'"':'')+' data-pick="'+it.id+'"'+(it.attr||"")+'>'+
        (asSheet?'':'<span class="mck" aria-hidden="true">'+(it.checked?I.check:'')+'</span>')+'<span class="mlbl">'+H(it.label)+'</span>'+(it.icon&&!asSheet?'<span class="mic" aria-hidden="true">'+it.icon+'</span>':'')+'</button>';
    }).join("");
    if(asSheet){
      ov.classList.add("ov-asheet");
      // role=menu : seulement des groupes et des menuitems (le titre devient le nom du groupe, « Annuler » est un menuitem)
      ov.innerHTML='<div class="asheet" role="menu" aria-label="'+H(o.label)+'"><div class="ag" role="group"'+(o.title?' aria-label="'+H(o.title)+'"':'')+'>'+(o.title?'<div class="ag-title" aria-hidden="true">'+H(o.title)+'</div>':'')+items+'</div>'+
        '<div class="ag" role="group"><button type="button" class="mitem cancel" role="menuitem" data-cancel="1">Annuler</button></div></div>';
    }else{
      ov.innerHTML='<div class="menu" role="menu" aria-label="'+H(o.label)+'">'+(o.title?'<div class="mtitle" aria-hidden="true">'+H(o.title)+'</div>':'')+items+'</div>';
      var menu=ov.firstChild, r=anchor.getBoundingClientRect(), vw=window.innerWidth, vh=window.innerHeight, left=(r.left+r.width/2)<vw/2;
      if(r.top<vh/2) menu.style.top=Math.round(r.bottom+6)+"px"; else menu.style.bottom=Math.round(vh-r.top+6)+"px";
      if(left) menu.style.left=Math.round(Math.max(8,r.left))+"px"; else menu.style.right=Math.round(Math.max(8,vw-r.right))+"px";
      menu.style.transformOrigin=(r.top<vh/2?"top ":"bottom ")+(left?"left":"right");
    }
    ov.addEventListener("click",function(e){
      var p=e.target.closest("[data-pick]"); if(p){ var id=p.getAttribute("data-pick"); closeOverlay(); o.onPick(id); return; }
      if(e.target.closest("[data-cancel]")) closeOverlay();
    });
    ov.addEventListener("keydown",function(e){
      if(e.key!=="ArrowDown"&&e.key!=="ArrowUp") return; e.preventDefault();
      var its=$$(".mitem",ov), i=its.indexOf(actif()); i=(i+(e.key==="ArrowDown"?1:-1)+its.length)%its.length; its[i].focus();
    });
    var first=ov.querySelector('[aria-checked="true"]')||ov.querySelector(".mitem"); if(first) first.focus();
  }

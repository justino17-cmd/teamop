  // Retrait local tout de suite, avec « Annuler » ; la SOURCE n'est prévenue qu'une fois le délai écoulé (ou la page quittée) — sinon « Annuler » mentirait.
  var retraits=[];
  function retirerCoteSource(r){ if(r.fait) return; r.fait=true;
    Promise.resolve().then(function(){ return SRC.retirerBoite(r.a.sid); }).then(function(){ delete RETIRES[r.a.id]; },function(e){ delete RETIRES[r.a.id]; if(vivant){ toast("La boîte n’a pas pu être retirée : "+msgErr(e,"échec")); charger(false); } }); }
  function deleteAcct(a){
    var ai=ACCOUNTS.indexOf(a), saved=[];
    for(var j=MESSAGES.length-1;j>=0;j--) if(MESSAGES[j].acct===a.id) saved.unshift({m:MESSAGES[j],i:j});
    saved.slice().reverse().forEach(function(x){ MESSAGES.splice(x.i,1); });

    state.selected=null; if(state.multi) state.multi=[]; refreshCls(); renderAll(); persist();
    var r={a:a,fait:false,annule:false}; retraits.push(r); RETIRES[a.id]=true;
    r.tm=setTimeout(function(){ if(!r.annule) retirerCoteSource(r); },6500);
    toast("Boîte "+a.email+" supprimée",{label:"Annuler",onAct:function(){

  var audioNouveau=null;

    placeSheetChrome();
    var mIn=$("#aMail"), det=$("#aDet"), go=$("#aGo"), err=$("#aMailErr"), found=null, seq=0, tmr;

    var kind=cote, seg=$("#kKind"), segBtns=$$("[data-kind]",seg);

    function paint(st,p,msg){

      if(st==="ko"){ det.innerHTML='<span class="ptile" style="background:#8e8e93" aria-hidden="true">'+I.warn+'</span><span class="pn"><b>'+H(msg)+'</b></span>'; return; }

    function apply(p){
      found=sansVoie(p)?null:p; var imap=motDePasse(p)&&!sansVoie(p);

      if(imap){ $("#aImap").value=p.imap||""; $("#aImapPort").value=p.imapPort||993; $("#aSmtp").value=p.smtp||""; $("#aSmtpPort").value=p.smtpPort||465; }

    }
    var enCours="";   // domaine dont le MX est en cours de lecture : un Entrée + un « change » ne font qu'une demande
    function detect(geste){
      var v=mIn.value.trim().toLowerCase(), at=v.lastIndexOf("@"), d=at>0?v.slice(at+1):"";
      if(!mIn.isConnected) return;   // feuille fermée (Échap, Annuler) : le champ qui disparaît déclenche un « change » — ce n’est PAS un geste, rien ne part
      if(geste&&enCours===d) return;
      showErr(""); var my=++seq; enCours="";
      if(!/^[^@\s]+@[a-z0-9-]+(\.[a-z0-9-]+)*\.[a-z]{2,}$/.test(v)){ det.hidden=true; apply(null); go.disabled=true; return; }
      var p=detectParDomaine(d);
      if(p){ paint("ok",p); apply(p); return; }
      if(!geste){   // domaine d'entreprise : on attend la fin de la saisie, aucun appel réseau pendant la frappe
        paint("idle",null,d); apply(null); go.disabled=false; go.textContent="Vérifier la messagerie"; return; }
      enCours=d; paint("wait",null,"Vérification de « "+d+" »"); apply(null);
      var lmx=lireMX(d);
      if(!lmx){ enCours=""; var g=provServeurEntreprise(d); g.note="Le serveur reconnaît la messagerie à la connexion."; paint("ok",g); apply(g); return; }
      lmx.then(function(mx){ if(my!==seq||!mIn.isConnected) return; enCours="";
        var r=detectParMX(d,mx);
        if(!r){ var q=provServeurEntreprise(d); q.note="Impossible de vérifier le domaine (hors ligne ?). Réglages les plus courants proposés : à vérifier."; paint("ok",q); apply(q); return; }
        if(r.erreur){ paint("ko",null,r.erreur); apply(null); return; }
        paint("ok",r); apply(r);
      });
    }
    // l'adresse change : ce qui a été reconnu pour l'AVANT ne vaut plus (Entrée dans les 350 ms refait la reconnaissance, elle ne connecte pas avec l'ancienne)
    mIn.addEventListener("input",function(){ found=null; clearTimeout(tmr); tmr=setTimeout(function(){ detect(false); },350); });
    mIn.addEventListener("change",function(){ clearTimeout(tmr); setTimeout(function(){ detect(true); },0); });   // le champ est quitté (ou Entrée) : la saisie est finie. Après un tour : fermer la feuille (Échap) fait aussi « quitter » le champ, avant de le retirer du document — ce n’est pas un geste
    mIn.addEventListener("keydown",function(e){ if(e.key==="Enter"&&!go.disabled){ e.preventDefault(); go.click(); } });
    $("#aAdvTog").onclick=function(){ var b=$("#aAdvBody"), open=b.hidden; b.hidden=!open; this.setAttribute("aria-expanded",String(open)); };
    $("#aClose").onclick=closeOverlay;
    $("#aManual").onclick=openProviderList;
    go.onclick=function(){
      if(!found){ clearTimeout(tmr); if(!go.disabled) detect(true); return; }   // le geste passe avant la frappe en attente (350 ms) : sinon elle le repeindrait par-dessus
      var mail=mIn.value.trim(), name=$("#aName").value.trim();
      if(acctByEmail(mail)){ showErr("Cette adresse est déjà connectée ("+KINDS[kindOf(acctByEmail(mail))]+")."); mIn.focus(); return; }
      var pw=motDePasse(found);
      if(pw&&!$("#aPass").value){ showErr("Entrez le mot de passe de cette boîte."); $("#aPass").focus(); return; }
      if(pw&&CAP.reglagesServeur&&!$("#aImap").value.trim()){ showErr("Indiquez le serveur de réception."); $("#aAdvBody").hidden=false; $("#aImap").focus(); return; }
      var avant=go.textContent; go.disabled=true; go.textContent=oauthOk(found)?"Ouverture de "+viaDe(found)+"…":"Connexion…";
      if(!PROVIDERS.some(function(x){ return x.id===found.id; })) PROVIDERS.splice(PROVIDERS.length-1,0,{id:found.id,name:found.name,sub:"",color:found.color,mono:found.mono||"",glyph:found.mono?null:(found.id.indexOf("icloud")===0?"cloud":"at"),kind:found.kind});
      connectAccount(provOf(found.id),mail,name||mail.split("@")[0],kind,{mdp:pw?$("#aPass").value:"",imap:pw&&CAP.reglagesServeur?{imap:$("#aImap").value.trim(),imapPort:+$("#aImapPort").value||993,smtp:$("#aSmtp").value.trim(),smtpPort:+$("#aSmtpPort").value||465}:null,logo:logoChoisi}).then(function(){
        if(ov.isConnected) closeOverlay(); },function(e){
        if(!ov.isConnected) return; go.disabled=false; go.textContent=avant; showErr(msgErr(e,"Connexion impossible.")); });
    };
    if(qk){
      go.style.display="none";   // « Continuer » n'a de sens que dans « Autre messagerie »
      var qErr=$("#aQErr"), qBtns=$$("#aQuick .prov");
      var qSay=function(t){ qErr.hidden=!t; qErr.querySelector("span").textContent=t||""; };
      // ⛔ L'autorisation s'ouvre DANS le geste : connectAccount appelle la source tout de suite (voir plus bas), SANS rien attendre avant — Safari bloque une fenêtre ouverte après un await.
      var quick=function(p){
        qSay(""); qBtns.forEach(function(b){ b.disabled=true; });
        var sub=(p.id==="gmail"?$("#aQG .pn span"):$("#aQM .pn span")), avant=sub.textContent; sub.textContent="Autorisation en cours dans la fenêtre ouverte…";
        connectAccount(p,"","",kind,{mdp:"",imap:null,logo:logoChoisi}).then(function(){ if(ov.isConnected) closeOverlay(); },function(e){
          if(!ov.isConnected) return; sub.textContent=avant; qBtns.forEach(function(b,i){ b.disabled=(i===0&&!okG)||(i===1&&!okM); }); qSay(msgErr(e,"Connexion impossible.")); });
      };
      if(okG) $("#aQG").onclick=function(){ quick(pG); };
      if(okM) $("#aQM").onclick=function(){ quick(pM); };
      $("#aQO").onclick=function(){ var a=$("#aAutre"), ouvrir=a.hidden; a.hidden=!ouvrir; this.setAttribute("aria-expanded",String(ouvrir)); go.style.display=ouvrir?"":"none"; if(ouvrir){ qSay(""); try{ mIn.focus(); }catch(x){} } };
      setTimeout(function(){ var f=$("#aQG")&&!$("#aQG").disabled?$("#aQG"):$("#aQO"); if(f) f.focus({preventScroll:true}); },30);
    } else
    setTimeout(function(){ mIn.focus({preventScroll:true}); },30);
  }
  // Repli : l'ancienne liste, pour les cas rares
  function openProviderList(){
    closeOverlay();
    var ov=makeOverlay("acct");
    ov.innerHTML='<div class="sheet acct" role="dialog" aria-modal="true" aria-labelledby="aTitle">'+
      sheetBar('<button class="btn back-btn" id="aBack" type="button" data-home="l" aria-label="Retour"><span class="ic" aria-hidden="true">'+I.chevL+'</span><span class="lbl" aria-hidden="true">Retour</span></button>','<span class="t">Choisir le fournisseur</span>','',"aTitle")+
      '<div class="sheet-body"><div class="gwrap"><div class="gcard" id="provGrid">'+PROVIDERS.map(function(p){

  function openConnect(p){
    closeOverlay();
    var isImap=motDePasse(p)&&!sansVoie(p);
    var ov=makeOverlay("acct");
    var row=function(id,label,type,ph,extra){ return '<div class="fld"><label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+type+'" placeholder="'+H(ph)+'"'+(extra||"")+'></div>'; };
    // Type de boîte : obligatoire, sans choix par défaut (contrôle segmenté iOS = groupe de boutons radio)
    var kindHtml='<div class="ghead kind-hide" id="kKindLbl">Type de boîte (obligatoire)</div>'+
      '<div class="gcard kind-card kind-hide"><div class="kseg" id="kKind" role="radiogroup" aria-labelledby="kKindLbl" aria-required="true" aria-describedby="kKindHelp">'+
        '<button type="button" role="radio" aria-checked="false" tabindex="0" data-kind="pro">'+I.briefcase+'<span>Pro</span></button>'+
        '<button type="button" role="radio" aria-checked="false" tabindex="-1" data-kind="perso">'+I.house+'<span>Perso</span></button></div></div>'+
      '<p class="kind-err" id="kKindErr" role="alert" hidden>'+I.warn+'<span>Choisissez « Pro » ou « Perso » pour cette boîte.</span></p>'+
      '<p class="gfoot-s kind-hide" id="kKindHelp">'+I.info+'<span>Pro : travail, clients, fournisseurs. Perso : vie privée. Chaque univers a sa propre vue, et vous pouvez aussi tout voir ensemble.</span></p>';
    // Adresse déjà connectée : erreur en ligne sous la carte « Compte »
    var mailErr='<p class="kind-err" id="kMailErr" role="alert" hidden>'+I.warn+'<span></span></p>';
    var inner;
    if(isImap){
      inner='<div class="ghead" aria-hidden="true">Compte</div><div class="gcard">'+
          row("kName","Nom","text","Votre nom affiché",' autocomplete="name"')+
          row("kMail","Adresse","email","vous@entreprise.fr",' autocomplete="email"')+
          row("kPass","Mot de passe","password","Requis",' autocomplete="off"')+'</div>'+mailErr+kindHtml+
        (CAP.reglagesServeur?'<div class="ghead" aria-hidden="true">Serveur de réception</div><div class="gcard">'+
          row("kImap",p.kind==="exchange"?"Serveur":"Serveur IMAP","text",p.kind==="exchange"?"mail.entreprise.fr":"imap.entreprise.fr",' autocapitalize="off"')+'</div>'+
        '<div class="ghead" aria-hidden="true">Serveur d’envoi</div><div class="gcard">'+
          row("kSmtp","Serveur SMTP","text","smtp.entreprise.fr",' autocapitalize="off"')+'</div>':'')+
        '<p class="gfoot-s">'+I.lock+'<span>La connexion est chiffrée (TLS).'+(p.kind==="oauth"?" Bientôt : connexion sécurisée via "+H(p.name)+", sans mot de passe — en attendant, utilisez un mot de passe d’application.":"")+'</span></p>';
    }else{
      inner='<div class="note-card">'+I.lock+'<div>'+(sansVoie(p)?H(provDetail(p)):'Vous allez vous connecter à <b>'+H(p.name)+'</b> de façon sécurisée (OAuth). '+H(TITRE)+' n’enregistre jamais votre mot de passe.')+'</div></div>'+
        '<div class="ghead" aria-hidden="true">Compte</div><div class="gcard">'+
          row("kMail","Adresse","email","vous@"+(p.id==="gmail"?"gmail.com":p.id==="icloud"?"icloud.com":p.id==="yahoo"?"yahoo.com":"exemple.com"),' autocomplete="email"')+
          row("kName","Nom","text","Votre nom affiché",' autocomplete="name"')+'</div>'+mailErr+kindHtml;
    }
    var short=p.kind==="imap"?"IMAP":p.kind==="exchange"?"Exchange":"";
    ov.innerHTML='<div class="sheet acct" role="dialog" aria-modal="true" aria-labelledby="kTitle">'+
      sheetBar('<button class="btn back-btn" id="kBack" type="button" data-home="l" aria-label="Retour"><span class="ic" aria-hidden="true">'+I.chevL+'</span><span class="lbl" aria-hidden="true">Retour</span></button>',
        providerTile(p)+(short?'<span class="t t-long">'+H(p.name)+'</span><span class="t t-short" aria-hidden="true">'+H(short)+'</span>':'<span class="t">'+H(p.name)+'</span>'),
        '<button class="btn" id="kCancel" type="button" data-home="foot" data-ord="1">Annuler</button>'+
        '<button class="btn primary" id="kGo" type="button" data-home="r" data-mac="foot" data-ord="2">'+(isImap?"Connecter":"Se connecter")+'</button>',"kTitle")+
      '<div class="sheet-body"><div class="gwrap">'+inner+'</div></div>'+SHEET_FOOT+'</div>';
    placeSheetChrome();
    if(sansVoie(p)) $("#kGo").disabled=true;
    $("#kBack").onclick=openProviderList;
    $("#kCancel").onclick=closeOverlay;
    setTimeout(function(){ var el=$("#kMail"); if(el) el.focus(); },30);
    var kind=UN_COTE?COTES[0]:null, seg=$("#kKind"), segBtns=$$("[data-kind]",seg), kErr=$("#kKindErr");
    function setKind(b,focus){ kind=b.getAttribute("data-kind");
      segBtns.forEach(function(x){ var on=x===b; x.setAttribute("aria-checked",String(on)); x.tabIndex=on?0:-1; });
      seg.classList.remove("invalid"); seg.removeAttribute("aria-invalid"); kErr.hidden=true; if(focus) b.focus(); }
    seg.addEventListener("click",function(e){ var b=e.target.closest("[data-kind]"); if(b) setKind(b,false); });
    seg.addEventListener("keydown",function(e){
      if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].indexOf(e.key)<0) return; e.preventDefault();
      var i=segBtns.indexOf(actif()); setKind(segBtns[i===0?1:0],true); });
    var mErr=$("#kMailErr"), mIn=$("#kMail");
    function mailError(txt){ var on=!!txt; mErr.hidden=!on; mErr.querySelector("span").textContent=txt||"";

    mIn.addEventListener("input",function(){ if(!mErr.hidden) mailError(""); });
    $("#kGo").onclick=function(){
      var mail=($("#kMail")&&$("#kMail").value.trim())||"";
      var name=($("#kName")&&$("#kName").value.trim())||"";
      var badMail=!mail||mail.indexOf("@")<1;
      var dup=badMail?null:acctByEmail(mail);
      if(!kind){ kErr.hidden=false; seg.classList.add("invalid"); seg.setAttribute("aria-invalid","true"); }
      if(badMail){ if($("#kMail")) $("#kMail").focus(); toast("Entrez une adresse e-mail valide"); return; }
      // Une adresse = une seule boîte, dans un seul univers (pas de doublon Pro + Perso)
      if(dup){ mailError("Cette adresse est déjà connectée ("+KINDS[kindOf(dup)]+")."); mIn.focus(); return; }
      if(!kind){ segBtns[0].focus(); kErr.scrollIntoView({block:"nearest"}); return; }
      var pw=isImap?($("#kPass")&&$("#kPass").value)||"":"";
      if(isImap&&!pw){ toast("Entrez le mot de passe de cette boîte"); $("#kPass").focus(); return; }
      var go=$("#kGo"), avant=go.textContent; go.textContent="Connexion…"; go.disabled=true;
      var srv=isImap&&CAP.reglagesServeur?{imap:($("#kImap").value||"").trim(),smtp:($("#kSmtp").value||"").trim()}:null;
      // Feuille fermée entre-temps (Échap, Annuler, Retour) = on n'y touche plus ; la connexion, elle, a été demandée.
      connectAccount(p,mail,name||mail.split("@")[0],kind,{mdp:pw,imap:srv}).then(function(){ if(ov.isConnected) closeOverlay(); },function(e){
        if(!ov.isConnected) return; go.disabled=false; go.textContent=avant; mailError(msgErr(e,"Connexion impossible.")); });

/* ── le temps ── */
const auj = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const jourDe = (j) => { const d = auj(); d.setDate(d.getDate() + j); return d; };
const fmt = (d, o) => new Intl.DateTimeFormat('fr-FR', o).format(d);
const maj1 = (t) => t.charAt(0).toUpperCase() + t.slice(1);
const jourLong = (j) => maj1(fmt(jourDe(j), { weekday: 'long', day: 'numeric', month: 'long' }));
const jourCourt = (j) => (j === 0 ? 'Aujourd’hui' : j === -1 ? 'Hier' : j === 1 ? 'Demain' : j > -7 && j < 0 ? maj1(fmt(jourDe(j), { weekday: 'long' })) : fmt(jourDe(j), { day: 'numeric', month: 'short' }));
const quand = (m) => (m.j === 0 ? m.h : jourCourt(m.j));
/* l'heure du prototype : il est 9 h 42 à l'ouverture (les données d'exemple racontent une matinée), puis le temps passe pour de vrai */
const _t0 = Date.now();
const hMaintenant = () => { const m = 9 * 60 + 42 + Math.floor((Date.now() - _t0) / 60000); return String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
const minutes = (h) => +h.slice(0, 2) * 60 + +h.slice(3);
const lundi = (sem) => { const d = auj(), k = (d.getDay() + 6) % 7; return -k + sem * 7; };       // le décalage (en jours) du lundi de la semaine visée

/* ── la navigation : #vue ou #vue/identifiant ── */
function lireAdresse() { const p = location.hash.slice(1).split('/'); S.vue = VUES[p[0]] ? p[0] : 'accueil'; S.id = p[1] ? decodeURIComponent(p[1]) : null; }
function aller(vue, id) { const h = '#' + vue + (id ? '/' + encodeURIComponent(id) : ''); if (location.hash === h) rendre(); else location.hash = h; }
/* la touche Retour (Android, navigateur) ferme aussi la feuille ouverte */
window.addEventListener('hashchange', () => { if ($('#calque').innerHTML) fermer(); fermerMenu(); lireAdresse(); rendre(); });
/* le rail (bureau), la barre du haut (recherche, activité, soi), les cinq onglets (téléphone) */

  return NAV.map((n) => { const c = compte(n[0]); return `<a href="#${n[0]}" ${S.vue === n[0] ? 'aria-current="page"' : ''} title="${n[2]}">${svg(n[1])}${n[2]}${c ? `<em>${c}</em>` : ''}</a>`; }).join('')
    + `<button class="creer" data-action="creer" aria-label="Créer" title="Créer : message, appel, réunion, rendez-vous">${svg('plus')}</button>`;
}
function hautHtml() { const n = activite().length;
  return `<a class="marque" href="#accueil" aria-label="OP MESSAGES, accueil"><i>OP<br>MSG</i><span>OP MESSAGES</span><em>PRO</em></a>
    <button class="chercher" data-action="chercher">${svg('cherche')}<span>Rechercher une personne, un message, une réunion</span><kbd>${/Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent) ? '⌘K' : 'Ctrl K'}</kbd></button>
    <div class="h-droite"><a class="h-btn" href="#activite" ${S.vue === 'activite' ? 'aria-current="page"' : ''} aria-label="Activité${n ? ', ' + n + ' à traiter' : ''}" title="Activité">${svg('cloche')}${n ? `<em>${n}</em>` : ''}</a>
      <a class="h-btn h-moi" href="#profil" ${S.vue === 'profil' ? 'aria-current="page"' : ''} aria-label="Mon profil et mes réglages" title="${esc(P.moi.n)} · ${STATUTS[S.statut][0]}">${av('moi', 'm', false).replace('</span>', `<u class="${STATUTS[S.statut][1] === 'npd' ? 'occ' : STATUTS[S.statut][1]}"></u></span>`)}</a></div>`;
}
const ONGLETS = ['accueil', 'messages', 'appels', 'agenda'];
function ongletsHtml() { const plus = !ONGLETS.includes(S.vue) && S.vue !== 'activite' && S.vue !== 'profil';
  return ONGLETS.map((k) => { const n = NAV.find((x) => x[0] === k), c = compte(k); return `<a href="#${k}" ${S.vue === k ? 'aria-current="page"' : ''}><i>${svg(n[1])}${c ? `<em>${c}</em>` : ''}</i>${n[2]}</a>`; }).join('')
    + `<button data-action="plus" ${plus ? 'aria-current="page"' : ''}><i>${svg('points')}${COUR.nl ? `<em>${COUR.nl}</em>` : ''}</i>Plus</button>`; }
function majMenu() { $('#cote').innerHTML = menuHtml(); $('#onglets').innerHTML = ongletsHtml(); $('#haut').innerHTML = hautHtml(); }
const tete = (titre, gestes) => `<div class="barre"><h1 class="coupe">${titre}</h1>${gestes || ''}</div>`;

/* ── l'Activité : tout ce qui attend une réponse, au même endroit (messages non lus, mentions, appels manqués, invitations, courriels) ── */
const TRAITE = new Set();
function activite() {
  const l = [];
  C.filter((c) => c.nl).forEach((c) => { const d = dernier(c); l.push({ id: 'm-' + c.id, g: c.canal ? 'mention' : 'message', ic: c.canal ? 'eclat' : 'bulle', c: '#2a4a9c', t: (c.canal ? 'Mention dans ' : '') + convNom(c), p: (c.canal ? prenom(d.de) + ' : ' : '') + apercu(d), h: quand(d), j: d.j, hh: d.h, go: 'messages/' + c.id, ges: [['Répondre', 'go']] }); });
  APPELS.filter((a) => a.sens === 'manque' && !a.vu).forEach((a) => l.push({ id: 'a-' + a.id, g: 'appel', ic: 'tel', c: '#e5484d', t: 'Appel manqué · ' + P[a.qui].n, p: P[a.qui].r, h: a.j === 0 ? a.h : jourCourt(a.j), j: a.j, hh: a.h, go: 'appels/' + a.id, ges: [['Rappeler', 'appeler', a.qui]] }));
  EVTS.filter((e) => e.invitation).forEach((e) => l.push({ id: 'i-' + e.id, g: 'invitation', ic: 'agenda', c: '#7d3c98', t: 'Invitation · ' + e.titre, p: jourLong(e.j) + ' · ' + e.deb + ' – ' + e.fin + ' · de ' + P[e.invitation].n, h: '', j: 0, hh: '07:00', go: 'reunions/' + e.id, ges: [['Accepter', 'inv', 'oui'], ['Refuser', 'inv', 'non']], e: e.id }));
  if (COUR.nl) l.push({ id: 'c', g: 'courrier', ic: 'mail', c: '#0d8a6a', t: COUR.nl + ' courriel' + (COUR.nl > 1 ? 's' : '') + ' non lu' + (COUR.nl > 1 ? 's' : ''), p: 'Dans ta boîte professionnelle', h: '', j: 0, hh: '06:00', go: 'courrier', ges: [['Ouvrir', 'go']] });
  return l.filter((x) => !TRAITE.has(x.id)).sort((a, b) => b.j - a.j || b.hh.localeCompare(a.hh));
}
const actHtml = (x) => `<div class="act"><span class="ic" style="--c:${x.c}">${svg(x.ic)}</span><div class="t"><b class="coupe">${esc(x.t)}</b><p>${esc(x.p)}</p><div class="ges">${x.ges.map((g, k) => g[1] === 'go' ? `<a class="btn" href="#${x.go}">${g[0]}</a>` : g[1] === 'appeler' ? `<button class="btn" data-appeler="${g[2]}">${svg('tel')}${g[0]}</button>` : `<button class="btn ${k ? 'gris' : ''}" data-inv="${x.e}" data-rep="${g[2]}">${g[0]}</button>`).join('')}<button class="btn gris" data-traite="${x.id}">${svg('coche')}Traité</button></div></div><time>${x.h}</time></div>`;

function rendre() {
  const v = VUES[S.vue](), sc = $('#scene'), garde = sc.dataset.cle === S.vue + '/' + (S.id || '') ? $$('.defile,.fil', sc).map((e) => e.scrollTop) : null;

/* ── feuilles ── */

/* ── toast et bannière ── */
let _toast = 0;
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(_toast); _toast = setTimeout(() => e.classList.remove('on'), 2600); }
function notifier(titre, texte, go) {

/* ── jour et nuit : en production, l'application suit l'appareil ; le réglage n'existe que dans ce prototype ── */
function appliquerTheme() { const nuit = S.theme === 'dark' || (S.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches); document.documentElement.dataset.theme = nuit ? 'dark' : 'light';
  const m = $('meta[name="theme-color"]'); if (m) m.content = nuit ? '#050b1f' : '#16296b'; if (COUR.inst && COUR.inst.rafraichir) COUR.inst.rafraichir({ donnees: false }); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', appliquerTheme);
const themeHote = () => (document.documentElement.dataset.theme === 'dark' ? 'nuit' : 'jour');
/* ══ LES ÉCRANS — une fonction par rubrique, qui rend { html, deux } (deux colonnes au bureau : la liste, puis le détail) ══ */
const vide = (ic, t) => `<div class="vide"><div><i>${svg(ic)}</i>${t}</div></div>`;
const chev = () => svg('chev').replace('<svg', '<svg class="ch"');

/* ═══ ACCUEIL : ma journée à gauche, ce qui attend à droite ═══ */
function prochaine() { const m = minutes(hMaintenant()); return EVTS.filter((e) => !e.passe && (e.j > 0 || (e.j === 0 && minutes(e.fin) > m))).sort((a, b) => a.j - b.j || a.deb.localeCompare(b.deb))[0]; }
function dansCombien(e) { if (e.j !== 0) return jourCourt(e.j) + ' à ' + e.deb; const d = minutes(e.deb) - minutes(hMaintenant()); return d <= 0 ? 'En cours' : d < 60 ? 'Dans ' + d + ' min' : 'Aujourd’hui à ' + e.deb; }
VUES.accueil = () => {
  const h = +hMaintenant().slice(0, 2), p = prochaine(), jour = EVTS.filter((e) => e.j === 0).sort((a, b) => a.deb.localeCompare(b.deb)), act = activite(), eq = Object.values(P).filter((x) => x.eq);

    </div><div style="display:flex;flex-direction:column;gap:16px;min-width:0">

    </div></div></div></div></div>` };

/* ═══ MESSAGES : une seule liste, en sections (favoris, canaux, équipe, clients), avec des filtres ═══ */
const ligneConv = (c) => { const d = dernier(c); return `<a class="ligne ${c.nl ? 'nl' : ''}" href="#messages/${c.id}" ${S.id === c.id ? 'aria-current="true"' : ''}>${c.canal ? '<span class="diese" aria-hidden="true">#</span>' : av(c.avec, '', true)}<span class="t"><span class="l1"><b class="coupe">${esc(convNom(c))}</b><time>${d.vide ? '' : quand(d)}</time></span>

const ordreConv = (a, b) => { const x = dernier(a), y = dernier(b); return y.j - x.j || y.h.localeCompare(x.h); };
function listeConvHtml() {
  const q = S.rech.trim().toLowerCase(), f = S.filtreConv; let tri = C.slice().sort(ordreConv);
  if (q) { const r = tri.filter((c) => convNom(c).toLowerCase().includes(q) || c.msgs.some((m) => (m.t || '').toLowerCase().includes(q)));
    return r.length ? r.map(ligneConv).join('') : `<p class="note" style="padding:20px;text-align:center">Aucun résultat pour « ${esc(S.rech)} ».</p>`; }
  if (f === 'nonlus') tri = tri.filter((c) => c.nl); else if (f === 'canaux') tri = tri.filter((c) => c.canal); else if (f === 'clients') tri = tri.filter((c) => c.avec && !P[c.avec].eq);
  if (!tri.length) return '<p class="note" style="padding:20px;text-align:center">Rien dans ce filtre.</p>';
  const sec = [['Favoris', tri.filter((c) => c.epingle)], ['Canaux', tri.filter((c) => !c.epingle && c.canal)], ['Équipe', tri.filter((c) => !c.epingle && c.avec && P[c.avec].eq)], ['Clients et partenaires', tri.filter((c) => !c.epingle && c.avec && !P[c.avec].eq)]];
  return sec.filter((s) => s[1].length).map((s) => `<p class="section-l">${s[0]}</p>${s[1].map(ligneConv).join('')}`).join('');
}
function bulleHtml(c, m, i) {

  const sep = !prec || prec.j !== m.j ? `<div class="jour">${jourCourt(m.j)}</div>` : '';
  if (m.type === 'sys') return sep + `<div class="sys">${svg(m.ic || 'tel')}${esc(m.t)}</div>`;
  let corps;
  if (m.type === 'vocal') corps = `<div class="bulle piece" data-msg="${m.id}"><span class="vocal"><button data-jouer aria-label="Écouter le message vocal">${svg('jouer')}</button><span class="onde">${[40, 70, 55, 90, 60, 35, 80, 65, 45, 75, 50, 85, 40, 60, 30, 70, 55, 45].map((h, k) => `<i style="--h:${h}%;--k:${k}"></i>`).join('')}</span><time>${m.d}</time></span></div>`;
  else if (m.type === 'photo') corps = `<div class="bulle piece" data-msg="${m.id}"><span class="photo-i" style="--a1:${P[m.de].a[0]};--a2:${P[m.de].a[1]}">${svg('photo')}</span>${m.leg ? `<small>${esc(m.leg)}</small>` : ''}</div>`;
  else if (m.type === 'fichier') corps = `<div class="bulle piece" data-msg="${m.id}"><span class="fichier"><i>${svg('doc')}</i><span><b>${esc(m.nom)}</b><small>${esc(m.taille)}</small></span></span></div>`;
  else if (m.type === 'position') corps = `<div class="bulle piece" data-msg="${m.id}"><span class="photo-i" style="--a1:#7fc8a9;--a2:#2a7a6a">${svg('position')}</span><small>${esc(m.t)}</small></div>`;
  else if (m.type === 'sondage') { const tot = m.opts.reduce((n, o) => n + o[1], 0) || 1; corps = `<div class="bulle piece" data-msg="${m.id}"><span class="sondage"><b>${esc(m.q)}</b>${m.opts.map((o, k) => `<button data-vote="${m.id}" data-k="${k}" aria-pressed="${m.v === k}"><i style="--w:${Math.round(o[1] / tot * 100)}%"></i><span>${esc(o[0])}</span><span>${o[1]}</span></button>`).join('')}<small>${tot} vote${tot > 1 ? 's' : ''}${m.v != null ? ' · tu as voté' : ''}</small></span></div>`; }
  else corps = `<div class="bulle" data-msg="${m.id}">${m.rep ? `<span class="cite">${esc(m.rep)}</span>` : ''}${esc(m.t)}</div>`;

}
function convHtml(c) {

VUES.agenda = () => {
  const l0 = lundi(S.agSem), jours = [0, 1, 2, 3, 4, 5, 6].map((k) => l0 + k), du = (j) => EVTS.filter((e) => e.j === j).sort((a, b) => a.deb.localeCompare(b.deb));

      <div class="g-corps"><div class="g-h">${Array.from({ length: GH - 1 }, (_, k) => `<span style="top:calc(var(--hh) * ${k + 1})">${G0 + k + 1}:00</span>`).join('')}</div>
      ${jours.map((j) => `<div class="g-col ${j === 0 ? 'auj' : ''}">${du(j).map((e) => `<button class="bloc-g" data-evt="${e.id}" style="--c:${TYPES_E[e.type][1]};top:calc(var(--hh) * ${pos(e.deb)} + 1px);height:calc(var(--hh) * ${Math.max(0.5, pos(e.fin) - pos(e.deb))} - 2px)"><b>${esc(e.titre)}</b><span>${e.deb} – ${e.fin}</span></button>`).join('')}${j === 0 ? `<i class="g-now" style="top:calc(var(--hh) * ${pos(hMaintenant())})"></i>` : ''}</div>`).join('')}</div></div>`;
  else { const ref = jourDe(l0 + 3), a = ref.getFullYear(), m = ref.getMonth(), premier = new Date(a, m, 1), dec = (premier.getDay() + 6) % 7, base = Math.round((premier - auj()) / 864e5) - dec;

      <div class="seg" role="group" aria-label="Affichage">${[['semaine', 'Semaine'], ['mois', 'Mois']].map((v) => `<button aria-pressed="${S.agVue === v[0]}" data-ag-vue="${v[0]}">${v[1]}</button>`).join('')}</div></div>
    ${corps}
    <div class="jour-liste" ${S.agVue === 'mois' ? 'style="display:block"' : ''}><h3 class="titre-s">${jourLong(S.agJour)}</h3><div class="groupe">${sel.length ? sel.map((e) => evtLigne(e, e.type === 'reunion' && !e.passe && e.j === 0 ? '<span class="pastille b" style="align-self:center">Rejoindre</span>' : '')).join('') : '<p style="padding:16px;color:var(--second)">Rien de prévu ce jour-là.</p>'}</div></div>

/* ═══ COURRIER : la VRAIE boîte mail d'OP MESSAGES Pro (le module opcourrier.js), montée telle quelle avec des courriels d'exemple.
   Justin, 13 novembre 2026 : « la boîte mail, je veux celle qui était ». Rien n'y est redessiné. ⛔ Sa zone reste toujours dans la page (on la
   masque) : le module se démonte de lui-même dès que son conteneur quitte le document. ═══ */
VUES.courrier = () => ({ html: '<div class="col seule"></div>' });
function placerCourrier() {
  const f = $('#courrier-fixe'), vu = S.vue === 'courrier', z = $('#zone-courrier');
  f.classList.toggle('masquee', !vu); f.setAttribute('aria-hidden', String(!vu));
  if (!window.OPCourrier || !window.OPCourrierDemo) { z.innerHTML = vide('mail', 'La boîte mail n’a pas pu se charger dans ce prototype.'); return; }
  if (COUR.inst) { if (vu) COUR.inst.rafraichir({ donnees: false }); return; }
  if (COUR.montage) return;                 // ⛔ le module annonce son compte PENDANT son montage : sans cette garde, le rendu qu'il déclenche le remontait sans fin
  COUR.montage = true;
  try { const source = OPCourrierDemo.creer({ mode: 'demo' }), toutes = source.boites.bind(source);
    source.boites = () => Promise.resolve(toutes()).then((l) => l.filter((b) => b.cote === 'pro'));      // la source d'exemple a une boîte perso : le côté Pro ne la montre pas
    COUR.inst = OPCourrier.monter(z, { source, cotes: ['pro'], cote: 'pro', cleStockage: 'protoOpmsg3_courrier', titre: 'OP Courrier', intervalle: 0, theme: themeHote,
      onCompter: (n) => { if (COUR.nl === n) return; COUR.nl = n; setTimeout(() => { majMenu(); if ((S.vue === 'accueil' || S.vue === 'activite') && !$('#calque').innerHTML) rendre(); }, 0); } });
  } catch (e) { z.innerHTML = vide('mail', 'La boîte mail n’a pas pu s’ouvrir dans ce prototype.'); }
}

/* ══ EN DIRECT : l'appel (audio, vidéo) et la réunion (préparation, salle, partage d'écran) ══ */
const dureeTxt = (t0) => { const s = Math.max(0, Math.floor((Date.now() - t0) / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
let _tic = 0;

/* ═══ APPEL ═══ */
function demarrerAppel(qui, video, entrant) {
  const c = conv(qui);
  if (c && c.canal) { ouvrirSalle({ titre: c.n, invites: c.membres.map((m) => [m, 'oui']) }, true); return; }      // appeler un canal, c'est une réunion
  const p = c ? c.avec : qui; if (!P[p]) return; fermer();
  S.appel = { qui: p, video: !!video, etat: entrant ? 'entrant' : 'sonne', muet: false, hp: false, clavier: false, reduit: false, t0: 0 };
  peindreAppel(); if (!entrant) setTimeout(() => { if (S.appel && S.appel.etat === 'sonne') { S.appel.etat = 'cours'; S.appel.t0 = Date.now(); peindreAppel(); } }, 2200);
}
function peindreAppel() {
  const a = S.appel, z = $('#plein'), m = $('#mini'); clearInterval(_tic);
  if (!a) { if (!S.salle) z.innerHTML = ''; if (m) m.remove(); return; }
  if (a.etat === 'cours') _tic = setInterval(() => { $$('[data-duree]').forEach((e) => { e.textContent = dureeTxt(a.t0); }); }, 1000);
  if (a.reduit) { z.innerHTML = ''; let b = m; if (!b) { b = document.createElement('button'); b.id = 'mini'; b.dataset.appel = 'revenir'; document.body.appendChild(b); }
    b.innerHTML = `${svg('tel')}${esc(prenom(a.qui))} · <span data-duree class="tab">${a.t0 ? dureeTxt(a.t0) : '…'}</span>`; b.setAttribute('aria-label', 'Revenir à l’appel avec ' + P[a.qui].n); return; }
  if (m) m.remove();
  const p = P[a.qui], b = (k, ic, l, on) => `<button data-appel="${k}" aria-pressed="${!!on}"><i>${svg(ic)}</i>${l}</button>`;
  const etat = a.etat === 'sonne' ? 'Appel en cours…' : a.etat === 'entrant' ? (a.video ? 'Appel vidéo entrant' : 'Appel entrant') : `<span data-duree class="tab">${dureeTxt(a.t0)}</span>`;
  z.innerHTML = `<div class="appel ${a.video && a.etat === 'cours' ? 'video' : ''} ${a.etat !== 'cours' ? 'sonne' : ''}" style="--a1:${p.a[0]};--a2:${p.a[1]}" role="dialog" aria-label="Appel avec ${esc(p.n)}">
    ${a.etat === 'cours' ? `<button class="reduire" data-appel="reduire" aria-label="Réduire l’appel">${svg('bas')}</button>` : ''}${a.video && a.etat === 'cours' ? '<span class="vous">Toi</span>' : ''}
    <div class="haut-a">${av(a.qui, 'xl')}<h2>${esc(p.n)}</h2><p>${etat}</p></div>
    ${a.etat === 'entrant' ? `<div class="fin" style="margin-top:auto"><button data-appel="raccrocher" class="racc"><i>${svg('tel')}</i>Refuser</button><button data-appel="repondre"><i class="ok">${svg('tel')}</i>Répondre</button></div>`
      : a.clavier ? `<div class="clavier">${'123456789*0#'.split('').map((t) => `<button data-touche="${t}">${t}</button>`).join('')}</div><div class="fin"><button data-appel="clavier"><i style="background:rgba(255,255,255,.16)">${svg('x')}</i>Masquer</button><button data-appel="raccrocher" class="racc"><i>${svg('tel')}</i>Raccrocher</button></div>`
      : `<div class="cmd">${b('muet', a.muet ? 'microoff' : 'micro', 'Silence', a.muet)}${b('hp', 'hp', 'Haut-parleur', a.hp)}${b('camera', a.video ? 'video' : 'camoff', 'Caméra', a.video)}${b('clavier', 'clavier', 'Clavier')}${b('ajouter', 'ajout', 'Ajouter')}${b('message', 'bulle', 'Message')}</div>
        <div class="fin"><button data-appel="raccrocher" class="racc"><i>${svg('tel')}</i>Raccrocher</button></div>`}</div>`;
}
function finAppel() {
  const a = S.appel; if (!a) return; clearInterval(_tic);
  const duree = a.t0 ? dureeTxt(a.t0) : null, sens = a.etat === 'entrant' ? 'manque' : a.etatOrigine === 'entrant' ? 'entrant' : 'sortant';
  APPELS.unshift({ id: uid(), qui: a.qui, sens, video: a.video ? 1 : 0, j: 0, h: hMaintenant(), duree: duree || undefined, vu: true });
  const c = C.find((x) => x.avec === a.qui); if (c && duree) c.msgs.push({ id: uid(), de: 'moi', type: 'sys', ic: a.video ? 'video' : 'tel', j: 0, h: hMaintenant(), t: `Appel ${a.video ? 'vidéo' : 'audio'} · ${duree}` });
  S.appel = null; peindreAppel(); rendre(); toast(duree ? 'Appel terminé · ' + duree : sens === 'manque' ? 'Appel refusé' : 'Appel annulé');
}

  menuLibre(x, y, l('ouvrir', 'Ouvrir', 'info') + (e.type === 'reunion' && !e.passe ? l('rejoindre', 'Rejoindre', 'video') : '') + (e.passe ? '' : l('modifier', 'Modifier', 'stylo') + l('plus1h', 'Décaler d’une heure', 'horloge') + l('demain', 'Reporter au lendemain', 'agenda') + l('dupliquer', 'Dupliquer', 'copier') + l('annuler', e.invites && e.invites.length ? 'Annuler la réunion' : 'Supprimer', 'corbeille', 'r')), e.id); }

  const d = menuLibre(ev.clientX, ev.clientY, `<button class="l" data-ectx="neuf" data-type="reunion">Nouvelle réunion à ${hm(m)}${svg('video')}</button><button class="l" data-ectx="neuf" data-type="rdv">Nouveau rendez-vous à ${hm(m)}${svg('agenda')}</button>`); d.dataset.j = j; d.dataset.m = m; });
document.addEventListener('click', (ev) => { const b = ev.target.closest('[data-ectx]'); if (!b) return; const mn = b.closest('.menu-ctx'), k = b.dataset.ectx, e = evt(mn.dataset.pour); ev.stopPropagation(); fermerMenu();
  if (k === 'neuf') { const m = +mn.dataset.m; feuilleProgrammer({ type: b.dataset.type, j: +mn.dataset.j, deb: hm(m), fin: hm(m + (b.dataset.type === 'reunion' ? 30 : 60)) }); return; }
  if (!e) return;
  if (k === 'ouvrir') ouvrir(`${fTeteOk(TYPES_E[e.type][0])}${ficheEvt(e)}`); else if (k === 'rejoindre') ouvrirSalle(e); else if (k === 'modifier') feuilleProgrammer(e);
  else if (k === 'plus1h') deplacerEvt(e, e.j, hm(minutes(e.deb) + 60)); else if (k === 'demain') deplacerEvt(e, e.j + 1, e.deb);
  else if (k === 'dupliquer') { EVTS.push(Object.assign({}, e, { id: uid(), j: e.j + 7, invites: e.invites ? e.invites.map((i) => [i[0], 'attente']) : undefined, cr: undefined, invitation: undefined })); rendre(); toast('Dupliqué : une semaine plus tard'); }

      'note-tache': () => { const x = APPELS.find((y) => y.id === id); S.taches.push({ id: uid(), t: (x.notes || 'Rappeler ' + quiAppel(x).n).slice(0, 90), src: 'Appel avec ' + quiAppel(x).n, fait: 0 }); fermer(); toast('Ajouté à tes tâches', 'Voir', () => aller('aujourdhui')); },
      'note-partager': () => { const x = APPELS.find((y) => y.id === id), cv = C.find((y) => y.avec === x.qui) || conv('equipe'); cv.msgs.push({ id: uid(), de: 'moi', j: 0, h: '09:42', t: 'Notes de l’appel : ' + x.notes }); toast('Notes envoyées', 'Voir', () => aller('messages-x-' + cv.id)); },
      cr: () => compteRendu(evt(id)),
      enr: () => toast('Prototype : l’enregistrement existe déjà (gardé 3 jours, puis à télécharger)'),
      transc: () => toast('Prototype : la transcription s’ouvrirait ici, avec la recherche dans le texte'),
      'cr-taches': () => { const e = evt(id); const m = e.cr.actions.filter((x) => x[1] === 'moi'); m.forEach((x) => { if (!S.taches.some((t) => t.t === x[0])) S.taches.push({ id: uid(), t: x[0], src: e.titre, fait: 0 }); }); fermer(); toast(m.length ? m.length + ' action' + (m.length > 1 ? 's' : '') + ' dans tes tâches' : 'Aucune action à ton nom', 'Voir', () => aller('aujourdhui')); },
      'cr-envoyer': () => { const e = evt(id), x = conv('equipe'); x.msgs.push({ id: uid(), de: 'moi', j: 0, h: '09:42', type: 'fiche', genre: 'devis', b: 'Compte rendu · ' + e.titre, s: e.cr.actions.length + ' actions · ' + e.cr.decisions.length + ' décisions', c: '#7d3c98' }); fermer(); toast('Compte rendu envoyé à l’équipe', 'Voir', () => aller('messages-x-equipe')); },
      'copier-lien': () => { try { navigator.clipboard.writeText(evt(S.param).lien).catch(() => {}); } catch (e) { /* refusé : le lien reste lisible */ } toast('Lien copié'); },
      'suppr-evt': () => { const i = EVTS.findIndex((x) => x.id === id), e = EVTS[i]; EVTS.splice(i, 1); aller('agenda'); rendre(); toast('Supprimé de l’agenda', 'Annuler', () => { EVTS.push(e); rendre(); }); },
      programmer: () => { const cr = b.dataset.creneau; feuilleProgrammer(cr != null ? { titre: 'Point d’équipe', j: [1, 1, 4][+cr], h: ['09:00', '16:00', '08:00'][+cr], invites: ['karim', 'leo', 'sophie'] } : { j: S.jourSel > 0 ? S.jourSel : 1 }); },
      code: () => toast('Prototype : on saisit ici le code reçu de l’organisateur'),
      'creer-evt': () => { const t = $('#pe-titre').value.trim() || 'Sans titre', j = +$('#pe-jour').value, h = $('#pe-heure').value, d = +$('#pe-duree').value;
        const type = ($('[data-type-evt][aria-pressed="true"]') || {}).dataset.typeEvt, inv = Array.from(document.querySelectorAll('#pe-invites [aria-pressed="true"]')).map((x) => [x.dataset.invite, 'attente']);
        const [hh, mm] = h.split(':').map(Number), f = hh * 60 + mm + d, fin = String(Math.floor(f / 60)).padStart(2, '0') + ':' + String(f % 60).padStart(2, '0');
        const e = { id: 'e' + uid(), cote: cote(), type, titre: t, j, deb: h, fin, invites: inv.length ? inv : undefined, c: type === 'reunion' ? '#2a4a9c' : '#a04a00', odj: $('#pe-odj').value.split('\n').map((x) => x.trim()).filter(Boolean), rappel: $('#pe-rappel').value, lien: type === 'reunion' ? 'op-messages.example/r/' + uid() : undefined };
        EVTS.push(e); fermer(); S.jourSel = Math.min(3, j); aller('agenda-x-' + e.id); rendre();
        notifier('Ajouté à l’agenda', t + ' · ' + jlong(j) + ' à ' + h + (inv.length ? '. Invitation envoyée à ' + inv.map((x) => prenom(x[0])).join(', ') + '.' : ''), 'agenda-x-' + e.id); },
      'ajouter-contact': () => ouvrir(`<h2>Ajouter un contact</h2><label class="champ">Identifiant ou numéro<input placeholder="Prénom#1234 ou 06…" autofocus></label><div class="info">${svg('qr')}<span class="t"><b>Ou montre ton code</b><br><span class="petit">L’autre personne le scanne : vous êtes en contact, sans échanger de numéro.</span></span></div><div class="pied"><button class="btn gris" data-ferme="1">Annuler</button><button class="btn" data-action="proto" data-mot="Prototype : la demande de contact serait envoyée" data-ferme-apres="1">Envoyer la demande</button></div>`, { centre: true }),
      proto: () => { if (b.dataset.fermeApres) fermer(); toast(b.dataset.mot); },
    };
    if (A[a]) { A[a](); return; }
  }
  if ((b = q('[data-plus-tard]'))) { fermer(); const s = $('#saisie'); if (s) s.value = ''; toast('Programmé : ' + b.dataset.plusTard.toLowerCase(), 'Annuler', () => { const z = $('#saisie'); if (z) z.value = _ctx; }); return; }
  if ((b = q('[data-go]'))) { ev.preventDefault(); if (b.dataset.notif) $('#notif').innerHTML = ''; if (b.dataset.ferme) fermer(); aller(b.dataset.go); return; }
  if ((b = q('[data-ferme]')) && (ev.target === b || b.classList.contains('x') || b.tagName === 'BUTTON')) { fermer(); return; }
});
document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.id === 'rech-msg' || t.id === 'rech-mail') { if (t.id === 'rech-msg') S.rechMsg = t.value; else S.rechMail = t.value; const p = t.selectionStart; rendre(); const n = $('#' + t.id); if (n) { n.focus(); n.setSelectionRange(p, p); } }
  if (t.id === 'rech-tout') $('#rech-res').innerHTML = resultats(t.value);
  if (t.id === 'saisie' || t.id === 'saisie-fil') { t.style.height = 'auto'; t.style.height = Math.min(120, t.scrollHeight) + 'px'; }
});
document.addEventListener('keydown', (ev) => {
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'k') { ev.preventDefault(); if (S.role !== 'invite') ouvrirRecherche(); return; }
  if (ev.key === 'Escape') { if ($('#calque').innerHTML) fermer(); else gdFin(); return; }
  if (ev.key === 'Enter' && !ev.shiftKey) {
    if (ev.target.id === 'saisie') { ev.preventDefault(); const s = ev.target; if (s.value.trim()) envoyerMsg(conv(S.param), s.value.trim()); }
    else if (ev.target.id === 'saisie-fil') { ev.preventDefault(); $('[data-action="envoyer-fil"]').click(); }
    else if (ev.target.id === 'salle-msg') { ev.preventDefault(); $('[data-salle="chat"]').click(); }
    else if (ev.target.id === 'salle-action') { ev.preventDefault(); $('[data-salle="action"]').click(); }
    else if (ev.target.matches && ev.target.matches('.bulle[data-menu-msg]')) ev.target.click();
  }
});

/* ═══ DÉMARRAGE ═══ */
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', appliquerMode); } catch (e) { /* ancien navigateur */ }
appliquerMode(); lireHash();
setTimeout(() => { if (S.role === 'pro' && S.route === 'aujourdhui' && GD.i < 0 && !$('#calque').innerHTML) notifier('Karim Benali', 'Dis-moi vite, le client attend.', 'messages-x-karim'); }, 5000);
</script>

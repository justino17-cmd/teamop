<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<script>/* le mode choisi (☀︎/☾), posé AVANT le premier rendu : sans ça, la page s'afficherait d'abord dans l'autre (dans une fonction : une variable globale heurterait celles des pages qui embarquent ces lignes) */
(function () { try { var m = localStorage.getItem('teamop_site_mode'); if (m === 'jour' || m === 'nuit') document.documentElement.setAttribute('data-theme', m === 'nuit' ? 'dark' : 'light'); } catch (e) {} })();</script>
<link rel="stylesheet" href="/vitrine/v2/theme.css">
<style>
  /* ══ LA PAGE OÙ L'ON PAIE, AU THÈME DU SITE (27 septembre 2026 au soir) ══════════════════════════════════════════
     Justin : « au niveau des connexions ou création de compte, j'ai pas mon thème ». On arrive ici depuis « Choisir
     Pro » sur les tarifs du site : la page gardait un fond toujours sombre, une couleur par formule (bleu, violet,
     ciel) et le logo VERT d'OP GESTION à côté de « TEAM OP ». Elle lit désormais la palette du site
     (/vitrine/v2/theme.css), jour ET nuit, comme les cartes des tarifs dont on vient ; les formules y parlent toutes
     la même couleur, celle du site.
     Ses propres noms de jetons (--fond, --texte…) restent : ils pointent simplement sur ceux du site. */
  :root {
    --fond: var(--m-bg);
    --navy: var(--m-card);
    --navy-2: var(--m-tile);
    --carte: var(--m-card);
    --bordure: var(--m-line);
    --bordure-vive: color-mix(in srgb, var(--m-link) 45%, transparent);
    --texte: var(--m-text);
    --texte-2: var(--m-body);
    --texte-3: var(--m-sub);
    --bleu: var(--m-link);
    --bleu-fond: color-mix(in srgb, var(--m-link) 12%, transparent);
    --vert: var(--m-ok);
    --vert-fond: var(--m-ok-fond);
    --radius: 22px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  #nbUsers::-webkit-outer-spin-button, #nbUsers::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  #nbUsers { -moz-appearance: textfield; appearance: textfield; }
  /* au doigt, le nombre qu'on retape fait 44 px (il en faisait 22 × 27) */
  @media (pointer: coarse) { #nbUsers { min-height: 44px; min-width: 44px; } }
  body {
    font-family: var(--m-corps);
    background: var(--fond);
    color: var(--texte);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== BARRE HAUTE : la marque et le ☀︎/☾ du site ===== */
  .barre {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: calc(12px + env(safe-area-inset-top)) 24px 12px;
    border-bottom: 1px solid var(--bordure);
  }
  .logo { display: flex; align-items: center; gap: 10px; font-family: var(--m-titre); font-weight: 600; font-size: 17px; letter-spacing: -0.01em; }
  .logo img { width: 32px; height: 32px; border-radius: 8px; display: block; }
  .barre-droite { display: flex; align-items: center; gap: 8px; }
  .btn-retour {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 13px; font-weight: 500;
    color: var(--texte);
    text-decoration: none;
    padding: 0 14px;
    min-height: 36px;
    border-radius: 999px;
    border: 0;
    background: var(--m-card);
    cursor: pointer;
    font-family: inherit;
  }
  .btn-retour:hover { opacity: .85; }
  .btn-retour svg { width: 15px; height: 15px; }

  /* ===== CONTENEUR ===== */
  .conteneur {
    max-width: 1020px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }
  .fil-etapes {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 32px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--texte-3);
    flex-wrap: wrap;
  }
  .etape { display: flex; align-items: center; gap: 8px; }
  .etape-num {
    width: 24px; height: 24px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    border: 1px solid var(--bordure);
  }
  .etape.faite .etape-num { background: var(--vert-fond); border-color: transparent; color: var(--vert); }
  .etape.active { color: var(--texte); }
  .etape.active .etape-num { background: var(--bleu); border-color: var(--bleu); color: var(--m-bg); }
  .fil-trait { width: 36px; height: 1px; background: var(--bordure); }

  .titre-page {
    text-align: center;
    margin-bottom: 8px;
    font-family: var(--m-titre);
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.1;
  }
  .sous-titre {
    text-align: center;
    color: var(--texte-3);
    margin-bottom: 32px;
    font-size: 17px;
  }

  /* ===== GRILLE PRINCIPALE ===== */
  .grille {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    gap: 24px;
    align-items: start;
  }

  /* ===== COLONNE DROITS ===== */
  .carte {
    background: var(--carte);
    border: 1px solid transparent;
    border-radius: var(--radius);
  }
  .carte-droits { padding: 28px; }
  .entete-formule {
    display: flex;
    align-items: center;
    gap: 14px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--bordure);
    margin-bottom: 22px;
  }
  .icone-formule {
    width: 52px; height: 52px;
    border-radius: 13px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .icone-formule svg { width: 26px; height: 26px; }
  /* le nom et sa pastille : quand le nom est long (« Business Premium »), la pastille passe dessous, alignée à gauche */
  .nom-formule { font-family: var(--m-titre); font-size: 22px; font-weight: 700; letter-spacing: -0.015em; margin-right: 10px; }
  .desc-formule { font-size: 14px; color: var(--texte-2); margin-top: 2px; }
  .badge-formule {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 9px;
    border-radius: 999px;
    vertical-align: middle;
    white-space: nowrap;
  }

  /* ===== BLOC UTILISATEURS (le point clé) ===== */
  .bloc-utilisateurs {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
    border-radius: 16px;
    margin-bottom: 24px;
    border: 1px solid;
  }
  .avatars { display: flex; }
  .avatar-rond {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 2px solid var(--navy);
    display: flex; align-items: center; justify-content: center;
    margin-left: -8px;
    font-size: 12px;
  }
  .avatar-rond:first-child { margin-left: 0; }
  .avatar-rond svg { width: 15px; height: 15px; }
  .bloc-utilisateurs .texte-u { flex: 1; min-width: 0; }
  .bloc-utilisateurs .gros { font-size: 16px; font-weight: 700; }
  .bloc-utilisateurs .petit { font-size: 13px; color: var(--texte-2); margin-top: 1px; }

  .section-droits {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--texte-3);
    margin: 20px 0 12px;
  }
  .droit {
    display: flex;
    align-items: flex-start;
    gap: 11px;
    padding: 9px 0;
    font-size: 14px;
  }
  .droit .coche {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--bleu-fond);
    color: var(--bleu);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .droit .coche svg { width: 12px; height: 12px; }
  .droit.exclu { color: var(--texte-3); }
  .droit.exclu .coche { background: var(--m-seg); color: var(--texte-3); }
  .droit strong { font-weight: 600; color: var(--texte); }
  .droit.exclu strong { color: var(--texte-3); }
  .droit .detail { color: var(--texte-2); }

  /* ===== COLONNE PAIEMENT ===== */
  .carte-paiement { padding: 26px; position: sticky; top: 24px; }
  .ligne-prix {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 8px 0;
    font-size: 14px;
    color: var(--texte-2);
  }
  .ligne-prix.total {
    border-top: 1px solid var(--bordure);
    margin-top: 10px;
    padding-top: 16px;
    color: var(--texte);
    font-weight: 700;
    font-size: 15px;
  }
  .prix-grand { font-family: var(--m-titre); font-size: 40px; font-weight: 700; letter-spacing: -0.03em; }
  .prix-grand small { font-family: var(--m-corps); font-size: 15px; font-weight: 500; letter-spacing: 0; color: var(--texte-3); }
  .choix-cycle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    margin: 16px 0 20px;
    padding: 4px;
    border-radius: 16px;
    background: var(--m-seg);
  }
  .cycle {
    padding: 9px 12px;
    min-height: 44px;
    border-radius: 12px;
    border: 0;
    cursor: pointer;
    text-align: center;
    font-size: 13px;
    font-weight: 500;
    color: var(--texte-2);
    transition: background-color .25s ease-out, box-shadow .25s ease-out;
    background: none;
    font-family: inherit;
    position: relative;
  }
  .cycle.actif { background: var(--m-seg-on); color: var(--texte); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.18); }
  .cycle .eco {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--vert);
    margin-top: 2px;
  }
  .btn-payer {
    width: 100%;
    padding: 13px 22px;
    min-height: 50px;
    border-radius: 999px;
    border: none;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    color: var(--m-on-accent);
    cursor: pointer;
    transition: opacity .15s ease-out, transform .15s ease-out;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    margin-top: 4px;
  }
  .btn-payer:hover { opacity: .92; }
  .btn-payer:active { transform: scale(.98); }
  .btn-payer:disabled { opacity: .6; cursor: default; }
  .btn-payer svg { width: 17px; height: 17px; }
  .note-paiement {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    font-size: 12.5px;
    color: var(--texte-3);
    margin-top: 14px;
  }
  .note-paiement svg { width: 13px; height: 13px; flex-shrink: 0; }
  .garanties {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--bordure);
  }
  .garantie {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 13px;
    color: var(--texte-2);
    padding: 4px 0;
  }
  .garantie svg { width: 14px; height: 14px; color: var(--vert); flex-shrink: 0; }

  /* ===== SÉLECTEUR AUTRE FORMULE : les pastilles des tarifs du site ===== */
  .autres-formules {
    margin-top: 22px;
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .puce-formule {
    font-size: 13px;
    font-weight: 500;
    padding: 0 16px;
    min-height: 36px;
    border-radius: 999px;
    border: 1px solid var(--bordure);
    color: var(--texte-2);
    cursor: pointer;
    background: none;
    font-family: inherit;
    transition: background-color .2s ease-out, color .2s ease-out;
  }
  .puce-formule:hover { color: var(--texte); border-color: var(--bordure-vive); }
  .puce-formule.active { background: var(--bleu); border-color: var(--bleu); color: var(--m-bg); font-weight: 600; }

  /* au doigt, pas de cible sous 44 px (le bouton ☀︎/☾ en fait déjà 44) */
  @media (pointer: coarse) { .btn-retour, .puce-formule { min-height: 44px; } }
  @media (prefers-reduced-motion: reduce) { .cycle, .btn-payer, .puce-formule { transition: none; } }

  @media (max-width: 860px) {
    /* ⛔ `minmax(0, 1fr)` ET PAS `1fr`. Une piste `1fr` a pour taille minimale `auto`, donc
       elle ne descend PAS sous la largeur intrinsèque de son contenu : mesuré à 390 px, la
       grille faisait 342 px et ses deux cartes 375 — la page débordait de 9 px et le
       récapitulatif de prix glissait sous le bord de l'écran, sur un iPhone 12 à 15. C'est la
       page où un prospect PAIE. `minmax(0, 1fr)` autorise la piste à rétrécir. */
    .grille { grid-template-columns: minmax(0, 1fr); }
    .carte-paiement { position: static; }
    .titre-page { font-size: 28px; }
  }
  @media (max-width: 480px) {
    .barre { padding-left: 16px; padding-right: 16px; }
    .conteneur { padding: 28px 16px 64px; }
    .carte-droits, .carte-paiement { padding: 22px 18px; }
    .bloc-utilisateurs { flex-direction: column; align-items: flex-start; gap: 10px; }
    /* les trois étapes passent sur deux lignes : un trait qui ne relie plus rien pendrait au bout de la première */
    .fil-etapes { gap: 10px 18px; }
    .fil-trait { display: none; }
  }
</style>
</head>

const REMISE_ANNUELLE = 2; // 2 mois offerts sur l'année

   23 septembre 2026 : « tu peux marquer bientôt disponible »). Une formule qu'on ne peut pas
   servir ne se vend pas : ni paiement, ni compte gratuit. Ses droits restent LISIBLES à gauche,
   pour que la page dise ce qui arrive. Repasser à false le jour de la réouverture. */

let formuleActive = params.get('formule') || 'business';
if (!FORMULES[formuleActive]) formuleActive = 'business';
let cycleAnnuel = false;

let nbUsersVoulu = Math.min(MAX_ABONNEMENTS, parseInt(params.get('utilisateurs'), 10) || 0);   // 0 = automatique (1 : un abonnement)

/* ---------- RENDU : SÉLECTEUR ---------- */
function rendreSelecteur() {
  const c = document.getElementById('selecteurFormules');
  const groupe = FORMULES[formuleActive].groupe;
  c.innerHTML = Object.entries(FORMULES).filter(([cle, f]) => f.groupe === groupe).map(([cle, f]) =>
    `<button class="puce-formule ${cle === formuleActive ? 'active' : ''}" data-formule="${cle}">${f.nom}</button>`
  ).join('');
  c.querySelectorAll('.puce-formule').forEach(b => {
    b.addEventListener('click', () => {
      formuleActive = b.dataset.formule; nbUsersVoulu = 0;
      history.replaceState(null, '', '?formule=' + formuleActive);
      rendreTout();
    });
  });
}

  const parUtilisateur = gratuit ? null

  const totalAffiche = prixAffiche * nbAbos;
  c.innerHTML = `

        <button id="aboMoins" type="button" style="width:44px;height:44px;border-radius:999px;border:1px solid var(--m-line);background:var(--m-tile);color:var(--m-text);font-size:20px;font-weight:600;cursor:pointer;flex-shrink:0;">\u2212</button>
        <div style="flex:1;text-align:center;">
          <div style="display:flex;align-items:baseline;justify-content:center;gap:7px;font-size:22px;font-weight:800;"><input id="nbUsers" type="number" min="1" max="${MAX_ABONNEMENTS}" value="${nbUsersVoulu}" title="Tapez votre nombre d'utilisateurs" style="width:${String(nbUsersVoulu).length+0.8}ch;text-align:center;font-size:22px;font-weight:800;background:transparent;border:none;outline:none;color:inherit;font-family:inherit;padding:0;border-bottom:1px dashed color-mix(in srgb,var(--m-link) 45%,transparent);"><span>utilisateur${nbUsersVoulu>1?'s':''}</span></div>
          <div style="font-size:12px;color:var(--m-sub);margin-top:4px;">${nbAbos} abonnement${nbAbos>1?'s':''} ${f.nom} \u00b7 un par utilisateur${nbUsersVoulu>=MAX_ABONNEMENTS?' \u00b7 au-del\u00e0 de '+MAX_ABONNEMENTS+', \u00e9crivez \u00e0 support@teamop.fr':''}</div>
        </div>
        <button id="aboPlus" type="button" style="width:44px;height:44px;border-radius:999px;border:1px solid var(--m-line);background:var(--m-tile);color:var(--m-text);font-size:20px;font-weight:600;cursor:pointer;flex-shrink:0;">+</button>
      </div>
      ${nbAbos>1 && !((STRIPE_PRICES[formuleActive]||{})[cycleAnnuel?'annuel':'mensuel'])?`<div style="margin-top:9px;font-size:12px;color:var(--m-body);text-align:center;">⚠️ Sur la page de paiement, indiquez la quantité : <b style="color:var(--m-text);">${nbAbos}</b></div>`:''}
    </div>` : ''}
    ${!gratuit && annuelDispo ? `
      <div class="choix-cycle">
        <button class="cycle ${!cycleAnnuel ? 'actif' : ''}" data-cycle="mensuel">
          Mensuel
          <span class="eco" style="visibility:hidden;">.</span>
        </button>
        <button class="cycle ${cycleAnnuel ? 'actif' : ''}" data-cycle="annuel">
          Annuel
          <span class="eco">${REMISE_ANNUELLE} mois offerts</span>
        </button>
      </div>` : ''}
    ${!gratuit ? `
      <div class="ligne-prix">
        <span>Abonnement ${f.nom}${nbAbos>1?' \u00d7 '+nbAbos:''}</span>
        <span>${(cycleAnnuel ? f.prixMensuel * 12 : f.prixMensuel) * nbAbos} €</span>
      </div>
      ${cycleAnnuel ? `
        <div class="ligne-prix" style="color:var(--vert);">
          <span>Remise annuelle (${REMISE_ANNUELLE} mois offerts)</span>

    </div>
    ${gratuit ? '' : `<div style="margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--m-ok-fond);border:1px solid color-mix(in srgb,var(--m-ok) 25%,transparent);">
      <div style="font-size:13.5px;font-weight:600;color:var(--m-ok);margin-bottom:8px;">🎁 Vous avez un code promo ?</div>
      <div style="font-size:12.5px;color:var(--m-body);line-height:1.5;margin-bottom:9px;">Entrez-le ici : il active vos mois offerts directement, <b>sans carte bancaire</b>. Un rappel vous préviendra avant la fin.</div>
      <div style="display:flex;gap:8px;">
        <input id="promo-code" placeholder="Ex : BIENVENUE3" style="flex:1;min-width:0;min-height:44px;background:var(--m-tile);border:1px solid var(--m-line);border-radius:12px;padding:10px 12px;color:var(--m-text);font-size:16px;font-family:inherit;text-transform:uppercase;" onkeydown="if(event.key==='Enter')promoValider()">
        <button type="button" onclick="promoValider()" id="promo-btn" style="background:var(--m-accent);color:var(--m-on-accent);border:none;border-radius:999px;padding:10px 18px;min-height:44px;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer;white-space:nowrap;">Activer</button>

      <div id="promo-msg" style="display:none;font-size:12px;margin-top:8px;line-height:1.5;"></div>
    </div>`}

    ${gratuit ? '' : `

  const bm=document.getElementById('aboMoins'), bp=document.getElementById('aboPlus'), ni=document.getElementById('nbUsers');

  if(bm) bm.addEventListener('click', ()=>{ if(abosActuels()>1){ nbUsersVoulu=(abosActuels()-1)*f.utilisateurs; rendrePaiement(); } });
  if(bp) bp.addEventListener('click', ()=>{ if(abosActuels()<MAX_ABONNEMENTS){ nbUsersVoulu=(abosActuels()+1)*f.utilisateurs; rendrePaiement(); } });
  if(ni){ ni.addEventListener('change', ()=>{ nbUsersVoulu=Math.min(MAX_ABONNEMENTS,Math.max(1,parseInt(ni.value,10)||1)); rendrePaiement(); });
    ni.addEventListener('input', ()=>{ ni.style.width=(Math.max(1,String(ni.value||'').length)+0.8)+'ch'; });
    ni.addEventListener('keyup', e=>{ if(e.key==='Enter') ni.blur(); }); }
  c.querySelectorAll('.cycle').forEach(b => {
    b.addEventListener('click', () => {

    }
    /* ⛔ SANS CETTE RÉFÉRENCE, LE CORRECTIF STRIPE DU SERVEUR NE SERT À RIEN.
       `/api/stripe/checkout` ne grave `subscription_data[metadata][espace]` sur l'abonnement
       que si la page lui envoie un `ref` — et cette page, la SEULE du site qui ouvre une page
       de paiement, ne l'envoyait pas. Le rattachement retombait donc sur l'égalité EXACTE des
       adresses : la comptable paie avec l'adresse de facturation de la société, l'espace a été
       créé avec celle de la personne qui avait demandé l'accès, et l'application reste
       bloquée après le paiement, sans un mot.
       `elan_sync_team` est le marqueur d'espace rattaché, le même que lit `promoValider()`
       plus bas. Il peut être vide — un prospect paie avant d'avoir un espace — et c'est
       prévu : le serveur ignore un `ref` vide, et le repli par adresse reste en place. */
    const espaceRattacheRef = () => {
      try { return String(localStorage.getItem('elan_sync_team') || '').trim(); } catch (e) { return ''; }
    };
    const btn = document.getElementById('btnPayer');
    // 1) Paiement automatique via le serveur TeamOP : quantité déjà réglée + champ code promo
    const priceId = (STRIPE_PRICES[formuleActive] || {})[cycleAnnuel ? 'annuel' : 'mensuel'];
    if (priceId) {
      const txt = btn.innerHTML;
      btn.disabled = true; btn.innerHTML = 'Préparation du paiement…';
      try {
        const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 7000);
        const r = await fetch('https://api.teamop.fr/api/stripe/checkout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ price: priceId, quantity: nbAbos, ref: espaceRattacheRef() }), signal: ctl.signal });
        clearTimeout(to);
        if (r.ok) { const j = await r.json(); if (j && j.url) { window.location.href = j.url; return; } }
      } catch (e) {}
      btn.disabled = false; btn.innerHTML = txt;
    }
    // 2) Repli : lien de paiement classique (quantité à régler sur la page Stripe)
    const lien = CONFIG_STRIPE[formuleActive][cycleAnnuel ? 'annuel' : 'mensuel'];
    if (!lien || lien.includes('A_REMPLACER')) {
      alert('Le paiement annuel arrive très bientôt.\nEn attendant, choisissez le paiement mensuel — sans engagement.');
      return;
    }
    window.location.href = lien;
  });
}

/* ---------- CODE PROMO — mois offerts sans carte ---------- */
async function promoValider() {
  const inp = document.getElementById('promo-code'), msg = document.getElementById('promo-msg'), btn = document.getElementById('promo-btn');
  const code = (inp && inp.value || '').trim().toUpperCase();
  const dis = (t, ok) => { if (msg) { msg.style.display = 'block'; msg.style.color = ok ? 'var(--m-ok)' : 'var(--m-err)'; msg.innerHTML = t; } };
  if (!code) { dis('Entrez votre code promo.', false); return; }
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  try {
    const r = await fetch('https://api.teamop.fr/api/promo/valider', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: code, apercu: true }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { dis('⚠ ' + (j.error || 'Code invalide'), false); if (btn) { btn.disabled = false; btn.textContent = 'Activer'; } return; }
    /* ⛔ ON NE PROMET PAS UNE ACTIVATION QU'ON NE PEUT PAS TENIR. La page félicitait le
       visiteur — « activation dans l'application… » — puis le renvoyait vers `app.html#promo=`.
       Or `promoAppliquer` EXIGE la preuve de la clé d'équipe : un code ne s'active que SUR UN
       ESPACE. Un prospect qui n'en a pas encore atterrissait donc sur l'écran de connexion,
       le code perdu avec le hash, et sans jamais comprendre pourquoi. C'est quelqu'un qui
       allait payer, et à qui on venait de dire que c'était fait.
       ⚠️ `elan_sync_team` est le marqueur d'espace rattaché (`espaceRattache()` dans app.html),
       et cette page est servie par la MÊME origine : elle peut donc le lire. Deux chemins,
       deux messages vrais. */
    var aUnEspace = false;
    try { aUnEspace = !!String(localStorage.getItem('elan_sync_team') || '').trim(); } catch (e) {}
    if (aUnEspace) {
      dis('✓ Code valide : <b>' + j.mois + ' mois offert(s)</b> — activation dans l\'application…', true);
      setTimeout(() => { window.location.href = 'app.html#promo=' + encodeURIComponent(code); }, 900);
      return;
    }
    /* Pas d'espace sur cet appareil : on dit la vérité, et on donne le geste suivant. Le code
       est mémorisé pour que le champ de l'application soit pré-rempli le jour venu — il n'est
       PAS appliqué tout seul : une activation reste un geste de la personne. */
    try { localStorage.setItem('teamop_promo_en_attente', code); } catch (e) {}
    /* ⛔ ON NE SE PORTE PAS GARANT DE CE QU'ON NE TIENT QUE SUR UN NAVIGATEUR. « Nous avons
       noté votre code » était faux dès que la personne changeait d'appareil : elle valide
       depuis son ordinateur, demande son accès, ouvre le lien sur son téléphone — le champ
       est vide et rien ne lui rappelle le code. C'est la même classe de défaut que celle
       qu'on vient de fermer deux lignes plus haut : dire au visiteur qu'une chose est faite
       alors qu'elle ne l'est qu'à moitié. On lui donne donc le code EN CLAIR, à noter — le
       pré-remplissage reste un confort quand c'est le même navigateur, pas une promesse. */
    dis('✓ Code valide : <b>' + j.mois + ' mois offert(s)</b>.<br>'
      + 'Notez-le : <b style="font-size:16px;letter-spacing:.04em">' + code + '</b><br>'
      + 'Un code s\'applique à <b>votre espace</b> : ouvrez-le d\'abord avec votre lien de connexion, '
      + 'puis entrez ce code dans <b>Paramètres → Abonnement</b>.<br>'
      + 'Pas encore d\'espace ? <a href="espace.html" style="color:var(--m-link);text-decoration:underline">Demandez votre accès ici</a>.', true);
    if (btn) { btn.disabled = false; btn.textContent = 'Activer'; }
  } catch (e) { dis('Le serveur ne répond pas — réessayez.', false); if (btn) { btn.disabled = false; btn.textContent = 'Activer'; } }
}

  rendreSelecteur();
  rendreDroits();
  rendrePaiement();
  document.title = 'Récapitulatif ' + FORMULES[formuleActive].nom + ' — TEAM OP';
}

rendreTout();

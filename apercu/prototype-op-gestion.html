<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<!-- Aperçu de travail (5 novembre 2026) : le PROTOTYPE d'OP GESTION que Justin teste, copié tel quel depuis l'artefact claude.ai.
     Il vit ici parce que la page de claude.ai refuse les images de la carte : sur teamop.fr, la vraie carte se charge comme dans
     l'application. DONNÉES ENTIÈREMENT FICTIVES (« Clim Services 17 »), aucun appel au serveur de TEAM OP, rien ne s'enregistre. -->
</head>
<body>
<title>Prototype OP GESTION</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Prototype OP GESTION — thème TEAM OP (design/THEME-REFERENCE.md), jour / nuit / auto.
   Ordinateur : menu à gauche. Téléphone (≤ 760 px) : la barre du bas d'OP GESTION. */
:root{
  --police:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",Roboto,"Noto Sans",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --r:22px; --r2:16px;
  --ressort:cubic-bezier(.32,.72,0,1);
}
:root,:root[data-mode="jour"]{
  color-scheme:light;
  --encre:#0b1426; --doux:#46526a; --faible:#6a7590;
  --surf:rgba(255,255,255,.58); --surf2:rgba(255,255,255,.86); --surf-in:rgba(11,20,38,.045); --survol:rgba(11,20,38,.06);
  --trait:rgba(11,20,38,.09); --trait2:rgba(11,20,38,.16); --lise:rgba(255,255,255,.9);
  --ombre:0 1px 2px rgba(11,20,38,.05),0 10px 30px rgba(11,20,38,.08); --ombre-haute:0 24px 60px rgba(11,20,38,.22);
  --lien:#0a5fc2; --fill:#0b1426; --on-fill:#fff; --seg-cur:rgba(255,255,255,.95); --seg-ink:#0b1426;
  --vert:#1c7a3a; --orange:#b35500; --rouge:#b0263c; --bleu:#0a5fc2; --violet:#7d3c98; --ambre:#8a5300;
  --menu-fond:rgba(255,255,255,.4); --feuille:#f8f9fc; --voile:rgba(11,20,38,.32);
  --cel-auj:rgba(10,95,194,.05); --grille:rgba(11,20,38,.07); --grille-forte:rgba(11,20,38,.13);
  --carte-fond:#ffffff; --mix-carte:#ffffff; --ink-sur-tech:#0b1426;
  --page:radial-gradient(120% 90% at 0% 0%,#dfe9ff 0%,transparent 55%),radial-gradient(110% 80% at 100% 100%,#e6dff6 0%,transparent 60%),linear-gradient(160deg,#eef3fb,#f0f3f8);
  --tab-fond:rgba(255,255,255,.62); --tab-lise:rgba(255,255,255,.9); --tab-cur:rgba(255,255,255,.92); --tab-cur-ink:#0b1426; --tab-ink:#4a556b;
}
:root[data-mode="nuit"]{
  color-scheme:dark;
  --encre:#f0f3f8; --doux:#b8c1d1; --faible:#8f9ab0;
  --surf:#1E2A42; --surf2:#25334f; --surf-in:rgba(255,255,255,.05); --survol:rgba(255,255,255,.07);
  --trait:rgba(255,255,255,.10); --trait2:rgba(255,255,255,.16); --lise:rgba(255,255,255,.16);
  --ombre:0 1px 2px rgba(0,0,0,.25),0 12px 32px rgba(0,0,0,.28); --ombre-haute:0 24px 60px rgba(0,0,0,.55);
  --lien:#8fb4ff; --fill:#2c3d63; --on-fill:#f0f3f8; --seg-cur:rgba(255,255,255,.22); --seg-ink:#f0f3f8;
  --vert:#30d158; --orange:#ff9f0a; --rouge:#ff6b7f; --bleu:#64a8ff; --violet:#c98bf5; --ambre:#ffd60a;
  --menu-fond:#15213A; --feuille:#15213A; --voile:rgba(2,5,12,.6);
  --cel-auj:rgba(100,168,255,.07); --grille:rgba(255,255,255,.06); --grille-forte:rgba(255,255,255,.12);
  --carte-fond:#1E2A42; --mix-carte:#1E2A42; --ink-sur-tech:#f0f3f8;
  --page:linear-gradient(112deg,rgba(255,255,255,0) 58%,rgba(255,255,255,.04) 58.2%),radial-gradient(120% 90% at 0% 0%,#1A2A4D 0%,rgba(26,42,77,0) 55%),radial-gradient(110% 80% at 100% 100%,#1C1636 0%,rgba(28,22,54,0) 60%),linear-gradient(160deg,#0F1A30 0%,#070B16 100%);
  --tab-fond:rgba(52,59,74,.6); --tab-lise:rgba(255,255,255,.16); --tab-cur:rgba(34,59,110,.72); --tab-cur-ink:#f0f3f8; --tab-ink:#abb3c2;
}
*{box-sizing:border-box}
html{background:var(--page) fixed;background-color:#0b1426}
html[data-mode="jour"]{background-color:#f0f3f8}
body{margin:0;min-height:100vh;background:var(--page) fixed;color:var(--encre);font-family:var(--police);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lien);outline-offset:2px;border-radius:8px}
.verre{background:var(--surf);border:1px solid var(--trait);box-shadow:var(--ombre);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%)}
/* ── cadre ── */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.menu{position:sticky;top:0;height:100vh;padding:18px 12px 14px;border-right:1px solid var(--trait);display:flex;flex-direction:column;gap:2px;background:var(--menu-fond);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}
.logo i{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#1f9d6b,#0b3b2e);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:13px;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.logo b{display:block;font-size:16px;letter-spacing:.01em}.logo small{display:block;color:var(--doux);font-size:12px}
.menu .grp{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faible);padding:12px 12px 4px}
.menu a{display:flex;align-items:center;gap:11px;min-height:44px;padding:0 12px;border-radius:12px;color:var(--encre);text-decoration:none;font-weight:500;font-size:15px}
.menu a:hover{background:var(--survol)}
.menu a.on{background:var(--surf2);font-weight:650;box-shadow:var(--ombre)}
.menu a .ic{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);flex:none}
.menu a svg{width:17px;height:17px}
.menu .pied{margin-top:auto;padding-top:12px;display:flex;flex-direction:column;gap:10px}
.contenu{min-width:0;padding-block:22px 48px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.barre-bas,.tete-tel{display:none}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .menu{display:none}
  .contenu{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:10px;padding-bottom:128px;gap:16px}
  .barre-bas{display:block;position:fixed;left:0;right:0;bottom:0;padding:8px max(12px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));z-index:30}
  .tete-tel{display:flex;align-items:center;justify-content:space-between;gap:10px}
}
.mode-seg{display:flex;padding:3px;border-radius:12px;background:var(--surf-in);border:1px solid var(--trait)}
.mode-seg button{flex:1;min-height:36px;border:0;border-radius:9px;background:none;color:var(--doux);font-size:13px;font-weight:600}
.mode-seg button[aria-pressed="true"]{background:var(--seg-cur);color:var(--seg-ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.bandeau-proto{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 14px;border-radius:14px;background:color-mix(in srgb,var(--orange) 10%,transparent);border:1px solid color-mix(in srgb,var(--orange) 30%,transparent);color:var(--encre);font-size:14px}
.bandeau-proto b{color:var(--orange)}
/* ── typo ── */
.surtitre{font-size:13px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--doux)}
h1{margin:0;font-size:34px;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
h2{margin:0;font-size:22px;line-height:1.25}
h3{margin:0;font-size:17px}
.gris{color:var(--doux)}.faible{color:var(--faible)}
.petit{font-size:14px}.mini{font-size:13px}
.mono{font-family:var(--mono);font-size:.92em}
@media (max-width:760px){h1{font-size:28px}}
.tete{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.tete>div:first-child{display:flex;flex-direction:column;gap:4px;min-width:0}
/* ── blocs ── */
.carte{background:var(--surf);border:1px solid var(--trait);border-radius:var(--r);padding:18px 20px;box-shadow:var(--ombre);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);min-width:0}
.carte>h3{margin:0 0 12px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--doux);font-weight:650;display:flex;justify-content:space-between;align-items:center;gap:8px}
@media (max-width:760px){.carte{padding:16px;border-radius:20px}}
.grille2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
.grille3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:1100px){.grille2,.grille3{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
@media (min-width:761px){.kpis-serre{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.kpis-serre .kpi{min-height:0;padding:9px 14px}.kpis-serre .kpi b{font-size:21px}.kpis-serre .kpi span{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
.kpi{background:var(--surf);border:1px solid var(--trait);border-radius:var(--r2);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:76px;box-shadow:var(--ombre);color:var(--encre)}
.kpi b{font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi span{color:var(--doux);font-size:14px}
button.kpi:hover{border-color:var(--trait2)}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpi b{font-size:22px}}
.seg{display:inline-flex;padding:3px;border-radius:13px;background:var(--surf-in);border:1px solid var(--trait);gap:2px}
.seg button{min-height:40px;padding:0 16px;border:0;border-radius:10px;background:none;color:var(--doux);font-weight:550;font-size:15px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--seg-cur);color:var(--seg-ink);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.12)}
@media (max-width:760px){.seg{display:flex;width:100%}.seg button{flex:1;padding:0 6px;font-size:14px}}
.btn{min-height:46px;padding:0 18px;border:0;border-radius:999px;background:var(--fill);color:var(--on-fill);font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap;transition:transform .2s var(--ressort),opacity .2s}
.btn:active{transform:scale(.97);opacity:.9}
.btn.gris{background:var(--surf2);color:var(--encre);border:1px solid var(--trait)}
.btn.vert{background:var(--vert);color:#fff}
:root[data-mode="nuit"] .btn.vert{color:#0b1426}
.btn.rouge{background:none;color:var(--rouge);border:1px solid color-mix(in srgb,var(--rouge) 40%,transparent)}
.btn.large{width:100%;min-height:56px;font-size:17px}
.btn.petit{min-height:40px;padding:0 14px;font-size:14px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.lien{background:none;border:0;color:var(--lien);font-weight:600;padding:0;min-height:44px;display:inline-flex;align-items:center;gap:4px;text-decoration:none}
.lien:hover{text-decoration:underline;text-underline-offset:3px}
.retour{align-self:flex-start;margin-bottom:-8px}
.st{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:650;white-space:nowrap;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.st-v{--c:var(--vert)}.st-o{--c:var(--orange)}.st-b{--c:var(--bleu)}.st-r{--c:var(--rouge)}.st-g{--c:var(--doux)}.st-p{--c:var(--violet)}
table.l{width:100%;border-collapse:collapse;font-size:15px}
table.l th{text-align:left;color:var(--doux);font-weight:600;font-size:13px;padding:10px 12px;border-bottom:1px solid var(--trait);white-space:nowrap}
table.l td{padding:13px 12px;border-bottom:1px solid var(--trait);vertical-align:middle}
table.l tr:last-child td{border-bottom:0}
table.l tr.clic{cursor:pointer}
table.l tr.clic:hover td{background:var(--survol)}
table.l tfoot td{font-weight:700;border-top:1px solid var(--trait2);border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tableau{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (max-width:760px){.tableau table.l{min-width:620px}}
.champ{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--doux);font-weight:550}
.champ input,.champ select,.champ textarea,.saisie{min-height:46px;border-radius:12px;border:1px solid var(--trait2);background:var(--surf2);color:var(--encre);padding:10px 12px;font-size:16px;font-weight:400;width:100%}
.champ textarea{min-height:104px;resize:vertical;line-height:1.45}
.deux-champs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trois-champs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:520px){.trois-champs{grid-template-columns:1fr 1fr}}
.ligne{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--trait)}
.ligne:last-child{border-bottom:0}
.ligne-clic{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surf2);border:1px solid var(--trait);text-align:left;width:100%;min-height:58px;color:var(--encre)}
.ligne-clic:hover{border-color:var(--trait2)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.alerte{padding:13px 15px;border-radius:16px;background:color-mix(in srgb,var(--rouge) 11%,transparent);border:1px solid color-mix(in srgb,var(--rouge) 35%,transparent)}
.info{padding:13px 15px;border-radius:16px;background:color-mix(in srgb,var(--bleu) 9%,transparent);border:1px solid color-mix(in srgb,var(--bleu) 28%,transparent)}
.ok-bloc{padding:13px 15px;border-radius:16px;background:color-mix(in srgb,var(--vert) 11%,transparent);border:1px solid color-mix(in srgb,var(--vert) 32%,transparent)}
.av{width:36px;height:36px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:#fff;background:var(--tc);text-shadow:0 1px 1px rgba(0,0,0,.25)}
.av.p{width:28px;height:28px;font-size:11px}
.puce{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--tc);flex:none}
/* ── calques : panneau, menu contextuel, message ── */
.voile{position:fixed;inset:0;background:var(--voile);z-index:40;display:flex;justify-content:flex-end;animation:fondu .2s ease both}
.panneau{width:min(520px,100%);height:100%;background:var(--feuille);border-left:1px solid var(--trait2);padding:20px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;box-shadow:var(--ombre-haute);animation:entreD .3s var(--ressort) both}
.panneau.large{width:min(860px,100%)}
.panneau .x{align-self:flex-end;min-width:44px;min-height:44px;border-radius:50%;border:0;background:var(--surf-in);font-size:17px;color:var(--encre);margin-bottom:-12px}
@media (max-width:760px){.voile{align-items:flex-end}.panneau,.panneau.large{width:100%;height:auto;max-height:92vh;border-radius:26px 26px 0 0;border-left:0;border-top:1px solid var(--trait2);padding:16px 16px calc(22px + env(safe-area-inset-bottom,0px));animation-name:entreB}}
@keyframes fondu{from{opacity:0}}@keyframes entreD{from{transform:translateX(40px);opacity:0}}@keyframes entreB{from{transform:translateY(60px)}}
.ctx{position:fixed;z-index:80;min-width:250px;max-width:300px;padding:6px;border-radius:16px;background:var(--feuille);border:1px solid var(--trait2);box-shadow:var(--ombre-haute);display:flex;flex-direction:column;-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);animation:pop .16s var(--ressort) both;transform-origin:top left}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
.ctx .t{padding:8px 12px 6px;font-size:13px;color:var(--doux);font-weight:600;border-bottom:1px solid var(--trait);margin-bottom:4px}
.ctx button{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 12px;border:0;border-radius:10px;background:none;color:var(--encre);text-align:left;font-size:15px;width:100%}
.ctx button:hover,.ctx button:focus-visible{background:var(--survol);outline:none}
.ctx button .i{width:20px;text-align:center;flex:none;color:var(--doux)}
.ctx button .s{margin-left:auto;font-size:12.5px;color:var(--faible);white-space:nowrap}
.ctx button.danger{color:var(--rouge)}.ctx button.danger .i{color:var(--rouge)}
.ctx hr{border:0;border-top:1px solid var(--trait);margin:4px 6px}
@media (max-width:760px){.ctx{left:8px!important;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));top:auto!important;max-width:none;border-radius:22px;padding:8px;animation-name:entreB}.ctx button{min-height:50px;font-size:16px}}
#toast{position:fixed;left:50%;bottom:26px;translate:-50% 16px;opacity:0;pointer-events:none;z-index:90;display:flex;gap:14px;align-items:center;max-width:min(600px,calc(100vw - 32px));padding:12px 14px 12px 18px;border-radius:18px;background:var(--feuille);border:1px solid var(--trait2);box-shadow:var(--ombre-haute);font-size:15px;transition:opacity .2s,translate .3s var(--ressort)}
#toast.on{opacity:1;translate:-50% 0;pointer-events:none}#toast.on button{pointer-events:auto} /* un toast est du texte : il n'avale pas le toucher de ce qu'il couvre (une signature), seul son bouton répond */
#toast button{min-height:40px;padding:0 16px;border-radius:999px;border:0;background:var(--fill);color:var(--on-fill);font-weight:700;flex:none}
@media (max-width:760px){#toast{bottom:108px;width:calc(100vw - 32px)}}
/* ── barre du bas d'OP GESTION ── */
.opg-barre{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:6px;border-radius:34px;background:var(--tab-fond);border:1px solid var(--tab-lise);box-shadow:0 24px 56px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.32);-webkit-backdrop-filter:blur(40px) saturate(2.2) brightness(1.06);backdrop-filter:blur(40px) saturate(2.2) brightness(1.06)}
.opg-tab{min-height:48px;border:0;background:none;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--tab-ink);font-size:11px;font-weight:600}
.opg-tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.opg-tab.on{background:var(--tab-cur);color:var(--tab-cur-ink);box-shadow:0 6px 16px rgba(11,20,38,.18),inset 0 1px 0 rgba(255,255,255,.3)}
@media (prefers-reduced-motion:no-preference){.vue-entre{animation:vueEntre .28s var(--ressort) both}@keyframes vueEntre{from{opacity:0;transform:translateY(6px)}}}
</style>
<style>
/* ── PLANNING : celui de la bêta (semaine par personne avec l'échelle des heures, jour, mois), en plus lisible ── */
.pl-barre{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pl-nav{display:inline-flex;align-items:center;gap:4px;padding:3px;border-radius:13px;background:var(--surf-in);border:1px solid var(--trait)}
.pl-nav button{min-width:40px;min-height:40px;border:0;border-radius:10px;background:none;color:var(--encre);font-size:20px}
.pl-nav button:hover{background:var(--survol)}
.pl-nav b{padding:0 8px;font-size:15px;white-space:nowrap;min-width:190px;text-align:center}
.pl-equipe{display:flex;gap:6px;flex-wrap:wrap}
.pl-equipe button{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 12px 0 6px;border-radius:999px;border:1px solid var(--trait);background:var(--surf2);color:var(--encre);font-size:14px;font-weight:550}

/* ══ Calendrier en CASES (3 novembre 2026) : une case par jour et par personne, un trait entre chaque ══ */
.ac-grille{display:grid;grid-template-rows:1fr;position:relative}
.ac-grille>*{grid-row:1;min-width:0}
.ac-c{display:block;border-right:1px solid var(--grille-forte);background:var(--carte-fond)}
.ac-c.we{background:color-mix(in srgb,var(--doux) 11%,var(--carte-fond))}
.ac-c.fer{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--orange) 26%,var(--carte-fond)) 0 3px,var(--carte-fond) 3px 7px)}
.ac-c.auj{background:color-mix(in srgb,var(--lien) 12%,var(--carte-fond));box-shadow:inset 1.5px 0 var(--lien),inset -1.5px 0 var(--lien)}
.ac-l>.ac-grille{border-left:1px solid var(--grille-forte)}
.ac-tetep{grid-template-rows:26px 1fr}
.ac-tetep .ac-mo{grid-row:1;display:flex;align-items:center;padding-left:8px;font-size:12.5px;font-weight:750;color:var(--encre);border-left:1px solid var(--trait2);border-bottom:1px solid var(--grille-forte);white-space:nowrap;overflow:clip;background:var(--surf-in)}
.ac-tetep .ac-jn{grid-row:2;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11.5px;font-weight:650;color:var(--doux);line-height:1.1;position:relative;overflow:visible}
.ac-tetep .ac-jn small{font-size:9.5px;font-weight:600;color:var(--faible)}
.ac-tetep .ac-jn.we{color:var(--faible)}.ac-tetep .ac-jn.fer{color:var(--orange)}
.ac-tetep .ac-jn.auj{color:var(--lien);font-weight:800}.ac-tetep .ac-jn.auj small{color:var(--lien)}
.ac-lu{position:absolute;left:3px;font-size:11px;font-weight:700;color:var(--doux);white-space:nowrap}
.ac-x{grid-row:1;position:relative;z-index:1;margin:6px 1px;display:flex;align-items:center;gap:5px;padding:0 6px;border:0;border-radius:7px;min-width:0;overflow:hidden;white-space:nowrap;cursor:pointer;font:inherit;font-size:12.5px;font-weight:650;color:var(--encre);
  background:repeating-linear-gradient(90deg,transparent 0 calc(var(--w) - 2px),color-mix(in srgb,var(--carte-fond) 75%,transparent) calc(var(--w) - 2px) var(--w)),color-mix(in srgb,var(--c) 36%,var(--carte-fond));
  box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 80%,transparent)}
.ac-x small{font-size:11.5px;font-weight:600;color:var(--doux);margin-left:2px}
.ac-x .ac-bl{overflow:hidden;text-overflow:clip}
.ac-x.att{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 30%,var(--carte-fond)) 0 5px,color-mix(in srgb,var(--c) 10%,var(--carte-fond)) 5px 10px);box-shadow:none;outline:1.5px dashed var(--c);outline-offset:-1.5px}
.ac-x.demi{width:calc(50% - 1px);padding:0;justify-content:center;font-size:12px}.ac-x.demi.matin{justify-self:start}.ac-x.demi.aprem{justify-self:end}
.ac-x:hover,.ac-x:focus-visible{outline:2px solid var(--encre);outline-offset:0;z-index:2}
.ac-pres .ac-grille{min-height:34px}
.ac-pc{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:750;font-variant-numeric:tabular-nums;position:relative}
.ac-pc small{font-size:10px;font-weight:600;opacity:.75}
.ac-pc.v{color:var(--vert);background:color-mix(in srgb,var(--vert) 10%,var(--carte-fond))}.ac-pc.o{color:var(--orange);background:color-mix(in srgb,var(--orange) 15%,var(--carte-fond))}.ac-pc.r{color:var(--rouge);background:color-mix(in srgb,var(--rouge) 17%,var(--carte-fond))}
.ac-pc.auj{box-shadow:inset 1.5px 0 var(--lien),inset -1.5px 0 var(--lien)}
.ac-pc.att::after{content:'';position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--orange)}
.a-leg i.demi{background:linear-gradient(90deg,color-mix(in srgb,var(--doux) 45%,var(--carte-fond)) 50%,transparent 50%);box-shadow:inset 0 0 0 1px var(--trait2)}
.ac-l{min-height:46px}
.ac-mo em{font-style:normal;position:sticky;left:208px}@media (max-width:760px){.ac-mo em{left:140px}}
.ac-x.seul{padding:0;justify-content:center;font-size:10px;letter-spacing:-.02em}

/* ══ Soldes plus compacts et plus expliqués (3 novembre 2026) ══ */
.as-p{gap:10px;margin-bottom:10px;padding-block:14px}
.as-corps{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:end}
@media (max-width:1180px){.as-corps{grid-template-columns:minmax(0,1fr)}}
.as-bs{gap:8px}
.as-b{padding:9px 10px;gap:3px;border-radius:12px}
.as-b>b{font-size:18px}.as-b>b span{font-size:12.5px}
.as-dit{font-size:12.5px;line-height:1.35;color:var(--doux)}
.as-mois{gap:2px}
.as-m{padding:3px 0;gap:2px}
.as-pile{height:30px;width:16px}
.as-m b{font-size:12px}
.as-m.vide b{color:var(--faible);font-weight:600}
.as-explique{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--doux);margin:0 0 8px}.as-explique b{color:var(--encre)}
.as-ex-pile{flex:none;width:14px;height:30px;border-radius:4px;background:var(--surf-in);display:flex;flex-direction:column-reverse;overflow:hidden}.as-ex-pile i{display:block;width:100%}
@media (max-width:760px){.as-bs{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.as-bs .as-b:last-child{grid-column:1/-1}.as-dit{font-size:12px}.as-b>b span{display:inline;font-size:11.5px}.as-mois{grid-template-columns:repeat(12,minmax(0,1fr));gap:1px}.as-m small{font-size:9.5px}.as-m small em{font-size:8.5px}.as-pile{width:12px;height:28px}.as-m b{font-size:11px}}

/* ══ Calendrier plus grand et plus lisible (3 novembre 2026, Justin : « plus grand et plus lisible ») ══ */
.ac-l{min-height:78px}
.ac-tete{min-height:66px}
.ac-nom{width:250px;gap:12px;padding:10px 14px}
.ac-nom b{font-size:15px}.ac-nom small{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-coin{font-size:12.5px}
.ac-tetep{grid-template-rows:30px 1fr}
.ac-tetep .ac-mo{font-size:14.5px;font-weight:800;padding-left:10px}
.ac-tetep .ac-jn{font-size:16px;font-weight:800;color:var(--encre);gap:1px}
.ac-tetep .ac-jn small{font-size:12px;font-weight:650;color:var(--doux)}
.ac-tetep .ac-jn.we,.ac-tetep .ac-jn.we small{color:var(--faible)}
.ac-x{margin:8px 2px;font-size:13.5px;font-weight:700;padding:0 8px;border-radius:9px}
.ac-x small{font-size:12.5px}
.ac-x.seul{font-size:12px;padding:0}
.ac-x.demi{width:auto;padding:0 6px;font-size:12.5px;margin:6px 2px;align-self:start;height:calc(50% - 8px)}.ac-x.demi.aprem{align-self:end}
.ac-x.demi.matin,.ac-x.demi.aprem{justify-self:stretch}
.ac-serre .ac-tetep .ac-jn{font-size:14px}.ac-serre .ac-tetep .ac-jn small{font-size:11px}.ac-serre .ac-pc{font-size:13.5px}
.ac-x.demi{padding:0 4px}.ac-x.etroit{padding:0 4px;justify-content:center;font-size:12.5px}
.ac-pres{min-height:48px}.ac-pres .ac-grille{min-height:48px}.ac-pres .ac-nom{font-size:14px}
.ac-x.seul,.ac-x.seul.etroit{padding:0;font-size:10.5px;letter-spacing:-.03em;justify-content:center}.ac-x.seul .ac-bl{text-overflow:clip}
.ac-pc{font-size:15px;font-weight:800}.ac-pc small{font-size:11.5px}
.ac-pc.att::after{top:4px;right:4px;width:8px;height:8px;background:var(--orange);box-shadow:0 0 0 2px var(--carte-fond)}
.carte.ac + .a-leg{font-size:14px;gap:10px 18px}.carte.ac + .a-leg i{width:14px;height:14px}
.carte.ac + .a-leg i.pt{width:8px;height:8px;margin:0 9px 0 3px}
.ac-aide{font-size:14px}
.ac-2col{display:grid;grid-template-columns:1fr;gap:18px;align-items:start;margin-bottom:18px}.ac-col{min-width:0;display:flex;flex-direction:column;gap:6px}
.ac-demi-t{font-size:13.5px;font-weight:750;color:var(--doux);padding-left:2px}.ac-demi-mo{margin:6px 0 8px;font-size:16px}
.ac-demi .ac-tetep.ac-sm{grid-template-rows:1fr}.ac-demi .ac-tetep.ac-sm .ac-jn{grid-row:1}.ac-demi .ac-l>.ac-grille{border-left:0}
.ac-demi .ac-tete{min-height:70px}.ac-demi .ac-l:not(.ac-tete){min-height:96px}.ac-demi .ac-tetep .ac-jn{font-size:20px}.ac-demi .ac-tetep .ac-jn small{font-size:13px}.ac-demi .ac-x{font-size:14.5px;font-weight:700}.ac-demi-t{font-size:15px!important;color:var(--texte)!important;margin-bottom:2px}.ac-demi .ac-defile{overflow-x:visible}
@media (max-width:760px){.ac-2col{grid-template-columns:1fr;gap:10px}}
.ac-leg{font-size:14px;gap:10px 18px}.ac-leg i{width:14px;height:14px}.ac-leg i.pt{width:8px;height:8px;margin:0 9px 0 3px}
/* ══ Vue « Toute l'équipe » (Justin, 4 novembre 2026 : « tu pourrais faire mieux ? ») — n'affecte ni la vue d'une personne ni les Soldes ══ */
.ac-eq .ac-l{min-height:80px}
.ac-eq .ac-x{font-size:14px;margin:9px 2px}.ac-eq .ac-x small{font-size:12.5px}
.ac-eq .ac-x.deux{white-space:normal;line-height:1.08;font-size:13px;padding:0 3px;justify-content:center;text-align:center}.ac-eq .ac-x.deux .ac-bl{text-overflow:clip}
.ac-eq .ac-x.demi{font-size:13px}.ac-eq .ac-x.deux2{white-space:normal;line-height:1.02;font-size:11.5px;padding:0 2px;justify-content:center;text-align:center}.ac-eq .ac-x.deux2 .ac-bl{text-overflow:clip}
.ac-eq .ac-x:not(.att){background:color-mix(in srgb,var(--c) 36%,var(--carte-fond))}
.ac-eq .ac-tetep .ac-jn{font-size:16px}.ac-eq .ac-tetep .ac-jn small{font-size:11px}
.ac-eq .ac-tetep .ac-mo{font-size:15px;font-weight:800}
.ac-eq .ac-c.m1,.ac-eq .ac-tetep .ac-mo:not(:first-child){box-shadow:inset 2px 0 color-mix(in srgb,var(--encre) 45%,transparent)}
.ac-eq .ac-c.etr{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--doux) 16%,var(--carte-fond)) 0 3px,color-mix(in srgb,var(--doux) 7%,var(--carte-fond)) 3px 7px)}
.ac-eq .ac-c.fer.etr{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--orange) 30%,var(--carte-fond)) 0 3px,var(--carte-fond) 3px 7px)}
.ac-eq .ac-tetep .ac-jn.etr{background:color-mix(in srgb,var(--doux) 8%,transparent)}
.ac-eq .ac-c.auj{background:color-mix(in srgb,var(--lien) 14%,var(--carte-fond));box-shadow:inset 2.5px 0 var(--lien),inset -2.5px 0 var(--lien)}
.ac-eq .ac-tetep .ac-jn.auj .ac-n{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 4px;border-radius:13px;background:var(--lien);color:#fff;font-size:14.5px}
.ac-eq .ac-tetep .ac-jn.auj small{color:var(--lien);font-weight:800}
.ac-eq .ac-pc.v{background:color-mix(in srgb,var(--vert) 6%,var(--carte-fond))}.ac-eq .ac-ok{color:color-mix(in srgb,var(--vert) 70%,var(--doux));font-size:14px;font-weight:700;opacity:.8}
.ac-eq .ac-pc.o,.ac-eq .ac-pc.r{font-size:15.5px;font-weight:850}
.ac-eq .ac-pc.auj{box-shadow:inset 2.5px 0 var(--lien),inset -2.5px 0 var(--lien)}
.ac-eq .ac-pc.att::after{top:5px;right:50%;transform:translateX(50%);width:10px;height:10px;box-shadow:0 0 0 2.5px var(--carte-fond)}
.a-leg i.pt{width:10px!important;height:10px!important}
.ac-bulle{position:fixed;z-index:9000;pointer-events:none;max-width:280px;padding:10px 12px;border-radius:12px;background:var(--feuille);color:var(--encre);font-size:13px;line-height:1.45;box-shadow:0 10px 30px rgba(0,0,0,.28),0 0 0 1px var(--trait);white-space:pre-line;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
.ac-bulle.vu{opacity:1;transform:none}.ac-bulle b{display:block;font-size:14px;margin-bottom:2px}
@media (hover:none){.ac-bulle{display:none}}
.ac-seul{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 12px}.ac-seul-n{display:flex;align-items:center;gap:10px;font-size:16px}.ac-seul .mini-btn{margin-left:auto}
.ac-sl .t-hist{align-items:center;padding:10px 0}.ac-sl-d{display:flex;align-items:center;gap:10px;flex:none}
@media (max-width:760px){
  .ac-l{min-height:60px}.ac-nom{width:128px;padding:8px}.ac-nom small{display:none}
  .ac-tetep .ac-jn{font-size:15px}.ac-tetep .ac-jn small{font-size:11.5px}
  .ac-x{font-size:12.5px;margin:7px 2px}
  .ac-sl .t-hist{flex-direction:column;align-items:flex-start;gap:6px}
}
/* ══ CARTE DES TOURNÉES (Planning → Carte) — fond dessiné, aucune tuile externe ══ */
:root,:root[data-mode="jour"]{--cr-mer:#cfe3f2;--cr-mer2:#bcd6ea;--cr-terre:#f4f1ea;--cr-ile:#efebe2;--cr-cote:#a9c6dc;--cr-route:#ffffff;--cr-route-b:#d9d2c4;--cr-n:#f7d58a;--cr-n-b:#d9b25f;--cr-txt:#5b6273;--cr-txt-fort:#2d3444;--cr-halo:#f4f1ea;--cr-mer-txt:#6f93b0;--cr-ville:#efe9dd}
:root[data-mode="nuit"]{--cr-mer:#0f1b2e;--cr-mer2:#13223a;--cr-terre:#1c2638;--cr-ile:#1f2a3e;--cr-cote:#2b3e5c;--cr-route:#33415c;--cr-route-b:#253149;--cr-n:#6b5a2e;--cr-n-b:#53461f;--cr-txt:#9aa6bd;--cr-txt-fort:#d6dded;--cr-halo:#1c2638;--cr-mer-txt:#5f7ea3;--cr-ville:#222e44}
/* Justin, 5 novembre 2026 : « que le menu et la carte soient à la même échelle en hauteur, qu'on évite de devoir descendre » — la carte et le
   panneau côte à côte, à la MÊME hauteur (--cr-h : la fenêtre moins ce qui est au-dessus, posée par crAjusterHauteur), le panneau défile seul. */
.cr{display:grid;grid-template-columns:minmax(0,1fr) clamp(320px,36%,400px);gap:14px;align-items:stretch;--cr-h:calc(100vh - 230px)}
.cr-carte{position:relative;height:var(--cr-h);min-height:440px;border-radius:18px;overflow:hidden;border:1px solid var(--trait2);background:var(--cr-mer);box-shadow:var(--ombre-haute, 0 10px 30px rgba(0,0,0,.12));isolation:isolate}
.cr-svg{position:absolute;inset:0;z-index:1;display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
/* la VRAIE carte (Leaflet, mêmes tuiles que l'application) : sous le dessin tant qu'aucune tuile n'est arrivée, seule ensuite */
.cr-lf{position:absolute;inset:0;z-index:0;background:var(--cr-mer)}
.cr-carte[data-fond="reel"] .cr-svg,.cr-carte[data-fond="reel"] .cr-echelle{display:none}
.cr-carte:not([data-fond="reel"]) .cr-fonds{display:none}
.cr-lf.leaflet-container{font:inherit;background:var(--cr-mer)}
.cr-carte.cr-sombre .cr-tu-plan{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.86) saturate(.75)}
.cr-carte.cr-sombre .cr-lf.leaflet-container{background:#0e1726}
.cr-lf .leaflet-control-attribution{font-size:10.5px;background:color-mix(in srgb,var(--feuille) 80%,transparent);color:var(--doux)}
.cr-lf .leaflet-control-attribution a{color:var(--doux)}
.cr-lf .leaflet-control-scale-line{border-color:var(--cr-txt-fort);color:var(--cr-txt-fort);background:color-mix(in srgb,var(--feuille) 70%,transparent);font-weight:700}
.cr-mk{width:30px;height:30px;border-radius:50%;background:var(--c);border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35);display:grid;place-items:center;color:#fff;font-size:12.5px;font-weight:800;position:relative;cursor:pointer;transition:transform .15s}
.cr-mk i{font-style:normal;position:relative;z-index:1}
.cr-mk.conf{border-radius:8px;transform:rotate(45deg)}.cr-mk.conf i{transform:rotate(-45deg)}
.cr-mk.on{transform:scale(1.22);box-shadow:0 0 0 7px color-mix(in srgb,var(--c) 30%,transparent),0 4px 14px rgba(0,0,0,.4)}
.cr-mk.conf.on{transform:rotate(45deg) scale(1.22)}
.cr-mk.estompe:not(.on){opacity:.3}
.cr-mk.dep{border-radius:9px;background:var(--fill);color:var(--on-fill);font-size:14px}
.cr-mk .cr-mk-r{position:absolute;right:-5px;top:-5px;width:11px;height:11px;border-radius:50%;background:var(--rouge);border:2px solid #fff}
.cr-mk.urg::before{content:'';position:absolute;inset:-6px;border-radius:inherit;background:var(--rouge);opacity:.35;animation:crPouls 1.6s ease-out infinite;z-index:-1}
@media (prefers-reduced-motion:reduce){.cr-mk.urg::before{animation:none}}
.cr-lbl-tr{display:inline-block;white-space:nowrap;padding:3px 8px;border-radius:11px;background:var(--feuille);border:1px solid var(--trait2);color:var(--encre);font-size:11.5px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.cr-lbl-tr.r{background:var(--rouge);color:#fff;border-color:transparent}
.cr-fonds{position:absolute;right:12px;bottom:26px;z-index:3;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.cr-sg{display:inline-flex;padding:3px;border-radius:12px;border:1px solid var(--trait2);background:color-mix(in srgb,var(--feuille) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 2px 8px rgba(0,0,0,.14)}
.cr-sg button{min-height:34px;padding:0 11px;border:0;border-radius:9px;background:none;color:var(--encre);font:inherit;font-size:12.5px;font-weight:650;cursor:pointer}
.cr-sg button[aria-pressed="true"]{background:var(--encre);color:var(--feuille)}
.cr-sg button[disabled]{opacity:.4;cursor:default}
.cr-note{position:absolute;left:12px;right:64px;bottom:12px;z-index:3;font-size:12.5px;font-weight:650;color:var(--encre);background:color-mix(in srgb,var(--feuille) 92%,transparent);border:1px solid var(--trait2);border-radius:10px;padding:6px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cr-note button{border:0;background:none;color:var(--lien);font:inherit;font-weight:700;cursor:pointer;padding:0}
.cr-carte:has(.cr-note) .cr-echelle{bottom:52px}
/* plein écran : la carte seule, par-dessus tout (Échap ou ✕ pour sortir) */
.cr.cr-plein .cr-carte,.cr.cr-plein.cr-empile .cr-carte{position:fixed;inset:0;z-index:500;height:auto;min-height:0;border-radius:0;border:0}
/* l'entrée de la vue garde un transform (fill both) : il ferait de #contenu le cadre du « fixed » — la carte plein écran se calerait sur lui, pas sur l'écran */
#contenu:has(.cr-plein){animation:none!important;transform:none!important}
/* le détail d'une intervention, EN HAUT du panneau (ordinateur, tablette en largeur) — plus sous la carte */
.cr-l{height:var(--cr-h);min-height:440px;overflow-y:auto;overscroll-behavior:contain;padding:0 4px 8px 0;scrollbar-gutter:stable}
.cr-det{display:flex;flex-direction:column;gap:10px}
.cr-det:empty{display:none}
.cr-l.cr-l-det .cr-lc{display:none}
.cr-ret{align-self:flex-start;border:0;background:none;color:var(--lien);font:inherit;font-weight:700;font-size:14px;cursor:pointer;min-height:40px;padding:0 4px}
.cr-det .cr-fiche{position:static;width:auto;box-shadow:none;animation:none}.cr-det .cr-fiche .x{display:none}
.cr-aller{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.cr-aller-l{display:flex;gap:8px;flex-wrap:wrap}
.cr-aller-l a{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:12px;font-weight:700;font-size:13.5px;text-decoration:none;color:#fff}
.cr-aller-l a.waze{background:#33ccff;color:#06283d}.cr-aller-l a.gmaps{background:#1a73e8}.cr-aller-l a.apple{background:#1c1c1e}
:root[data-mode="nuit"] .cr-aller-l a.apple{background:#f2f2f7;color:#1c1c1e}
.cr-svg.prise{cursor:grabbing}
.cr-svg text{font-family:inherit;pointer-events:none}
.cr-lbl{fill:var(--cr-txt);font-size:12px;font-weight:600;paint-order:stroke;stroke:var(--cr-halo);stroke-width:3.5px;stroke-linejoin:round}

/* ══ PRENDRE RENDEZ-VOUS — SEULEMENT QUAND IL RESTE QUELQUE CHOSE À FAIRE ══
   Justin, 31 octobre : « suite à une intervention, ça lui sert à rien de reprendre rendez-vous ; ça dépend de ce qui reste
   à faire, si c'est pour un devis ». Donc pas de bouton générique : « La suite » dit ce qui reste, et SEULE une suite qui se
   planifie maintenant propose une date — le remplacement, une fois son devis accepté. L'entretien d'un an se proposera un
   mois avant (rien à choisir aujourd'hui). Les moments proposés suivent le PLANNING (un technicien du secteur vraiment libre)
   ET les réglages de l'entreprise (RDV_REGLES). Le client propose, le bureau VALIDE : c'est la validation qui pose
   l'intervention chez le technicien et envoie le SMS. */
const DEMI = { matin:['le matin','8 h – 12 h',480,720], aprem:['l’après-midi','13 h 30 – 18 h',810,1080] };

const RDV_REGLES = { actif:true, apresDevis:'date', delai:2, horizon:14, parDemi:2,
  jours:{ 1:{matin:true,aprem:true}, 2:{matin:true,aprem:true}, 3:{matin:true,aprem:true}, 4:{matin:true,aprem:true}, 5:{matin:true,aprem:true}, 6:{matin:false,aprem:false} },
  types:{ reparation:{ lib:'Réparation après un devis accepté', matin:false, aprem:true, delai:7, note:'pièce à commander' }, entretien:{ lib:'Entretien annuel', matin:true, aprem:true, delai:0, note:'' } } };
const DEVIS_SUITE = { num:'D-2026-041', objet:'Remplacement du ventilateur extérieur', ttc:412.80 };
let RDV = null;
/* Justin, 1er novembre : les dates proposées au client sont les VRAIS TROUS du planning, à la durée de l'intervention — un
   lundi après-midi où il ne reste qu'une heure n'est pas proposé pour un travail de deux heures. « Au mieux » : un créneau collé
   à une intervention déjà prévue passe en premier (pas de petits trous perdus dans la journée). Le client choisit une heure
   précise ; elle est posée TOUT DE SUITE au planning, chez le technicien libre, « accepté par le client ». */
let SUITE_ETAT = {}; // par intervention : 'aaccepter' | 'accepte' (attend le lien du bureau) | 'lien' (lien envoyé) | 'pris'
const etatSuite = id => SUITE_ETAT[id] || 'aaccepter';
function rdvCreneaux(cli, dur, type){
  const R = RDV_REGLES, T0 = R.types[type], sect = SECT_CLI[cli], T = TECHS.filter(t => t.id && (!sect || (SECT_TECH[t.id] || []).includes(sect)));
  const depart = ajoute(AUJ, Math.max(R.delai, T0.delai)), fin = ajoute(depart, R.horizon), L = [];
  const permis = m => (T0.matin && R.jours[1] && m >= DEMI.matin[2] && m < DEMI.matin[3]) || (T0.aprem && m >= DEMI.aprem[2] - 15 && m < DEMI.aprem[3]);
  for (let d = depart; d <= fin; d = ajoute(d, 1)) { const js = R.jours[dObj(d).getDay()]; if (!js) continue;
    const opts = [];

      const fen = [DEMI.matin[2], DEMI.aprem[2], DEMI.aprem[2] + 60, DEMI.matin[2] + 60].filter(m => m >= x && m + dur <= y);

    }));

    else if (e === 'aaccepter') ven = `<div class="suite-l">${tete}<span class="suite-b"><button type="button" class="btnc clair" data-action="info" data-txt="Le devis s’ouvre en PDF : le détail des pièces et de la main-d’œuvre.">Voir le devis</button>${R.apresDevis === 'date' ? '<button type="button" class="btnc" data-rdv="1">Accepter et choisir une date</button>' : '<button type="button" class="btnc" data-devisok="' + i.id + '">Accepter le devis</button>'}</span></div>`;
    else if (e === 'accepte') ven = `<div class="suite-l">${tete}<div class="rdv-ok"><b>✓ Devis accepté</b><span class="gris petit">Merci ! ${esc(ENTREPRISE.nom)} vous envoie un lien pour choisir votre date.</span></div></div>`;
    else if (e === 'lien') ven = `<div class="suite-l">${tete}<div class="info petit">${esc(ENTREPRISE.nom)} vous propose de choisir la date de l’intervention.</div><span class="suite-b"><button type="button" class="btnc" data-rdv="1">Choisir ma date</button></span></div>`;
    else { const n = INTS.find(o => o.demande && o.demande.depuis === i.id && o.st !== 'annulee'); ven = `<div class="lgn"><span><b>Remplacer le ventilateur</b><br><span class="gris petit">${n ? 'Rendez-vous le ' + jlong(n.d) + ' à ' + n.h : 'Rendez-vous pris'}</span></span><span class="st st-v">confirmé</span></div>`; }
  }
  const ent = F.suite.entretien ? `<div class="lgn"><span><b>Prochain entretien</b><br><span class="gris petit">Nous vous écrirons un mois avant pour choisir la date.</span></span><span class="gris">${dObj(ajoute(i.d, 364)).toLocaleDateString('fr-FR', { month:'long', year:'numeric' })}</span></div>` : '';

function blocRdv(i, F){

    <div class="rdv-proto"><b>Dans le prototype, côté bureau :</b> ${RDV.rappel ? 'la demande est dans « À faire maintenant », à rappeler.' : `le rendez-vous est déjà <b>posé au planning</b> le ${jlong(RDV.d)} à ${hm(RDV.h)}, chez ${esc(tech(RDV.tid).nom)}, marqué « accepté par le client ». Le bureau peut le glisser sur quelqu’un d’autre.`}
      <span style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button type="button" class="btn" data-rdvvoir="1">Voir au planning</button><button type="button" class="btn gris" data-rdvraz="1">Recommencer</button></span></div>`;
  const pas = `<div class="rdv-pas">${['Quand','Confirmer'].map((t,k)=>`<span class="${RDV.etape > k+2 ? 'fait' : ''} ${RDV.etape === k+2 ? 'ici' : ''}">${k+1}. ${t}</span>`).join('')}</div>`;

      <div class="rdv-jours">${L.map(j => `<div class="rdv-j"><b>${jlong(j.d)}</b><span>${j.opts.map(o => `<button type="button" data-rdvc="${j.d}|${o.h}|${o.tid}" aria-pressed="${RDV.d === j.d && RDV.h === o.h}"><b>${hm(o.h)}</b><small>→ ${hm(o.h + dur)}</small></button>`).join('')}</span></div>`).join('') || '<span class="gris">Aucun moment libre sur les deux semaines à venir.</span>'}</div>
      <button type="button" class="btnc clair" data-rdvc="rappel">Aucun ne me va — qu’on m’appelle</button><button type="button" class="lien" data-rdvraz="1">Annuler</button>`; }
  return pas + `<div class="rdv-recap"><div class="lgn"><span>Pour</span><b>Remplacer le ventilateur</b></div><div class="lgn"><span>Quand</span><b>${rdvTexte(RDV)}</b></div><div class="lgn"><span>Où</span><b>${esc(c.adr)}</b></div></div>
    <label class="champ">Un mot pour le technicien (facultatif)<textarea class="saisie" rows="2" data-rdvnote="1" placeholder="Ex. : code du portail, chien dans le jardin…">${esc(RDV.note || '')}</textarea></label>

function rdvEnvoyer(){

  else if (RDV.h == null && RDV.demi) { const d = RDV.d; Object.assign(n, { d, h:hm(DEMI[RDV.demi][2]), dur:120, tech:'', st:'aplanifier', titre:'Remplacer le ventilateur', demande:{ d0:d, demi:RDV.demi, rappel:false, note:RDV.note || '', depuis:RDV.int, devis:DEVIS_SUITE, le:AUJ } }); }

/* Justin, 1er novembre : « peu importe où je la mets sur le planning, il faut proposer l'heure au client ». Le client donne une
   GROSSE fenêtre (une demi-journée) ; le bureau cale une heure précise, souvent entre deux clients. Dans sa fenêtre → confirmé tout
   de suite ; hors de sa fenêtre (plus tard, un autre jour) → PROPOSÉ, le client accepte ou refuse. Le panneau part toujours de
   l'endroit où la carte est posée : on ne re-choisit rien. */
function dansCreneau(n, d, h){ const D = n.demande; if (!D || D.rappel || !D.demi) return false; const [,,a,z] = DEMI[D.demi]; return d === (D.d0 || n.d) && h >= a && h + n.dur <= z; }
function rdvTechsLibres(n){ const sect = SECT_CLI[n.cli]; return TECHS.filter(t => t.id && (!sect || (SECT_TECH[t.id] || []).includes(sect))); }
function rdvHeures(n, tid, d){ const occ = plagesLibres(tid, d), H = []; for (let m = PARAMS.debut; m + n.dur <= PARAMS.fin; m += 15) if (occ.some(([x,y]) => m >= x && m + n.dur <= y) || (n.tech === tid && n.d === d && hm(m) === n.h)) H.push(m); return H; }
function panneauDemande(id){
  const n = INTS.find(o => o.id === id); if (!n || !n.demande) return; const c = CLIENTS[n.cli], D = n.demande, T = rdvTechsLibres(n), d0 = D.d0 || n.d;
  if (!D.choix) { if (n.tech) D.choix = { tid:n.tech, d:n.d, h:hmin(n.h) };
    else { let best = null; const hc = hmin(n.h); for (const t of T) if (rdvHeures(n, t.id, n.d).includes(hc)) { best = { tid:t.id, d:n.d, h:hc }; break; } if (!best) for (const t of T) { const H = rdvHeures(n, t.id, d0).filter(m => dansCreneau(n, d0, m)); if (H.length) { best = { tid:t.id, d:d0, h:H[0] }; break; } } D.choix = best || { tid:T[0].id, d:n.d, h:hmin(n.h) }; } }
  const ch = D.choix, H = rdvHeures(n, ch.tid, ch.d), dedans = dansCreneau(n, ch.d, ch.h), prop = D.etat === 'propose';
  const fen = D.rappel ? 'aucun créneau ne lui allait : à rappeler' : jlong(d0) + ', ' + DEMI[D.demi][0] + ' (' + DEMI[D.demi][1] + ')';
  ouvrirPanneau(`<span class="st ${prop ? 'st-o' : 'st-b'}" style="align-self:flex-start">${prop ? 'Horaire proposé au client · réponse attendue' : 'Demande de rendez-vous · à valider'}</span><h2>${esc(n.titre)}</h2><span class="gris">${esc(c.nom)} · ${esc(c.contact)} · ${esc(c.tel)}<br>${esc(c.adr)} · secteur ${SECT_CLI[n.cli] || '—'}</span>

      ${D.depuis ? `<div class="ligne"><span>Suite de</span><button type="button" class="lien" data-plein="inter-x-${D.depuis}">l’intervention du ${jcourt(INTS.find(o=>o.id===D.depuis).d)} ›</button></div>` : ''}

      <div class="ligne"><span>Durée prévue</span><b>${duree(n.dur)}</b></div></div>
    ${prop ? `<div class="carte"><h3>L’horaire proposé</h3><div class="ligne"><span>Proposé le ${jcourt(D.proposeLe || AUJ)} par SMS</span><b>${jlong(n.d)} · ${n.h} – ${fin(n.h, n.dur)} · ${esc(tech(n.tech).nom)}</b></div>
        <div class="gris petit">Le client répond depuis son lien (Accepter / Choisir un autre moment). Pour l’essai, fais sa réponse :</div>
        <div class="actions" style="justify-content:flex-start;margin-top:8px"><button type="button" class="btn" data-demrep="${id}|oui">Le client accepte</button><button type="button" class="btn gris" data-demrep="${id}|non">Le client refuse</button></div></div>`

        <label class="champ" style="flex:1 1 180px">Heure d’arrivée<select data-demh="${id}">${H.map(m => `<option value="${m}" ${ch.h === m ? 'selected' : ''}>${hm(m)} – ${hm(m + n.dur)}${dansCreneau(n, ch.d, m) ? '  ✓ dans sa fenêtre' : '  · à lui proposer'}</option>`).join('') || '<option>Plus rien de libre</option>'}</select></label></div>
      <div class="${dedans ? 'ok-bloc' : 'info'} petit" style="margin-top:10px">${dedans ? '✓ C’est dans le créneau qu’il a choisi : le rendez-vous est <b>confirmé</b> tout de suite, il reçoit l’heure exacte par SMS.' : 'Hors du créneau qu’il a choisi : l’horaire lui est <b>proposé</b> par SMS, il accepte ou en choisit un autre. La carte reste « en attente » au planning.'}</div></div>

function demandeValider(id){

}
/* posée chez un technicien (panneau ou glisser) : confirmée si c'est dans sa fenêtre, sinon proposée */
function demandePlacee(n, depuisPanneau){

  if (!n.tech) { D.etat = null; n.st = 'aplanifier'; rendre(); return; }
  if (dansCreneau(n, n.d, hmin(n.h))) { n.st = 'planifiee'; D.confirme = true; D.etat = 'ok'; rendre(); flash(n.id);
    toast(`Rendez-vous confirmé : ${esc(tech(n.tech).nom)} · ${jlong(n.d)} · ${n.h} – ${fin(n.h, n.dur)}<br>📱 SMS à ${esc(CLIENTS[n.cli].nom)} : « Votre rendez-vous est confirmé le ${jlong(n.d)} à ${n.h} avec ${esc(tech(n.tech).nom)}. »`, ANNULER); }
  else { n.st = 'aplanifier'; D.etat = 'propose'; D.proposeLe = AUJ; rendre(); flash(n.id);
    toast(`Horaire proposé : ${jlong(n.d)} · ${n.h} avec ${esc(tech(n.tech).nom)} (hors de sa fenêtre)<br>📱 SMS à ${esc(CLIENTS[n.cli].nom)} : « Nous pouvons venir le ${jlong(n.d)} à ${n.h}. Ça vous convient ? Accepter ou choisir un autre moment : lien »`, ANNULER); }
}
function demandeReponse(id, oui){
  const n = INTS.find(o => o.id === id), D = n.demande; fermerPanneau(); memo();
  if (oui) { n.st = 'planifiee'; D.confirme = true; D.etat = 'ok'; rendre(); flash(n.id); toast(`${esc(CLIENTS[n.cli].nom)} a accepté : rendez-vous confirmé le ${jlong(n.d)} à ${n.h} avec ${esc(tech(n.tech).nom)}.`); }
  else { n.tech = ''; n.d = D.d0 || n.d; n.h = D.demi ? hm(DEMI[D.demi][2]) : '09:00'; D.etat = null; n.st = 'aplanifier'; rendre(); toast(`${esc(CLIENTS[n.cli].nom)} a refusé l’horaire : la demande revient « à valider », dans sa fenêtre d’origine.`); }
}

/* ══ LES RÉGLAGES DES RENDEZ-VOUS EN LIGNE (l'entreprise décide quand ses clients peuvent demander) ══ */
function panneauReglagesRdv(){

    const deb0 = d === AUJ ? Math.max(T_JOUR_DEB, Math.ceil((MAINT_MIN + 30) / 30) * 30) : T_JOUR_DEB;

function dtPeindre(inp){ const b = inp.nextElementSibling; if (!b || !b.classList.contains('dt-btn')) return; const v = inp.value;
  b.innerHTML = inp.dataset.dt === 'date' ? `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>${dtLib(v)}</span>` : `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>${v || 'Choisir l’heure'}</span>`;
  b.setAttribute('aria-label', (inp.closest('label')?.firstChild?.textContent || '').trim() + ' : ' + (v ? (inp.dataset.dt === 'date' ? dtLib(v) : v) : 'à choisir')); }
function dtPoser(inp, v, fermer){ inp.value = v; dtPeindre(inp); inp.dispatchEvent(new Event('input', { bubbles:true })); inp.dispatchEvent(new Event('change', { bubbles:true })); if (fermer) dtFermer(); else dtRendre(); }
function dtFermer(){ const p = document.getElementById('dtpop'); if (p) p.remove(); dtOuvert = null; }
function dtOuvrir(inp){ dtOuvert = { inp, mois: (inp.value || AUJ).slice(0,7) }; dtRendre(); }
function dtRendre(){
  if (!dtOuvert) return; const { inp } = dtOuvert, v = inp.value; let p = document.getElementById('dtpop');
  if (!p) { p = document.createElement('div'); p.id = 'dtpop'; p.setAttribute('role', 'dialog'); document.body.appendChild(p); }
  if (inp.dataset.dt === 'date') {
    const [a, m] = dtOuvert.mois.split('-').map(Number), d1 = new Date(a, m-1, 1), dec = (d1.getDay() + 6) % 7, nb = new Date(a, m, 0).getDate(), cases = [];
    for (let k = 0; k < dec; k++) cases.push('<span></span>');
    for (let j = 1; j <= nb; j++) { const iso = dtIso(new Date(a, m-1, j)); cases.push(`<button type="button" data-dtj="${iso}" class="${iso === v ? 'sel' : ''} ${iso === AUJ ? 'auj' : ''} ${[5,6].includes((new Date(a,m-1,j).getDay()+6)%7) ? 'we' : ''}" aria-label="${dObj(iso).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}" aria-pressed="${iso===v}">${j}</button>`); }
    p.innerHTML = `<div class="dt-rac">${[[-1,'Hier'],[0,'Aujourd’hui'],[1,'Demain']].map(([n,l]) => `<button type="button" data-dtj="${ajoute(AUJ,n)}" aria-pressed="${ajoute(AUJ,n)===v}">${l}</button>`).join('')}</div>
      <div class="dt-tete"><button type="button" data-dtm="-1" aria-label="Mois précédent">‹</button><b>${DT_MOIS[m-1]} ${a}</b><button type="button" data-dtm="1" aria-label="Mois suivant">›</button></div>
      <div class="dt-grille"><small>lu</small><small>ma</small><small>me</small><small>je</small><small>ve</small><small>sa</small><small>di</small>${cases.join('')}</div>`;
  } else {
    const [h, mn] = (v || '').split(':').map(Number), H = Array.from({length:16}, (_, k) => k + 6), M = [0,5,10,15,20,25,30,35,40,45,50,55];
    p.innerHTML = `<div class="dt-rac"><button type="button" data-dtmaint="1">Maintenant</button><b class="dt-val">${v || '--:--'}</b></div>
      <div class="dt-sous">Heure</div><div class="dt-h">${H.map(x => `<button type="button" data-dth="${x}" aria-pressed="${x===h}">${String(x).padStart(2,'0')} h</button>`).join('')}</div>
      <div class="dt-sous">Minutes</div><div class="dt-h dt-mn">${M.map(x => `<button type="button" data-dtmn="${x}" aria-pressed="${x===mn}">${String(x).padStart(2,'0')}</button>`).join('')}</div>
      <button type="button" class="btn dt-ok" data-dtok="1">OK</button>`;
  }
  const b = inp.nextElementSibling.getBoundingClientRect(), tel = innerWidth <= 760; p.className = tel ? 'dt-feuille' : 'dt-bulle';
  if (!tel) { const L = Math.min(Math.max(8, b.left), innerWidth - p.offsetWidth - 8), haut = b.bottom + 8 + p.offsetHeight > innerHeight - 8; p.style.left = L + 'px'; p.style.top = (haut ? Math.max(8, b.top - p.offsetHeight - 8) : b.bottom + 8) + 'px'; }
  else { p.style.left = ''; p.style.top = ''; }
}
document.addEventListener('click', ev => {
  const t = ev.target, b = t.closest('.dt-btn');
  if (b) { ev.preventDefault(); ev.stopPropagation(); const inp = b.previousElementSibling; if (dtOuvert && dtOuvert.inp === inp) dtFermer(); else dtOuvrir(inp); return; }
  const p = t.closest('#dtpop'); if (!p) { if (dtOuvert) { dtFermer(); ev.stopPropagation(); ev.preventDefault(); } return; }
  ev.stopPropagation(); const inp = dtOuvert.inp; let x;
  if ((x = t.closest('[data-dtj]'))) dtPoser(inp, x.dataset.dtj, true);
  else if ((x = t.closest('[data-dtm]'))) { const [a, m] = dtOuvert.mois.split('-').map(Number), n = new Date(a, m - 1 + +x.dataset.dtm, 1); dtOuvert.mois = dtIso(n).slice(0,7); dtRendre(); }
  else if (t.closest('[data-dtmaint]')) { const n = new Date(); dtPoser(inp, String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0'), true); }
  else if ((x = t.closest('[data-dth]'))) { const mn = (inp.value || '00:00').split(':')[1] || '00'; dtPoser(inp, String(x.dataset.dth).padStart(2,'0') + ':' + mn, false); }
  else if ((x = t.closest('[data-dtmn]'))) { const h = (inp.value || '08:00').split(':')[0]; dtPoser(inp, h + ':' + String(x.dataset.dtmn).padStart(2,'0'), true); }
  else if (t.closest('[data-dtok]')) dtFermer();
}, true);
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && dtOuvert) { ev.stopPropagation(); dtFermer(); } }, true);
addEventListener('resize', () => dtOuvert && dtRendre());
document.addEventListener('scroll', ev => { if (dtOuvert && !ev.target.closest?.('#dtpop') && innerWidth > 760) dtRendre(); }, true);
new MutationObserver(() => { dtAmeliorer(); if (dtOuvert && !document.contains(dtOuvert.inp)) dtFermer(); }).observe(document.body, { childList:true, subtree:true });
dtAmeliorer();
</script>

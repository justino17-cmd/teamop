<!-- Aperçu de travail (16 novembre 2026) : le PROTOTYPE d'OP MESSAGES, CÔTÉ PRO, refait de A à Z à la demande de Justin (« refais tout, style
     Apple », « concentre-toi sur le côté pro »). Les rubriques sont celles de la vraie application : Tableau de bord, Messages, Contacts, Appels,
     Réunions, Agenda, Courrier, et le Profil. DONNÉES ENTIÈREMENT FICTIVES (« Clim Services 17 », adresses en .example), aucun appel à un serveur,
     rien ne s'enregistre. Ce n'est PAS OP MESSAGES : la vraie page est servie par server-msg/.
     ⛔ CETTE PAGE EST FABRIQUÉE : ses parties sont dans design/opmessages/prototype/ (assembler.sh). On modifie les parties, jamais ce fichier.
     ⛔ LE COURRIER N'EST PAS UNE MAQUETTE (Justin : « la boîte mail, je veux celle qui était ») : la rubrique monte le VRAI module opcourrier.js,
     chargé à côté de cette page, avec sa source de démonstration. -->
<style>
/* ══ PROTOTYPE D'OP MESSAGES, CÔTÉ PRO (16 novembre 2026) — refait de A à Z à la demande de Justin : « refais tout, style Apple »,
   « concentre-toi sur le côté pro ». Les rubriques sont celles de la vraie application (Tableau de bord, Messages, Contacts, Appels,
   Réunions, Agenda, Courrier, le Profil en bas) ; les couleurs sont celles de design/opmessages/THEME-OPMESSAGES.md.
   Les tailles sont celles d'Apple : 13 px au bureau (macOS), 17 px au téléphone (iOS), rien sous 11 px. ══ */
:root{
  --fond:#f2f2f7; --texte:#000; --second:rgba(60,60,67,.6); --faible:rgba(60,60,67,.3); --accent:#2a4a9c; --fill:#2a4a9c; --sur-fill:#fff;
  --doux:rgba(42,74,156,.12); --carte:#fff; --champ:rgba(118,118,128,.12); --recue:#e9e9eb; --barre:rgba(255,255,255,.78); --onglets:rgba(255,255,255,.72);
  --lentille:rgba(118,118,128,.16); --trait:rgba(60,60,67,.29); --cote:rgba(255,255,255,.5); --feuille:rgba(242,242,247,.96); --notif:rgba(255,255,255,.86);
  --bascule:rgba(120,120,128,.16); --seg:rgba(118,118,128,.12); --seg-on:#fff; --survol:rgba(118,118,128,.1);
  --rouge:#ff453a; --rouge-txt:#d70015; --vert:#30d158; --vert-txt:#1c7a3a; --orange:#ff9f0a; --orange-txt:#a05a00;
  --ombre:0 8px 28px rgba(0,0,0,.1),0 1px 3px rgba(0,0,0,.06); --reflet:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(255,255,255,.35),inset 0 0 0 .5px rgba(255,255,255,.55);
  --r:14px; --ressort:cubic-bezier(.2,.9,.25,1);
}
:root[data-theme="dark"]{
  --fond:#0b1633; --texte:#fff; --second:rgba(220,228,250,.62); --faible:rgba(220,228,250,.32); --accent:#8fb0f5; --fill:#3b63c4; --sur-fill:#fff;
  --doux:rgba(126,162,240,.2); --carte:#16244b; --champ:rgba(120,140,200,.18); --recue:#203262; --barre:rgba(14,26,58,.78); --onglets:rgba(22,36,76,.7);
  --lentille:rgba(255,255,255,.14); --trait:rgba(120,140,200,.3); --cote:rgba(14,26,58,.6); --feuille:rgba(18,31,66,.97); --notif:rgba(28,44,90,.9);
  --bascule:rgba(120,140,200,.3); --seg:rgba(120,140,200,.22); --seg-on:#3d4f80; --survol:rgba(160,180,240,.12);
  --rouge-txt:#ff6961; --vert-txt:#4cd964; --orange-txt:#ffb340;
  --ombre:0 8px 28px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.3); --reflet:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -1px 0 rgba(255,255,255,.06),inset 0 0 0 .5px rgba(255,255,255,.1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:13px/18px -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--texte);background:var(--fond);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:15px;line-height:20px;font-weight:600} h2{font-size:20px;line-height:25px;font-weight:700} h3{font-size:11px;line-height:14px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--second)}
.gris{color:var(--second)} .petit{font-size:12px;line-height:16px} .tab{font-variant-numeric:tabular-nums} .coupe{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ── la charpente : le menu, la scène ── */
#app{position:fixed;inset:0;height:var(--haut,100%);display:grid;grid-template-columns:236px minmax(0,1fr)}
.cote{display:flex;flex-direction:column;gap:2px;padding:14px 12px 12px;background:var(--cote);border-right:.5px solid var(--trait);min-height:0;-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%)}
.marque{display:flex;align-items:center;gap:9px;padding:4px 8px 14px;font-weight:700;font-size:15px;letter-spacing:.01em}
.marque{white-space:nowrap} .marque i{width:28px;height:28px;border-radius:7px;background:linear-gradient(150deg,#4f78d6,#1b2d63);display:grid;place-items:center;color:#fff;font-size:8px;line-height:9px;font-weight:800;font-style:normal;text-align:center;flex:none;letter-spacing:.02em}
.marque em{font-size:9.5px;line-height:14px;font-weight:700;font-style:normal;letter-spacing:.06em;background:var(--fill);color:#fff;padding:0 5px;border-radius:4px}
.nav{display:flex;flex-direction:column;gap:2px} .nav a{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:8px;font-size:14px}
.nav a svg{color:var(--accent)} .nav a b{font-weight:400;flex:1} .nav a .n{font-size:12px;color:var(--second)} .nav a[aria-current]{background:var(--lentille)} .nav a[aria-current] b{font-weight:600}
.moi{margin-top:auto;display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;width:100%} .moi[aria-current]{background:var(--lentille)}
.moi>span:not(.av){flex:1;min-width:0} .moi b{display:block;font-size:14px;font-weight:600} .moi svg{width:14px;height:14px;color:var(--second)}
.statut{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--second)} .statut i{width:7px;height:7px;border-radius:50%;background:var(--vert)} .statut.occ i{background:var(--orange)} .statut.abs i{background:var(--faible)} .statut.npd i{background:var(--rouge)}
#scene{min-width:0;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);position:relative;grid-column:2;grid-row:1}
#scene.deux{grid-template-columns:clamp(300px,31vw,400px) minmax(0,1fr)}
.col{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--fond)} .col.liste{border-right:.5px solid var(--trait)}
.barre{flex:none;min-height:52px;display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--barre);border-bottom:.5px solid var(--trait);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);position:relative;z-index:2}
.barre h1{flex:1;min-width:0} .barre .pousse{flex:1}
.defile{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.page{padding:20px 24px 32px;display:flex;flex-direction:column;gap:18px;max-width:1180px;width:100%;margin:0 auto}
.grand{display:none}
.rond{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--accent);flex:none;position:relative} .rond.plein{background:var(--fill);color:#fff} .rond.gris{background:var(--champ)}
.lien{color:var(--accent);font-size:14px;padding:4px 2px}
.retour{display:none}

/* ── les pièces ── */
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:600;font-size:15px;background:linear-gradient(160deg,var(--a1,#4f78d6),var(--a2,#2a4a9c));position:relative;letter-spacing:.01em}
.av.p{width:28px;height:28px;font-size:11px} .av.m{width:32px;height:32px;font-size:12px} .av.g{width:60px;height:60px;font-size:22px} .av.xl{width:96px;height:96px;font-size:36px}
.av u{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:var(--vert);border:2px solid var(--carte);text-decoration:none} .av u.occ{background:var(--orange)} .av u.abs{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;padding:0 14px;border-radius:999px;background:var(--fill);color:var(--sur-fill);font-weight:600;font-size:13px;white-space:nowrap;flex:none}
.btn.gris{background:var(--champ);color:var(--accent)} .btn.rouge{background:var(--rouge);color:#fff} .btn.vert{background:var(--vert);color:#04310f} .btn.large{width:100%;min-height:40px;font-size:15px}
.btn svg{width:16px;height:16px} .btn:disabled{opacity:.4;cursor:default}
.carte{background:var(--carte);border-radius:var(--r);overflow:hidden}
.carte.pad{padding:14px 16px}
.groupe{background:var(--carte);border-radius:var(--r);overflow:hidden}
.rang{display:flex;align-items:center;gap:12px;min-height:44px;padding:8px 14px;width:100%;position:relative}
.rang+.rang::before{content:"";position:absolute;left:14px;right:0;top:0;border-top:.5px solid var(--trait)} .rang.av-g+.rang.av-g::before,.rang.ic-g+.rang.ic-g::before{left:66px}
.rang .t{flex:1;min-width:0} .rang .t b{display:block;font-weight:500;font-size:14px;line-height:19px} .rang .t span{display:block;color:var(--second);font-size:12.5px;line-height:17px}
.rang .v{color:var(--second);font-size:13px;white-space:nowrap} .rang>svg.ch{width:13px;height:13px;color:var(--faible)}
.rang .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--c,var(--fill));color:#fff;flex:none} .rang .ic svg{width:17px;height:17px}
.seg{display:inline-flex;padding:2px;border-radius:9px;background:var(--seg);gap:0;max-width:100%} .seg button{min-height:28px;padding:0 16px;border-radius:7px;font-size:13px;font-weight:500;white-space:nowrap;flex:1}
.seg button[aria-pressed="true"]{background:var(--seg-on);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);font-weight:600}
.bascule{width:40px;height:24px;border-radius:12px;background:var(--bascule);position:relative;flex:none;transition:background .2s} .bascule::after{content:"";position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .22s var(--ressort)}
.bascule[aria-checked="true"]{background:var(--vert)} .bascule[aria-checked="true"]::after{transform:translateX(16px)}
.cherche{display:flex;align-items:center;gap:6px;height:32px;padding:0 9px;border-radius:9px;background:var(--champ);color:var(--second);margin:12px 16px 4px;flex:none} .cherche svg{width:15px;height:15px} .cherche input{flex:1;min-width:0;border:0;background:none;outline:0;color:var(--texte);font-size:14px}
.pastille{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:6px;font-size:11.5px;font-weight:600;line-height:16px;background:var(--champ);color:var(--second);white-space:nowrap}
.pastille.b{background:var(--doux);color:var(--accent)} .pastille.r{background:rgba(255,69,58,.14);color:var(--rouge-txt)} .pastille.v{background:rgba(48,209,88,.16);color:var(--vert-txt)} .pastille.o{background:rgba(255,159,10,.16);color:var(--orange-txt)}
.vide{flex:1;display:grid;place-items:center;text-align:center;color:var(--second);padding:30px;font-size:14px;line-height:20px} .vide div{max-width:280px;display:flex;flex-direction:column;align-items:center;gap:12px}
.vide i{width:64px;height:64px;border-radius:50%;background:var(--doux);color:var(--accent);display:grid;place-items:center} .vide i svg{width:26px;height:26px}
.titre-s{padding:14px 20px 6px} .note{font-size:12px;line-height:16px;color:var(--second);padding:0 16px}
.champ{display:flex;flex-direction:column;gap:5px} .champ>span{font-size:12px;color:var(--second);padding-left:2px}
.champ input,.champ select,.champ textarea{min-height:34px;border-radius:9px;border:.5px solid var(--trait);background:var(--carte);padding:6px 10px;outline:0;width:100%;resize:none} .champ input:focus,.champ textarea:focus,.champ select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--doux)}
.puces{display:flex;gap:6px;flex-wrap:wrap} .puce{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 11px 0 4px;border-radius:999px;background:var(--champ);font-size:13px} .puce .av{width:22px;height:22px;font-size:9px} .puce.sans{padding-left:11px}
.puce[aria-pressed="true"]{background:var(--fill);color:#fff}

/* ── Tableau de bord ── */
.bonjour h2{font-size:26px;line-height:32px} .bonjour p{color:var(--second);font-size:14px;margin-top:2px}
.gestes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px} .gestes button{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:var(--r);background:var(--carte);font-weight:600;font-size:13.5px}
.gestes button i{width:34px;height:34px;border-radius:50%;background:var(--c,var(--fill));color:#fff;display:grid;place-items:center}
.tuiles-b{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start}
.tuile-b{background:var(--carte);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column} .tuile-b>header{display:flex;align-items:center;gap:8px;padding:12px 14px 4px} .tuile-b>header h3{flex:1} .tuile-b>header a,.tuile-b>header button{color:var(--accent);font-size:12.5px}
.tuile-b .rien{padding:6px 14px 16px;color:var(--second)}
.prochaine{margin:6px 10px 10px;padding:12px 14px;border-radius:12px;background:var(--doux);display:flex;align-items:center;gap:12px} .prochaine .t{flex:1;min-width:0} .prochaine b{display:block;font-size:15px;line-height:20px} .prochaine .t>span{color:var(--second);font-size:12.5px;display:block}
.coche{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--faible);flex:none;display:grid;place-items:center;color:#fff} .coche[aria-checked="true"]{background:var(--fill);border-color:var(--fill)} .coche svg{width:13px;height:13px;stroke-width:2.4;display:none} .coche[aria-checked="true"] svg{display:block}
.rang.fait .t b{color:var(--second);text-decoration:line-through}

/* ── listes de conversations, de contacts, d'appels ── */
.epingles{display:flex;gap:6px;padding:10px 12px 4px;overflow-x:auto;scrollbar-width:none;flex:none} .epingles::-webkit-scrollbar{display:none}
.epingles a{display:flex;flex-direction:column;align-items:center;gap:6px;width:76px;flex:none;font-size:11.5px;line-height:14px;padding:4px 0;border-radius:10px} .epingles a span{max-width:72px} .epingles a[aria-current]{color:var(--accent);font-weight:600}
.epingles .av{width:56px;height:56px;font-size:20px} .non-lu{position:absolute;right:0;top:0;width:13px;height:13px;border-radius:50%;background:var(--fill);border:2px solid var(--fond)}
.ligne{display:flex;align-items:center;gap:11px;padding:8px 12px 8px 22px;margin:0 8px;border-radius:10px;position:relative;width:calc(100% - 16px)}
.ligne+.ligne::before{content:"";position:absolute;left:73px;right:4px;top:0;border-top:.5px solid var(--trait)}
.ligne .pt{position:absolute;left:7px;top:50%;margin-top:-4px;width:8px;height:8px;border-radius:50%;background:var(--fill)}
.ligne .t{flex:1;min-width:0} .ligne .l1{display:flex;align-items:baseline;gap:8px} .ligne .l1 b{flex:1;min-width:0;font-weight:600;font-size:14px;line-height:19px} .ligne time,.ligne .h{font-size:12px;color:var(--second);white-space:nowrap}
.ligne .ap{color:var(--second);font-size:13px;line-height:17px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden} .ligne .ap.une{-webkit-line-clamp:1}
.ligne[aria-current]{background:var(--fill);color:#fff} .ligne[aria-current] .ap,.ligne[aria-current] time,.ligne[aria-current] .h,.ligne[aria-current] .gris{color:rgba(255,255,255,.8)} .ligne[aria-current] .pt{background:#fff} .ligne[aria-current]::before,.ligne[aria-current]+.ligne::before{display:none}
.ligne[aria-current] .rond{color:#fff} .ligne[aria-current] .date-t{background:rgba(255,255,255,.22);color:#fff} .ligne.manque .l1 b{color:var(--rouge-txt)} .ligne[aria-current].manque .l1 b{color:#fff}
.ligne .sens{width:14px;height:14px;color:var(--second);margin-right:3px;vertical-align:-2px} .ligne[aria-current] .sens{color:rgba(255,255,255,.8)}
.section-l{padding:14px 22px 5px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--second)}

/* ── la conversation ── */
.qui{display:flex;align-items:center;gap:9px;min-width:0;flex:1} .qui span{min-width:0} .qui b{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:600} .qui b svg{width:11px;height:11px;color:var(--faible)} .qui small{display:block;font-size:11.5px;color:var(--second);line-height:14px}
.fil{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 10px;display:flex;flex-direction:column;gap:2px;overscroll-behavior:contain}
.jour{align-self:center;font-size:11px;font-weight:600;color:var(--second);padding:10px 0 6px}
.msg{display:flex;flex-direction:column;align-items:flex-start;max-width:min(66%,560px);position:relative} .msg.moi{align-self:flex-end;align-items:flex-end} .msg.suite{margin-top:0} .msg:not(.suite){margin-top:8px}
.msg .aut{font-size:11px;color:var(--second);padding:0 12px 2px}
.bulle{padding:6px 12px;border-radius:17px;background:var(--recue);font-size:13px;line-height:18px;white-space:pre-wrap;overflow-wrap:anywhere;position:relative;cursor:default;text-align:left}
.msg.moi .bulle{background:var(--fill);color:#fff}
.msg .cite{font-size:12px;line-height:16px;padding:2px 0 4px 8px;margin-bottom:4px;border-left:2px solid currentColor;opacity:.75;display:block}
.msg .lu{font-size:11px;color:var(--second);padding:2px 6px 0}
.reacs{display:flex;gap:3px;margin:-5px 8px 2px;position:relative;z-index:1} .reacs span{font-size:12px;line-height:18px;padding:0 6px;border-radius:10px;background:var(--carte);box-shadow:0 0 0 .5px var(--trait),0 1px 2px rgba(0,0,0,.08)}
.bulle.photo{padding:3px;background:var(--recue)} .photo-i{width:220px;max-width:100%;aspect-ratio:4/3;border-radius:14px;background:linear-gradient(140deg,var(--a1,#7f9ee0),var(--a2,#243d85));display:grid;place-items:center;color:rgba(255,255,255,.85)} .photo-i svg{width:30px;height:30px} .bulle.photo small{display:block;padding:4px 9px 3px;font-size:12px}
.vocal{display:flex;align-items:center;gap:9px;min-width:190px} .vocal button{width:28px;height:28px;border-radius:50%;background:rgba(120,120,128,.24);display:grid;place-items:center;flex:none} .msg.moi .vocal button{background:rgba(255,255,255,.26)} .vocal button svg{width:12px;height:12px;fill:currentColor;stroke:none}
.onde{flex:1;height:22px;display:flex;align-items:center;gap:2px} .onde i{flex:1;border-radius:2px;background:currentColor;opacity:.45;height:var(--h,40%)} .vocal.joue .onde i{animation:onde 1s ease-in-out infinite alternate;animation-delay:calc(var(--k) * -70ms)} @keyframes onde{to{height:20%;opacity:.9}}
.vocal time{font-size:11.5px;opacity:.75}
.fichier{display:flex;align-items:center;gap:10px;min-width:200px} .fichier i{width:34px;height:34px;border-radius:8px;background:rgba(120,120,128,.22);display:grid;place-items:center;flex:none} .msg.moi .fichier i{background:rgba(255,255,255,.24)} .fichier b{display:block;font-weight:600} .fichier small{opacity:.75;font-size:11.5px}
.sondage{min-width:230px;display:flex;flex-direction:column;gap:6px} .sondage>b{font-weight:600} .sondage button{position:relative;display:flex;justify-content:space-between;gap:10px;padding:6px 10px;border-radius:9px;background:rgba(120,120,128,.16);overflow:hidden;font-size:13px} .msg.moi .sondage button{background:rgba(255,255,255,.2)}

/* ══ EN DIRECT : l'appel (audio, vidéo) et la réunion (préparation, salle, partage d'écran) ══ */
const dureeTxt = (t0) => { const s = Math.max(0, Math.floor((Date.now() - t0) / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
let _tic = 0;

/* ═══ APPEL ═══ */
function demarrerAppel(qui, video, entrant) {
  const c = conv(qui);
  if (c && c.canal) { ouvrirSalle({ titre: c.n, invites: c.membres.map((m) => [m, 'oui']) }, true); return; }      // appeler un canal, c'est une réunion
  const p = c ? c.avec : qui; if (!P[p]) return; fermer();
  S.appel = { qui: p, video: !!video, etat: entrant ? 'entrant' : 'sonne', muet: false, hp: false, clavier: false, reduit: false, t0: 0 };
  peindreAppel(); if (!entrant) setTimeout(() => { if (S.appel && S.appel.etat === 'sonne') { S.appel.etat = 'cours'; S.appel.t0 = Date.now(); peindreAppel(); } }, 2200);
}
function peindreAppel() {
  const a = S.appel, z = $('#plein'), m = $('#mini'); clearInterval(_tic);
  if (!a) { if (!S.salle) z.innerHTML = ''; if (m) m.remove(); return; }
  if (a.etat === 'cours') _tic = setInterval(() => { $$('[data-duree]').forEach((e) => { e.textContent = dureeTxt(a.t0); }); }, 1000);
  if (a.reduit) { z.innerHTML = ''; let b = m; if (!b) { b = document.createElement('button'); b.id = 'mini'; b.dataset.appel = 'revenir'; document.body.appendChild(b); }
    b.innerHTML = `${svg('tel')}${esc(prenom(a.qui))} · <span data-duree class="tab">${a.t0 ? dureeTxt(a.t0) : '…'}</span>`; b.setAttribute('aria-label', 'Revenir à l’appel avec ' + P[a.qui].n); return; }
  if (m) m.remove();
  const p = P[a.qui], b = (k, ic, l, on) => `<button data-appel="${k}" aria-pressed="${!!on}"><i>${svg(ic)}</i>${l}</button>`;
  const etat = a.etat === 'sonne' ? 'Appel en cours…' : a.etat === 'entrant' ? (a.video ? 'Appel vidéo entrant' : 'Appel entrant') : `<span data-duree class="tab">${dureeTxt(a.t0)}</span>`;
  z.innerHTML = `<div class="appel ${a.video && a.etat === 'cours' ? 'video' : ''} ${a.etat !== 'cours' ? 'sonne' : ''}" style="--a1:${p.a[0]};--a2:${p.a[1]}" role="dialog" aria-label="Appel avec ${esc(p.n)}">
    ${a.etat === 'cours' ? `<button class="reduire" data-appel="reduire" aria-label="Réduire l’appel">${svg('bas')}</button>` : ''}${a.video && a.etat === 'cours' ? '<span class="vous">Toi</span>' : ''}

    ${a.etat === 'entrant' ? `<div class="fin" style="margin-top:auto"><button data-appel="raccrocher" class="racc"><i>${svg('tel')}</i>Refuser</button><button data-appel="repondre"><i class="ok">${svg('tel')}</i>Répondre</button></div>`
      : a.clavier ? `<div class="clavier">${'123456789*0#'.split('').map((t) => `<button data-touche="${t}">${t}</button>`).join('')}</div><div class="fin"><button data-appel="clavier"><i style="background:rgba(255,255,255,.16)">${svg('x')}</i>Masquer</button><button data-appel="raccrocher" class="racc"><i>${svg('tel')}</i>Raccrocher</button></div>`
      : `<div class="cmd">${b('muet', a.muet ? 'microoff' : 'micro', 'Silence', a.muet)}${b('hp', 'hp', 'Haut-parleur', a.hp)}${b('camera', a.video ? 'video' : 'camoff', 'Caméra', a.video)}${b('clavier', 'clavier', 'Clavier')}${b('ajouter', 'ajout', 'Ajouter')}${b('message', 'bulle', 'Message')}</div>
        <div class="fin"><button data-appel="raccrocher" class="racc"><i>${svg('tel')}</i>Raccrocher</button></div>`}</div>`;

function finAppel() {

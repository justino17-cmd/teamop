<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1c357f">
<title>Prototype OP MESSAGES</title>
<!-- Aperçu de travail (16 novembre 2026) : le PROTOTYPE d'OP MESSAGES, CÔTÉ PRO, refait de A à Z à la demande de Justin (« refais tout, style
     Apple », « concentre-toi sur le côté pro »). Les rubriques sont celles de la vraie application : Tableau de bord, Messages, Contacts, Appels,
     Réunions, Agenda, Courrier, et le Profil. DONNÉES ENTIÈREMENT FICTIVES (« Clim Services 17 », adresses en .example), aucun appel à un serveur,
     rien ne s'enregistre. Ce n'est PAS OP MESSAGES : la vraie page est servie par server-msg/.
     ⛔ CETTE PAGE EST FABRIQUÉE : ses parties sont dans design/opmessages/prototype/ (assembler.sh). On modifie les parties, jamais ce fichier.
     ⛔ LE COURRIER N'EST PAS UNE MAQUETTE (Justin : « la boîte mail, je veux celle qui était ») : la rubrique monte le VRAI module opcourrier.js,
     chargé à côté de cette page, avec sa source de démonstration. -->
<style>
/* ══ PROTOTYPE D'OP MESSAGES, CÔTÉ PRO — REFONTE TOTALE (17 novembre 2026). Justin : « je vois pas vraiment de différence […] prends les meilleures
   applications pro pour les réunions, les appels, les messages, les mails, l'agenda, et fais-moi ça mieux. Je veux une refonte totale. »
   Ce qui change de forme, d'après Teams, Slack, Zoom, Spike et Superhuman : un CADRE bleu (rail d'icônes + barre de recherche) autour d'un espace de
   travail arrondi ; des messages en LIGNES (auteur, heure, texte) avec leurs gestes au survol, plus de bulles ; une liste de conversations en
   sections avec filtres ; un fil « Activité » ; un agenda en GRILLE HORAIRE ; des cartes bordées, des angles moins ronds, 14 px au bureau. ══ */
:root{
  --cadre:#1c357f; --cadre2:#152764; --fond:#f5f6fa; --carte:#fff; --bord:#e3e6ee; --texte:#131a2c; --second:#5a6377; --faible:#99a1b3; --accent:#2a4a9c; --fill:#2a4a9c;
  --doux:#e9effd; --champ:#eef0f6; --survol:#f1f3f8; --sel:#e6edff; --vert:#16a34a; --vert-doux:#e3f6ea; --rouge:#e5484d; --rouge-doux:#fde8e8; --orange:#d97706; --orange-doux:#fdf0d9;
  --ombre:0 10px 30px rgba(15,23,60,.14),0 1px 3px rgba(15,23,60,.08); --r:12px; --ressort:cubic-bezier(.2,.9,.25,1);
}
:root[data-theme="dark"]{
  --cadre:#050b1f; --cadre2:#050b1f; --fond:#0c1530; --carte:#131e40; --bord:#25325e; --texte:#eef2ff; --second:#a9b4d6; --faible:#6d7aa4; --accent:#93b2f6; --fill:#3b63c4;
  --doux:#1b2a58; --champ:#19254e; --survol:#18244b; --sel:#1f3068; --vert:#34c26a; --vert-doux:#143524; --rouge:#ff6b6f; --rouge-doux:#3d1a22; --orange:#f2a93b; --orange-doux:#3a2a12;
  --ombre:0 10px 30px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:14px/20px -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--texte);background:var(--cadre);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:inherit} a{color:inherit;text-decoration:none}
svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:17px;line-height:24px;font-weight:700;letter-spacing:-.01em} h2{font-size:20px;line-height:26px;font-weight:700;letter-spacing:-.01em} h3{font-size:12px;line-height:16px;font-weight:600;color:var(--second)}
.gris{color:var(--second)} .petit{font-size:12.5px;line-height:17px} .tab{font-variant-numeric:tabular-nums} .coupe{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ── le cadre : la barre du haut (recherche), le rail, l'espace de travail arrondi ── */
#cadre{position:fixed;inset:0;height:var(--haut,100%);display:grid;grid-template-columns:76px minmax(0,1fr);grid-template-rows:50px minmax(0,1fr);background:linear-gradient(180deg,var(--cadre),var(--cadre2))}
#haut{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 12px 0 14px;color:#fff}
.marque{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px;letter-spacing:.02em;white-space:nowrap;width:210px;flex:none}
.marque i{width:28px;height:28px;border-radius:8px;background:#fff;color:var(--cadre);display:grid;place-items:center;font-size:8px;line-height:9px;font-weight:800;font-style:normal;text-align:center;flex:none}
.marque em{font-size:9.5px;line-height:15px;font-weight:700;font-style:normal;letter-spacing:.06em;background:rgba(255,255,255,.2);padding:0 6px;border-radius:5px}
.chercher{flex:1;min-width:0;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:9px;background:rgba(255,255,255,.14);color:rgba(255,255,255,.85);font-size:13.5px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.chercher span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left} .chercher kbd{font:inherit;font-size:11.5px;padding:0 6px;border-radius:5px;background:rgba(255,255,255,.16)}
.h-droite{display:flex;align-items:center;gap:6px;width:210px;justify-content:flex-end;flex:none}
.h-btn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;position:relative} .h-btn em{position:absolute;top:1px;right:0;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--rouge);color:#fff;font-size:10.5px;line-height:16px;font-weight:700;font-style:normal;text-align:center}
.h-btn[aria-current]{background:rgba(255,255,255,.2)} .h-moi{border-radius:11px;padding:2px}
.cote{grid-column:1;grid-row:2;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 6px 10px;min-height:0;overflow-y:auto;scrollbar-width:none}
.cote a{display:flex;flex-direction:column;align-items:center;gap:3px;width:64px;padding:7px 0 5px;border-radius:11px;color:rgba(255,255,255,.72);font-size:10.5px;line-height:13px;font-weight:500;position:relative}
.cote a svg{width:22px;height:22px} .cote a[aria-current]{background:rgba(255,255,255,.17);color:#fff;font-weight:700}
.cote a em{position:absolute;top:3px;right:9px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--rouge);color:#fff;font-size:10.5px;line-height:16px;font-weight:700;font-style:normal;text-align:center}
.cote .creer{margin-top:auto;width:44px;height:44px;border-radius:14px;background:#fff;color:var(--cadre);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.25)} .cote .creer svg{width:22px;height:22px;stroke-width:2.2}
#app{grid-column:2;grid-row:2;margin:0 8px 8px 0;border-radius:14px;overflow:hidden;background:var(--fond);display:grid;min-width:0;min-height:0;position:relative}
#scene,#courrier-fixe{grid-area:1/1;min-width:0;min-height:0}
#scene{display:grid;grid-template-columns:minmax(0,1fr)} #scene.deux{grid-template-columns:clamp(290px,29vw,370px) minmax(0,1fr)}
.col{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--fond)} .col.liste{background:var(--carte);border-right:1px solid var(--bord)}
.barre{flex:none;min-height:56px;display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--carte);border-bottom:1px solid var(--bord);position:relative;z-index:2}
.col.liste .barre{border-bottom:0} .barre h1{flex:1;min-width:0} .barre .pousse{flex:1}
.defile{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.page{padding:22px 26px 34px;display:flex;flex-direction:column;gap:18px;max-width:1240px;width:100%;margin:0 auto}
.rond{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--second);flex:none;position:relative} .rond.plein{background:var(--fill);color:#fff} .rond.gris{background:var(--champ)}
.lien{color:var(--accent);font-weight:600;font-size:13.5px;padding:4px 2px} .retour{display:none}

/* ── les pièces ── */
.av{width:36px;height:36px;border-radius:30%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;background:linear-gradient(160deg,var(--a1,#4f78d6),var(--a2,#2a4a9c));position:relative;letter-spacing:.02em}
.av.p{width:26px;height:26px;font-size:10px} .av.m{width:30px;height:30px;font-size:11px} .av.g{width:56px;height:56px;font-size:20px} .av.xl{width:88px;height:88px;font-size:32px}
.av u{position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;border-radius:50%;background:var(--vert);border:2px solid var(--carte);text-decoration:none} .av u.occ{background:var(--orange)} .av u.abs{background:var(--faible)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:0 14px;border-radius:9px;background:var(--fill);color:#fff;font-weight:600;font-size:13.5px;white-space:nowrap;flex:none}
.btn.gris{background:var(--carte);color:var(--texte);box-shadow:inset 0 0 0 1px var(--bord)} .btn.rouge{background:var(--rouge)} .btn.vert{background:var(--vert)} .btn.large{width:100%;min-height:42px;font-size:14.5px}
.btn svg{width:16px;height:16px} .btn:disabled{opacity:.4;cursor:default}
.carte,.groupe,.tuile-b{background:var(--carte);border:1px solid var(--bord);border-radius:var(--r);overflow:hidden} .carte.pad{padding:14px 16px}
.rang{display:flex;align-items:center;gap:12px;min-height:46px;padding:9px 14px;width:100%;position:relative}
.rang+.rang{border-top:1px solid var(--bord)}
.rang .t{flex:1;min-width:0} .rang .t b{display:block;font-weight:600;font-size:14px;line-height:19px} .rang .t span{display:block;color:var(--second);font-size:12.5px;line-height:17px}
.rang .v{color:var(--second);font-size:13px;white-space:nowrap} .rang>svg.ch{width:14px;height:14px;color:var(--faible)}
.rang .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--fill)) 14%,transparent);color:var(--c,var(--fill));flex:none} .rang .ic svg{width:17px;height:17px}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--champ);max-width:100%} .seg button{min-height:28px;padding:0 14px;border-radius:7px;font-size:13px;font-weight:600;color:var(--second);white-space:nowrap;flex:1}
.seg button[aria-pressed="true"]{background:var(--carte);color:var(--texte);box-shadow:0 1px 3px rgba(15,23,60,.14)}
.filtres{display:flex;gap:6px;padding:2px 14px 10px;overflow-x:auto;scrollbar-width:none;flex:none} .filtres::-webkit-scrollbar{display:none}
.filtres button{flex:none;min-height:28px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--second);box-shadow:inset 0 0 0 1px var(--bord);white-space:nowrap} .filtres button[aria-pressed="true"]{background:var(--texte);color:var(--carte);box-shadow:none} .filtres button b{font-weight:700;opacity:.7;margin-left:4px}
.bascule{width:40px;height:24px;border-radius:12px;background:var(--faible);position:relative;flex:none;transition:background .2s} .bascule::after{content:"";position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .22s var(--ressort)}
.bascule[aria-checked="true"]{background:var(--vert)} .bascule[aria-checked="true"]::after{transform:translateX(16px)}
.cherche{display:flex;align-items:center;gap:7px;height:34px;padding:0 10px;border-radius:9px;background:var(--champ);color:var(--second);margin:0 14px 10px;flex:none} .cherche svg{width:15px;height:15px} .cherche input{flex:1;min-width:0;border:0;background:none;outline:0;color:var(--texte)}
.pastille{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:700;line-height:18px;background:var(--champ);color:var(--second);white-space:nowrap}
.pastille.b{background:var(--doux);color:var(--accent)} .pastille.r{background:var(--rouge-doux);color:var(--rouge)} .pastille.v{background:var(--vert-doux);color:var(--vert)} .pastille.o{background:var(--orange-doux);color:var(--orange)}
.vide{flex:1;display:grid;place-items:center;text-align:center;color:var(--second);padding:30px} .vide div{max-width:300px;display:flex;flex-direction:column;align-items:center;gap:12px}
.vide i{width:60px;height:60px;border-radius:18px;background:var(--doux);color:var(--accent);display:grid;place-items:center} .vide i svg{width:26px;height:26px}
.titre-s{padding:6px 2px 8px} .note{font-size:12.5px;line-height:17px;color:var(--second);padding:0 14px}
.champ{display:flex;flex-direction:column;gap:5px} .champ>span{font-size:12.5px;font-weight:600;color:var(--second)}
.champ input,.champ select,.champ textarea{min-height:38px;border-radius:9px;border:1px solid var(--bord);background:var(--carte);padding:7px 11px;outline:0;width:100%;resize:none} .champ input:focus,.champ textarea:focus,.champ select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--doux)}
.puces{display:flex;gap:6px;flex-wrap:wrap} .puce{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 11px 0 4px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--bord);font-size:13px;font-weight:500} .puce .av{width:24px;height:24px;font-size:9px}
.puce[aria-pressed="true"]{background:var(--fill);color:#fff;box-shadow:none}
.statut{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--second)} .statut i{width:8px;height:8px;border-radius:50%;background:var(--vert)} .statut.occ i{background:var(--orange)} .statut.abs i{background:var(--faible)} .statut.npd i{background:var(--rouge)}

/* ── Accueil : ma journée à gauche, ce qui attend à droite ── */
.bonjour{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap} .bonjour>div{flex:1;min-width:220px} .bonjour h2{font-size:26px;line-height:32px} .bonjour p{color:var(--second);margin-top:2px}
.gestes{display:flex;gap:8px;flex-wrap:wrap}
.acc{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.tuile-b>header{display:flex;align-items:center;gap:8px;padding:13px 16px 9px} .tuile-b>header h3{flex:1;font-size:14px;font-weight:700;color:var(--texte)} .tuile-b>header a,.tuile-b>header button{color:var(--accent);font-size:12.5px;font-weight:600}
.tuile-b .rien{padding:4px 16px 16px;color:var(--second)}
.prochaine{margin:0 12px 10px;padding:12px 14px;border-radius:11px;background:var(--fill);color:#fff;display:flex;align-items:center;gap:12px} .prochaine .t{flex:1;min-width:0} .prochaine b{display:block;font-size:15px;line-height:20px} .prochaine .t>span{display:block;font-size:12.5px;opacity:.85}
.prochaine .btn{background:#fff;color:var(--fill)}
.coche{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--faible);flex:none;display:grid;place-items:center;color:#fff;position:relative} .coche[aria-checked="true"]{background:var(--fill);border-color:var(--fill)} .coche svg{width:13px;height:13px;stroke-width:2.6;display:none} .coche[aria-checked="true"] svg{display:block}
.rang.fait .t b{color:var(--second);text-decoration:line-through;font-weight:500}
.presence{display:flex;gap:14px;padding:4px 16px 16px;flex-wrap:wrap} .presence a{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;width:60px;text-align:center}
.act{display:flex;gap:12px;padding:11px 16px;align-items:flex-start;position:relative} .act+.act{border-top:1px solid var(--bord)} .act .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.act .t{flex:1;min-width:0} .act .t b{display:block;font-weight:600} .act .t p{color:var(--second);font-size:13px;line-height:18px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden} .act time{font-size:12px;color:var(--faible);white-space:nowrap}
.act .ges{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap} .act .ges .btn{min-height:30px;padding:0 11px;font-size:12.5px}

/* ── listes : conversations (en sections), contacts, appels, réunions ── */
.section-l{display:flex;align-items:center;gap:6px;padding:12px 18px 5px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--faible)}
.ligne{display:flex;align-items:center;gap:11px;padding:8px 10px;margin:1px 8px;border-radius:10px;position:relative;width:calc(100% - 16px)}
.ligne .t{flex:1;min-width:0} .ligne .l1{display:flex;align-items:baseline;gap:8px} .ligne .l1 b{flex:1;min-width:0;font-weight:500;font-size:14px;line-height:19px} .ligne time,.ligne .h{font-size:12px;color:var(--faible);white-space:nowrap}
.ligne .ap{color:var(--second);font-size:13px;line-height:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ligne.nl .l1 b{font-weight:700} .ligne.nl .ap{color:var(--texte)} .ligne .n{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--fill);color:#fff;font-size:11.5px;font-weight:700;line-height:20px;text-align:center;flex:none}
.ligne[aria-current]{background:var(--sel);box-shadow:inset 3px 0 0 var(--accent)} .ligne.manque .l1 b{color:var(--rouge)}
.ligne .sens{width:14px;height:14px;margin-right:4px;vertical-align:-2px} .ligne .diese{width:36px;height:36px;border-radius:30%;display:grid;place-items:center;background:var(--champ);color:var(--second);font-weight:700;font-size:16px;flex:none}

/* ── la conversation : des LIGNES (auteur, heure, texte), les gestes au survol ── */
.qui{display:flex;align-items:center;gap:10px;min-width:0;flex:1} .qui>span:not(.av){min-width:0} .qui b{display:flex;align-items:center;gap:5px;font-size:15px;font-weight:700} .qui b svg{width:12px;height:12px;color:var(--faible)} .qui small{display:block;font-size:12px;color:var(--second);line-height:15px}
.fil{flex:1;min-height:0;overflow-y:auto;padding:10px 0 14px;display:flex;flex-direction:column;overscroll-behavior:contain;background:var(--carte)}
.jour{align-self:center;font-size:12px;font-weight:700;color:var(--second);padding:3px 12px;margin:10px 0 6px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--bord);background:var(--carte)}
.msg{display:grid;grid-template-columns:36px minmax(0,1fr);column-gap:11px;padding:5px 22px;position:relative} .msg.suite{padding-top:1px} .msg.suite>.av{visibility:hidden;height:0}
.msg .ent{display:flex;align-items:baseline;gap:8px;grid-column:2} .msg .ent b{font-weight:700} .msg .ent time{font-size:12px;color:var(--faible)} .msg.suite .ent{display:none}
.msg>.av{grid-row:1/span 4} .msg .corps{grid-column:2;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.bulle{font-size:14.5px;line-height:21px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%;cursor:default}
.msg .cite{display:block;font-size:13px;line-height:18px;color:var(--second);padding:1px 0 1px 9px;margin-bottom:3px;border-left:3px solid var(--bord)}
.msg .lu{font-size:12px;color:var(--faible)}
.reacs{display:flex;gap:4px} .reacs span{font-size:13px;line-height:22px;padding:0 8px;border-radius:999px;background:var(--doux);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent)}
.outils{display:none;position:absolute;right:20px;top:-14px;padding:3px;border-radius:10px;background:var(--carte);box-shadow:0 0 0 1px var(--bord),0 4px 12px rgba(15,23,60,.12);gap:1px;z-index:1}
.outils button{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--second);font-size:15px} .outils button svg{width:16px;height:16px}
.bulle.piece{padding:10px 12px;border-radius:12px;border:1px solid var(--bord);background:var(--carte)}

/* Source de DÉMONSTRATION d'OP Courrier — pour la page d'essai (scratchpad/courrier/essai.html) et les sondes du module. Rien d'autre ne la charge.
   ⛔ Les données d'exemple vivent ICI et nulle part ailleurs : `opcourrier.js` et `beta.html` n'en contiennent aucune (tests/test-2702.js le garde).
   Noms et adresses INVENTÉS (domaines en .example) ; les expéditeurs « arnaque / hameçonnage » servent à éprouver le tri automatique.
   Modes (paramètre ?mode= de la page d'essai) :
     demo        tout allumé (OAuth, envoi programmé, signature, simulation) — c'est le mode de la maquette validée

    <div class="h-droite"><a class="h-btn" href="#activite" ${S.vue === 'activite' ? 'aria-current="page"' : ''} aria-label="Activité${n ? ', ' + n + ' à traiter' : ''}" title="Activité">${svg('cloche')}${n ? `<em>${n}</em>` : ''}</a>

/* ── l'Activité : tout ce qui attend une réponse, au même endroit (messages non lus, mentions, appels manqués, invitations, courriels) ── */
const TRAITE = new Set();
function activite() {

  APPELS.filter((a) => a.sens === 'manque' && !a.vu).forEach((a) => l.push({ id: 'a-' + a.id, g: 'appel', ic: 'tel', c: '#e5484d', t: 'Appel manqué · ' + P[a.qui].n, p: P[a.qui].r, h: a.j === 0 ? a.h : jourCourt(a.j), j: a.j, hh: a.h, go: 'appels/' + a.id, ges: [['Rappeler', 'appeler', a.qui]] }));
  EVTS.filter((e) => e.invitation).forEach((e) => l.push({ id: 'i-' + e.id, g: 'invitation', ic: 'agenda', c: '#7d3c98', t: 'Invitation · ' + e.titre, p: jourLong(e.j) + ' · ' + e.deb + ' – ' + e.fin + ' · de ' + P[e.invitation].n, h: '', j: 0, hh: '07:00', go: 'reunions/' + e.id, ges: [['Accepter', 'inv', 'oui'], ['Refuser', 'inv', 'non']], e: e.id }));
  if (COUR.nl) l.push({ id: 'c', g: 'courrier', ic: 'mail', c: '#0d8a6a', t: COUR.nl + ' courriel' + (COUR.nl > 1 ? 's' : '') + ' non lu' + (COUR.nl > 1 ? 's' : ''), p: 'Dans ta boîte professionnelle', h: '', j: 0, hh: '06:00', go: 'courrier', ges: [['Ouvrir', 'go']] });
  return l.filter((x) => !TRAITE.has(x.id)).sort((a, b) => b.j - a.j || b.hh.localeCompare(a.hh));
}
const actHtml = (x) => `<div class="act"><span class="ic" style="--c:${x.c}">${svg(x.ic)}</span><div class="t"><b class="coupe">${esc(x.t)}</b><p>${esc(x.p)}</p><div class="ges">${x.ges.map((g, k) => g[1] === 'go' ? `<a class="btn" href="#${x.go}">${g[0]}</a>` : g[1] === 'appeler' ? `<button class="btn" data-appeler="${g[2]}">${svg('tel')}${g[0]}</button>` : `<button class="btn ${k ? 'gris' : ''}" data-inv="${x.e}" data-rep="${g[2]}">${g[0]}</button>`).join('')}<button class="btn gris" data-traite="${x.id}">${svg('coche')}Traité</button></div></div><time>${x.h}</time></div>`;

function rendre() {
  const v = VUES[S.vue](), sc = $('#scene'), garde = sc.dataset.cle === S.vue + '/' + (S.id || '') ? $$('.defile,.fil', sc).map((e) => e.scrollTop) : null;

}

/* ── toast et bannière ── */
let _toast = 0;

/* ── jour et nuit : en production, l'application suit l'appareil ; le réglage n'existe que dans ce prototype ── */
function appliquerTheme() { const nuit = S.theme === 'dark' || (S.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches); document.documentElement.dataset.theme = nuit ? 'dark' : 'light';

/* ══ LES ÉCRANS — une fonction par rubrique, qui rend { html, deux } (deux colonnes au bureau : la liste, puis le détail) ══ */

/* ═══ ACCUEIL : ma journée à gauche, ce qui attend à droite ═══ */
function prochaine() { const m = minutes(hMaintenant()); return EVTS.filter((e) => !e.passe && (e.j > 0 || (e.j === 0 && minutes(e.fin) > m))).sort((a, b) => a.j - b.j || a.deb.localeCompare(b.deb))[0]; }

VUES.accueil = () => {

      <div class="gestes"><button class="btn" data-action="nouveau-message">${svg('stylo')}Nouveau message</button><button class="btn gris" data-action="nouvel-appel">${svg('tel')}Appeler</button><button class="btn gris" data-action="reunion-maintenant">${svg('video')}Réunion immédiate</button><button class="btn gris" data-action="programmer">${svg('agenda')}Programmer</button></div></div>

        + (jour.length ? jour.map((e) => evtLigne(e)).join('') : '<p class="rien">Rien de prévu aujourd’hui.</p>'))}

    </div><div style="display:flex;flex-direction:column;gap:16px;min-width:0">
      ${tuile('À traiter', `<a href="#activite">Tout voir${act.length ? ' (' + act.length + ')' : ''}</a>`, act.length ? act.slice(0, 5).map(actHtml).join('') : '<p class="rien">Tout est traité. Belle journée !</p>')}
      ${tuile('Mon équipe', '<a href="#contacts">Contacts</a>', `<div class="presence">${eq.map((x) => `<a href="#contacts/${x.id}" title="${esc(x.n)} · ${esc(x.stt)}">${av(x.id, 'g', true)}<span class="coupe" style="max-width:100%">${esc(prenom(x.id))}</span></a>`).join('')}</div>`)}
    </div></div></div></div></div>` };
};

/* ═══ ACTIVITÉ ═══ */

    <div class="filtres" style="padding:0">${f.map((x) => { const n = x[0] === 'tout' ? tout.length : tout.filter((y) => y.g === x[0]).length; return `<button aria-pressed="${S.filtreAct === x[0]}" data-filtre-act="${x[0]}">${x[1]}${n ? `<b>${n}</b>` : ''}</button>`; }).join('')}</div>
    ${l.length ? `<div class="carte">${l.map(actHtml).join('')}</div>` : `<div class="carte">${vide('coche', tout.length ? 'Rien dans ce filtre.' : 'Tout est traité. Rien ne t’attend.')}</div>`}

/* ═══ MESSAGES : une seule liste, en sections (favoris, canaux, équipe, clients), avec des filtres ═══ */
const ligneConv = (c) => { const d = dernier(c); return `<a class="ligne ${c.nl ? 'nl' : ''}" href="#messages/${c.id}" ${S.id === c.id ? 'aria-current="true"' : ''}>${c.canal ? '<span class="diese" aria-hidden="true">#</span>' : av(c.avec, '', true)}<span class="t"><span class="l1"><b class="coupe">${esc(convNom(c))}</b><time>${d.vide ? '' : quand(d)}</time></span>
  <span class="ap">${d.vide ? '' : d.de === 'moi' ? 'Toi : ' : c.canal ? esc(prenom(d.de)) + ' : ' : ''}${esc(apercu(d))}</span></span>${c.nl ? `<span class="n">${c.nl}</span>` : c.sourdine ? svg('sourdine').replace('<svg', '<svg style="width:15px;height:15px;color:var(--faible)"') : ''}</a>`; };
const ordreConv = (a, b) => { const x = dernier(a), y = dernier(b); return y.j - x.j || y.h.localeCompare(x.h); };
function listeConvHtml() {
  const q = S.rech.trim().toLowerCase(), f = S.filtreConv; let tri = C.slice().sort(ordreConv);
  if (q) { const r = tri.filter((c) => convNom(c).toLowerCase().includes(q) || c.msgs.some((m) => (m.t || '').toLowerCase().includes(q)));
    return r.length ? r.map(ligneConv).join('') : `<p class="note" style="padding:20px;text-align:center">Aucun résultat pour « ${esc(S.rech)} ».</p>`; }
  if (f === 'nonlus') tri = tri.filter((c) => c.nl); else if (f === 'canaux') tri = tri.filter((c) => c.canal); else if (f === 'clients') tri = tri.filter((c) => c.avec && !P[c.avec].eq);
  if (!tri.length) return '<p class="note" style="padding:20px;text-align:center">Rien dans ce filtre.</p>';
  const sec = [['Favoris', tri.filter((c) => c.epingle)], ['Canaux', tri.filter((c) => !c.epingle && c.canal)], ['Équipe', tri.filter((c) => !c.epingle && c.avec && P[c.avec].eq)], ['Clients et partenaires', tri.filter((c) => !c.epingle && c.avec && !P[c.avec].eq)]];
  return sec.filter((s) => s[1].length).map((s) => `<p class="section-l">${s[0]}</p>${s[1].map(ligneConv).join('')}`).join('');
}
function bulleHtml(c, m, i) {
  const prec = c.msgs[i - 1], suite = prec && prec.de === m.de && prec.j === m.j && prec.type !== 'sys' && m.type !== 'sys', moi = m.de === 'moi';
  const sep = !prec || prec.j !== m.j ? `<div class="jour">${jourCourt(m.j)}</div>` : '';
  if (m.type === 'sys') return sep + `<div class="sys">${svg(m.ic || 'tel')}${esc(m.t)}</div>`;
  let corps;
  if (m.type === 'vocal') corps = `<div class="bulle piece" data-msg="${m.id}"><span class="vocal"><button data-jouer aria-label="Écouter le message vocal">${svg('jouer')}</button><span class="onde">${[40, 70, 55, 90, 60, 35, 80, 65, 45, 75, 50, 85, 40, 60, 30, 70, 55, 45].map((h, k) => `<i style="--h:${h}%;--k:${k}"></i>`).join('')}</span><time>${m.d}</time></span></div>`;
  else if (m.type === 'photo') corps = `<div class="bulle piece" data-msg="${m.id}"><span class="photo-i" style="--a1:${P[m.de].a[0]};--a2:${P[m.de].a[1]}">${svg('photo')}</span>${m.leg ? `<small>${esc(m.leg)}</small>` : ''}</div>`;
  else if (m.type === 'fichier') corps = `<div class="bulle piece" data-msg="${m.id}"><span class="fichier"><i>${svg('doc')}</i><span><b>${esc(m.nom)}</b><small>${esc(m.taille)}</small></span></span></div>`;
  else if (m.type === 'position') corps = `<div class="bulle piece" data-msg="${m.id}"><span class="photo-i" style="--a1:#7fc8a9;--a2:#2a7a6a">${svg('position')}</span><small>${esc(m.t)}</small></div>`;
  else if (m.type === 'sondage') { const tot = m.opts.reduce((n, o) => n + o[1], 0) || 1; corps = `<div class="bulle piece" data-msg="${m.id}"><span class="sondage"><b>${esc(m.q)}</b>${m.opts.map((o, k) => `<button data-vote="${m.id}" data-k="${k}" aria-pressed="${m.v === k}"><i style="--w:${Math.round(o[1] / tot * 100)}%"></i><span>${esc(o[0])}</span><span>${o[1]}</span></button>`).join('')}<small>${tot} vote${tot > 1 ? 's' : ''}${m.v != null ? ' · tu as voté' : ''}</small></span></div>`; }
  else corps = `<div class="bulle" data-msg="${m.id}">${m.rep ? `<span class="cite">${esc(m.rep)}</span>` : ''}${esc(m.t)}</div>`;
  return `${sep}<div class="msg ${suite ? 'suite' : ''}">${av(m.de)}<div class="ent"><b>${moi ? 'Toi' : esc(P[m.de].n)}</b><time>${m.h}</time></div><div class="corps">${corps}
    ${m.reac && m.reac.length ? `<span class="reacs">${m.reac.map((r) => `<span>${r}</span>`).join('')}</span>` : ''}${moi && i === c.msgs.length - 1 ? `<span class="lu">${m.lu ? 'Lu ' + m.lu : 'Distribué'}</span>` : ''}</div>
    <div class="outils" data-pour="${m.id}"><button data-outil="pouce" aria-label="Réagir 👍" title="Réagir">👍</button><button data-outil="repondre" aria-label="Répondre" title="Répondre">${svg('repondre')}</button><button data-outil="plus" aria-label="Plus d’actions" title="Plus d’actions">${svg('points')}</button></div></div>`;
}

        <button class="rond" id="btn-envoi" data-action="vocal" aria-label="Enregistrer un message vocal">${svg('micro')}</button></div></div></div></div>`;
}
VUES.messages = () => {

  const f = [['tout', 'Tout'], ['nonlus', 'Non lus'], ['canaux', 'Canaux'], ['clients', 'Clients']];
  const liste = `<div class="col liste">${tete('Messages', `<button class="rond" data-action="nouveau-message" aria-label="Nouvelle conversation" title="Nouvelle conversation">${svg('stylo')}</button>`)}

/* ═══ COURRIER : la VRAIE boîte mail d'OP MESSAGES Pro (le module opcourrier.js), montée telle quelle avec des courriels d'exemple.

function placerCourrier() {

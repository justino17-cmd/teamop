<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<!-- Aperçu de travail (13 novembre 2026) : le PROTOTYPE d'OP MESSAGES demandé par Justin (« revois tout en prototype, apporte des idées » :
     messages, appels, appels vidéo, réunions, courrier). Même forme que apercu/prototype-op-gestion.html : une page, un réglage Jour / Nuit / Auto,
     des rôles à essayer, une visite guidée. DONNÉES ENTIÈREMENT FICTIVES (« Clim Services 17 », adresses en .example), aucun appel à un serveur,
     rien ne s'enregistre. Ce n'est PAS OP MESSAGES : la vraie page est servie par server-msg/. -->
</head>
<body>
<title>Prototype OP MESSAGES</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Prototype OP MESSAGES — thème « 100 % Apple » d'OP MESSAGES (design/opmessages/THEME-OPMESSAGES.md) : fonds unis, bleu du logo,
   verre sur les barres, nuit en bleu nuit (jamais noir). Ordinateur : menu à gauche, liste, détail. Téléphone (≤ 760 px) : une
   colonne et la capsule d'onglets qui flotte. Données entièrement fictives, aucun appel réseau. */
:root{
  --police:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",Roboto,"Noto Sans",system-ui,sans-serif;
  --r:22px; --r2:14px; --ressort:cubic-bezier(.32,.72,0,1);
  color-scheme:light;
  --fond:#f2f2f7; --encre:#000; --doux:rgba(60,60,67,.8); --faible:rgba(60,60,67,.6); --tenu:rgba(60,60,67,.3);
  --accent:#2a4a9c; --fill:#2a4a9c; --sur-fill:#fff; --fill-doux:rgba(42,74,156,.12);
  --carte:#fff; --champ:rgba(118,118,128,.12); --recue:#e9e9eb; --sur-recue:#000;
  --barre:rgba(255,255,255,.78); --onglets:rgba(255,255,255,.72); --onglet-on:rgba(118,118,128,.16); --onglet-ink:#2a4a9c; --onglet-off:rgba(60,60,67,.8);
  --trait:rgba(60,60,67,.2); --menu:rgba(255,255,255,.5); --feuille:rgba(242,242,247,.96); --notif:rgba(255,255,255,.9);
  --seg:rgba(118,118,128,.12); --seg-on:#fff; --bascule:rgba(120,120,128,.16); --survol:rgba(60,60,67,.06);
  --ombre:0 8px 28px rgba(0,0,0,.1),0 1px 3px rgba(0,0,0,.06); --ombre-haute:0 24px 60px rgba(0,0,0,.24);
  --reflet:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(255,255,255,.35),inset 0 0 0 .5px rgba(255,255,255,.55);
  --rouge:#d70015; --rouge-fill:#d70015; --vert:#1c7a3a; --vert-vif:#30d158; --orange:#a04a00; --violet:#7d3c98;
  --voile:rgba(0,0,0,.34); --idee:#8a5300; --idee-fond:rgba(255,179,64,.2);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --fond:#0b1633; --encre:#fff; --doux:rgba(220,228,250,.78); --faible:rgba(220,228,250,.62); --tenu:rgba(220,228,250,.3);
  --accent:#9db8f5; --fill:#3b63c4; --sur-fill:#fff; --fill-doux:rgba(126,162,240,.2);
  --carte:#16244b; --champ:rgba(120,140,200,.18); --recue:#203262; --sur-recue:#fff;
  --barre:rgba(14,26,58,.78); --onglets:rgba(22,36,76,.9); --onglet-on:rgba(255,255,255,.14); --onglet-ink:#c7d6fb; --onglet-off:rgba(220,228,250,.78);
  --trait:rgba(120,140,200,.26); --menu:rgba(14,26,58,.6); --feuille:rgba(18,31,66,.97); --notif:rgba(28,44,90,.94);
  --seg:rgba(120,140,200,.22); --seg-on:#3d4f80; --bascule:rgba(120,140,200,.3); --survol:rgba(160,180,240,.1);
  --ombre:0 8px 28px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.3); --ombre-haute:0 24px 60px rgba(0,0,0,.6);
  --reflet:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -1px 0 rgba(255,255,255,.06),inset 0 0 0 .5px rgba(255,255,255,.1);
  --rouge:#ff8a82; --rouge-fill:#d70015; --vert:#5ee08a; --vert-vif:#30d158; --orange:#ffb340; --violet:#d2a8ff;
  --voile:rgba(2,6,20,.6); --idee:#ffcf7a; --idee-fond:rgba(255,179,64,.18);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --fond:#0b1633; --encre:#fff; --doux:rgba(220,228,250,.78); --faible:rgba(220,228,250,.62); --tenu:rgba(220,228,250,.3);
  --accent:#9db8f5; --fill:#3b63c4; --sur-fill:#fff; --fill-doux:rgba(126,162,240,.2);
  --carte:#16244b; --champ:rgba(120,140,200,.18); --recue:#203262; --sur-recue:#fff;
  --barre:rgba(14,26,58,.78); --onglets:rgba(22,36,76,.9); --onglet-on:rgba(255,255,255,.14); --onglet-ink:#c7d6fb; --onglet-off:rgba(220,228,250,.78);
  --trait:rgba(120,140,200,.26); --menu:rgba(14,26,58,.6); --feuille:rgba(18,31,66,.97); --notif:rgba(28,44,90,.94);
  --seg:rgba(120,140,200,.22); --seg-on:#3d4f80; --bascule:rgba(120,140,200,.3); --survol:rgba(160,180,240,.1);
  --ombre:0 8px 28px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.3); --ombre-haute:0 24px 60px rgba(0,0,0,.6);
  --reflet:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -1px 0 rgba(255,255,255,.06),inset 0 0 0 .5px rgba(255,255,255,.1);
  --rouge:#ff8a82; --rouge-fill:#d70015; --vert:#5ee08a; --vert-vif:#30d158; --orange:#ffb340; --violet:#d2a8ff;
  --voile:rgba(2,6,20,.6); --idee:#ffcf7a; --idee-fond:rgba(255,179,64,.18);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fond);color:var(--encre);font:400 16px/1.35 var(--police);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3,p{margin:0}
h1{font-size:30px;line-height:1.15;font-weight:700;letter-spacing:.01em}
h2{font-size:20px;font-weight:700}
h3{font-size:13px;font-weight:600;color:var(--faible);text-transform:uppercase;letter-spacing:.04em}
.gris{color:var(--doux)} .faible{color:var(--faible)} .petit{font-size:14px} .mini{font-size:12.5px} .gras{font-weight:600}
.rouge{color:var(--rouge)} .vert{color:var(--vert)} .tab{font-variant-numeric:tabular-nums}
svg{width:22px;height:22px;flex:none}

/* ── le cadre ── */
.cadre{height:100%;display:flex;flex-direction:column}
.bande{flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px max(16px,env(safe-area-inset-right,0px)) 7px max(16px,env(safe-area-inset-left,0px));
  background:var(--idee-fond);border-bottom:.5px solid var(--trait);font-size:13px}
.bande b{color:var(--idee)}
.bande .pousse{flex:1}
.tel-seul{display:none!important}
.app{flex:1;min-height:0;display:grid;grid-template-columns:236px minmax(0,1fr)}
.menu{display:flex;flex-direction:column;gap:2px;padding:14px 10px 12px max(10px,env(safe-area-inset-left,0px));background:var(--menu);border-right:.5px solid var(--trait);overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 12px;font-weight:700;font-size:15px;letter-spacing:.02em}
.logo i{width:34px;height:34px;border-radius:9px;background:linear-gradient(150deg,#4f78d6,#2a4a9c);display:grid;place-items:center;color:#fff;font:800 10px/1 var(--police);font-style:normal;text-align:center}
.logo .pro{font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--fill);color:var(--sur-fill)}
.menu a,.menu button.lien-menu{display:flex;align-items:center;gap:11px;min-height:40px;padding:6px 10px;border-radius:10px;color:var(--encre);text-decoration:none;font-size:15px;width:100%}
.menu a:hover,.menu button.lien-menu:hover{background:var(--survol)}
.menu a.on{background:var(--fill-doux);color:var(--accent);font-weight:600}
.menu a svg{color:var(--accent)}
.menu .n{margin-left:auto;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--fill);color:var(--sur-fill);font-size:12px;font-weight:600;display:grid;place-items:center}
.menu .grp{font-size:11px;font-weight:600;color:var(--faible);text-transform:uppercase;letter-spacing:.05em;padding:14px 10px 4px}
.menu .pied{margin-top:auto;padding-top:10px}
.moi{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;width:100%}
.moi:hover{background:var(--survol)}
.moi .t{min-width:0;flex:1}
.moi .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statut{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--doux)}
.statut i{width:8px;height:8px;border-radius:50%;background:var(--vert-vif)}
.statut.occ i{background:#ff9f0a} .statut.npd i{background:#ff453a} .statut.abs i{background:var(--tenu)}

.scene{min-width:0;min-height:0;display:grid;grid-template-columns:clamp(320px,31vw,420px) minmax(0,1fr)}
.scene.une{grid-template-columns:minmax(0,1fr)}
.liste{min-height:0;display:flex;flex-direction:column;border-right:.5px solid var(--trait);background:var(--fond)}
.detail{min-height:0;min-width:0;display:flex;flex-direction:column;position:relative}
.page{min-height:0;overflow-y:auto;padding:22px max(22px,env(safe-area-inset-right,0px)) 40px 22px}
.page>.dedans{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.tete{flex:none;padding:16px 16px 8px;display:flex;flex-direction:column;gap:10px}
.tete .l1{display:flex;align-items:center;gap:8px}
.tete .l1 h1{flex:1;min-width:0}
.defile{flex:1;min-height:0;overflow-y:auto;padding:0 8px 16px}
.vide{flex:1;display:grid;place-items:center;text-align:center;color:var(--faible);padding:30px}
.vide svg{width:54px;height:54px;color:var(--tenu);margin:0 auto 10px;display:block}

/* ── pièces ── */
.rond{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--accent);flex:none}
.rond:hover{background:var(--survol)}
.rond.plein{background:var(--fill);color:var(--sur-fill)}
.rond.gris{background:var(--champ)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;background:var(--fill);color:var(--sur-fill);font-weight:600;font-size:15px;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.gris{background:var(--champ);color:var(--accent)}
.btn.rouge{background:var(--rouge-fill);color:#fff}
.btn.vert{background:#1f8a3f;color:#fff}
.btn.petit{min-height:36px;padding:0 13px;font-size:14px}
.btn.large{width:100%;min-height:50px}
.btn svg{width:18px;height:18px}
.lien{color:var(--accent);font-weight:500}
.cherche{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:12px;background:var(--champ);color:var(--faible)}
.cherche svg{width:17px;height:17px}
.cherche input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:16px;color:var(--encre)}
.cherche kbd{font:500 11px var(--police);padding:2px 6px;border-radius:6px;border:.5px solid var(--trait);color:var(--faible)}
.seg{display:inline-flex;padding:2px;border-radius:10px;background:var(--seg);gap:2px;max-width:100%}
.seg button{min-height:30px;padding:0 12px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--encre);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--seg-on);box-shadow:0 1px 3px rgba(0,0,0,.14);font-weight:600}
.seg.plein{display:flex} .seg.plein button{flex:1;padding:0 6px}
.puces{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.puces::-webkit-scrollbar{display:none}
.puce{flex:none;min-height:32px;padding:0 12px;border-radius:999px;background:var(--champ);font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.puce[aria-pressed="true"]{background:var(--fill);color:var(--sur-fill)}
.puce .c{font-size:11.5px;opacity:.8}
.av{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:600;font-size:16px;position:relative;background:linear-gradient(150deg,var(--a1,#4f78d6),var(--a2,#2a4a9c))}
.av.p{width:30px;height:30px;font-size:12px} .av.m{width:36px;height:36px;font-size:13.5px} .av.g{width:64px;height:64px;font-size:23px} .av.xl{width:104px;height:104px;font-size:38px}
.av .pt{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:var(--vert-vif);border:2px solid var(--fond)}
.av.grp{border-radius:30%}
.pile{display:flex} .pile .av{margin-left:-8px;box-shadow:0 0 0 2px var(--carte)} .pile .av:first-child{margin-left:0}
.et{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:7px;font-size:12px;font-weight:600;background:var(--champ);color:var(--doux);white-space:nowrap}
.et.b{background:var(--fill-doux);color:var(--accent)} .et.v{background:color-mix(in srgb,var(--vert-vif) 20%,transparent);color:var(--vert)}
.et.r{background:color-mix(in srgb,#ff453a 18%,transparent);color:var(--rouge)} .et.o{background:var(--idee-fond);color:var(--orange)}
.et.idee{background:var(--idee-fond);color:var(--idee)}
.sur-fill .et.idee{background:rgba(255,255,255,.2);color:#fff}
.et svg{width:13px;height:13px}
.carte{background:var(--carte);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.carte.serre{padding:4px 0;gap:0}
.grille2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.grille3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.rang{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 16px;width:100%;position:relative}
.rang+.rang::before{content:"";position:absolute;left:16px;right:0;top:0;border-top:.5px solid var(--trait)}
button.rang:hover,a.rang:hover{background:var(--survol)}
.rang .t{flex:1;min-width:0}
.rang .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rang .t span{display:block;color:var(--doux);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rang .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--c,var(--fill));color:#fff;flex:none}
.rang .ic svg{width:18px;height:18px}
.rang .chev{color:var(--tenu);width:16px;height:16px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bascule{width:50px;height:30px;border-radius:15px;background:var(--bascule);position:relative;flex:none;transition:background .2s}
.bascule::after{content:"";position:absolute;left:2px;top:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .22s var(--ressort)}
.bascule[aria-checked="true"]{background:#30b950} .bascule[aria-checked="true"]::after{transform:translateX(20px)}
.champ{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--doux);font-weight:500}
.champ input,.champ select,.champ textarea{min-height:44px;padding:9px 12px;border-radius:12px;border:.5px solid var(--trait);background:var(--carte);font-size:16px;color:var(--encre);width:100%}
.champ textarea{min-height:110px;resize:vertical;line-height:1.4}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info{padding:11px 14px;border-radius:14px;background:var(--fill-doux);font-size:14px;display:flex;gap:10px;align-items:flex-start}
.info svg{color:var(--accent);width:19px;height:19px;margin-top:1px}
.info.idee{background:var(--idee-fond)} .info.idee svg{color:var(--idee)}
.info .t{flex:1;min-width:0}

/* ── liste de conversations / courriels ── */
.conv{display:flex;gap:11px;align-items:flex-start;padding:10px 10px;border-radius:14px;width:100%;position:relative}
.conv:hover{background:var(--survol)}
.conv.on{background:var(--fill-doux)}
.conv .t{flex:1;min-width:0}
.conv .l1{display:flex;align-items:baseline;gap:8px}
.conv .l1 b{flex:1;min-width:0;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .l1 time{font-size:13px;color:var(--faible);flex:none}
.conv .ap{font-size:14.5px;color:var(--doux);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
.conv .ap b{color:var(--encre);font-weight:600}
.conv .bas{display:flex;gap:6px;align-items:center;margin-top:4px;flex-wrap:wrap}
.conv .nl{position:absolute;left:1px;top:26px;width:8px;height:8px;border-radius:50%;background:var(--fill)}
.conv .cpt{min-width:20px;height:20px;border-radius:10px;background:var(--fill);color:var(--sur-fill);font-size:12px;font-weight:600;display:grid;place-items:center;padding:0 6px;flex:none}
.conv.nonlu .l1 b{font-weight:700}
.titre-grp{font-size:12px;font-weight:600;color:var(--faible);text-transform:uppercase;letter-spacing:.05em;padding:14px 12px 4px}
.epingles{display:flex;gap:14px;overflow-x:auto;padding:4px 10px 10px;scrollbar-width:none}
.epingles button{display:flex;flex-direction:column;align-items:center;gap:5px;width:64px;flex:none;font-size:12px;color:var(--doux)}
.epingles .nom-e{max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── conversation ── */
.barre-conv{flex:none;display:flex;align-items:center;gap:8px;min-height:60px;padding:8px 12px;background:var(--barre);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border-bottom:.5px solid var(--trait);z-index:2}
.barre-conv .qui{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.barre-conv .qui b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barre-conv .qui .sous{font-size:12.5px;color:var(--doux);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.retour-tel{display:none}
.fil{flex:1;min-height:0;overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px 16px;display:flex;flex-direction:column;gap:3px}
.jour-sep{align-self:center;font-size:12px;color:var(--faible);font-weight:600;padding:10px 0 6px}
.msg{display:flex;gap:8px;max-width:min(78%,560px);align-items:flex-end;position:relative}
.msg.moi-m{align-self:flex-end;flex-direction:row-reverse}
.msg .av{margin-bottom:2px}
.bulle{padding:8px 13px;border-radius:20px;background:var(--recue);color:var(--sur-recue);font-size:16px;line-height:1.32;min-width:0;overflow-wrap:anywhere;position:relative}
.msg.moi-m .bulle{background:var(--fill);color:var(--sur-fill);border-bottom-right-radius:6px}
.msg:not(.moi-m) .bulle{border-bottom-left-radius:6px}
.bulle .aut{display:block;font-size:12.5px;font-weight:600;color:var(--accent);margin-bottom:1px}
.bulle .cite{display:block;font-size:13.5px;padding:4px 9px;margin:0 0 5px;border-left:3px solid currentColor;border-radius:4px;opacity:.82;background:rgba(127,127,127,.14)}
.bulle .date-d{text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer;font-weight:600}
.bulle .trad{display:block;margin-top:6px;padding-top:6px;border-top:.5px solid rgba(127,127,127,.4);font-size:14.5px;opacity:.92}
.msg .reac{position:absolute;bottom:-11px;right:10px;display:flex;gap:2px;padding:1px 6px;border-radius:11px;background:var(--carte);box-shadow:0 1px 4px rgba(0,0,0,.2);font-size:13px}
.msg.moi-m .reac{right:auto;left:10px}
.msg.a-reac{margin-bottom:12px}
.msg .outils{display:none;align-self:center;gap:2px}
.msg:hover .outils,.msg:focus-within .outils{display:flex}

.salle{flex:1;min-height:0;display:flex;flex-direction:column;background:#06080f}

/* ── calques ── */
.voile{position:fixed;inset:0;z-index:60;background:var(--voile);display:flex;justify-content:flex-end;animation:fondu .18s}
.panneau{width:min(500px,100%);height:100%;background:var(--feuille);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);overflow-y:auto;padding:20px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) 20px;display:flex;flex-direction:column;gap:14px;position:relative;animation:entreD .3s var(--ressort);box-shadow:var(--ombre-haute)}
.panneau.large{width:min(760px,100%)}
.panneau>*{flex-shrink:0}                    /* une feuille plus haute que l'écran DÉFILE : ses blocs ne s'écrasent pas les uns sur les autres */
.voile.centre{justify-content:center;align-items:center;padding:20px}
.voile.centre .panneau{height:auto;max-height:min(92%,820px);border-radius:24px;animation:pop .26s var(--ressort)}
.panneau .x{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;background:var(--champ);display:grid;place-items:center;color:var(--doux);z-index:2}

@keyframes fondu{from{opacity:0}} @keyframes entreD{from{transform:translateX(40px);opacity:0}} @keyframes entreB{from{transform:translateY(60px);opacity:0}} @keyframes pop{from{transform:scale(.94);opacity:0}}
#notif{position:fixed;z-index:80;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:center;pointer-events:none;padding:0 12px}
.banniere{pointer-events:auto;width:min(420px,100%);display:flex;gap:11px;align-items:center;padding:11px 13px;border-radius:20px;background:var(--notif);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);box-shadow:var(--ombre),var(--reflet);animation:desc .4s var(--ressort);text-align:left}
.banniere .logo-n{width:36px;height:36px;border-radius:9px;background:linear-gradient(150deg,#4f78d6,#2a4a9c);color:#fff;display:grid;place-items:center;font:800 9px/1 var(--police);text-align:center;flex:none}
.banniere .t{flex:1;min-width:0;font-size:14px} .banniere .t b{display:block} .banniere .t small{color:var(--faible);font-size:12px}
@keyframes desc{from{transform:translateY(-70px);opacity:0}}
#toast{position:fixed;z-index:85;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:.25s var(--ressort);display:flex;align-items:center;gap:12px;padding:11px 16px;border-radius:999px;background:#1d2437;color:#fff;font-size:14.5px;box-shadow:var(--ombre-haute);max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#plein:not(:empty)~#toast{bottom:auto!important;top:calc(58px + env(safe-area-inset-top,0px))}      /* en appel ou en réunion, le message passe EN HAUT : il ne couvre pas les commandes */
#toast button{color:#9db8f5;font-weight:700;white-space:nowrap}
.mini-appel{position:fixed;z-index:45;left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:#1f8a3f;color:#fff;font-size:14px;font-weight:600;box-shadow:var(--ombre)}

/* ── barre du téléphone ── */
.barre-bas{display:none}
.capsule{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:5px;border-radius:34px;background:var(--onglets);backdrop-filter:blur(24px) saturate(200%);-webkit-backdrop-filter:blur(24px) saturate(200%);box-shadow:var(--ombre),var(--reflet)}

/* ── visite guidée ── */

/* ── idées ── */
.idee-c{display:flex;flex-direction:column;gap:7px;padding:14px 16px;border-radius:18px;background:var(--carte);min-width:0}
.idee-c .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.idee-c .h b{flex:1;min-width:140px;font-size:16px}
.idee-c p{font-size:14.5px;color:var(--doux)}

}

      'rappel-facture': () => { S.rappels.push({ t: 'Régler la facture F-2611-0412 (2 316,00 €)', q: 'le 27 novembre, 3 jours avant l’échéance' }); toast('Rappel posé le 27 novembre', 'Voir', () => aller('aujourdhui')); },
      'vers-compta': () => { const m = mail(id); ecrireMail({ titre: 'Envoyer à la comptable', boite: m.boite, a: P.camille.mel, objet: 'Tr: ' + m.objet, corps: 'Bonjour Camille,\n\nVoici la facture Froid Atlantique de novembre.' }); },
      'apercu-pj': () => ouvrir(`<h2>Aperçu</h2><div style="background:#fff;color:#16244b;border-radius:14px;padding:26px;min-height:300px;box-shadow:0 2px 10px rgba(0,0,0,.15)"><b style="font-size:18px">Contrat d’entretien 2027</b><p style="margin-top:10px;color:#46526a">Entre Clim Services 17 et l’Hôtel des Remparts.<br>Objet : entretien annuel de 14 climatiseurs.<br>Montant : 2 380,00 € HT par an.</p><p style="margin-top:14px;color:#6a7590;font-size:13px">Document fictif du prototype.</p></div><div class="pied"><button class="btn" data-ferme="1">Fermer</button></div>`, { centre: true, large: true }),
      signer: () => ouvrir(`<h2>Envoyer pour signature</h2><div class="actions">${etIdee(25)}</div><label class="champ">Document<input value="Contrat-entretien-2027.pdf" readonly></label><label class="champ">Signataire<input value="James Carter · j.carter@hotel-remparts.example"></label><div class="deux"><label class="champ">Vérification<select><option>Code par SMS</option><option>Code par courriel</option></select></label><label class="champ">Délai<select><option>7 jours</option><option>15 jours</option><option>30 jours</option></select></label></div>
        <div class="rang" style="padding:0"><span class="t"><b>Je contresigne après le client</b><span>Tu reçois le document signé à valider</span></span><button class="bascule" role="switch" aria-checked="false" data-bascule="1" aria-label="Contre-signature"></button></div>
        <div class="pied"><button class="btn gris" data-ferme="1">Annuler</button><button class="btn" data-action="proto" data-mot="Prototype : la demande de signature serait envoyée. Tu suivrais « En attente », « Ouvert », « Signé »." data-ferme-apres="1">Envoyer pour signature</button></div>`, { centre: true }),

      'em-programmer': () => { _ctx = { boite: $('#em-de').value, a: $('#em-a').value, objet: $('#em-objet').value, corps: $('#em-corps').value }; feuilleChoix('Programmer l’envoi', 'Le courriel part au moment choisi, même si l’application est fermée.', [['Ce soir à 18 h 00', ''], ['Demain à 8 h 00', 'Pendant les heures de bureau du destinataire'], ['Lundi à 8 h 00', '']], 'data-prog'); },

      'ajouter-contact': () => ouvrir(`<h2>Ajouter un contact</h2><label class="champ">Identifiant ou numéro<input placeholder="Prénom#1234 ou 06…" autofocus></label><div class="info">${svg('qr')}<span class="t"><b>Ou montre ton code</b><br><span class="petit">L’autre personne le scanne : vous êtes en contact, sans échanger de numéro.</span></span></div><div class="pied"><button class="btn gris" data-ferme="1">Annuler</button><button class="btn" data-action="proto" data-mot="Prototype : la demande de contact serait envoyée" data-ferme-apres="1">Envoyer la demande</button></div>`, { centre: true }),
      proto: () => { if (b.dataset.fermeApres) fermer(); toast(b.dataset.mot); },
    };
    if (A[a]) { A[a](); return; }
  }
  if ((b = q('[data-plus-tard]'))) { fermer(); const s = $('#saisie'); if (s) s.value = ''; toast('Programmé : ' + b.dataset.plusTard.toLowerCase(), 'Annuler', () => { const z = $('#saisie'); if (z) z.value = _ctx; }); return; }
  if ((b = q('[data-go]'))) { ev.preventDefault(); if (b.dataset.notif) $('#notif').innerHTML = ''; if (b.dataset.ferme) fermer(); aller(b.dataset.go); return; }
  if ((b = q('[data-ferme]')) && (ev.target === b || b.classList.contains('x') || b.tagName === 'BUTTON')) { fermer(); return; }
});
document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.id === 'rech-msg' || t.id === 'rech-mail') { if (t.id === 'rech-msg') S.rechMsg = t.value; else S.rechMail = t.value; const p = t.selectionStart; rendre(); const n = $('#' + t.id); if (n) { n.focus(); n.setSelectionRange(p, p); } }
  if (t.id === 'rech-tout') $('#rech-res').innerHTML = resultats(t.value);
  if (t.id === 'saisie' || t.id === 'saisie-fil') { t.style.height = 'auto'; t.style.height = Math.min(120, t.scrollHeight) + 'px'; }
});
document.addEventListener('keydown', (ev) => {
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'k') { ev.preventDefault(); if (S.role !== 'invite') ouvrirRecherche(); return; }
  if (ev.key === 'Escape') { if ($('#calque').innerHTML) fermer(); else gdFin(); return; }
  if (ev.key === 'Enter' && !ev.shiftKey) {
    if (ev.target.id === 'saisie') { ev.preventDefault(); const s = ev.target; if (s.value.trim()) envoyerMsg(conv(S.param), s.value.trim()); }
    else if (ev.target.id === 'saisie-fil') { ev.preventDefault(); $('[data-action="envoyer-fil"]').click(); }
    else if (ev.target.id === 'salle-msg') { ev.preventDefault(); $('[data-salle="chat"]').click(); }
    else if (ev.target.id === 'salle-action') { ev.preventDefault(); $('[data-salle="action"]').click(); }
    else if (ev.target.matches && ev.target.matches('.bulle[data-menu-msg]')) ev.target.click();
  }
});

try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', appliquerMode); } catch (e) { /* ancien navigateur */ }

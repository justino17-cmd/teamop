<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"></head><body>
<title>Comptabilité Clim Services 17</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex,nofollow">
<style>
/* Mise en page : un logiciel de comptabilité. Menu des rubriques à gauche (sur téléphone, un tiroir), le travail au centre,
   le détail d'une écriture, d'une pièce ou d'un compte dans un panneau qui glisse à droite. Police du système, comme
   OP GESTION ; chiffres alignés (tabulaires), numéros de comptes et codes de lettrage en chasse fixe : on lit des colonnes. */
:root{
  --bg:#f2f4f7; --surf:#ffffff; --surf2:#eef1f5; --surf3:#e6eaf0; --ink:#121b2a; --mute:#5a6578; --faible:#7b8597; --line:#dde2ea; --line2:#c9d0db;
  --accent:#0a5fc2; --accent-ink:#ffffff; --accent-bg:#e7f0fb;
  --ok:#17804f; --ok-bg:#e2f3ea; --warn:#9a5600; --warn-bg:#fcefd9; --bad:#b4332a; --bad-bg:#fbe6e3; --essai:#6b45a8; --essai-bg:#efe8fa;
  --debit:#121b2a; --credit:#121b2a; --ombre:0 1px 2px rgba(18,27,42,.06),0 8px 24px rgba(18,27,42,.07); --voile:rgba(18,27,42,.34);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px; --menu:252px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141c; --surf:#161f2b; --surf2:#1c2734; --surf3:#233040; --ink:#e8edf4; --mute:#a2adbd; --faible:#8792a3; --line:#2a3646; --line2:#3a485b;
  --accent:#5ea2ff; --accent-ink:#06121f; --accent-bg:#14263d;
  --ok:#4fd295; --ok-bg:#123224; --warn:#f2a94e; --warn-bg:#352610; --bad:#ff8378; --bad-bg:#3b1815; --essai:#c4a6ff; --essai-bg:#2a2140;
  --debit:#e8edf4; --credit:#e8edf4; --ombre:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35); --voile:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141c; --surf:#161f2b; --surf2:#1c2734; --surf3:#233040; --ink:#e8edf4; --mute:#a2adbd; --faible:#8792a3; --line:#2a3646; --line2:#3a485b;
  --accent:#5ea2ff; --accent-ink:#06121f; --accent-bg:#14263d;
  --ok:#4fd295; --ok-bg:#123224; --warn:#f2a94e; --warn-bg:#352610; --bad:#ff8378; --bad-bg:#3b1815; --essai:#c4a6ff; --essai-bg:#2a2140;
  --debit:#e8edf4; --credit:#e8edf4; --ombre:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35); --voile:rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15.5px/1.5 var(--f);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1{font-size:28px;line-height:1.15;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:18px;margin:0;text-wrap:balance}
h3{font-size:15.5px;margin:0}
p{margin:0}
.mute{color:var(--mute)}.petit{font-size:13.5px}.n,.num{font-variant-numeric:tabular-nums}.mono{font-family:var(--mono);font-size:.92em}
[hidden]{display:none!important}
.seul-tel{display:none!important}
.cache-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ─── la charpente ─── */
.app{display:grid;grid-template-columns:var(--menu) minmax(0,1fr);min-height:100vh}
.menu{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surf);border-right:1px solid var(--line);padding:16px 12px 24px;display:flex;flex-direction:column;gap:2px}
.marque{display:flex;gap:10px;align-items:center;padding:4px 8px 14px}
.marque i{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 13px/1 var(--f);font-style:normal;letter-spacing:.02em;flex:none}
.marque b{display:block;font-size:15px}.marque small{color:var(--mute);font-size:12.5px}
.menu .grp{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faible);padding:14px 10px 4px}
.menu a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:14.5px;min-height:38px}
.menu a:hover{background:var(--surf2)}
.menu a[aria-current="page"]{background:var(--accent-bg);color:var(--accent);font-weight:650}
.menu a .nb{margin-left:auto;min-width:22px;height:20px;padding:0 6px;border-radius:999px;background:var(--warn-bg);color:var(--warn);font-size:12px;font-weight:700;display:grid;place-items:center}
.menu a .nb.ok{background:var(--ok-bg);color:var(--ok)}
.menu svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.centre{min-width:0;display:flex;flex-direction:column}
.barre{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(20px,env(safe-area-inset-left,0px));display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;min-height:58px}
.barre .ouvrir-menu{display:none}
.barre .dossier{display:flex;flex-direction:column;line-height:1.25}.barre .dossier b{font-size:14.5px}.barre .dossier span{font-size:12.5px;color:var(--mute)}
.barre .puces{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.puce{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surf);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.puce i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.puce.ouvert i{background:var(--warn)}
.contenu{padding:24px max(16px,env(safe-area-inset-right,0px)) 64px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px;max-width:1440px;width:100%}
.tete{display:flex;gap:12px 20px;align-items:flex-end;flex-wrap:wrap}
.tete>div:first-child{flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:4px}
.surtitre{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.tete .actions{display:flex;gap:8px;flex-wrap:wrap}
.consigne{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--accent-bg);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.consigne b{display:block}.consigne .x{margin-left:auto}

/* ─── les pièces de base ─── */
.carte{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.carte>h2,.carte>h3{margin-bottom:10px}
.grille{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left}
button.kpi:hover{border-color:var(--line2)}
@media (min-width:1001px){.kpis.six{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kpi span{font-size:13px;color:var(--mute)}.kpi b{font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}.kpi small{font-size:12.5px;color:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14.5px;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(1.06)}
.btn.gris{background:var(--surf);color:var(--ink);border-color:var(--line2)}
.btn.gris:hover{background:var(--surf2);filter:none}
.btn.danger{background:var(--surf);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.petit{min-height:32px;padding:0 11px;font-size:13.5px;border-radius:8px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed;filter:none}
.lien{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.st{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:650;white-space:nowrap;background:var(--surf2);color:var(--mute)}
.st.ok{background:var(--ok-bg);color:var(--ok)}.st.warn{background:var(--warn-bg);color:var(--warn)}.st.bad{background:var(--bad-bg);color:var(--bad)}.st.info{background:var(--accent-bg);color:var(--accent)}.st.essai{background:var(--essai-bg);color:var(--essai)}
.jn{display:inline-grid;place-items:center;min-width:30px;height:22px;padding:0 6px;border-radius:6px;background:var(--surf3);font:700 11.5px/1 var(--mono);letter-spacing:.02em}
.let{font:700 12px/1 var(--mono);color:var(--ok)}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:3px;border-radius:11px;background:var(--surf2);border:1px solid var(--line)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--mute);min-height:34px}
.seg button[aria-pressed="true"]{background:var(--surf);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.outils{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.champ{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute);font-weight:600;min-width:0}
.saisie,.champ input,.champ select,.champ textarea{min-height:40px;border:1px solid var(--line2);border-radius:9px;background:var(--surf);padding:0 10px;font-size:15px;font-weight:400;color:var(--ink);width:100%}
.champ textarea{padding:8px 10px;min-height:70px}
.case{display:flex;gap:8px;align-items:center;font-size:14.5px;min-height:36px}
.case input{width:18px;height:18px;accent-color:var(--accent)}
.info{padding:11px 14px;border-radius:12px;background:var(--accent-bg);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);font-size:14.5px}
.alerte{padding:11px 14px;border-radius:12px;background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);font-size:14.5px}
.erreur{padding:11px 14px;border-radius:12px;background:var(--bad-bg);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent);color:var(--ink);font-size:14.5px}
.bon{padding:11px 14px;border-radius:12px;background:var(--ok-bg);border:1px solid color-mix(in srgb,var(--ok) 30%,transparent);font-size:14.5px}
.vide{padding:28px;text-align:center;color:var(--mute)}

/* ─── les tableaux comptables ─── */
.defile{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--r);background:var(--surf)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faible);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surf);position:sticky;top:0;white-space:nowrap}
.t td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t td.n,.t th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.t td.c{white-space:nowrap}
.t tbody tr.clic{cursor:pointer}.t tbody tr.clic:hover td{background:var(--surf2)}
.t tr.total td{font-weight:700;background:var(--surf2);border-top:1px solid var(--line2)}
.t tr.sous td{background:color-mix(in srgb,var(--surf2) 55%,transparent);font-weight:650}
.t tr.essai td{background:color-mix(in srgb,var(--essai-bg) 55%,transparent)}
.t tr.brouil td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.t input.saisie{min-height:34px;font-size:14px;padding:0 8px}
.t .compte{font-family:var(--mono);font-size:13px;white-space:nowrap}
.t td .sec{display:block;font-size:12.5px;color:var(--mute)}

/* ─── le panneau de détail ─── */
.voile{position:fixed;inset:0;background:var(--voile);z-index:40;display:flex;justify-content:flex-end;animation:fondu .18s ease}
.panneau{width:min(760px,100%);height:100%;overflow:auto;background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--ombre);padding:20px max(20px,env(safe-area-inset-right,0px)) 40px 22px;display:flex;flex-direction:column;gap:14px;animation:glisse .26s cubic-bezier(.32,.72,0,1)}
.panneau.large{width:min(1040px,100%)}
.panneau .haut{display:flex;gap:10px;align-items:flex-start}
.panneau .haut>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.fermer{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surf);font-size:18px;flex:none;display:grid;place-items:center}
@keyframes fondu{from{opacity:0}}@keyframes glisse{from{transform:translateX(40px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.voile,.panneau{animation:none}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14.5px;z-index:60;max-width:min(560px,calc(100% - 32px));box-shadow:var(--ombre);pointer-events:none}

/* ─── la pièce justificative (un document fictif) ─── */
.doc{background:#fff;color:#1b2330;border:1px solid #d7dce4;border-radius:10px;padding:18px 20px;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.doc .dtete{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid #e3e7ee;padding-bottom:10px;margin-bottom:10px}
.doc b{color:#111}.doc table{width:100%;border-collapse:collapse;margin-top:8px}.doc td,.doc th{padding:5px 4px;border-bottom:1px solid #eef1f5;text-align:left}.doc .n{text-align:right}
.doc .tot{margin-left:auto;width:min(260px,100%);margin-top:8px}.doc .tot div{display:flex;justify-content:space-between;padding:2px 0}.doc .tot div:last-child{font-weight:700;border-top:1px solid #d7dce4;padding-top:5px}

/* ─── l'équilibre d'une écriture ─── */
.balance-ecr{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:14px}
.balance-ecr .ecart{font-weight:700}
.balance-ecr .ecart.ok{color:var(--ok)}.balance-ecr .ecart.ko{color:var(--bad)}

/* ─── les étapes (à faire, clôture) ─── */
.etapes{display:flex;flex-direction:column}
.etape{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.etape:last-child{border-bottom:0}
.etape .rond{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:13px;font-weight:800;background:var(--surf2);color:var(--mute);border:1px solid var(--line)}
.etape.ok .rond{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.etape .txt{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:1px}
.etape.ok .txt b{color:var(--mute);font-weight:600}

/* ─── le bilan ─── */
.bilan{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.graph svg{width:100%;height:auto;display:block}
.graph text{fill:var(--mute);font-size:11px;font-family:var(--f)}

/* ─── le parcours d'essai ─── */
.essais{display:flex;flex-direction:column;gap:8px}
.essai-l{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--surf);border:1px solid var(--line);flex-wrap:wrap}
.essai-l .rond{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;font-size:13px;background:var(--surf2);color:var(--mute)}
.essai-l.ok .rond{background:var(--ok-bg);color:var(--ok)}
.essai-l .txt{flex:1 1 280px;min-width:0}

/* ─── l'automatique : la carte de synchronisation, les questions, le fil, le terrain ─── */
.synchro{display:flex;gap:12px 14px;align-items:center;flex-wrap:wrap;border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
.synchro .s-ic{width:44px;height:44px;border-radius:12px;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center;font-size:20px;font-weight:700;flex:none}
.synchro .s-c{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:3px}
.synchro .actions{display:flex;gap:8px;flex-wrap:wrap}
.synchro.fait{border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}.synchro.fait .s-ic{background:var(--ok-bg);color:var(--ok)}
.fil{display:flex;flex-direction:column}
.fil-l{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.fil-l:first-child{padding-top:2px}.fil-l:last-child{border-bottom:0}
.fil-ic,.av-ic,.ev-ic{width:36px;height:36px;border-radius:10px;background:var(--surf2);display:grid;place-items:center;flex:none;font-size:17px}
.fil-c{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.fil-t{display:flex;gap:2px 12px;flex-wrap:wrap;align-items:baseline;justify-content:space-between}
.fil-t b{min-width:0;overflow-wrap:anywhere}
.fil-c .lien,.ev-c .lien,.t .lien{align-self:flex-start;font-size:13.5px;min-height:32px;display:inline-flex;align-items:center}
.av{display:flex;gap:14px;align-items:flex-start}
.av-ic,.ev-ic{width:44px;height:44px;font-size:21px}
.av-c{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.av-form{display:flex;flex-direction:column;gap:8px;max-width:560px}
.av-choix{display:flex;gap:8px;flex-wrap:wrap}
.av-mini{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.av-mini:last-of-type{border-bottom:0}
.av-mini .av-ic{width:32px;height:32px;font-size:15px}.av-mini .av-t{flex:1;min-width:0;font-size:14.5px}
.evs{display:flex;flex-direction:column;gap:10px}
.ev{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ev-c{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:3px}
.ev.fait{background:color-mix(in srgb,var(--ok-bg) 45%,var(--surf))}
.ev-r{color:var(--ok);font-weight:600}
.liste{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px}
.clair{display:flex;flex-direction:column;gap:8px}
.clair-l{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surf)}
.clair-l .cl-c{font-family:var(--mono);font-size:13px;color:var(--mute)}.clair-l .cl-n{font-weight:650;min-width:0}.clair-l .cl-m{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
.clair-l p{grid-column:1/-1;color:var(--ink);font-size:14.5px}
.cl-mini{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:13.5px}
.cl-mini li{display:flex;gap:8px}.cl-mini .mono{color:var(--mute);flex:none;font-size:12px;padding-top:2px}
.chaine{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chaine span{padding:7px 12px;border-radius:10px;background:var(--accent-bg);color:var(--accent);font-weight:650;font-size:14px}
.chaine i{color:var(--faible);font-style:normal}
.glossaire dl{display:grid;grid-template-columns:minmax(150px,230px) minmax(0,1fr);gap:9px 18px;margin:0}
.glossaire dt{font-weight:700}.glossaire dd{margin:0;color:var(--mute)}
.tva-calc{display:flex;flex-direction:column;gap:6px;margin:4px 0 10px;max-width:540px}
.tva-calc div{display:flex;justify-content:space-between;gap:12px}.tva-calc .tot{border-top:1px solid var(--line2);padding-top:7px;font-weight:700;font-size:16px}

const FOURNISSEURS = [
  ['F-CDO', 'Clim Distribution Ouest', '401000'], ['F-FPA', 'Frigo Pièces Atlantique', '401000'], ['F-EP17', 'Électricité Pro 17', '401000'], ['F-SCI', 'SCI du Port (loyer)', '401000'],

const TIERS = [...CLIENTS, ...FOURNISSEURS];

/* ─── l'état du dossier ─── */
const E = [];                                  // toutes les écritures
const PER = {};                                // 'AAAA-MM' → 'cloturee'
const TVA_DECL = {};                           // 'AAAA-MM' → { decl:date, paye:date, l:{…} }
const RELEVE = [];                             // le relevé de la banque : { id, date, lib, m (+ crédit, − débit), ref, pointe:ligneRef|null }

const IMMOS = [];                              // le registre des immobilisations
const JOURNAL_ACTIONS = [];                    // la piste d'audit : qui a fait quoi
let SEQ = 0, LET_SEQ = {};

function ecr(o){
  const e = { id:'e' + (++SEQ), j:o.j, date:o.date, piece:o.piece || '', lib:o.lib, etat:o.etat || 'valide', orig:o.orig || 'saisie', ech:o.ech || null, pj:o.pj === undefined ? (o.piece ? o.piece + '.pdf' : null) : o.pj,

function lignesDe(filtre, o){
  o = o || {}; const R = [];

const NUMS = {};

/* ─── les pièces à traiter ─── */
const ligneDoc = P => P.l ? P.l.map(([d, q, pu]) => ({ d, q, pu, t:r2(q * pu) })) : [];
const htDe = P => r2(ligneDoc(P).reduce((s, x) => s + cts(x.t), 0) / 100);
function proposition(P){
  const ht = htDe(P), tva = r2(ht * (P.taux || 0) / 100), ttc = r2(ht + tva), t = P.de && tiers(P.de);
  const DEF = { 'F-CDO':'601000', 'F-FPA':'601000', 'F-EP17':'601000', 'F-ATL':'626000', 'F-GAR':'615500' };
  if (P.paie) return { j:'PA', date:P.date, piece:P.ref, lib:'Journal de paie · octobre 2026', l:lignesPaie(P.paie) };
  if (P.immo) return { j:'AC', date:P.date, piece:P.ref, lib:P.immo.lib + ' · ' + t.nom, ech:P.ech, l:[[P.immo.c, null, ht, 0, P.immo.lib], ['445620', null, tva, 0, 'TVA déductible sur immobilisation', { taux:P.taux, base:ht }], [t.c, P.de, 0, ttc, P.ref + ' · ' + t.nom]] };
  if (P.avoir) return { j:'AC', date:P.date, piece:P.ref, lib:'Avoir · ' + t.nom, l:[[t.c, P.de, ttc, 0, P.ref + ' · ' + t.nom], ['601000', null, 0, ht, P.l[0][0]], ['445660', null, 0, tva, 'TVA déductible à reprendre', { taux:P.taux, base:-ht }]] };
  if (P.paye === 'carte') return { j:'BQ', date:P.date, piece:P.ref, lib:'Carburant · ' + P.emetteur, l:[['606100', null, ht, 0, P.l[0][0]], ['445660', null, tva, 0, 'TVA déductible', { taux:P.taux, base:ht }], ['512000', null, 0, ttc, 'Carte de l’entreprise']] };
  return { j:'AC', date:P.date, piece:P.ref, lib:P.l[0][0] + ' · ' + t.nom, ech:P.ech, l:[[DEF[P.de] || '601000', null, ht, 0, P.l.length > 1 ? 'Matériel de climatisation' : P.l[0][0]], ['445660', null, tva, 0, 'TVA déductible', { taux:P.taux, base:ht }], [t.c, P.de, 0, ttc, P.ref + ' · ' + t.nom]] };
}
const emetteur = P => P.de ? nomTiers(P.de) : P.emetteur;
function docHtml(P){

    <table><tbody>${[['Salaires bruts (dont ' + nb(p.sup) + ' € d’heures supplémentaires)', p.brut], ['Cotisations salariales URSSAF', p.sal1], ['Cotisations salariales retraite et prévoyance', p.sal2], ['Prélèvement à la source', p.pas], ['Net à payer', p.net], ['Cotisations patronales URSSAF', p.pat1], ['Cotisations patronales retraite et prévoyance', p.pat2]].map(([l, m]) => `<tr><td>${l}</td><td class="n">${nb(m)} €</td></tr>`).join('')}</tbody></table>
    <p style="margin-top:8px;color:#5a6578">Montants fictifs. Le détail par salarié est dans les fiches de paie.</p></div>`; }
  const L = ligneDoc(P), ht = htDe(P), tva = r2(ht * P.taux / 100);

    <table><thead><tr><th>Désignation</th><th class="n">Qté</th><th class="n">P.U. HT</th><th class="n">Total HT</th></tr></thead><tbody>${L.map(x => `<tr><td>${esc(x.d)}</td><td class="n">${x.q}</td><td class="n">${nb(x.pu)}</td><td class="n">${nb(x.t)}</td></tr>`).join('')}</tbody></table>
    <div class="tot"><div><span>Total HT</span><span>${nb(ht)} €</span></div><div><span>TVA ${P.taux} %</span><span>${nb(tva)} €</span></div><div><span>${P.avoir ? 'Avoir TTC' : 'Total TTC'}</span><span>${nb(r2(ht + tva))} €</span></div></div>
    ${P.paye === 'carte' ? '<p style="margin-top:8px">Payé par carte bancaire le 29/10/2026.</p>' : ''}</div>`;

const lireNombre = v => { const x = parseFloat(String(v || '').replace(/\s| /g, '').replace(',', '.')); return isNaN(x) ? 0 : r2(x); };
function lireLignes(zone, orig){
  return [...zone.querySelectorAll('.lignes-ed tbody tr')].map((tr, i) => { const g = k => { const e = tr.querySelector(`[data-l="${k}"]`); return e ? e.value : ''; };
    const c = (g('c').match(/\d{6}/) || [g('c').trim()])[0]; return [c, COLLECTIFS[c] ? g('aux') || null : null, lireNombre(g('d')), lireNombre(g('cr')), g('lib').trim(), orig && orig[i] && orig[i][5]]; });
}
function equilibreHtml(L){

}
document.addEventListener('input', ev => { const z = ev.target.closest('[data-ecriture]'); if (!z || !ev.target.closest('.lignes-ed')) return; const q = z.querySelector('[data-equilibre]'); if (q) q.innerHTML = equilibreHtml(lireLignes(z)); });
function ouvrirPiece(id){
  const P = PIECES.find(p => p.id === id), pr = proposition(P), fait = P.statut !== 'a_traiter';
  const e = fait && E.find(x => x.id === P.ecr);
  ouvrir(haut(esc(P.type) + ' · ' + esc(emetteur(P)), `${P.ref} · reçue le ${dCourt(P.date)}`, 'Pièce à traiter') + `<div class="grille g2">${docHtml(P)}
    <div style="display:flex;flex-direction:column;gap:10px;min-width:0">${fait ? `<div class="bon">Passée en comptabilité : ${e ? `<button type="button" class="lien" data-a="ecr" data-id="${e.id}">${e.num || 'écriture au brouillard'}</button>` : ''}.</div>` :
      `<div class="info petit">${P.paie ? 'Le cabinet envoie le total de la paie : salaires bruts, charges, net à payer, et ce qui est dû aux organismes.' : P.immo ? `Plus de 500 € HT et durable : ce n’est pas une charge mais une immobilisation, amortie sur ${P.immo.duree} ans (seuil de tolérance usuel, à confirmer avec l’expert-comptable).` : P.avoir ? 'Un avoir fait l’inverse d’une facture : il diminue ce qu’on doit au fournisseur et la TVA déductible.' : P.paye === 'carte' ? 'Payé tout de suite par carte : l’écriture va au journal de banque, sans passer par le compte du fournisseur.' : 'Proposition faite à partir de la facture : le compte de charge du fournisseur, la TVA déductible, et ce qu’on lui doit.'}</div>`}
    </div></div>
    ${fait ? '' : `<div data-ecriture="piece" data-id="${P.id}" style="display:flex;flex-direction:column;gap:10px">
      <div class="outils"><span class="jn">${pr.j}</span><b>${JOURNAUX[pr.j]}</b><span class="mute">· ${dCourt(pr.date)} · ${esc(pr.piece)}</span></div>
      ${lignesEditables(pr.l)}
      ${P.immo ? `<label class="case"><input type="checkbox" id="pi-immo" checked> Inscrire au registre des immobilisations : « ${esc(P.immo.lib)} », amortie sur <select id="pi-duree" class="saisie" style="width:auto;min-height:32px">${[2, 3, 4, 5].map(n => `<option ${n === P.immo.duree ? 'selected' : ''}>${n}</option>`).join('')}</select> ans</label>` : ''}
      <div id="pi-err"></div>

function enregistrerPiece(id, val){
  const P = PIECES.find(p => p.id === id), pr = proposition(P), z = $('#calque [data-ecriture]'), L = lireLignes(z, pr.l);

  const essai = ecr(e); const r = refusEcriture(essai);
  if (r) { essai.etat = 'supprimee'; $('#pi-err').innerHTML = `<div class="erreur">${esc(r)}</div>`; return; }
  if (val) { const m = valider(essai); if (m) { $('#pi-err').innerHTML = `<div class="erreur">${esc(m)}</div>`; return; } }
  P.statut = 'traitee'; P.ecr = essai.id; trace(`Pièce ${P.ref} passée en comptabilité`, { ref:essai.id });
  if (P.immo && $('#pi-immo') && $('#pi-immo').checked) { IMMOS.push({ id:'I' + (IMMOS.length + 1), lib:P.immo.lib, c:P.immo.c, date:P.date, val:htDe(P), duree:+$('#pi-duree').value, fourn:nomTiers(P.de), ecr:essai.id }); }

  fermer(); rendre(); toast(val ? `Pièce ${P.ref} en comptabilité : ${essai.num}.` : `Pièce ${P.ref} au brouillard : à valider.`);
}

function soldesDe(o){ const S = {}; balance(o).forEach(b => { S[b.n] = cts(b.s); }); return S; }

  const R = { brut:0, amort:0, stock:0, clients:0, autresCre:0, dispo:0, capital:0, reserves:0, ran:0, res12:0, emprunts:0, fourn:0, fisc:0, autresDet:0 }, res67 = [];
  const dans = (n, L) => L.some(p => n.startsWith(p));
  Object.entries(S).forEach(([n, s]) => {
    if (n[0] === '6' || n[0] === '7') return res67.push(s);
    if (n.startsWith('21')) R.brut += s; else if (n.startsWith('28')) R.amort -= s; else if (n.startsWith('3')) R.stock += s;
    else if (n.startsWith('101')) R.capital -= s; else if (n.startsWith('106')) R.reserves -= s; else if (n.startsWith('11')) R.ran -= s; else if (n.startsWith('12')) R.res12 -= s; else if (n.startsWith('16')) R.emprunts -= s;
    else if (dans(n, ['512', '530'])) { if (s >= 0) R.dispo += s; else R.emprunts -= s; }
    else if (dans(n, ['411', '418'])) { if (s >= 0) R.clients += s; else R.autresDet -= s; }
    else if (dans(n, ['401', '404', '408'])) { if (s <= 0) R.fourn -= s; else R.autresCre += s; }
    else if (dans(n, ['421', '428', '431', '437', '438', '4421', '444', '4455', '4457', '44587', '447'])) { if (s <= 0) R.fisc -= s; else R.autresCre += s; }
    else { if (s >= 0) R.autresCre += s; else R.autresDet -= s; }

function enClair(l){

  if (c === '411000') return deb ? `${qui} te doit ${m}.` : `${qui} a payé ${m} : cette somme ne t’est plus due.`;
  if (c === '401000' || c === '404000') return deb ? `Tu ne dois plus ${m} à ${qui} (payé, ou remboursé par un avoir).` : `Tu dois ${m} à ${qui}.`;
  if (c.startsWith('70')) return deb ? `Ton chiffre d’affaires baisse de ${m}.` : `Ton chiffre d’affaires augmente de ${m} : ce que tu as gagné, hors taxes.`;
  if (c === '445740') return deb ? `Ces ${m} de TVA ne sont plus « en attente » : le client a payé.` : `${m} de TVA mis en attente : ils ne seront dus à l’État qu’au paiement du client.`;
  if (c === '445710') return l.cr ? `${m} de TVA collectée : tu la dois à l’État pour ce mois-ci.` : `${m} de TVA collectée passent dans la déclaration du mois.`;
  if (c === '445660' || c === '445620') return deb ? `${m} de TVA payée sur cet achat : l’État te la rend, elle diminue ta TVA à payer.` : `${m} de TVA récupérable passent dans la déclaration (ou sont repris par un avoir).`;
  if (c === '445510') return l.cr ? `${m} de TVA à payer à l’État le 19 novembre.` : `${m} de TVA payés à l’État.`;
  if (c === '445670') return deb ? `${m} de crédit de TVA, à reporter sur le mois suivant.` : `Le crédit de TVA du mois précédent est utilisé (${m}).`;
  if (c === '467100') return deb ? `${m} payés par carte : le prestataire de paiement les versera sur ton compte.` : `Le prestataire de cartes a versé ${m} de paiements.`;
  if (c === '511200') return deb ? `Un chèque de ${m} attend d’être déposé à la banque.` : `${m} de chèques déposés à la banque.`;
  if (c === '421000') return l.cr ? `${m} dus aux salariés (salaires nets, ou frais à leur rembourser).` : `${m} versés aux salariés.`;
  if (c === '431000') return l.cr ? `${m} dus à l’URSSAF, à payer le 15 du mois suivant.` : `${m} payés à l’URSSAF.`;
  if (c === '437000') return l.cr ? `${m} dus à la retraite complémentaire, à la prévoyance et à la mutuelle.` : `${m} payés aux caisses de retraite et de prévoyance.`;
  if (c === '442100') return l.cr ? `${m} d’impôt sur le revenu retenus sur les salaires : à reverser à l’État.` : `${m} d’impôt prélevé à la source reversés.`;
  if (c === '471000') return deb ? `${m} en attente d’explication (compte d’attente).` : `Le compte d’attente est soldé (${m}).`;
  if (c.startsWith('21')) return deb ? `${m} : un bien qui va durer entre au registre des immobilisations.` : `${m} : un bien sort du registre.`;
  if (c.startsWith('28')) return `${m} d’usure du bien (amortissement cumulé).`;
  if (c.startsWith('6')) return deb ? `Une dépense de ${m} (${libCpt(c).toLowerCase()}) : elle diminue ton bénéfice.` : `La dépense « ${libCpt(c).toLowerCase()} » diminue de ${m}.`;
  if (c.startsWith('7')) return deb ? `Un produit diminue de ${m}.` : `Un produit de ${m} (${libCpt(c).toLowerCase()}).`;
  return `${libCpt(c)} : ${deb ? 'débit' : 'crédit'} de ${m}.`;
}

    if (!c || c.closest('#barre')) return;
    if (c.closest('#calque')) return c.scrollIntoView({ block:'center', behavior:comp });
    /* la cible doit tomber entre la barre du haut (collante) et la bulle du guide, pas dessous */
    const r = c.getBoundingClientRect(), g = $('#guide'), haut = Math.max(0, $('#barre').getBoundingClientRect().bottom) + 10, bas = (g.hidden ? innerHeight : g.getBoundingClientRect().top) - 10;

    const place = bas - haut, y = scrollY + r.top - haut - (r.height < place ? (place - r.height) / 2 : 0);

  }, 30);

<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"></head><body>
<title>Comptabilité OP GESTION</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex,nofollow">
<script>
/* Avant la première image : le mode (jour, nuit, auto). Une seule couleur, le bleu de TEAM OP, de jour comme de nuit (Justin,
   10 novembre 2026 : « le mode jour et le mode nuit bleu, pas le reste »). En « auto », on suit le choix de la page
   qui héberge (data-theme) s'il existe, sinon celui de l'appareil. Le rangement de l'appareil peut manquer : on fait sans. */
(function(){ var R = document.documentElement, mode = 'auto'; if (!R.lang) R.lang = 'fr';   /* la langue : sans elle, les mots longs d'un tableau ne se coupent pas proprement sur téléphone */
  try { mode = localStorage.getItem('opc_mode') || 'auto'; } catch (e) {}
  window.OPC_APPARENCE = { mode: mode };
  window.opcAppliquer = function(){ var a = window.OPC_APPARENCE, th = R.getAttribute('data-theme');
    var nuit = a.mode === 'nuit' || (a.mode === 'auto' && (th ? th === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches));
    R.setAttribute('data-mode', nuit ? 'nuit' : 'jour'); };
  window.opcAppliquer();
  /* ouverte dans OP GESTION (dans un cadre), elle suit le réglage Jour / Nuit qu'OP GESTION lui écrit */
  try { addEventListener('message', function(e){ var m = e.data && e.data.opc_mode; if (m === 'jour' || m === 'nuit' || m === 'auto') { window.OPC_APPARENCE.mode = m; window.opcAppliquer(); if (window.opcRafraichir) window.opcRafraichir(); } }); } catch (e) {}
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', window.opcAppliquer); new MutationObserver(window.opcAppliquer).observe(R, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}
})();
</script>
<style>
/* Comptabilité d'OP GESTION — le bleu de TEAM OP (marine), jour / nuit / auto : design/THEME-REFERENCE.md et la
   coque du prototype OP GESTION. Ordinateur : menu à gauche, barre d'état en haut. Téléphone : la barre du bas d'OP GESTION, le tiroir
   par « Plus ». Verre sur les surfaces, pilules pour les boutons, chiffres alignés, numéros de comptes en chasse fixe. */
:root{
  --police:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",Roboto,"Noto Sans",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:22px; --r2:16px; --ressort:cubic-bezier(.32,.72,0,1); --menu:264px;
  color-scheme:light;
  --encre:#0b1426; --doux:#46526a; --faible:#5a6379;
  --surf:rgba(255,255,255,.58); --surf2:rgba(255,255,255,.86); --surf-in:rgba(11,20,38,.045); --survol:rgba(11,20,38,.06);
  --trait:rgba(11,20,38,.09); --trait2:rgba(11,20,38,.16);
  --ombre:0 1px 2px rgba(11,20,38,.05),0 10px 30px rgba(11,20,38,.08); --ombre-haute:0 24px 60px rgba(11,20,38,.22);
  --lien:#0a5fc2; --fill:#0b1426; --on-fill:#fff; --seg-cur:rgba(255,255,255,.95); --seg-ink:#0b1426;
  --vert:#196e34; --orange:#994900; --rouge:#b0263c; --bleu:#0a5cbc; --violet:#7d3c98; --ambre:#8a5300;
  --menu-fond:rgba(255,255,255,.4); --feuille:#f8f9fc; --voile:rgba(11,20,38,.32); --carte-fond:#ffffff; --bande:#eef2f9;
  --page:radial-gradient(120% 90% at 0% 0%,#dfe9ff 0%,rgba(223,233,255,0) 55%),radial-gradient(110% 80% at 100% 100%,#d9e6fb 0%,rgba(217,230,251,0) 60%),linear-gradient(160deg,#eef3fb,#f0f3f8);
  --tab-fond:rgba(255,255,255,.62); --tab-lise:rgba(255,255,255,.9); --tab-cur:rgba(255,255,255,.92); --tab-cur-ink:#0b1426; --tab-ink:#4a556b;
  --spot:#2f7bf0; --serie1:#0a5fc2; --serie2:#c25e00; --tuile:13%; --graph-fond:transparent; --graph-marge:0px; --graph-anneau:var(--carte-fond); --barre:var(--serie1);
  --c-gris:#636366; --c-bleu:#0a5fc2; --c-orange:#c25e00; --c-indigo:#4b48c9; --c-violet:#8e44ad; --c-vert:#1c7a3a; --c-sapin:#1f7a5c; --c-cyan:#0a7c8a; --c-rouge:#b0263c; --c-ambre:#8a5300; --c-ciel:#0a5fc2; --c-ardoise:#636366;
  /* les anciens noms, encore lus par quelques écrans du comptable */
  --ink:var(--encre); --mute:var(--doux); --accent:var(--serie1); --line:var(--trait); --line2:var(--trait2); --ok:var(--vert); --warn:var(--orange); --bad:var(--rouge); --f:var(--police);
  --warn-bg:color-mix(in srgb,var(--orange) 13%,transparent); --bad-bg:color-mix(in srgb,var(--rouge) 12%,transparent);
}
:root[data-mode="nuit"]{
  color-scheme:dark;
  --encre:#f0f3f8; --doux:#b8c1d1; --faible:#93a0b7;
  --surf:#1e2a42; --surf2:#25334f; --surf-in:rgba(255,255,255,.05); --survol:rgba(255,255,255,.07);
  --trait:rgba(255,255,255,.10); --trait2:rgba(255,255,255,.16);
  --ombre:0 1px 2px rgba(0,0,0,.25),0 12px 32px rgba(0,0,0,.28); --ombre-haute:0 24px 60px rgba(0,0,0,.55);
  --lien:#8fb4ff; --fill:#2c3d63; --on-fill:#f0f3f8; --seg-cur:rgba(255,255,255,.22); --seg-ink:#f0f3f8;
  --vert:#30d158; --orange:#ff9f0a; --rouge:#ff7d8e; --bleu:#6aabff; --violet:#cb90f5; --ambre:#ffd60a;
  --menu-fond:#15213a; --feuille:#15213a; --voile:rgba(2,5,12,.6); --carte-fond:#1e2a42; --bande:#0f1a30;
  --page:linear-gradient(112deg,rgba(255,255,255,0) 58%,rgba(255,255,255,.04) 58.2%),radial-gradient(120% 90% at 0% 0%,#1a2a4d 0%,rgba(26,42,77,0) 55%),radial-gradient(110% 80% at 100% 100%,#12234a 0%,rgba(18,35,74,0) 60%),linear-gradient(160deg,#0f1a30 0%,#070b16 100%);
  --tab-fond:rgba(52,59,74,.6); --tab-lise:rgba(255,255,255,.16); --tab-cur:rgba(34,59,110,.72); --tab-cur-ink:#f0f3f8; --tab-ink:#abb3c2;
  --spot:#6ea8ff; --serie1:#3987e6; --serie2:#d07a1a; --tuile:20%;
  --c-gris:#a2a2a8; --c-bleu:#4c9dff; --c-orange:#ff9f0a; --c-indigo:#9896f5; --c-violet:#cf7df5; --c-vert:#30d158; --c-sapin:#34c759; --c-cyan:#40c8e0; --c-rouge:#ff6b7f; --c-ambre:#ffd60a; --c-ciel:#64d2ff; --c-ardoise:#aeaeb2;
}
*{box-sizing:border-box}
html{background:var(--page) fixed;background-color:var(--bande);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--page) fixed;background-color:var(--bande);color:var(--encre);font-family:var(--police);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--bande)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lien);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
#prev:focus-visible{outline-offset:3px}
.contenu:focus,.contenu:focus-visible{outline:none}
h1{margin:0;font-size:34px;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
h2{margin:0;font-size:20px;line-height:1.25;text-wrap:balance}
h3{margin:0;font-size:16px}
p{margin:0}
.mute,.gris{color:var(--doux)}.faible{color:var(--faible)}.petit{font-size:14px}.mini{font-size:13px}
.n,.num{font-variant-numeric:tabular-nums}.mono{font-family:var(--mono);font-size:.92em}
[hidden]{display:none!important}
.seul-tel{display:none!important}
.seul-etroit{display:none!important}
.seul-tiroir{display:none}
.cache-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ─── la tuile d'icône d'une rubrique : sa couleur de famille, en voile ─── */
.ic{width:30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;flex:none;background:color-mix(in srgb,var(--c,var(--lien)) var(--tuile),transparent);color:var(--c,var(--lien))}
.ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.g{width:44px;height:44px;border-radius:13px}.ic.g svg{width:24px;height:24px}
.ic.p{width:24px;height:24px;border-radius:7px}.ic.p svg{width:14px;height:14px}
.c-gris{--c:var(--c-gris)}.c-bleu{--c:var(--c-bleu)}.c-orange{--c:var(--c-orange)}.c-indigo{--c:var(--c-indigo)}.c-violet{--c:var(--c-violet)}.c-vert{--c:var(--c-vert)}.c-sapin{--c:var(--c-sapin)}.c-cyan{--c:var(--c-cyan)}.c-rouge{--c:var(--c-rouge)}.c-ambre{--c:var(--c-ambre)}.c-ciel{--c:var(--c-ciel)}.c-ardoise{--c:var(--c-ardoise)}

/* ─── la charpente ─── */
.app{display:grid;grid-template-columns:var(--menu) minmax(0,1fr);min-height:100vh}
.menu{position:sticky;top:0;height:100vh;height:100dvh;overflow:hidden;padding:18px 12px 14px;border-right:1px solid var(--trait);display:flex;flex-direction:column;gap:2px;background:var(--menu-fond);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%)}
.logo{display:flex;align-items:center;gap:10px;padding:2px 8px 14px;min-width:0}
.logo i{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#12306b);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:13px;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25);flex:none}
.logo span{min-width:0;display:flex;flex-direction:column}
.logo b{font-size:16px;letter-spacing:.01em;white-space:nowrap}.logo small{color:var(--doux);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu .grp{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faible);padding:12px 12px 4px}
.menu a{display:flex;align-items:center;gap:11px;min-height:44px;padding:0 10px;border-radius:12px;color:var(--encre);text-decoration:none;font-weight:500;font-size:15px}
.menu a:hover{background:var(--survol)}
.menu a[aria-current="page"]{background:var(--surf2);font-weight:650;box-shadow:var(--ombre)}
.menu a>span:not(.ic):not(.nb){flex:1;min-width:0}
.nb{margin-left:auto;min-width:22px;height:21px;padding:0 7px;border-radius:999px;background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange);font-size:12px;font-weight:700;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.nb.ok{background:color-mix(in srgb,var(--vert) 15%,transparent);color:var(--vert)}
.menu-liste{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin:0 -6px;padding:0 6px 10px;overscroll-behavior:contain}
.menu .pied{flex:none;padding:8px 0 0;border-top:1px solid var(--trait);display:flex;flex-direction:column;gap:8px}
/* les réglages : un bouton toujours visible au pied du menu (la liste des rubriques défile au-dessus) ; ils s'ouvrent dans une fenêtre */
.menu-regl{display:flex;align-items:center;gap:11px;min-height:52px;width:100%;padding:6px 10px;border:0;border-radius:12px;background:none;color:var(--encre);text-align:left}
.menu-regl:hover{background:var(--survol)}
.menu-regl>span:not(.ic){display:flex;flex-direction:column;min-width:0;flex:1}
.menu-regl b{font-size:15px;font-weight:600}.menu-regl small{font-size:12px;color:var(--doux);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reglages.col{grid-template-columns:minmax(0,1fr)!important;gap:14px}.reglages.col .mode-seg button{min-height:42px;font-size:14.5px}
.regl{display:flex;flex-direction:column;gap:5px}
.regl>span{font-size:12px;font-weight:600;color:var(--faible);padding-left:4px}
.mode-seg{display:flex;padding:3px;border-radius:12px;background:var(--surf-in);border:1px solid var(--trait)}
.mode-seg button{flex:1;min-height:36px;border:0;border-radius:9px;background:none;color:var(--doux);font-size:13px;font-weight:600;padding:0 6px;white-space:nowrap}
.mode-seg button[aria-pressed="true"]{background:var(--seg-cur);color:var(--seg-ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.bandeau-proto{padding:8px 10px;border-radius:14px;background:color-mix(in srgb,var(--orange) 10%,transparent);border:1px solid color-mix(in srgb,var(--orange) 30%,transparent);color:var(--encre);font-size:13px}
.bandeau-proto b{color:var(--orange)}
.nuit-note{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px;border-color:color-mix(in srgb,var(--orange) 45%,transparent)}
.nuit-note .lien{flex:none;min-height:44px}
.centre{min-width:0;display:flex;flex-direction:column}
.barre{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;min-height:60px;padding:9px max(28px,env(safe-area-inset-right,0px)) 9px max(28px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--bande) 78%,transparent);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid var(--trait)}
.barre .ouvrir-menu,.barre .logo{display:none}
.barre .droite{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 12px;border-radius:999px;background:var(--surf);border:1px solid var(--trait);font-size:13.5px;font-weight:600;white-space:nowrap;color:var(--encre)}
button.chip:hover{border-color:var(--trait2)}
.chip .pt{width:8px;height:8px;border-radius:50%;background:var(--vert);flex:none}
.chip.vivant .pt{box-shadow:0 0 0 0 color-mix(in srgb,var(--vert) 60%,transparent);animation:pouls 1.8s ease-out infinite}
.chip.attente .pt{background:var(--orange)}
.chip .h{font-variant-numeric:tabular-nums;color:var(--doux);font-weight:600}
@keyframes pouls{70%{box-shadow:0 0 0 7px color-mix(in srgb,var(--vert) 0%,transparent)}100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--vert) 0%,transparent)}}
.contenu{padding-block:22px 56px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;width:100%}
.barre-bas{display:none}
.tete{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap}
.tete>div:first-child{flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:4px}
.tete p{max-width:78ch}
.surtitre{font-size:13px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--lien)}
.tete .actions,.actions{display:flex;gap:8px;flex-wrap:wrap}

/* ─── les pièces de base ─── */
.carte{background:var(--surf);border:1px solid var(--trait);border-radius:var(--r);padding:18px 20px;box-shadow:var(--ombre);min-width:0}
.carte>h2{margin-bottom:12px}
.carte>h3{margin:0 0 12px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--doux);font-weight:650}
.grille{display:grid;gap:16px;align-items:start}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,max(400px,calc(50% - 8px))),1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
@media (min-width:1001px){.kpis.six{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kpi{background:var(--surf);border:1px solid var(--trait);border-radius:var(--r2);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:76px;box-shadow:var(--ombre);color:var(--encre);min-width:0}
.kpi b{font-size:26px;letter-spacing:-.01em;line-height:1.2;overflow-wrap:anywhere}
.kpi>span{color:var(--doux);font-size:14px}.kpi small{color:var(--doux);font-size:13px}
.kpi .k-t{display:flex;align-items:center;gap:9px;margin-bottom:4px;color:var(--doux);font-size:14px;font-weight:550}
button.kpi{transition:transform .2s var(--ressort),border-color .2s}
button.kpi:hover{border-color:var(--trait2)}button.kpi:active{transform:scale(.98)}
.btn{min-height:46px;padding:0 18px;border:0;border-radius:999px;background:var(--fill);color:var(--on-fill);font-weight:650;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap;transition:transform .2s var(--ressort),opacity .2s}
.btn:active{transform:scale(.97);opacity:.9}
:root[data-mode="nuit"] .btn:not(.gris):not(.danger){border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.btn.gris{background:var(--surf2);color:var(--encre);border:1px solid var(--trait)}
.btn.gris:hover{border-color:var(--trait2)}
.btn.danger{background:none;color:var(--rouge);border:1px solid color-mix(in srgb,var(--rouge) 40%,transparent)}
.btn.petit{min-height:40px;padding:0 14px;font-size:14px}
.btn.large{min-height:54px;font-size:17px;padding:0 24px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.42;cursor:not-allowed}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lien{background:none;border:0;padding:0;color:var(--lien);font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:4px;min-height:32px}
.lien:hover{text-decoration:underline;text-underline-offset:3px}
.st{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:650;white-space:nowrap;background:color-mix(in srgb,var(--c,var(--doux)) 15%,transparent);color:var(--c,var(--doux));text-decoration:none}
.st.ok{--c:var(--vert)}.st.warn{--c:var(--orange)}.st.bad{--c:var(--rouge)}.st.info{--c:var(--bleu)}.st.essai{--c:var(--violet)}
.jn{display:inline-grid;place-items:center;min-width:30px;height:22px;padding:0 6px;border-radius:6px;background:var(--surf-in);border:1px solid var(--trait);font:700 11.5px/1 var(--mono);letter-spacing:.02em}
.let{font:700 12px/1 var(--mono);color:var(--vert)}
.seg{display:inline-flex;flex-wrap:wrap;padding:3px;border-radius:13px;background:var(--surf-in);border:1px solid var(--trait);gap:2px}
.seg button{min-height:38px;padding:0 14px;border:0;border-radius:10px;background:none;color:var(--doux);font-weight:550;font-size:14.5px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--seg-cur);color:var(--seg-ink);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.outils{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.champ{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--doux);font-weight:550;min-width:0}
.saisie,.champ input,.champ select,.champ textarea{min-height:46px;border:1px solid var(--trait2);border-radius:12px;background:var(--surf2);padding:8px 12px;font-size:16px;font-weight:400;color:var(--encre);width:100%}
.champ textarea{min-height:84px;line-height:1.45}
.case{display:flex;gap:10px;align-items:center;font-size:15px;min-height:44px}
.case input{width:20px;height:20px;accent-color:var(--lien);flex:none}
.info,.alerte,.erreur,.bon{padding:13px 15px;border-radius:16px;font-size:15px;border:1px solid}
.info{background:color-mix(in srgb,var(--bleu) 9%,transparent);border-color:color-mix(in srgb,var(--bleu) 28%,transparent)}
.alerte{background:color-mix(in srgb,var(--orange) 11%,transparent);border-color:color-mix(in srgb,var(--orange) 32%,transparent)}
.erreur{background:color-mix(in srgb,var(--rouge) 11%,transparent);border-color:color-mix(in srgb,var(--rouge) 35%,transparent)}
.bon{background:color-mix(in srgb,var(--vert) 11%,transparent);border-color:color-mix(in srgb,var(--vert) 32%,transparent)}
.st.info{padding:3px 10px;border:0;border-radius:999px;font-size:13px;background:color-mix(in srgb,var(--bleu) 15%,transparent)}
.vide{padding:28px;text-align:center;color:var(--doux)}
.liste{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px}

/* ─── les tableaux comptables ─── */
.defile{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--trait);border-radius:var(--r2);background:var(--surf);box-shadow:var(--ombre)}
.carte .defile,.panneau .carte .defile{border:0!important;border-radius:0;background:none;box-shadow:none}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
.t th{text-align:left;font-size:12.5px;font-weight:600;color:var(--doux);padding:11px 12px;border-bottom:1px solid var(--trait);white-space:nowrap}
.t td{padding:11px 12px;border-bottom:1px solid var(--trait);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t td.n,.t th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.t td.c{white-space:nowrap}
.t tbody tr.clic{cursor:pointer}.t tbody tr.clic:hover td,.t tbody tr.clic:focus-visible td{background:var(--survol)}.t tbody tr.clic:focus-visible{outline-offset:-3px}
.t tr.total td{font-weight:700;background:var(--surf-in);border-top:1px solid var(--trait2)}
.t tr.sous td{background:var(--surf-in);font-weight:650}
.t tr.essai td{background:color-mix(in srgb,var(--violet) 8%,transparent)}
.t tr.brouil td:first-child{box-shadow:inset 3px 0 0 var(--orange)}
.t input.saisie{min-height:38px;font-size:14.5px;padding:0 8px;border-radius:9px}
.t .compte{font-family:var(--mono);font-size:13px;white-space:nowrap}
.t td .sec{display:block;font-size:13px;color:var(--doux)}
.t td.ret{padding-left:26px;color:var(--doux)}

/* ─── le panneau de détail (une feuille sur téléphone) ─── */
.voile{position:fixed;inset:0;background:var(--voile);z-index:40;display:flex;justify-content:flex-end;animation:fondu .2s ease both}
.panneau{width:min(760px,100%);height:100%;overflow-y:auto;background:var(--feuille);border-left:1px solid var(--trait2);box-shadow:var(--ombre-haute);padding:20px max(22px,env(safe-area-inset-right,0px)) 40px 22px;display:flex;flex-direction:column;gap:14px;animation:entreD .3s var(--ressort) both}
.panneau.large{width:min(1040px,100%)}
.panneau>*{flex-shrink:0}
.fec-apercu{max-height:180px;overflow:auto;margin:6px 0 0;padding:10px 12px;border:1px solid var(--trait2);border-radius:12px;background:var(--surf2);font-size:12px;line-height:1.5;white-space:pre}
.panneau .carte{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--surf2);box-shadow:none}
.panneau .haut{display:flex;gap:10px;align-items:flex-start}
.panneau .haut>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.fermer{width:44px;height:44px;border-radius:50%;border:0;background:var(--surf-in);font-size:16px;flex:none;display:grid;place-items:center;color:var(--encre)}
.fermer:hover{background:var(--survol)}
@keyframes fondu{from{opacity:0}}@keyframes entreD{from{transform:translateX(40px);opacity:0}}@keyframes entreB{from{transform:translateY(60px)}}
/* un message éphémère est du texte : il ne prend jamais un toucher ; pendant un test ou la démo, il monte en haut */
.toast{position:fixed;left:16px;right:16px;margin:0 auto;width:max-content;bottom:calc(26px + env(safe-area-inset-bottom,0px));z-index:90;max-width:min(600px,calc(100vw - 32px));padding:12px 18px;border-radius:18px;background:var(--feuille);color:var(--encre);border:1px solid var(--trait2);box-shadow:var(--ombre-haute);font-size:15px;pointer-events:none}
body.guide-on .toast{bottom:auto;top:calc(14px + env(safe-area-inset-top,0px))}

/* ─── la pièce justificative (un document : toujours sur papier blanc) ─── */
.doc{background:#fff;color:#1b2330;border:1px solid #d7dce4;border-radius:12px;padding:18px 20px;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.doc .dtete{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid #e3e7ee;padding-bottom:10px;margin-bottom:10px}
.doc b{color:#111}.doc table{width:100%;border-collapse:collapse;margin-top:8px}.doc td,.doc th{padding:5px 4px;border-bottom:1px solid #eef1f5;text-align:left}.doc .n{text-align:right}
.doc .tot{margin-left:auto;width:min(260px,100%);margin-top:8px}.doc .tot div{display:flex;justify-content:space-between;padding:2px 0}.doc .tot div:last-child{font-weight:700;border-top:1px solid #d7dce4;padding-top:5px}
.doc.bul{overflow-x:auto}
.doc.bul table{font-size:12.5px;min-width:520px}
.doc.bul .bul-large{overflow-x:auto;-webkit-overflow-scrolling:touch}.doc.bul .bul-note{font-size:11.5px;color:#5a6578;margin:10px 0 0}
.doc.bul .bul-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:10px 0 4px;padding:10px 12px;border:1px solid #e3e7ee;border-radius:8px;background:#f7f9fb;text-align:left;font-weight:400}
.doc.bul td.n,.doc.bul th.n{white-space:nowrap}
.doc.bul td.rub{font-weight:700;background:#f2f5f9;color:#33405a;font-size:12px}
.doc.bul tr.fort td{font-weight:700;border-top:1px solid #cfd6e0}
.doc.bul tr.net td{font-weight:800;font-size:15px;background:#eaf2fd;color:#0a3f80}
.doc.bul .bul-pied{margin-top:10px;font-size:11.5px;color:#5a6578}

/* ─── l'équilibre d'une écriture, les étapes, le bilan ─── */
.balance-ecr{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:14.5px}
.balance-ecr .ecart{font-weight:700}.balance-ecr .ecart.ok{color:var(--vert)}.balance-ecr .ecart.ko{color:var(--rouge)}
.etapes{display:flex;flex-direction:column}
.etape{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--trait);flex-wrap:wrap}
.etape:last-child{border-bottom:0}
.etape .rond{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:13px;font-weight:800;background:var(--surf-in);color:var(--doux);border:1px solid var(--trait)}
.etape.ok .rond{background:color-mix(in srgb,var(--vert) 16%,transparent);color:var(--vert);border-color:transparent}
.etape .txt{flex:1 1 180px;min-width:0;display:flex;flex-direction:column;gap:1px}
.etape.ok .txt b{color:var(--doux);font-weight:600}
.bilan{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,max(400px,calc(50% - 8px))),1fr));gap:16px}
.graph svg{width:100%;height:auto;display:block}
.graph text{fill:var(--doux);font-size:11px;font-family:var(--police)}
.legende{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:13.5px;color:var(--doux);align-items:center}
.legende i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* ─── l'automatique : synchronisation, questions, fil, règles ─── */
.synchro{display:flex;gap:12px 14px;align-items:center;flex-wrap:wrap}
.synchro .s-c{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:3px}
.synchro.fait{border-color:color-mix(in srgb,var(--vert) 32%,var(--trait))}
.fil{display:flex;flex-direction:column}
.fil-l{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--trait)}.fil-l:first-child{padding-top:2px}.fil-l:last-child{border-bottom:0;padding-bottom:2px}
.fil-c{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.fil-t{display:flex;gap:2px 12px;flex-wrap:wrap;align-items:baseline;justify-content:space-between}
.fil-t b{min-width:0;overflow-wrap:anywhere}
.fil-c .lien,.ev-c .lien,.t .lien,.cpt-c .lien{align-self:flex-start;font-size:14px}
.via{display:inline-flex;gap:6px;align-items:center}.via svg.i{width:15px;height:15px}
.vue-tel{display:none}
.av{display:flex;gap:14px;align-items:flex-start}
.av-c{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.av-form{display:flex;flex-direction:column;gap:8px;max-width:560px}
.av-choix{display:flex;gap:8px;flex-wrap:wrap}
.av-mini{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--trait)}.av-mini:last-of-type{border-bottom:0}
.av-mini{flex-wrap:wrap}.av-mini .av-t{flex:1 1 170px;min-width:0;font-size:15px}
.av-mini.prevu{flex-wrap:wrap}.av-mini.prevu .av-t{flex:1 1 240px;display:flex;flex-direction:column;gap:2px}.av-b{display:flex;gap:6px;flex-wrap:wrap}
.clair{display:flex;flex-direction:column;gap:8px}
.clair-l{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;padding:11px 13px;border:1px solid var(--trait);border-radius:14px;background:var(--surf2)}
.clair-l .cl-c{font-family:var(--mono);font-size:13px;color:var(--doux)}.clair-l .cl-n{font-weight:650;min-width:0}.clair-l .cl-m{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px;color:var(--doux)}
.clair-l p{grid-column:1/-1;font-size:15px}
.cl-mini{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:14px}
.cl-mini li{display:flex;gap:8px}.cl-mini .mono{color:var(--doux);flex:none;font-size:12px;padding-top:3px}
.chaine{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chaine span{padding:7px 12px;border-radius:999px;background:color-mix(in srgb,var(--lien) 11%,transparent);color:var(--lien);font-weight:650;font-size:14px}
.chaine i{color:var(--faible);font-style:normal}
.glossaire dl{display:grid;grid-template-columns:minmax(150px,230px) minmax(0,1fr);gap:9px 18px;margin:0}
.glossaire dt{font-weight:700}.glossaire dd{margin:0;color:var(--doux)}
.tva-calc{display:flex;flex-direction:column;gap:6px;margin:4px 0 10px;max-width:540px}
.tva-calc div{display:flex;justify-content:space-between;gap:12px}.tva-calc .tot{border-top:1px solid var(--trait2);padding-top:7px;font-weight:700;font-size:17px}
.tva-calc b{font-variant-numeric:tabular-nums;white-space:nowrap}
.replie>summary{display:flex;gap:4px 12px;align-items:baseline;flex-wrap:wrap;cursor:pointer;min-height:36px;list-style:none}
.replie>summary::-webkit-details-marker{display:none}
.replie>summary::before{content:"›";font-weight:700;color:var(--doux);transition:transform .2s;display:inline-block}
.replie[open]>summary::before{transform:rotate(90deg)}
.replie-c{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.barres{display:flex;flex-direction:column;gap:10px}
.barre-l{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:14.5px}
.barre-l i{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surf-in);position:relative;overflow:hidden}
.barre-l i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--p);background:var(--barre);border-radius:3px}
.barre-prog{height:8px;border-radius:4px;background:var(--surf-in);overflow:hidden;margin-top:10px}.barre-prog i{display:block;height:100%;background:var(--vert);border-radius:4px;transition:width .4s}
.essais{display:flex;flex-direction:column;gap:8px}
.essai-l{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surf2);border:1px solid var(--trait);flex-wrap:wrap}
.essai-l .rond{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;font-size:13px;background:var(--surf-in);color:var(--doux)}
.essai-l.ok .rond{background:color-mix(in srgb,var(--vert) 16%,transparent);color:var(--vert)}
.essai-l .txt{flex:1 1 280px;min-width:0}

/* ─── l'accueil : le choix d'entrée, les réglages ─── */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px 28px;align-items:center;padding:24px 26px}
.hero h2{font-size:26px;line-height:1.2}
.hero .h-t{display:flex;flex-direction:column;gap:10px;min-width:0}
.hero .h-a{display:flex;flex-direction:column;gap:10px;min-width:0}
.choix{display:flex;gap:14px;align-items:center;text-align:left;width:100%;min-height:68px;padding:12px 16px;border-radius:18px;border:1px solid var(--trait);background:var(--surf2);color:var(--encre);transition:transform .2s var(--ressort),border-color .2s}
.choix:hover{border-color:var(--trait2)}.choix:active{transform:scale(.98)}
.choix>span:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column}
.choix small{color:var(--doux);font-size:13.5px}
.choix.premier{background:var(--fill);color:var(--on-fill);border-color:transparent}
.choix.premier small{color:inherit;opacity:.78}
.choix.premier .ic{background:rgba(255,255,255,.16);color:inherit}
:root[data-mode="nuit"] .choix.premier{border:1px solid rgba(255,255,255,.16)}
.reglages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 16px}
.reglages .regl>span{font-size:13px}

/* ─── la journée en direct : à gauche OP GESTION, à droite la comptabilité ─── */
.jr-tete{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
.jr-tete .s-c{min-width:0;display:flex;flex-direction:column;gap:3px}
.jr{display:flex;flex-direction:column}
.jr-e{display:grid;grid-template-columns:64px minmax(0,1fr) 26px minmax(0,1fr);gap:0 12px;align-items:stretch;padding:10px 0;position:relative}
.jr-h{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--doux);padding-top:13px;text-align:right}
.jr-e.fait .jr-h{color:var(--encre)}
.jr-f{display:flex;align-items:center;justify-content:center;color:var(--faible)}
.jr-f svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.jr-e.fait .jr-f{color:var(--vert)}
.opg-c,.cpt-c{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:16px;border:1px solid var(--trait);background:var(--surf2);min-width:0}
.opg-c>div,.cpt-c>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.opg-c .qui{font-size:12.5px;font-weight:650;color:var(--doux);letter-spacing:.02em;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cpt-c{background:var(--surf-in);border-style:dashed}
.jr-e.fait .cpt-c{background:color-mix(in srgb,var(--vert) 9%,transparent);border-style:solid;border-color:color-mix(in srgb,var(--vert) 30%,transparent)}
.jr-e.attente .cpt-c{background:color-mix(in srgb,var(--orange) 9%,transparent);border-style:solid;border-color:color-mix(in srgb,var(--orange) 30%,transparent)}
.jr-e.neuf .opg-c,.jr-e.neuf .cpt-c{animation:arrive .5s var(--ressort) both}
.jr-e.neuf .cpt-c{animation-delay:.18s}
@keyframes arrive{from{opacity:0;transform:translateY(8px) scale(.985)}}
.av2{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11.5px;font-weight:800;color:#fff;background:var(--tc,#5b6b8c);text-shadow:0 1px 1px rgba(0,0,0,.25)}

/* ─── la prévision de trésorerie ─── */
.prev{position:relative;background:var(--graph-fond);border-radius:14px;padding:var(--graph-marge)}
.prev svg{width:100%;height:auto;display:block;overflow:visible;touch-action:pan-y}
.prev text{fill:var(--doux);font-size:11.5px;font-family:var(--police);font-variant-numeric:tabular-nums}
.prev .etiq{fill:var(--encre);font-weight:700;font-size:12.5px}
.prev-bulle{position:absolute;top:0;left:0;pointer-events:none;padding:8px 11px;border-radius:12px;background:var(--feuille);border:1px solid var(--trait2);box-shadow:var(--ombre-haute);font-size:13.5px;display:flex;flex-direction:column;gap:1px;min-width:150px;z-index:3}
.prev-bulle b{font-size:15px;font-variant-numeric:tabular-nums}

/* ─── le guide des tests et la démo : l'ombre, la lumière sur la cible, la bulle ─── */
#spot{position:fixed;z-index:70;border-radius:14px;pointer-events:none;box-shadow:0 0 0 3px var(--spot),0 0 22px 4px color-mix(in srgb,var(--spot) 55%,transparent);animation:spot 1.6s ease-in-out infinite}
#spot.glisse{transition:left .25s ease,top .25s ease,width .25s ease,height .25s ease}
#spot.ombre{box-shadow:0 0 0 9999px rgba(6,10,18,.46),0 0 0 3px var(--spot),0 0 22px 4px color-mix(in srgb,var(--spot) 60%,transparent)}
@keyframes spot{50%{outline:3px solid color-mix(in srgb,var(--spot) 35%,transparent);outline-offset:3px}}
.guide{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:min(430px,calc(100vw - 32px));max-height:min(66vh,600px);overflow:hidden;z-index:80;
  background:var(--feuille);color:var(--encre);border:1px solid var(--trait2);border-radius:20px;box-shadow:var(--ombre-haute);padding:15px 17px;display:flex;flex-direction:column;gap:10px;animation:monte .28s var(--ressort) both}
@keyframes monte{from{transform:translateY(14px);opacity:0}}
.g-tete{display:flex;gap:10px;align-items:flex-start}.g-tete>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.g-n{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--lien)}
.guide .fermer{width:38px;height:38px;font-size:14px}.guide .g-voix{font-size:15px}
/* très petit téléphone : le bouton de la voix ne prend aucune place dans l'en-tête de la bulle (il rétrécissait le titre, et le texte se coupait) ; il se pose au bout de la petite ligne du haut, avec une zone de toucher de 44 px */
@media (max-width:380px){.guide .g-tete{position:relative}.guide .g-voix{position:absolute;right:48px;top:-13px;width:44px;height:44px;background:none;font-size:14px;display:grid;place-items:start end;padding:11px 2px 0 0}}
.g-prog{display:flex;gap:4px}.g-prog i{flex:1;height:4px;border-radius:2px;background:var(--surf-in)}.g-prog i.ok{background:var(--vert)}.g-prog i.cur{background:var(--spot)}
/* la bulle a une hauteur bornée : c'est son TEXTE qui défile, jamais ses boutons (sur un petit téléphone, un texte long passait PAR-DESSUS « Test suivant », qui ne se touchait plus) */
.guide>*{flex:none}.guide>.g-txt,.guide>.g-fin{flex:0 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.g-txt{font-size:15.5px}
.guide>.g-txt.suite,.guide>.g-fin.suite{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 38px),rgba(0,0,0,.12));mask-image:linear-gradient(to bottom,#000 calc(100% - 38px),rgba(0,0,0,.12))}
.guide>.g-txt:focus-visible,.guide>.g-fin:focus-visible{outline-offset:-2px}
.guide:has(>.g-fin){max-height:min(84vh,calc(100vh - 100px))}
.g-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* les trois boutons de la démo tiennent sur une rangée, en pause aussi (« Reprendre ») : la bulle fait la largeur de l'écran moins 16 px sur téléphone */
@media (max-width:415px){.g-mot-v{display:none}}
@media (max-width:365px){.g-mot-p{display:none}}
.g-fin{display:flex;flex-direction:column;gap:6px;font-size:15px}.g-ok{color:var(--vert);font-size:16px}
.g-temps{height:3px;border-radius:2px;background:var(--surf-in);overflow:hidden}
.g-temps i{display:block;height:100%;width:0;background:var(--spot);border-radius:2px}
.g-lien{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.g-lien .opg-c,.g-lien .cpt-c{padding:9px 11px;border-radius:13px;font-size:14px}
.g-lien .fl{justify-self:center;color:var(--faible);font-size:12.5px;font-weight:650;display:flex;gap:6px;align-items:center}
body.guide-on .contenu{padding-bottom:calc(var(--guide-h,170px) + 48px)}
body.guide-on .panneau{padding-bottom:calc(var(--guide-h,170px) + 48px)}

/* ─── la barre du bas d'OP GESTION (téléphone) ─── */
.opg-barre{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:6px;border-radius:34px;background:var(--tab-fond);border:1px solid var(--tab-lise);box-shadow:0 24px 56px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.32);-webkit-backdrop-filter:blur(40px) saturate(2.2) brightness(1.06);backdrop-filter:blur(40px) saturate(2.2) brightness(1.06)}

<script>
/* ══ LE MOTEUR COMPTABLE — partie double, journaux, lettrage, TVA, immobilisations, clôtures ══
   Une écriture = des lignes au débit et au crédit qui s'équilibrent. Tant qu'elle est au BROUILLARD, on la corrige ou on la
   supprime ; une fois VALIDÉE, elle reçoit son numéro définitif dans son journal et ne se modifie plus : on la contrepasse
   (principe d'intangibilité, PCG art. 420-5 — à faire confirmer). Une période CLÔTURÉE ne reçoit plus aucune écriture.
   Tout est calculé en centimes pour qu'aucune somme ne dérive. Données fictives (Clim Services 17, l'entreprise du prototype
   OP GESTION) : dix mois d'activité, de janvier au 31 octobre 2026. */
const AUJ = '2026-10-31';
const EXO = { debut:'2026-01-01', fin:'2026-12-31', annee:2026, prec:'2025' };
const DOSSIER = { nom:'Clim Services 17', forme:'SARL au capital de 10 000 €', siren:'123456789', siret:'123 456 789 00012', adr:'4 rue du Port, 17000 La Rochelle',
  ape:'43.22B · Travaux d’installation d’équipements thermiques et de climatisation', cab:'Cabinet Atlantique Conseil', cabQui:'Claire Moreau', moi:'Julie Petit',
  tva:'Régime réel normal · déclaration mensuelle (CA3)', exig:'TVA sur les encaissements (prestations de services)', is:'Impôt sur les sociétés' };
const r2 = x => Math.round((+x || 0) * 100) / 100;
const cts = x => Math.round((+x || 0) * 100);
const eur = (n, z) => (n === 0 && z ? '—' : (n < 0 ? '−' : '') + Math.abs(n).toLocaleString('fr-FR', { minimumFractionDigits:2, maximumFractionDigits:2 }) + '\u00a0€');
const nb = n => n.toLocaleString('fr-FR', { minimumFractionDigits:2, maximumFractionDigits:2 });
const dObj = d => new Date(d + 'T12:00:00');
const iso = x => x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
const ajoute = (d, n) => { const x = dObj(d); x.setDate(x.getDate() + n); return iso(x); };
const finMois = ym => iso(new Date(+ym.slice(0, 4), +ym.slice(5, 7), 0, 12));

function refusEcriture(e){

function codeSuivant(aux){ const n = LET_SEQ[aux] = (LET_SEQ[aux] || 0) + 1; let s = '', k = n; while (k > 0) { k--; s = String.fromCharCode(65 + k % 26) + s; k = Math.floor(k / 26); } return s; }

/* ─── les immobilisations : amortissement linéaire, au prorata du temps (année de 360 jours) ─── */
const DUREES = { '215400':5, '218200':5, '218300':3 };

/* ─── la TVA du mois : ce qui a été encaissé (collectée) et ce qui se déduit, à partir des comptes ─── */

    else if (dans(n, ['401', '404', '408'])) { if (s <= 0) R.fourn -= s; else R.autresCre += s; }

/* ─── « en clair » : chaque ligne d'écriture dite avec des mots de patron ─── */
function enClair(l){
  const c = l.c, deb = l.d > 0, m = eur(deb ? l.d : l.cr), qui = l.aux ? nomTiers(l.aux) : '';
  if (c === '512000') return deb ? `${m} arrivent sur ton compte en banque.` : `${m} sortent de ton compte en banque.`;
  if (c === '530000') return deb ? `${m} entrent dans la caisse.` : `${m} sortent de la caisse.`;
  if (c === '411000') { const pl = /^M\. et Mme /.test(qui); return deb ? `${qui} ${pl ? 'te doivent' : 'te doit'} ${m}.` : `${qui} ${pl ? 'ont' : 'a'} payé ${m} : cette somme ne t’est plus due.`; }
  if (c === '401000' || c === '404000') return deb ? `Tu ne dois plus ${m} à ${qui} (payé, ou remboursé par un avoir).` : `Tu dois ${m} à ${qui}.`;
  if (c.startsWith('70')) return deb ? `Ton chiffre d’affaires baisse de ${m}.` : `Ton chiffre d’affaires augmente de ${m} : ce que tu as gagné, hors taxes.`;
  if (c === '445740') return deb ? `Ces ${m} de TVA ne sont plus « en attente » : le client a payé.` : `${m} de TVA mis en attente : ils ne seront dus à l’État qu’au paiement du client.`;
  if (c === '445710') return l.cr ? `${m} de TVA collectée : tu la dois à l’État pour ce mois-ci.` : `${m} de TVA collectée passent dans la déclaration du mois.`;
  if (c === '445668') return deb ? `${m} de TVA sur cette prestation : tu ne la récupères qu’une fois la facture payée. En attendant, elle patiente ici.` : `Ces ${m} de TVA n’attendent plus : la facture est payée.`;
  if (c === '445660' || c === '445620') return deb ? `${m} de TVA payée sur cet achat : l’État te la rend, elle diminue ta TVA à payer.` : `${m} de TVA récupérable passent dans la déclaration (ou sont repris par un avoir).`;
  if (c === '445510') return l.cr ? `${m} de TVA à payer à l’État, prélevés le 23 novembre.` : `${m} de TVA payés à l’État.`;
  if (c === '445670') return deb ? `${m} de crédit de TVA, à reporter sur le mois suivant.` : `Le crédit de TVA du mois précédent est utilisé (${m}).`;
  if (c === '467100') return deb ? `${m} payés par carte : le prestataire de paiement les versera sur ton compte.` : `Le prestataire de cartes a versé ${m} de paiements.`;
  if (c === '511200') return deb ? `Un chèque de ${m} attend d’être déposé à la banque.` : `${m} de chèques déposés à la banque.`;
  if (c === '421000') return l.cr ? `${m} dus aux salariés (salaires nets, ou frais à leur rembourser).` : `${m} versés aux salariés.`;
  if (c === '431000') return l.cr ? `${m} dus à l’URSSAF, à payer le 15 du mois suivant.` : `${m} payés à l’URSSAF.`;
  if (c === '437000') return l.cr ? `${m} dus à la retraite complémentaire, à la prévoyance, à la mutuelle et aux caisses du bâtiment.` : `${m} payés aux caisses de retraite, de prévoyance et du bâtiment.`;
  if (c === '442100') return l.cr ? `${m} d’impôt sur le revenu retenus sur les salaires : à reverser à l’État.` : `${m} d’impôt prélevé à la source reversés.`;
  if (c === '471000') return deb ? `${m} en attente d’explication (compte d’attente).` : `Le compte d’attente est soldé (${m}).`;
  if (c.startsWith('21')) return deb ? `${m} : un bien qui va durer entre au registre des immobilisations.` : `${m} : un bien sort du registre.`;
  if (c.startsWith('28')) return `${m} d’usure du bien (amortissement cumulé).`;
  if (c.startsWith('6')) return deb ? `Une dépense de ${m} (${libCpt(c).toLowerCase()}) : elle diminue ton bénéfice.` : `La dépense « ${libCpt(c).toLowerCase()} » diminue de ${m}.`;
  if (c.startsWith('7')) return deb ? `Un produit diminue de ${m}.` : `Un produit de ${m} (${libCpt(c).toLowerCase()}).`;
  return `${libCpt(c)} : ${deb ? 'débit' : 'crédit'} de ${m}.`;
}

/* la phrase sous le graphique se CALCULE sur les mois : écrite à la main (« Août est bas »), elle disait le contraire des barres dès que les chiffres ont bougé */
function legendeMois(mois){
  const nom = x => nomMois(x.m).replace(/ \d{4}$/, ''), haut = mois.reduce((a, x) => x.ca > a.ca ? x : a), bas = mois.reduce((a, x) => x.ca < a.ca ? x : a), finis = mois.filter(x => x.m !== '2026-10' || PAIE.valide), chBas = finis.reduce((a, x) => x.ch < a.ch ? x : a);
  return `${nom(haut).charAt(0).toUpperCase() + nom(haut).slice(1)} est le meilleur mois (${eur(haut.ca)} de produits), ${nom(bas)} le plus calme (${eur(bas.ca)}).` +
    (chBas.m === '2026-08' ? ' En août, les charges baissent : les congés payés du bâtiment sont versés par la caisse de congés, pas par l’entreprise.' : '') + (PAIE.valide ? '' : ' Octobre n’a pas encore sa paie.');
}
VUES.pilotage = () => {
  const ca = -solde('70', { au:AUJ }), charges = solde('6', { au:AUJ }), res = -(solde('6', { au:AUJ }) + solde('7', { au:AUJ })), treso = solde('512000', { au:AUJ }) + solde('530000', { au:AUJ }), F = aFaire();
  const mois = MOIS_LISTE.map(m => ({ m, ca:-solde('7', { du:m + '-01', au:finMois(m) }), ch:solde('6', { du:m + '-01', au:finMois(m) }) }));
  const lc = document.documentElement.clientWidth, tel = lc <= 760, W = tel ? Math.max(250, lc - 66) : 760, H = tel ? 220 : 250, g = tel ? 44 : 52, d = tel ? 6 : 10, h = 14, b = 30, mx = Math.max(...mois.map(x => Math.max(x.ca, x.ch))), pas = pasJoli(mx / 4), y1 = Math.ceil(mx / pas) * pas, bande = (W - g - d) / mois.length, bw = Math.max(4, Math.min(22, (bande - (tel ? 6 : 14)) / 2)), Y = v => h + (y1 - v) * (H - h - b) / y1;
  const barre = (x, v, c) => { const y = Y(v), hh = H - b - y, r = Math.min(4, bw / 2, hh); return hh < 1 ? '' : `<path d="M${x} ${H - b} V${y + r} a${r} ${r} 0 0 1 ${r} -${r} H${x + bw - r} a${r} ${r} 0 0 1 ${r} ${r} V${H - b} Z" fill="var(--${c})"/>`; };
  const grad = []; for (let v = 0; v <= y1 + .01; v += pas) grad.push(v);
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Produits et charges par mois, de janvier à octobre 2026. ${mois.map(x => `${nomMois(x.m).replace(/ \d{4}$/, '')} : produits ${eur(x.ca)}, charges ${eur(x.ch)}`).join(' ; ')}.">${grad.map(v => `<line x1="${g}" x2="${W - d}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--trait)" stroke-width="1"/><text x="${g - 8}" y="${Y(v) + 4}" text-anchor="end">${kEur(v)}</text>`).join('')}
    ${mois.map((x, i) => { const cx = g + i * bande + (bande - 2 * bw - 2) / 2; return barre(cx, x.ca, 'serie1') + barre(cx + bw + 2, x.ch, 'serie2') + `<text x="${g + i * bande + bande / 2}" y="${H - 9}" text-anchor="middle">${tel ? MOIS_C[i].charAt(0).toUpperCase() : MOIS_C[i]}</text><rect data-tip="${esc(nomMois(x.m))}|Produits ${eur(x.ca)}|Charges ${eur(x.ch)}|Résultat ${eur(x.ca - x.ch)}" x="${g + i * bande}" y="${h}" width="${bande}" height="${H - h - b}" fill="transparent"/>`; }).join('')}</svg>`;
  return tete('Pilotage', 'Pilotage du comptable', 'Les chiffres de l’exercice, mois par mois. Janvier à septembre sont clôturés ; octobre se ferme quand tout est vert.') +
    `<div class="kpis"><div class="kpi"><span>Chiffre d’affaires 2026 (HT)</span><b>${eur(ca)}</b><small>janvier à octobre</small></div><div class="kpi"><span>Charges</span><b>${eur(charges)}</b><small>janvier à octobre</small></div><div class="kpi"><span>Résultat provisoire</span><b>${eur(res)}</b><small>avant clôture et impôt</small></div><div class="kpi"><span>Trésorerie</span><b>${eur(treso)}</b><small>banque et caisse</small></div></div>
    <div class="carte graph"><h2>Produits et charges, mois par mois</h2>
      <div class="prev"><div class="legende" style="margin-bottom:8px"><span><i style="background:var(--serie1)"></i>Produits</span><span><i style="background:var(--serie2)"></i>Charges</span></div>${svg}<div class="prev-bulle" hidden></div></div><p class="mute petit" style="margin-top:6px">${legendeMois(mois)}</p></div>
    <div class="carte"><h2>Avant de clôturer octobre · ${F.filter(x => x.ok).length}/${F.length}</h2><div class="etapes">${F.map((x, i) => `<div class="etape ${x.ok ? 'ok' : ''}"><span class="rond">${x.ok ? '✓' : i + 1}</span><span class="txt"><b>${x.t}</b><span class="mute petit">${x.d}</span></span>${x.ok ? '' : `<button type="button" class="btn gris petit" data-a="aller" data-r="${x.k}" ${x.gl ? `data-gl="${x.gl}"` : ''}>Y aller</button>`}</div>`).join('')}</div></div>`;
};

  if (S.type === 'retard') G = F.map(f => f.lib.startsWith(S.cle) && f.cat === 'client' ? { ...f, d:ajoute(f.d, 15), sur:false } : f).filter(f => f.d <= fin);
  else G.push({ d:S.d, lib:'Dépense simulée', m:-S.m, sur:false, cat:'sim' });
  G.sort((a, b) => a.d.localeCompare(b.d) || b.m - a.m);
  let s = cts(P.depart); const J = [{ d:AUJ, s:P.depart, F:[] }];
  for (let d = ajoute(AUJ, 1); d <= fin; d = ajoute(d, 1)) { const Lj = G.filter(f => f.d === d); Lj.forEach(f => { s += cts(f.m); }); J.push({ d, s:s / 100, F:Lj }); }
  return { F:G, J, depart:P.depart, bas:J.reduce((m, j) => j.s < m.s ? j : m, J[0]), fin:J[J.length - 1], base:P };
};
function cmptTraitBase(P, X, Y){ const v = P.base.J.map(j => j.s); let d = `M${X(0).toFixed(1)} ${Y(v[0]).toFixed(1)}`; for (let i = 1; i < v.length; i++) d += ` H${X(i).toFixed(1)} V${Y(v[i]).toFixed(1)}`; return `<path d="${d}" fill="none" stroke="var(--doux)" stroke-width="1.5" stroke-dasharray="5 5" stroke-linejoin="round"/>`; }
const cmptPrevVue0 = VUES.previsions;
VUES.previsions = () => {
  CMPT.dansPrev = true; let h; try { h = cmptPrevVue0(); } finally { CMPT.dansPrev = false; }
  const P = UI._prev, cr = CMPT.seuilOn && P ? P.J.find(j => j.s < CMPT.seuil) : null, S = CMPT.sim;
  const ligneSeuil = `<div class="cmpt-seuil"><label class="cmpt-bascule"><input type="checkbox" data-cmpt="seuil" ${CMPT.seuilOn ? 'checked' : ''}> <span>Me prévenir si le compte passe sous</span></label><label class="cmpt-bascule"><input type="number" id="cmpt-seuil-val" value="${CMPT.seuil}" min="0" step="1000" inputmode="numeric" aria-label="Seuil en euros"> €</label><button type="button" class="btn gris" data-cmpt="sim">Et si…</button></div>`;
  const alerte = cr ? `<div class="alerte cmpt-ecart" role="status"><b>Le ${dCourt(cr.d)}, le compte descendrait à ${eur(cr.s)}</b>, sous ton seuil de ${eur(CMPT.seuil)}. Relancer les factures en retard ou décaler une dépense suffit souvent.</div>` : '';
  const sim = S ? `<div class="info cmpt-simbande" role="status"><span><b>Simulation :</b> ${esc(S.desc)}. Rien n’est écrit dans la comptabilité ; le trait pointillé est la courbe sans cette simulation.</span><button type="button" class="btn gris petit" data-cmpt="sim-fin">Annuler la simulation</button></div>` : '';
  h = apresTete(h, ligneSeuil + alerte + sim);
  if (UI.prevSurligne === 'tva') { h = h.replace(/<tr role="row">(<td class="c lt-d" role="cell">[^<]*<\/td><td class="lt-t" role="cell">TVA )/g, '<tr role="row" class="cmpt-surligne">$1'); UI.prevSurligne = null; }
  return h;
};
function cmptSimFenetre(){
  const P = cmptPrev0(UI.prevHab), cl = P.F.filter(f => f.cat === 'client' && /^FAC-/.test(f.lib));
  ouvrir(haut('Et si…', 'Un essai : rien n’est écrit dans la comptabilité', 'Trésorerie') + `<div class="cmpt-sim"><label>Que veux-tu tester ?<select id="cmpt-sim-t"><option value="retard">Un client paie 15 jours plus tard</option><option value="depense">J’ajoute une dépense</option></select></label>
    <label id="cmpt-sim-a">Quelle facture ?<select id="cmpt-sim-f">${cl.map(f => `<option value="${esc(f.lib.split(' · ')[0])}">${esc(f.lib)} · ${nb(f.m)} €</option>`).join('') || '<option value="">Aucune facture en attente</option>'}</select></label>
    <div id="cmpt-sim-b" class="cmpt-champs" hidden><label>Montant (€)<input type="number" id="cmpt-sim-m" value="25000" min="0" step="100" inputmode="decimal"></label><label>Le<input type="date" id="cmpt-sim-d" value="2026-11-12" min="${ajoute(AUJ, 1)}" max="${ajoute(AUJ, 56)}"></label></div>
    <div class="outils"><button type="button" class="btn" data-cmpt="sim-ok">Voir la courbe</button><button type="button" class="btn gris" data-a="fermer">Annuler</button></div></div>`);
}
document.addEventListener('change', ev => { const t = ev.target; if (!t) return;
  if (t.id === 'cmpt-sim-t') { const a = document.getElementById('cmpt-sim-a'), b = document.getElementById('cmpt-sim-b'); if (a) a.hidden = t.value !== 'retard'; if (b) b.hidden = t.value !== 'depense'; }
  if (t.id === 'cmpt-seuil-val') { CMPT.seuil = Math.max(0, +t.value || 0); rendre(); } });
function cmptSimOk(){
  const t = (document.getElementById('cmpt-sim-t') || {}).value;
  if (t === 'retard') { const sel = document.getElementById('cmpt-sim-f'), cle = sel && sel.value; if (!cle) return toast('Aucune facture en attente à tester.'); CMPT.sim = { type:'retard', cle, desc:`${sel.options[sel.selectedIndex].text.split(' · ').slice(0, 2).join(' · ')} paie 15 jours plus tard` }; }
  else { const m = Math.max(0, +(document.getElementById('cmpt-sim-m') || {}).value || 0), d = (document.getElementById('cmpt-sim-d') || {}).value;
    if (!m) return toast('Indique le montant de la dépense.'); if (!d || d <= AUJ || d > ajoute(AUJ, 56)) return toast('Choisis une date dans les huit prochaines semaines.'); CMPT.sim = { type:'depense', m, d, desc:`une dépense de ${eur(m)} le ${dCourt(d)}` }; }
  fermer(); rendre();
}

/* ─── le menu : une ombre en bas et une flèche tant qu'il reste des rubriques cachées ─── */
function cmptMenuMaj(){
  const m = document.getElementById('menu'), l = m && m.querySelector('.menu-liste'); if (!l) return;
  if (!m.querySelector('.cmpt-plus')) { const p = document.createElement('button'); p.type = 'button'; p.className = 'cmpt-plus'; p.dataset.cmpt = 'defiler'; p.setAttribute('aria-label', 'Voir les rubriques suivantes'); p.innerHTML = '<span aria-hidden="true">⌄</span> Plus bas'; l.after(p); }
  m.classList.toggle('cmpt-coupe', l.scrollHeight - l.scrollTop - l.clientHeight > 6);
}
document.addEventListener('scroll', ev => { if (ev.target && ev.target.classList && ev.target.classList.contains('menu-liste')) cmptMenuMaj(); }, true);
addEventListener('resize', cmptMenuMaj);
(() => { const r1 = rendre; rendre = function(){ const v = r1.apply(this, arguments); try { cmptMenuMaj(); } catch (e) {} return v; }; })();

/* ─── un seul écouteur pour les gestes d'ici (data-cmpt="geste|argument") ─── */
document.addEventListener('click', ev => {
  const b = ev.target.closest && ev.target.closest('[data-cmpt]'); if (!b) return; const [a, x, y] = b.dataset.cmpt.split('|'), cle = b.dataset.cle, film = CINE.actif && !CINE.fin;
  if (a === 'ouvrir') return cmptParent({ opc_ouvrir:{ sorte:x, cle, cli:b.dataset.cli || '' } }) ? undefined : toast('Cette fiche s’ouvre dans OP GESTION : ici, la comptabilité est ouverte seule.');
  if (a === 'relancer') return film ? toast('La démo joue déjà la journée. Pour relancer toi-même, quitte-la d’abord (✕).') : cmptRelancer(cle);
  if (a === 'relancer-ok') return cmptRelancerOk(cle);
  if (a === 'pdf') return cmptPdf(cle);
  if (a === 'vf') { UI.vf = x; return rendre(); }
  if (a === 'ach') { UI.ach = x; return rendre(); }
  if (a === 'bq') { UI.bq = x; return rendre(); }
  if (a === 'tiers') return ouvrirTiers(x);
  if (a === 'lecture') return cmptLecture();
  if (a === 'relire') return cmptRelire();
  if (a === 'copier') { try { navigator.clipboard.writeText(b.dataset.txt || ''); } catch (e) {} return toast('Adresse copiée : donne-la à tes fournisseurs.'); }
  if (a === 'depot') return film ? toast('La démo joue déjà la journée.') : cmptDepot(x);
  if (a === 'hero') { CMPT.heroReplie = x === '1'; try { localStorage.setItem('cmpt_hero_replie', x); } catch (e) {} return rendre(); }
  if (a === 'attend') { if (y) UI.vf = y; return aller(x); }
  if (a === 'impots') return toast('Dans la vraie version, ton espace impots.gouv.fr s’ouvre ici. Dans la démonstration, rien n’est transmis.');
  if (a === 'rappel') { CMPT.rappelTva = !CMPT.rappelTva; return toast(CMPT.rappelTva ? 'Rappels activés : un message le 16/11 (sept jours avant) puis le 22/11.' : 'Rappels coupés pour la TVA.'); }
  if (a === 'treso-tva') { UI.prevTout = true; UI.prevSurligne = 'tva'; return aller('previsions'); }
  if (a === 'seuil') { CMPT.seuilOn = !CMPT.seuilOn; return rendre(); }
  if (a === 'sim') return cmptSimFenetre();
  if (a === 'sim-ok') return cmptSimOk();
  if (a === 'sim-fin') { CMPT.sim = null; return rendre(); }
  if (a === 'defiler') { const l = document.querySelector('#menu .menu-liste'); if (l) l.scrollBy({ top:Math.max(120, l.clientHeight * .7), behavior:'smooth' }); return; }
});
/* OP GESTION est prévenu que la fenêtre est prête : il répond avec qui regarde, et ce qui était demandé */
cmptParent({ opc_pret:1 });
try { cmptMenuMaj(); } catch (e) {}

</script>

<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"></head><body>
<title>Comptabilité Clim Services 17</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex,nofollow">
<style>
/* Mise en page : un logiciel de comptabilité. Menu des rubriques à gauche (sur téléphone, un tiroir), le travail au centre,
   le détail d'une écriture, d'une pièce ou d'un compte dans un panneau qui glisse à droite. Police du système, comme
   OP GESTION ; chiffres alignés (tabulaires), numéros de comptes et codes de lettrage en chasse fixe : on lit des colonnes. */
:root{
  --bg:#f2f4f7; --surf:#ffffff; --surf2:#eef1f5; --surf3:#e6eaf0; --ink:#121b2a; --mute:#5a6578; --faible:#7b8597; --line:#dde2ea; --line2:#c9d0db;
  --accent:#0a5fc2; --accent-ink:#ffffff; --accent-bg:#e7f0fb;
  --ok:#17804f; --ok-bg:#e2f3ea; --warn:#9a5600; --warn-bg:#fcefd9; --bad:#b4332a; --bad-bg:#fbe6e3; --essai:#6b45a8; --essai-bg:#efe8fa;
  --debit:#121b2a; --credit:#121b2a; --ombre:0 1px 2px rgba(18,27,42,.06),0 8px 24px rgba(18,27,42,.07); --voile:rgba(18,27,42,.34);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px; --menu:252px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141c; --surf:#161f2b; --surf2:#1c2734; --surf3:#233040; --ink:#e8edf4; --mute:#a2adbd; --faible:#8792a3; --line:#2a3646; --line2:#3a485b;
  --accent:#5ea2ff; --accent-ink:#06121f; --accent-bg:#14263d;
  --ok:#4fd295; --ok-bg:#123224; --warn:#f2a94e; --warn-bg:#352610; --bad:#ff8378; --bad-bg:#3b1815; --essai:#c4a6ff; --essai-bg:#2a2140;
  --debit:#e8edf4; --credit:#e8edf4; --ombre:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35); --voile:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141c; --surf:#161f2b; --surf2:#1c2734; --surf3:#233040; --ink:#e8edf4; --mute:#a2adbd; --faible:#8792a3; --line:#2a3646; --line2:#3a485b;
  --accent:#5ea2ff; --accent-ink:#06121f; --accent-bg:#14263d;
  --ok:#4fd295; --ok-bg:#123224; --warn:#f2a94e; --warn-bg:#352610; --bad:#ff8378; --bad-bg:#3b1815; --essai:#c4a6ff; --essai-bg:#2a2140;
  --debit:#e8edf4; --credit:#e8edf4; --ombre:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35); --voile:rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15.5px/1.5 var(--f);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1{font-size:28px;line-height:1.15;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:18px;margin:0;text-wrap:balance}
h3{font-size:15.5px;margin:0}
p{margin:0}
.mute{color:var(--mute)}.petit{font-size:13.5px}.n,.num{font-variant-numeric:tabular-nums}.mono{font-family:var(--mono);font-size:.92em}
[hidden]{display:none!important}
.seul-tel{display:none!important}
.cache-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ─── la charpente ─── */
.app{display:grid;grid-template-columns:var(--menu) minmax(0,1fr);min-height:100vh}
.menu{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surf);border-right:1px solid var(--line);padding:16px 12px 24px;display:flex;flex-direction:column;gap:2px}
.marque{display:flex;gap:10px;align-items:center;padding:4px 8px 14px}
.marque i{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 13px/1 var(--f);font-style:normal;letter-spacing:.02em;flex:none}
.marque b{display:block;font-size:15px}.marque small{color:var(--mute);font-size:12.5px}
.menu .grp{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faible);padding:14px 10px 4px}
.menu a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:14.5px;min-height:38px}
.menu a:hover{background:var(--surf2)}
.menu a[aria-current="page"]{background:var(--accent-bg);color:var(--accent);font-weight:650}
.menu a .nb{margin-left:auto;min-width:22px;height:20px;padding:0 6px;border-radius:999px;background:var(--warn-bg);color:var(--warn);font-size:12px;font-weight:700;display:grid;place-items:center}
.menu a .nb.ok{background:var(--ok-bg);color:var(--ok)}
.menu svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.centre{min-width:0;display:flex;flex-direction:column}
.barre{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(20px,env(safe-area-inset-left,0px));display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;min-height:58px}
.barre .ouvrir-menu{display:none}
.barre .dossier{display:flex;flex-direction:column;line-height:1.25}.barre .dossier b{font-size:14.5px}.barre .dossier span{font-size:12.5px;color:var(--mute)}
.barre .puces{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.puce{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surf);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.puce i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.puce.ouvert i{background:var(--warn)}
.contenu{padding:24px max(16px,env(safe-area-inset-right,0px)) 64px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px;max-width:1440px;width:100%}
.tete{display:flex;gap:12px 20px;align-items:flex-end;flex-wrap:wrap}
.tete>div:first-child{flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:4px}
.surtitre{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.tete .actions{display:flex;gap:8px;flex-wrap:wrap}
.consigne{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--accent-bg);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.consigne b{display:block}.consigne .x{margin-left:auto}

/* ─── les pièces de base ─── */
.carte{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.carte>h2,.carte>h3{margin-bottom:10px}
.grille{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left}
button.kpi:hover{border-color:var(--line2)}
@media (min-width:1001px){.kpis.six{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kpi span{font-size:13px;color:var(--mute)}.kpi b{font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}.kpi small{font-size:12.5px;color:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14.5px;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(1.06)}
.btn.gris{background:var(--surf);color:var(--ink);border-color:var(--line2)}
.btn.gris:hover{background:var(--surf2);filter:none}
.btn.danger{background:var(--surf);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.petit{min-height:32px;padding:0 11px;font-size:13.5px;border-radius:8px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed;filter:none}
.lien{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.st{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:650;white-space:nowrap;background:var(--surf2);color:var(--mute)}
.st.ok{background:var(--ok-bg);color:var(--ok)}.st.warn{background:var(--warn-bg);color:var(--warn)}.st.bad{background:var(--bad-bg);color:var(--bad)}.st.info{background:var(--accent-bg);color:var(--accent)}.st.essai{background:var(--essai-bg);color:var(--essai)}
.jn{display:inline-grid;place-items:center;min-width:30px;height:22px;padding:0 6px;border-radius:6px;background:var(--surf3);font:700 11.5px/1 var(--mono);letter-spacing:.02em}
.let{font:700 12px/1 var(--mono);color:var(--ok)}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:3px;border-radius:11px;background:var(--surf2);border:1px solid var(--line)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--mute);min-height:34px}
.seg button[aria-pressed="true"]{background:var(--surf);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.outils{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.champ{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute);font-weight:600;min-width:0}
.saisie,.champ input,.champ select,.champ textarea{min-height:40px;border:1px solid var(--line2);border-radius:9px;background:var(--surf);padding:0 10px;font-size:15px;font-weight:400;color:var(--ink);width:100%}
.champ textarea{padding:8px 10px;min-height:70px}
.case{display:flex;gap:8px;align-items:center;font-size:14.5px;min-height:36px}
.case input{width:18px;height:18px;accent-color:var(--accent)}
.info{padding:11px 14px;border-radius:12px;background:var(--accent-bg);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);font-size:14.5px}
.alerte{padding:11px 14px;border-radius:12px;background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);font-size:14.5px}
.erreur{padding:11px 14px;border-radius:12px;background:var(--bad-bg);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent);color:var(--ink);font-size:14.5px}
.bon{padding:11px 14px;border-radius:12px;background:var(--ok-bg);border:1px solid color-mix(in srgb,var(--ok) 30%,transparent);font-size:14.5px}
.vide{padding:28px;text-align:center;color:var(--mute)}

/* ─── les tableaux comptables ─── */
.defile{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--r);background:var(--surf)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faible);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surf);position:sticky;top:0;white-space:nowrap}
.t td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t td.n,.t th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.t td.c{white-space:nowrap}
.t tbody tr.clic{cursor:pointer}.t tbody tr.clic:hover td{background:var(--surf2)}
.t tr.total td{font-weight:700;background:var(--surf2);border-top:1px solid var(--line2)}
.t tr.sous td{background:color-mix(in srgb,var(--surf2) 55%,transparent);font-weight:650}
.t tr.essai td{background:color-mix(in srgb,var(--essai-bg) 55%,transparent)}
.t tr.brouil td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.t input.saisie{min-height:34px;font-size:14px;padding:0 8px}
.t .compte{font-family:var(--mono);font-size:13px;white-space:nowrap}
.t td .sec{display:block;font-size:12.5px;color:var(--mute)}

/* ─── le panneau de détail ─── */
.voile{position:fixed;inset:0;background:var(--voile);z-index:40;display:flex;justify-content:flex-end;animation:fondu .18s ease}
.panneau{width:min(760px,100%);height:100%;overflow:auto;background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--ombre);padding:20px max(20px,env(safe-area-inset-right,0px)) 40px 22px;display:flex;flex-direction:column;gap:14px;animation:glisse .26s cubic-bezier(.32,.72,0,1)}
.panneau.large{width:min(1040px,100%)}
.panneau .haut{display:flex;gap:10px;align-items:flex-start}
.panneau .haut>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.fermer{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surf);font-size:18px;flex:none;display:grid;place-items:center}
@keyframes fondu{from{opacity:0}}@keyframes glisse{from{transform:translateX(40px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.voile,.panneau{animation:none}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14.5px;z-index:60;max-width:min(560px,calc(100% - 32px));box-shadow:var(--ombre);pointer-events:none}

/* ─── la pièce justificative (un document fictif) ─── */
.doc{background:#fff;color:#1b2330;border:1px solid #d7dce4;border-radius:10px;padding:18px 20px;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.doc .dtete{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid #e3e7ee;padding-bottom:10px;margin-bottom:10px}
.doc b{color:#111}.doc table{width:100%;border-collapse:collapse;margin-top:8px}.doc td,.doc th{padding:5px 4px;border-bottom:1px solid #eef1f5;text-align:left}.doc .n{text-align:right}
.doc .tot{margin-left:auto;width:min(260px,100%);margin-top:8px}.doc .tot div{display:flex;justify-content:space-between;padding:2px 0}.doc .tot div:last-child{font-weight:700;border-top:1px solid #d7dce4;padding-top:5px}

/* ─── l'équilibre d'une écriture ─── */
.balance-ecr{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:14px}
.balance-ecr .ecart{font-weight:700}
.balance-ecr .ecart.ok{color:var(--ok)}.balance-ecr .ecart.ko{color:var(--bad)}

/* ─── les étapes (à faire, clôture) ─── */
.etapes{display:flex;flex-direction:column}
.etape{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.etape:last-child{border-bottom:0}
.etape .rond{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:13px;font-weight:800;background:var(--surf2);color:var(--mute);border:1px solid var(--line)}
.etape.ok .rond{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.etape .txt{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:1px}
.etape.ok .txt b{color:var(--mute);font-weight:600}

/* ─── le bilan ─── */
.bilan{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.graph svg{width:100%;height:auto;display:block}
.graph text{fill:var(--mute);font-size:11px;font-family:var(--f)}

/* ─── le parcours d'essai ─── */
.essais{display:flex;flex-direction:column;gap:8px}
.essai-l{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--surf);border:1px solid var(--line);flex-wrap:wrap}
.essai-l .rond{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;font-size:13px;background:var(--surf2);color:var(--mute)}
.essai-l.ok .rond{background:var(--ok-bg);color:var(--ok)}
.essai-l .txt{flex:1 1 280px;min-width:0}

/* ─── téléphone et tablette ─── */
@media (max-width:1000px){
  .app{grid-template-columns:minmax(0,1fr)}
  .menu{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:50;transform:translateX(-105%);transition:transform .25s cubic-bezier(.32,.72,0,1);box-shadow:var(--ombre);padding-top:calc(16px + env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px))}
  body.menu-ouvert .menu{transform:none}
  body.menu-ouvert::after{content:"";position:fixed;inset:0;background:var(--voile);z-index:45}
  .barre .ouvrir-menu{display:inline-flex}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:700px){
  h1{font-size:23px}
  .g2,.g3,.bilan{grid-template-columns:minmax(0,1fr)}
  .contenu{padding-top:18px;gap:14px}
  .barre .puces{margin-left:0;width:100%}
  .kpi b{font-size:20px}
  .panneau{padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px))}
  .t{font-size:13.5px}.t td,.t th{padding:8px 9px}
  .masque-tel{display:none}
  .seul-tel{display:block!important}
  .barre .puce.exo,.barre .dossier span{display:none}
  .carte{padding:14px}
  .kpis.six{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (pointer:coarse){.btn.petit{min-height:40px}.seg button{min-height:40px}}
</style>
<div class="app"><nav class="menu" id="menu" aria-label="Rubriques"></nav><div class="centre"><header class="barre" id="barre"></header><main class="contenu" id="contenu" tabindex="-1"></main></div></div>
<div id="calque"></div><div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
/* ══ LE MOTEUR COMPTABLE — partie double, journaux, lettrage, TVA, immobilisations, clôtures ══
   Une écriture = des lignes au débit et au crédit qui s'équilibrent. Tant qu'elle est au BROUILLARD, on la corrige ou on la
   supprime ; une fois VALIDÉE, elle reçoit son numéro définitif dans son journal et ne se modifie plus : on la contrepasse
   (principe d'intangibilité, PCG art. 420-5 — à faire confirmer). Une période CLÔTURÉE ne reçoit plus aucune écriture.
   Tout est calculé en centimes pour qu'aucune somme ne dérive. Données fictives (Clim Services 17, l'entreprise du prototype
   OP GESTION) : dix mois d'activité, de janvier au 31 octobre 2026. */
const AUJ = '2026-10-31';
const EXO = { debut:'2026-01-01', fin:'2026-12-31', annee:2026, prec:'2025' };
const DOSSIER = { nom:'Clim Services 17', forme:'SARL au capital de 10 000 €', siren:'123456789', siret:'123 456 789 00012', adr:'4 rue du Port, 17000 La Rochelle',
  ape:'43.22B · Travaux d’installation d’équipements thermiques et de climatisation', cab:'Cabinet Atlantique Conseil', cabQui:'Claire Moreau', moi:'Julie Petit',
  tva:'Régime réel normal · déclaration mensuelle (CA3)', exig:'TVA sur les encaissements (prestations de services)', is:'Impôt sur les sociétés' };
const r2 = x => Math.round((+x || 0) * 100) / 100;
const cts = x => Math.round((+x || 0) * 100);
const eur = (n, z) => (n === 0 && z ? '—' : (n < 0 ? '−' : '') + Math.abs(n).toLocaleString('fr-FR', { minimumFractionDigits:2, maximumFractionDigits:2 }) + ' €');
const nb = n => n.toLocaleString('fr-FR', { minimumFractionDigits:2, maximumFractionDigits:2 });
const dObj = d => new Date(d + 'T12:00:00');
const iso = x => x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
const ajoute = (d, n) => { const x = dObj(d); x.setDate(x.getDate() + n); return iso(x); };
const finMois = ym => iso(new Date(+ym.slice(0, 4), +ym.slice(5, 7), 0, 12));
const ouvre = d => { const w = dObj(d).getDay(); return w === 6 ? ajoute(d, 2) : w === 0 ? ajoute(d, 1) : d; };
const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];

/* ─── le lettrage : rapprocher, sur un compte de tiers, une facture et son paiement ─── */
function codeSuivant(aux){ const n = LET_SEQ[aux] = (LET_SEQ[aux] || 0) + 1; let s = '', k = n; while (k > 0) { k--; s = String.fromCharCode(65 + k % 26) + s; k = Math.floor(k / 26); } return s; }

  if (L.some(l => l.let)) return { err:'Une des lignes est déjà lettrée.' };
  const s = L.reduce((a, l) => a + cts(l.d) - cts(l.cr), 0); if (s !== 0) return { err:`Les lignes choisies ne s’annulent pas : il reste ${eur(s / 100)}. Le lettrage rapproche une facture et ce qui la paie, pour le même montant.` };

/* lettrage automatique : une facture et un paiement du même montant, la référence de pièce d'abord, puis le montant seul */
function lettrageAuto(aux){
  let n = 0; const L = nonLettrees(aux).filter(x => x.e.etat === 'valide');

/* ─── les immobilisations : amortissement linéaire, au prorata du temps (année de 360 jours) ─── */
const DUREES = { '215400':5, '218200':5, '218300':3 };
const AMORT = { '215400':'281540', '218200':'281820', '218300':'281830' };
function jours360(a, b){ const [y1, m1, d1] = a.split('-').map(Number), [y2, m2, d2] = b.split('-').map(Number); return (y2 - y1) * 360 + (m2 - m1) * 30 + (Math.min(d2, 30) - Math.min(d1, 30)) + 1; }
function amortCumule(im, au){

/* ─── la TVA du mois : ce qui a été encaissé (collectée) et ce qui se déduit, à partir des comptes ─── */

/* ══ LES DONNÉES DU DOSSIER — dix mois de Clim Services 17, fabriqués une fois, toujours les mêmes ══

<!-- ⛔ AUCUN APPEL RÉSEAU, GARDÉ PAR LE NAVIGATEUR ET PAS SEULEMENT PAR LA SOBRIÉTÉ DU CODE : default-src 'none' refuse tout
     fetch, toute police, tout script distant. Seuls sont permis : le logo (icons/opmsg-*.png, même origine), le module de
     données `source.js` (même dossier), et ce que la personne fabrique ici même — une photo réduite ou un vocal enregistré
     (blob:, jamais envoyés nulle part). `media-src blob:` n'existe que pour réécouter son propre vocal. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' blob:; media-src blob:; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'">

/* ══ 1. LES JETONS — LE DOCUMENT `design/opmessages/THEME-OPMESSAGES.md` EST LA SOURCE ══════════════════════════════════
   Les valeurs du tableau « Couleurs » du document sont recopiées ici telles quelles ; celles que le document ne cite pas
   (faint, inputBg, line, shadowBar, segTrack, segKnob, sheet, sheetBg, notifBg, toggleOff, handle) viennent de la fonction
   `tokens(dark)` de la maquette source (« OP Messages Apple.dc.html », l. 583-595). `tests/test-856.js` RELIT le document et
   compare, jeton par jeton, jour ET nuit : un banc qui recopie des valeurs garde une croyance, un banc qui relit la source
   garde un accord (la leçon de test-759).
   ⛔ Le jour et la nuit suivent l'APPAREIL (prefers-color-scheme) et rien d'autre : pas de bouton, pas de clé rangée.
   TROIS jetons sont à NOUS, ils ne sont ni dans le document ni dans la maquette — écarts déclarés un par un dans test-856 :
   · --sub-meta : le « secondaire » du document (.6 de jour) tombe à ~4,1:1 sur le coin bleu du décor — trop clair pour une
     légende de 11 px (datage, « Lu », nom d'auteur, mention d'aperçu). Mesuré au pixel : ≥ 4,5 jour et nuit avec celui-ci ;
   · --rond-bord : le contour des cases décochées (rgba(120,120,128,.4)) faisait ~1,4:1 sur la carte — il en faut 3 (WCAG 1.4.11) ;
   · --on-fill : l'encre posée sur --fill (bulle envoyée, pastille, flèche d'envoi) : une surface, une encre ;
   · --placeholder : le texte d'un champ VIDE, sur la matière du champ (--field, plus claire que la carte) : la légende de 11 px passe, le placeholder de 17 px posé sur
     ce fond tombait à 4,0–4,2:1 de nuit (lu au pixel, tout le texte de l'écran) ;
   · --accent-txt et --side-actif-fg : l'accent de NUIT (#7ea2f0) est une couleur d'aplat, pas d'une lettre — posé en texte sur le décor bleu (« Modifier »,
     la pastille « Groupe ») il tombait à 4,2:1 et 3,6:1, et sur le fond vif de la barre latérale (saturate 180 %) à 2,65:1 (mesuré au pixel, 1er octobre 2026).
     Le texte prend sa propre teinte (jour : l'accent, qui passe) ; l'accent reste celui des aplats, des anneaux de focus et des contours. */
:root {
  --text: #0e1a3f;
  --sub: rgba(14,26,63,.6);
  --faint: rgba(14,26,63,.3);
  --sub-meta: rgba(14,26,63,.72);
  --placeholder: rgba(14,26,63,.72);
  --accent: #2a4a9c;
  --accent-txt: #2a4a9c;
  --side-actif-fg: #2a4a9c;
  --fill: #2a4a9c;
  --fill-soft: rgba(42,74,156,.12);
  --card: rgba(255,255,255,.82);
  --field: rgba(42,74,156,.1);
  --input-bg: #ffffff;
  --line: 0.5px solid rgba(60,60,67,.29);
  --sep: 0.5px solid rgba(60,60,67,.2);
  --nav-bar: rgba(255,255,255,.78);
  --tab-bar: rgba(255,255,255,.72);
  --shadow-bar: 0 12px 32px rgba(11,20,38,.12), inset 0 1px 0 #fff;
  --bubble-in: #e6ecf7;
  --bubble-in-fg: #0e1a3f;
  --seg-track: rgba(118,118,128,.12);
  --seg-knob: #fff;
  --sidebar: rgba(255,255,255,.4);
  --sheet: rgba(248,250,255,.94);
  --sheet-bg: rgba(242,242,247,.94);
  --notif-bg: rgba(255,255,255,.82);
  --toggle-off: rgba(120,120,128,.16);
  --rond-bord: rgba(60,60,67,.6);
  --on-fill: #ffffff;
  --sub-meta-sel: rgba(14,26,63,.72);
  --group-r: 12px;
  --handle: rgba(0,0,0,.72);
  --tab-active-bg: rgba(255,255,255,.88);
  --tab-active-fg: #1a2e6b;
  --tab-active-shadow: 0 4px 14px rgba(0,0,0,.12), inset 0 1px 0 #fff;
  --screen: linear-gradient(112deg, rgba(255,255,255,0) 58%, rgba(255,255,255,.4) 58.2%), radial-gradient(120% 90% at 0% 0%, #ffffff 0%, rgba(255,255,255,0) 55%), radial-gradient(110% 80% at 100% 100%, #c9d8f5 0%, rgba(201,216,245,0) 60%), linear-gradient(160deg, #eef3fb, #dfe8f8);
  /* — ce qui n'est pas dans le tableau du document : encres de statut, puces, plan de repli — */
  --rouge: #ff453a;
  --vert: #30d158;
  --puce-x: #ffffff;
  --coche: #ffffff;
  --solide: #f6f8fd;
  --solide-feuille: #f2f2f7;
  --solide-notif: #ffffff;
  --base: #eef3fb;
}
@media (prefers-color-scheme: dark) {
  :root {
    --text: #ffffff;
    --sub: rgba(220,228,250,.66);
    --faint: rgba(220,228,250,.32);
    --sub-meta: rgba(220,228,250,.78);
    --placeholder: rgba(236,241,255,.9);
    --accent: #7ea2f0;
    --accent-txt: #c7d6fb;
    --side-actif-fg: #ffffff;
    --fill: #3b63c4;
    --fill-soft: rgba(126,162,240,.22);
    --card: rgba(255,255,255,.09);
    --field: rgba(255,255,255,.14);
    --input-bg: rgba(255,255,255,.06);
    --line: 1px solid rgba(255,255,255,.14);
    --sep: 0.5px solid rgba(84,84,88,.6);
    --nav-bar: rgba(26,46,107,.72);
    --tab-bar: rgba(255,255,255,.1);
    --shadow-bar: 0 12px 32px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.16);
    --bubble-in: rgba(255,255,255,.14);
    --bubble-in-fg: #fff;
    --seg-track: rgba(118,118,128,.24);
    --seg-knob: #636366;
    --sidebar: rgba(255,255,255,.04);
    --sheet: rgba(20,32,74,.92);
    --sheet-bg: rgba(28,28,30,.92);
    --notif-bg: rgba(44,44,46,.82);
    --toggle-off: rgba(120,120,128,.32);
    --rond-bord: rgba(235,235,245,.6);
    --on-fill: #ffffff;
    --sub-meta-sel: rgba(240,244,255,.92);
    --group-r: 12px;
    --handle: rgba(255,255,255,.8);
    --tab-active-bg: rgba(42,74,156,.8);
    --tab-active-fg: #fff;
    --tab-active-shadow: 0 6px 16px rgba(34,59,110,.3), inset 0 1px 0 rgba(255,255,255,.28);
    --screen: linear-gradient(112deg, rgba(255,255,255,0) 58%, rgba(255,255,255,.05) 58.2%), radial-gradient(120% 90% at 0% 0%, #24408a 0%, rgba(36,64,138,0) 55%), linear-gradient(160deg, #1a2e6b, #0e1a3f);
    --rouge: #ff453a;
    --vert: #30d158;
    --puce-x: #0e1a3f;
    --coche: #ffffff;
    --solide: #1b2d68;
    --solide-feuille: #1c1c1e;
    --solide-notif: #2c2c2e;
    --base: #0e1a3f;
  }
}

/* ══ 2. BASE ═══════════════════════════════════════════════════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; }
/* ⛔ le décor va sur <html> : le fond de <html> se propage au canevas et se peint en tout premier (CLAUDE.md). */
html {
  color-scheme: light dark;
  background-color: var(--base);
  background-image: var(--screen);
  background-attachment: fixed;
  -webkit-text-size-adjust: 100%;
  scrollbar-color: var(--faint) transparent;
  -webkit-tap-highlight-color: transparent;
}
html.feuille-ouverte, html.feuille-ouverte body { overflow: hidden; }
body {
  margin: 0;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI Variable Text', 'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Helvetica, system-ui, sans-serif;
  font-size: 17px;
  line-height: 1.3;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
button { border: 0; background: none; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; text-align: inherit; }
a { color: inherit; text-decoration: none; -webkit-touch-callout: none; }
ul { list-style: none; margin: 0; padding: 0; }
h1, h2, p { margin: 0; }
svg.ic.plein { fill: currentColor; stroke: none; }
svg.ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-seul { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* La réponse au toucher est IMMÉDIATE : l'état « pressé » se pose au doigt posé, pas au relâché (apple-design, §1). La transition
   part de la valeur VISIBLE du moment — un geste interrompu repart d'où il est, sans saut. */
.presse { transition: transform .12s ease-out, background-color .2s; }
.presse:active { transform: scale(.97); }

/* ══ 3. LA MISE EN PAGE — téléphone (barre d'onglets flottante) ET bureau (barre latérale de 236 px) ═════════════════════
   La navigation se choisit à la LARGEUR, jamais au type d'appareil : un iPad en portrait (820) garde la barre d'onglets. */
.app { min-height: 100vh; min-height: 100dvh; }
.contenu {
  min-width: 0;
  padding: calc(env(safe-area-inset-top, 0px) + 6px) max(16px, env(safe-area-inset-right, 0px)) calc(120px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.side { display: none; }
@media (min-width: 900px) {
  .app { display: grid; grid-template-columns: 236px minmax(0, 1fr); }
  .contenu { padding: 6px 28px 40px; }
  .side { display: flex; }
}

.vue[hidden] { display: none; }
/* ⛔ une colonne de liste n'a pas de raison de faire 2 268 px à 2 560 : l'écran Messages passe en maître-détail dès 1 100 px
   (§ 9), et les autres vues sont bornées */
.vue { max-width: 1000px; margin-inline: auto; }
.entete-vue { display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 0 4px; }
.lien-texte { min-height: 44px; min-width: 44px; display: inline-flex; align-items: center; font-size: 17px; color: var(--accent-txt); }
.grand-titre {
  margin: 2px 4px 10px;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI Variable Display', 'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Helvetica, system-ui, sans-serif;
  font-size: 34px; line-height: 41px; letter-spacing: .37px; font-weight: 700; color: var(--text);
}
/* le bouton « Groupe » : la zone qui répond fait 44 px, la pastille qu'on voit en fait 32 (le paquet dessine 32) */
.btn-groupe { min-height: 44px; display: inline-flex; align-items: center; padding: 0; }
.btn-groupe .pastille {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px 0 10px; border-radius: 999px;
  background: var(--fill-soft); color: var(--accent-txt); font-size: 15px; font-weight: 600; transition: transform .12s ease-out;
}
.btn-groupe:active .pastille { transform: scale(.95); }
.btn-groupe .ic { font-size: 16px; stroke-width: 2.2; }

.recherche {
  display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; margin-bottom: 12px;
  border-radius: 12px; background: var(--field); color: var(--sub);
}
.recherche .ic { font-size: 16px; stroke-width: 2.4; }
.recherche input {
  flex: 1; min-width: 0; height: 44px; border: 0; outline: 0; background: transparent; padding: 0;
  font-size: 17px; color: var(--text); caret-color: var(--accent); -webkit-appearance: none; appearance: none;
}
.recherche input::placeholder { color: var(--placeholder); opacity: 1; }
.recherche input::-webkit-search-cancel-button { display: none; }
.recherche:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }

/* épinglés : 4 cercles de 60 dans des colonnes de 76 */
.epingles { display: flex; gap: 8px; overflow-x: auto; padding: 4px 4px 12px; margin: 0 -4px; scrollbar-width: none; }
/* ⛔ l'ANNEAU de focus (2 px + 2 px de décalage) doit tenir DANS le conteneur qui coupe : `overflow-x:auto` coupe aussi en vertical, `overflow:hidden` des
   cartes coupe tout. Mesuré au clavier à 1 440 px : il ne restait qu'un trait sur la ligne, un angle sur l'épinglé. Deux parades : du rembourrage (4 px)
   là où le conteneur défile, un décalage NÉGATIF (l'anneau dessiné dedans) là où une ligne touche les bords de sa carte. */
.epingle-bouton:focus-visible { outline-offset: 0; border-radius: 12px; }
.carte-liste .conv:focus-visible, .carte .contact:focus-visible, .carte .reglage:focus-visible { outline-offset: -3px; }
.epingles::-webkit-scrollbar { display: none; }
.epingle { flex: none; width: 76px; }
.epingle-bouton { width: 100%; min-height: 44px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; transition: transform .12s ease-out; }
.epingle-bouton:active { transform: scale(.95); }
.epingle-bouton[aria-current="true"] .epingle-nom { color: var(--accent-txt); font-weight: 600; }
.epingle .avatar { width: 60px; height: 60px; font-size: 20px; }
.epingle-nom { font-size: 12px; max-width: 76px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* avatars : dégradés du paquet (index 0 à 5) */
.avatar { flex: none; display: grid; place-items: center; border-radius: 50%; color: #fff; font-weight: 600; background-size: cover; background-position: center; }
.av0 { background-image: linear-gradient(180deg, #4f78d6, #2a4a9c); }
.av1 { background-image: linear-gradient(180deg, #ff9f0a, #ff375f); }
.av2 { background-image: linear-gradient(180deg, #30d158, #0a84ff); }
.av3 { background-image: linear-gradient(180deg, #bf5af2, #5e5ce6); }
.av4 { background-image: linear-gradient(180deg, #8e8e93, #636366); }
.av5 { background-image: linear-gradient(180deg, #64d2ff, #5e5ce6); }

/* la liste : une carte, des lignes de 72 px minimum */
.carte-liste { border-radius: var(--group-r); overflow: hidden; background: var(--card); }
.carte-liste > li { border-bottom: var(--sep); }
.carte-liste > li:last-child { border-bottom: 0; }
/* la ligne est un BOUTON (clavier, lecteur d'écran, doigt) : toute sa largeur répond */
.conv { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 14px; min-height: 72px; color: var(--text); transition: background-color .2s, transform .12s ease-out; }
.conv:active { transform: scale(.985); }
.conv[aria-current="true"] { background: var(--fill-soft); --sub-meta: var(--sub-meta-sel); }
@media (hover: hover) { .conv:not([aria-current="true"]):hover { background: var(--field); } }
.conv-point { width: 10px; flex: none; display: flex; justify-content: center; }
.point { width: 10px; height: 10px; border-radius: 50%; background: var(--fill); }
.conv .avatar { width: 50px; height: 50px; font-size: 18px; }
.conv-corps { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.conv-ligne { display: flex; align-items: baseline; gap: 8px; }
.conv-nom { min-width: 0; font-size: 17px; font-weight: 600; letter-spacing: -.02em; line-height: 22px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv-heure { margin-left: auto; font-size: 15px; color: var(--sub-meta); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chev { width: 7px; height: 12px; flex: none; fill: none; stroke: var(--faint); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; align-self: center; }
.conv-apercu { font-size: 15px; line-height: 20px; color: var(--sub-meta); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.conv-neuve { animation: entree .5s cubic-bezier(.32,.72,0,1) both; }
.vide { padding: 22px 16px; text-align: center; font-size: 15px; color: var(--sub-meta); }
@keyframes entree { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

.mention-apercu { margin: 18px 4px 0; text-align: center; font-size: 12px; line-height: 16px; color: var(--sub-meta); }

/* les écrans qui arrivent aux étapes suivantes : des coquilles « bientôt » */
.coquille { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 38px 24px; border-radius: var(--group-r); background: var(--card); text-align: center; }
.coquille-icone { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 50%; background: var(--fill-soft); color: var(--accent); font-size: 28px; }
.coquille h2 { font-size: 20px; line-height: 25px; font-weight: 700; letter-spacing: -.02em; }
.coquille p { max-width: 34ch; font-size: 15px; line-height: 20px; color: var(--sub-meta); }

/* ══ 4. LA BARRE D'ONGLETS (téléphone) — pilule flottante en verre, bulle sur l'onglet actif ═══════════════════════════════
   Les colonnes sont ÉGALES et se déduisent de leur NOMBRE ; le JavaScript ne pose qu'un NUMÉRO (--i), le CSS calcule la
   place de la bulle : rien n'est mesuré, donc rien ne peut être mesuré trop tôt (CLAUDE.md, « une géométrie recopiée en
   JavaScript dépend du moment où on la copie »). translate en pourcentage = largeur de la bulle = une colonne. */
.tabs {
  position: fixed; z-index: 18; left: max(14px, env(safe-area-inset-left, 0px)); right: max(14px, env(safe-area-inset-right, 0px));
  bottom: max(14px, calc(env(safe-area-inset-bottom, 0px) - 8px)); margin: 0 auto; max-width: 480px;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; padding: 7px; border-radius: 34px;
  background: var(--tab-bar); -webkit-backdrop-filter: blur(36px) saturate(200%); backdrop-filter: blur(36px) saturate(200%);
  border: var(--line); box-shadow: var(--shadow-bar); --i: 0;
}
.tabs-bulle {
  position: absolute; top: 7px; bottom: 7px; left: 7px; width: calc((100% - 20px) / 4); border-radius: 26px;
  background: var(--tab-active-bg); box-shadow: var(--tab-active-shadow);
  translate: calc(var(--i) * (100% + 2px)) 0; transition: translate .45s cubic-bezier(.32,.72,0,1);
}
.tab {
  position: relative; z-index: 1; min-width: 0; min-height: 50px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--sub-meta); font-size: 11px; font-weight: 500; letter-spacing: .01em; transition: color .25s, transform .12s ease-out;
}
.tab .ic { font-size: 24px; }
.tab span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab:active { transform: scale(.94); }
.tab[aria-current="page"] { color: var(--tab-active-fg); font-weight: 600; }
/* ⛔ APRÈS la règle de .tabs (même spécificité : la dernière écrite gagne) — placée dans la requête du § 3, elle ne cachait rien et
   la pilule se posait sur la barre latérale (relevé à la première capture au bureau). */
@media (min-width: 900px) { .tabs { display: none; } }

/* ══ 5. LA BARRE LATÉRALE (bureau) — 236 px, verre, statut « Disponible » ═════════════════════════════════════════════════ */
.side {
  position: sticky; top: 0; height: 100vh; height: 100dvh; flex-direction: column; gap: 2px; padding: 14px 10px;
  background: var(--sidebar); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
  border-right: var(--line);
}
.side-marque { display: flex; align-items: center; gap: 9px; padding: 2px 8px 14px; }
.side-marque img { width: 28px; height: 28px; border-radius: 7px; display: block; }
.side-marque b { font-size: 15px; font-weight: 600; letter-spacing: -.014em; }
.side-lien { display: flex; align-items: center; gap: 9px; min-height: 32px; padding: 4px 8px; border-radius: 8px; font-size: 13px; color: var(--text); transition: background-color .2s, transform .12s ease-out; }
.side-lien .ic { font-size: 16px; }
.side-lien[aria-current="page"] { background: var(--fill-soft); color: var(--side-actif-fg); font-weight: 600; }
.side-lien:active { transform: scale(.98); }
@media (hover: hover) { .side-lien:not([aria-current="page"]):hover { background: var(--field); } }
@media (pointer: coarse) { .side-lien { min-height: 44px; } }
.side-fin { margin-top: auto; }
.moi { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 10px; background: var(--field); }
.moi .avatar { width: 26px; height: 26px; font-size: 11px; }
.moi-texte { min-width: 0; display: flex; flex-direction: column; }
.moi-nom { font-size: 13px; font-weight: 600; }
.moi-statut { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--sub-meta); }
.moi-statut i { width: 6px; height: 6px; border-radius: 50%; background: var(--vert); }

/* ══ 6. LA FEUILLE « NOUVEAU GROUPE » — monte du bas (téléphone), fenêtre centrée de 520 px (bureau) ══════════════════════ */
.voile {
  position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.35); opacity: 0; visibility: hidden;
  transition: opacity .3s, visibility 0s linear .3s;
}

.feuille {

    border-radius: 22px; border-bottom: var(--line);

  }

.g-identite { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }

/* membres choisis : puces avatar avec ✕ — toute la puce est la cible (≥ 44 px), la croix n'est que le signe */
.puces { display: flex; gap: 10px; overflow-x: auto; padding: 4px 4px 14px; margin: 0 -4px; scrollbar-width: none; }
.puce:focus-visible { outline-offset: 0; border-radius: 12px; }

/* ══ 7. LA BANNIÈRE DE NOTIFICATION — descend du haut, s'efface seule après ~3,5 s ═══════════════════════════════════════
   Le chemin d'entrée est le chemin de sortie (apple-design, §7). Elle ne reçoit aucun toucher : on ne la rate pas, on ne
   la ferme pas — elle ne se met jamais devant ce qu'on fait. */
.notif {
  --haut: max(10px, calc(env(safe-area-inset-top, 0px) + 8px));
  position: fixed; z-index: 50; top: var(--haut); left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  margin: 0 auto; max-width: 440px; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 24px;
  background: var(--notif-bg); -webkit-backdrop-filter: blur(40px) saturate(180%); backdrop-filter: blur(40px) saturate(180%);
  border: var(--line); box-shadow: 0 18px 44px rgba(0,0,0,.28); color: var(--text); pointer-events: none;
  transform: translateY(calc(-100% - var(--haut) - 24px)); opacity: 0; transition: transform .5s cubic-bezier(.32,.72,0,1), opacity .35s;
}
.notif.on { transform: none; opacity: 1; }
.notif img { width: 38px; height: 38px; border-radius: 10px; display: block; flex: none; }
.notif-corps { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.notif-tete { display: flex; align-items: baseline; gap: 8px; }
.notif-tete b { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.notif-tete span { margin-left: auto; font-size: 13px; color: var(--sub-meta); }
.notif-texte { font-size: 15px; line-height: 20px; letter-spacing: -.01em; text-wrap: pretty; overflow-wrap: anywhere; }
.notif-aide { font-size: 13px; line-height: 17px; color: var(--sub-meta); overflow-wrap: anywhere; }
.notif-aide:empty { display: none; }

/* un petit mot qui s'efface seul (« Modifier » n'est pas encore dessiné) */
/* ⛔ centré par left/right + margin:auto + width:max-content, JAMAIS par left:50% + translate(-50%) : à largeur automatique, la boîte
   ne prend que la place qui reste à droite de son bord gauche (180 px sur 360, deux lignes) — CLAUDE.md, « boîte absolue centrée ». */
.mot {
  position: fixed; z-index: 49; left: 16px; right: 16px; margin: 0 auto; width: max-content; max-width: min(440px, calc(100vw - 32px));
  top: calc(env(safe-area-inset-top, 0px) + 56px); padding: 9px 16px; border-radius: 18px; text-align: center;
  background: rgba(28,28,30,.9); color: #fff; font-size: 14px; line-height: 18px; pointer-events: none; overflow-wrap: anywhere;
  transform: translateY(-8px); opacity: 0; transition: transform .35s cubic-bezier(.32,.72,0,1), opacity .25s;
}
.mot.on { transform: none; opacity: 1; }

/* ══ 9. LA CONVERSATION — téléphone : un écran qui recouvre la liste ; 900-1 099 : elle remplace la liste, avec un retour ;
   dès 1 100 px : MAÎTRE-DÉTAIL, la liste (colonne bornée) et la conversation côte à côte ═══════════════════════════════════
   Ce que la maquette dessine (nav en verre, bulles 20/6, photos 118×88, vocal, « Lu », saisie, champ « Message ») est ici ; ce
   qu'elle ne dessine pas (un vrai champ, le retour, le défilement, l'enregistrement) est ajouté sans toucher aux jetons. */
:root { --col-liste: clamp(340px, 30vw, 440px); }
.conv-ecran {
  position: fixed; z-index: 30; top: var(--vvt, 0px); left: 0; right: 0; height: var(--vvh, 100%); display: none; flex-direction: column; min-height: 0;
  background-color: var(--base); background-image: var(--screen); background-attachment: fixed; outline: none;
}

.conv-vide {
  position: fixed; z-index: 20; top: 0; bottom: 0; right: 0; left: calc(236px + var(--col-liste)); display: none; place-items: center; padding: 24px; text-align: center;
  border-left: var(--sep);
}
.conv-vide p { max-width: 28ch; font-size: 15px; line-height: 20px; color: var(--sub-meta); }
.conv-vide .coquille-icone { margin: 0 auto 12px; }
@keyframes pousse { from { transform: translateX(28px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (max-width: 899.98px) {
  html[data-conv] .conv-ecran { animation: pousse .38s cubic-bezier(.32,.72,0,1) both; }
  html[data-conv] .tabs { display: none; }
}
@media (max-width: 1099.98px) { html[data-conv], html[data-conv] body { overflow: hidden; } }
@media (min-width: 900px) { .conv-ecran { left: 236px; } }
@media (min-width: 1100px) {
  html[data-vue="messages"] .app { grid-template-columns: 236px var(--col-liste) minmax(0, 1fr); }
  html[data-vue="messages"] .contenu { padding-left: 16px; padding-right: 16px; }
  html[data-vue="messages"] .conv-ecran { left: calc(236px + var(--col-liste)); border-left: var(--sep); }
  html[data-vue="messages"]:not([data-conv]) .conv-vide { display: grid; }
  .conv-nav .conv-retour { display: none; }
}

.conv-nav {
  flex: none; display: flex; align-items: center; gap: 6px;
  padding: calc(env(safe-area-inset-top, 0px) + 2px) max(10px, env(safe-area-inset-right, 0px)) 8px max(10px, env(safe-area-inset-left, 0px));
  background: var(--nav-bar); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%); border-bottom: var(--line);
}
.conv-gauche, .conv-droite { flex: none; width: 76px; display: flex; align-items: center; }
.conv-droite { justify-content: flex-end; }

.conv-retour svg { width: 12px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.badge { min-width: 18px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--fill); color: var(--on-fill); font-size: 12px; font-weight: 600; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.conv-cam { min-height: 44px; min-width: 44px; display: inline-grid; place-items: center; color: var(--accent); font-size: 24px; }
.conv-titre { flex: 1; min-width: 0; min-height: 44px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text); }
.conv-titre .avatar { width: 44px; height: 44px; font-size: 16px; }
.conv-titre-nom { max-width: 100%; display: flex; align-items: center; gap: 3px; font-size: 12px; line-height: 16px; }
.conv-titre-nom > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv-titre-nom .chev { width: 7px; height: 11px; stroke: var(--sub); }

.conv-fil {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-color: var(--faint) transparent;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
}
.conv-fil:focus-visible { outline-offset: -3px; }
/* ⛔ la colonne se borne : à 2 560 px, une bulle à 78 % de la fenêtre serait une ligne de 1 900 px */
.conv-colonne { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 3px; }
.datage, .systeme { text-align: center; font-size: 11px; line-height: 14px; color: var(--sub-meta); overflow-wrap: anywhere; }
.datage { font-weight: 600; margin: 6px 0 10px; }
.systeme { margin: 10px 8px; }
.msg { display: flex; flex-direction: column; gap: 2px; margin-top: 10px; }

.msg.de-moi { align-items: flex-end; }
.msg.de-autre { align-items: flex-start; }

.bulle {
  max-width: 78%; padding: 8px 13px; font-size: 17px; line-height: 22px; letter-spacing: -.02em; text-wrap: pretty;
  overflow-wrap: anywhere; white-space: pre-wrap; user-select: text; -webkit-user-select: text;
}
.recue { background: var(--bubble-in); color: var(--bubble-in-fg); border-radius: 20px 20px 20px 6px; }

.photos { display: flex; flex-wrap: wrap; gap: 4px; max-width: 78%; }
.msg.de-moi .photos { justify-content: flex-end; }
.photo { position: relative; width: 118px; height: 88px; padding: 0; border-radius: 14px; overflow: hidden; display: grid; place-items: center; background: var(--field); color: var(--sub); }
.photo .ic { font-size: 22px; stroke-width: 1.8; }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

button.photo { transition: transform .12s ease-out; }
button.photo:active { transform: scale(.97); }
.vocal { min-height: 48px; display: flex; align-items: center; gap: 10px; padding: 10px 14px; max-width: 78%; text-align: left; }
.vocal-disque { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: 50%; background: color-mix(in srgb, currentColor 18%, transparent); font-size: 12px; }
.vocal-disque .pause, .vocal[data-lecture] .vocal-disque .play { display: none; }

.statut { padding: 0 12px; font-size: 11px; line-height: 14px; color: var(--sub-meta); }
.saisie-ind { align-self: flex-start; display: flex; align-items: center; gap: 4px; padding: 10px 14px; margin-top: 8px; border-radius: 20px 20px 20px 6px; background: var(--bubble-in); }
.saisie-ind i { width: 7px; height: 7px; border-radius: 50%; background: var(--sub); animation: saisie 1.2s infinite; }
.saisie-ind i:nth-child(2) { animation-delay: .2s; }
.saisie-ind i:nth-child(3) { animation-delay: .4s; }
@keyframes saisie { 0%, 60%, 100% { opacity: .35; transform: none; } 30% { opacity: 1; transform: translateY(-2px); } }

.avis-saisie {
  flex: none; margin: 0 max(12px, env(safe-area-inset-right, 0px)) 6px max(12px, env(safe-area-inset-left, 0px)); padding: 9px 14px; border-radius: 14px;
  background: var(--card); border: var(--line); color: var(--text); font-size: 14px; line-height: 19px; overflow-wrap: anywhere;
}
.composer {
  flex: none; padding: 8px max(12px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
  background: var(--nav-bar); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
}
.compo-ligne, .enreg { max-width: 860px; margin: 0 auto; display: flex; align-items: flex-end; gap: 6px; }
.compo-bouton { flex: none; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; color: var(--sub); font-size: 22px; touch-action: manipulation; transition: transform .12s ease-out; }
.compo-bouton:active { transform: scale(.92); }
.compo-bouton .disque { display: grid; place-items: center; border-radius: 50%; }
.compo-plus .disque { width: 34px; height: 34px; background: var(--field); font-size: 16px; }
.compo-plus .ic { stroke-width: 2.4; }
.compo-micro { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.envoyer { color: var(--on-fill); }
.envoyer .disque { width: 28px; height: 28px; background: var(--fill); font-size: 14px; }
.envoyer .ic { stroke-width: 2.6; }
.pilule-saisie { --pad-y: 7px; flex: 1; min-width: 0; min-height: 36px; display: flex; align-items: flex-end; border-radius: 18px; border: var(--line); background: var(--input-bg); }
.pilule-saisie:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.pilule-saisie textarea {
  flex: 1; min-width: 0; height: 36px; max-height: calc(5 * 22px + 2 * var(--pad-y)); padding: var(--pad-y) 6px var(--pad-y) 14px; border: 0; outline: 0; resize: none; background: transparent;
  font-size: 17px; line-height: 22px; letter-spacing: -.02em; color: var(--text); caret-color: var(--accent); overflow-y: auto; -webkit-appearance: none; appearance: none;
}

@media (pointer: coarse) {
  .compo-bouton { width: 44px; height: 44px; }
  .pilule-saisie { --pad-y: 11px; min-height: 44px; border-radius: 22px; }
  .pilule-saisie textarea { height: 44px; }
}

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
.enreg-duree { min-width: 40px; font-size: 17px; font-variant-numeric: tabular-nums; }
.enreg-onde { flex: 1; min-width: 0; height: 28px; display: flex; align-items: center; justify-content: flex-end; gap: 2px; overflow: hidden; }
.enreg-onde i { width: 3px; flex: none; border-radius: 2px; background: var(--accent); }

/* la photo agrandie : un voile noir, la photo en entier, une croix de 44 px — Échap, le retour système et le voile la ferment */
.visionneuse {
  position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: calc(env(safe-area-inset-top, 0px) + 56px) 12px calc(env(safe-area-inset-bottom, 0px) + 12px);
  background: rgba(0,0,0,.88);
}
.visionneuse img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 12px; display: block; }
.visionneuse-fermer { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 6px); right: max(8px, env(safe-area-inset-right, 0px)); width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; background: rgba(255,255,255,.16); color: #fff; font-size: 18px; }

/* ══ 8. LES RÉGLAGES DE L'APPAREIL : transparence et mouvement ═════════════════════════════════════════════════════════════
   ⛔ Retirer le flou SANS rendre de matière laisserait un texte posé sur ce qui passe dessous : on remplace la vitre par un
   aplat plein (« un filtre de fond se déclare AVEC sa surface », et l'inverse aussi). */
@media (prefers-reduced-transparency: reduce) {
  [data-glass] { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; background: var(--solide) !important; }
  .feuille { background: var(--solide-feuille) !important; }
  .notif { background: var(--solide-notif) !important; }
}
@media (prefers-reduced-motion: reduce) {

  /* en couleurs forcées les fonds disparaissent : seuls les CONTOURS restent — une bulle, une photo, un vocal en gardent un, sinon émis et reçu ne se

  .bulle, .photo, .vocal, .saisie-ind, .pilule-saisie, .avis-saisie { border: 1px solid CanvasText; }

}

<script src="source.js"></script>
<script>
(function () {
  'use strict';

  /* ═══ 1. LA SOURCE — l'UNIQUE porte vers les données ═══════════════════════════════════════════════════════════════════════
     ⛔ Cette page ne contient AUCUNE donnée et n'en modifie AUCUNE : tout ce qu'elle sait des personnes et des conversations vient de
     `window.OPMSG_SOURCE` (source.js), et tout ce qu'elle change passe par une de ses méthodes (envoyer, marquerLu, creerGroupe).
     Brancher le serveur d'OP MESSAGES, plus tard, c'est remplacer ce seul objet : les écrans ci-dessous ne bougent pas.
     Ce que la page garde est un INSTANTANÉ de ce que la source a rendu, rafraîchi quand elle le dit (`ecouter`). */
  const $ = id => document.getElementById(id);
  const source = window.OPMSG_SOURCE;
  if (!source) { $('contenu').innerHTML = '<p class="vide">Les données de l\'aperçu n\'ont pas pu être chargées.</p>'; return; }
  const MOI = source.moi();
  const CONTACTS = source.contacts();
  const VUES = {
    messages: { titre: 'Messages',  icone: 'i-chat' },
    appels:   { titre: 'Appels',    icone: 'i-phone', texte: 'L\'historique des appels et les appels de groupe, audio ou vidéo.' },
    reunions: { titre: 'Réunions',  icone: 'i-video', texte: 'L\'agenda, la programmation, les invités et les rappels.' },
    reglages: { titre: 'Réglages',  icone: 'i-gear',  texte: 'Le compte, les notifications et la confidentialité.' }
  };
  const ORDRE = ['messages', 'appels', 'reunions', 'reglages'];
  const EPHEMERES = [[0, 'Désactivés'], [86400, '24 heures'], [604800, '7 jours'], [7776000, '90 jours']];
  const VOCAL_MIN_MS = 800, VOCAL_MAX_MS = 180000, TENU_MS = 600, TEXTE_MAX = 4000;

  /* ═══ 2. L'ÉTAT — un seul objet, que des instantanés et des gestes en cours ════════════════════════════════════════════════ */
  const etat = {
    route: null,                  // { vue, conv, feuille, photo } — c'est elle qui est écrite dans l'historique
    conversations: [],            // la liste, telle que la source l'a rendue
    conv: null, convDonnees: null, jeton: 0,
    recherche: '', neuves: new Set(), brouillons: {}, scrollListe: 0, posVues: {}, forcerBas: false, envoiEnCours: false,
    groupe: groupeVierge(), garderPhoto: false, photo: null, creation: false
  };
  function groupeVierge() { return { ouvert: false, nom: '', photo: null, choisis: [], recherche: '', ephemeres: 0, annonces: false }; }

  /* ═══ 3. OUTILS ═══════════════════════════════════════════════════════════════════════════════════════════════════════════ */
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  /* la recherche ignore accents et casse : « ines » trouve « Inès » */
  const norme = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  const contactDe = id => CONTACTS.find(c => c.id === id);
  const prenom = c => c.nom.split(' ')[0];
  const icone = (id, cls) => '<svg class="ic' + (cls ? ' ' + cls : '') + '" aria-hidden="true"><use href="#' + id + '"/></svg>';
  const CHEVRON = '<svg class="chev" viewBox="0 0 8 13" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5 1.5 11.5"/></svg>';
  const blob = u => typeof u === 'string' && /^blob:/.test(u);
  /* l'avatar d'une photo choisie s'écrit en style direct : l'adresse est un blob: fabriqué par la page, vérifié, puis échappé */
  const avatar = c => '<span class="avatar av' + (((c.avatar | 0) % 6 + 6) % 6) + '"' + (blob(c.photo) ? ' style="background-image:url(' + esc(c.photo) + ')"' : '') + ' aria-hidden="true">' + (blob(c.photo) ? '' : esc(c.initiales || '')) + '</span>';

  /* les dates : l'heure du jour, « Hier », le jour de la semaine, puis la date — tout se calcule sur l'horloge de l'appareil */
  const FMT_HEURE = new Intl.DateTimeFormat('fr-FR', { hour: '2-digit', minute: '2-digit' });
  const FMT_JOUR = new Intl.DateTimeFormat('fr-FR', { weekday: 'short' });
  const FMT_DATE = new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'short' });
  const maj1 = s => s.charAt(0).toUpperCase() + s.slice(1);
  const debutDeJour = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const ecartJours = (t, ref) => Math.round((debutDeJour(ref) - debutDeJour(t)) / 86400000);
  function libelleListe(t) {
    const now = Date.now(), j = ecartJours(t, now);
    if (now - t < 60000 && now >= t) return 'maintenant';
    if (j <= 0) return FMT_HEURE.format(t);
    if (j === 1) return 'Hier';
    return j < 7 ? maj1(FMT_JOUR.format(t)) : FMT_DATE.format(t);
  }
  function libelleDatage(t) {
    const j = ecartJours(t, Date.now()), h = FMT_HEURE.format(t);
    if (j <= 0) return 'Aujourd\'hui ' + h;
    if (j === 1) return 'Hier ' + h;
    return (j < 7 ? maj1(FMT_JOUR.format(t)) : FMT_DATE.format(t)) + ' ' + h;
  }
  const duree = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');

  /* ═══ 4. LA LISTE MESSAGES ════════════════════════════════════════════════════════════════════════════════════════════════ */
  function ligneConv(c, neuve) {
    const sel = etat.conv === c.id;
    return '<li' + (neuve ? ' class="conv-neuve"' : '') + '><button type="button" class="conv presse" data-ouvrir="' + esc(c.id) + '"' + (sel ? ' aria-current="true"' : '') + '>' +
      '<span class="conv-point">' + (c.nonLu ? '<i class="point"></i><span class="sr-seul">Non lu</span>' : '') + '</span>' + avatar(c) +
      '<span class="conv-corps"><span class="conv-ligne"><span class="conv-nom">' + esc(c.nom) + '</span><span class="conv-heure" data-t="' + (+c.t || 0) + '">' + esc(libelleListe(c.t)) + '</span>' + CHEVRON + '</span>' +
      '<span class="conv-apercu" dir="auto">' + esc(c.apercu) + '</span></span></button></li>';
  }
  function rendreListe() {
    const q = norme(etat.recherche);
    const vues = etat.conversations.filter(c => !q || norme(c.nom).includes(q) || norme(c.apercu).includes(q));
    /* ⛔ une conversation neuve s'anime UNE fois : le drapeau est consommé par ce rendu, pas gardé — sinon chaque frappe dans la
       recherche (qui refait toute la liste) rejouerait l'entrée de chaque groupe créé depuis le début */
    const neuves = new Set(etat.neuves); etat.neuves.clear();
    $('liste-conv').innerHTML = vues.length ? vues.map(c => ligneConv(c, neuves.has(c.id))).join('') :
      '<li class="vide">Aucun résultat pour « ' + esc(etat.recherche.trim()) + ' »</li>';
    /* épinglés : les conversations marquées, une colonne de 76 px chacune (nom court, jamais coupé en deux) */
    const pins = etat.conversations.filter(c => c.epingle);
    $('epingles').innerHTML = pins.map(c => '<li class="epingle"><button type="button" class="epingle-bouton" data-ouvrir="' + esc(c.id) + '"' + (etat.conv === c.id ? ' aria-current="true"' : '') + '>' +
      avatar(c) + '<span class="epingle-nom">' + esc(c.court || c.nom) + '</span></button></li>').join('');
    $('epingles').hidden = !pins.length;
    majBadge();
  }
  async function rafraichirListe() {
    etat.conversations = await source.lister();
    rendreListe();
  }

  /* ═══ 5. LES AUTRES ÉCRANS — des coquilles « bientôt » (étapes 3 à 5) ═════════════════════════════════════════════════════
     Ajouter un écran = remplir UNE entrée de VUES et écrire une fonction de rendu ici ; la navigation, l'état et les
     jetons ne bougent pas. */
  function rendreCoquille(cle) {
    const v = VUES[cle], sec = $('vue-' + cle);
    sec.innerHTML = '<div class="entete-vue"></div><h1 class="grand-titre" id="titre-' + cle + '">' + esc(v.titre) + '</h1>' +
      '<div class="coquille"><span class="coquille-icone">' + icone(v.icone) + '</span><h2>Bientôt disponible</h2><p>' + esc(v.texte) + ' Cet écran n\'est pas encore dessiné dans l\'aperçu.</p></div>';
  }
  function construireNavigation() {
    const lien = (cle, cls) => '<a href="#' + cle + '" class="' + cls + '" data-vue="' + cle + '">' + icone(VUES[cle].icone) + '<span>' + esc(VUES[cle].titre) + '</span></a>';
    $('nav-side').innerHTML = ORDRE.map(c => lien(c, 'side-lien')).join('');
    $('tabs').insertAdjacentHTML('beforeend', ORDRE.map(c => lien(c, 'tab')).join(''));
  }

  /* ═══ 6. LA NAVIGATION — UNE ROUTE, UNE ENTRÉE D'HISTORIQUE PAR COUCHE ═════════════════════════════════════════════════════
     La route dit tout ce qui est ouvert : la vue, la conversation, la feuille « Nouveau groupe », la photo agrandie. Chaque couche
     qu'on ouvre POUSSE une entrée (le retour système — Android, le geste d'iOS, le bouton du navigateur — la referme au lieu de
     quitter la page) ; chaque couche qu'on ferme à la main REND cette entrée (`history.back()`), et c'est `popstate` — un seul
     chemin — qui ferme vraiment. ⛔ « UN GESTE, UNE NAVIGATION » (CLAUDE.md) : cette page n'écoute AUCUN geste de balayage à elle,
     donc le navigateur n'a pas de second retour à jouer ; et un bouton qui ferme ne ferme pas ET ne navigue pas — il navigue, et
     la fermeture suit. Une entrée neuve n'est posée que si quelque chose s'ouvre : passer d'une conversation à l'autre (au bureau)
     REMPLACE l'entrée au lieu d'en empiler. */
  const memeRoute = (a, b) => !!a && !!b && a.vue === b.vue && (a.conv || null) === (b.conv || null) && !!a.feuille === !!b.feuille && (a.photo || null) === (b.photo || null);
  const urlDe = r => '#' + r.vue + (r.conv ? '/' + encodeURIComponent(r.conv) : '');
  function routeDepuisHash() {
    const p = location.hash.slice(1).split('/');
    let conv = null; try { conv = p[1] ? decodeURIComponent(p[1]) : null; } catch (e) { conv = null; }
    /* ⛔ `VUES[p[0]]` lit aussi la chaîne de prototypes : « #constructor » ou « #__proto__ » passaient pour des vues et laissaient les quatre masquées */
    const vue = Object.prototype.hasOwnProperty.call(VUES, p[0]) ? p[0] : 'messages';
    return { vue, conv: vue === 'messages' && p[0] === 'messages' ? conv : null, feuille: false, photo: null };
  }
  const entree = () => (history.state && history.state.opmsg) ? history.state : null;
  function parentDe(r) {
    if (r.photo) return Object.assign({}, r, { photo: null });
    if (r.feuille) return Object.assign({}, r, { feuille: false });
    if (r.conv) return Object.assign({}, r, { conv: null });
    return null;
  }
  function pousser(r) {
    const h = entree();
    history.pushState({ opmsg: 1, n: h ? h.n + 1 : 1, r, p: etat.route }, '', urlDe(r));
    appliquer(r);
  }
  function remplacer(r) {
    const h = entree();
    history.replaceState({ opmsg: 1, n: h ? h.n : 0, r, p: h ? h.p : null }, '', urlDe(r));
    appliquer(r);
  }
  /* fermer la couche du dessus : on rend l'entrée qu'on avait posée — ou, arrivé par un lien direct (aucune entrée à rendre), on
     remplace par la route d'en dessous */
  function fermerCouche() {
    const parent = parentDe(etat.route); if (!parent) return;
    const h = entree();
    if (h && h.n > 0 && h.p && memeRoute(h.p, parent)) history.back(); else remplacer(parent);
  }
  /* la position de la liste est rendue PAR LA PAGE (etat.scrollListe, au retour), pas par la restauration native de l'historique : celle-ci diffère d'un
     navigateur à l'autre (Safari iOS ne la rend pas toujours sur un retour système) et masquait, ici, le retrait de notre propre mémoire (sonde, S04) */
  try { history.scrollRestoration = 'manual'; } catch (e) { /* un navigateur sans l'option garde la sienne */ }
  window.addEventListener('popstate', e => appliquer(e.state && e.state.opmsg ? e.state.r : routeDepuisHash()));

  /* appliquer(route) : l'écran DIT la route, rien d'autre. Elle ne pousse jamais d'historique — elle est jouée aussi par popstate. */
  function appliquer(r) {
    const prec = etat.route; etat.route = r;
    const racine = document.documentElement;
    if (!prec || prec.vue !== r.vue) {
      /* ⛔ la position se LIT avant de masquer la vue : une fois masquée, le document raccourcit et la fenêtre est ramenée à la hauteur de la vue d'arrivée (mesuré : 500 px lus 106) */
      if (prec) etat.posVues[prec.vue] = prec.vue === 'messages' && etat.conv ? etat.scrollListe : window.scrollY;
      ORDRE.forEach(k => { $('vue-' + k).hidden = k !== r.vue; });
      document.querySelectorAll('[data-vue]').forEach(a => { if (a.dataset.vue === r.vue) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
      $('tabs').style.setProperty('--i', ORDRE.indexOf(r.vue));
      document.title = VUES[r.vue].titre + ' — OP MESSAGES, aperçu';
      /* chaque vue garde SA position (comme une barre d'onglets d'iPhone) : la liste défilée, un tour par Appels, et elle est là où on l'a laissée.
         ⛔ avec une conversation ouverte la fenêtre n'est plus la liste (iOS la ramène en haut pour le clavier) : la position de la liste est celle gardée à l'ouverture */
      if (prec) window.scrollTo(0, etat.posVues[r.vue] || 0);
    }
    racine.dataset.vue = r.vue;
    const veutConv = r.vue === 'messages' ? (r.conv || null) : null;
    if (veutConv !== etat.conv) { if (veutConv) ouvrirConv(veutConv); else fermerConv(); }
    if (r.feuille && !etat.groupe.ouvert) ouvrirFeuilleDom(); else if (!r.feuille && etat.groupe.ouvert) fermerFeuilleDom();
    const cle = r.photo || null;
    if (cle !== etat.photo) { if (cle) ouvrirPhotoDom(cle); else fermerPhotoDom(); }
    synchroInert();
  }
  /* ce qui n'est pas au premier plan ne reçoit ni le focus ni le lecteur d'écran : la feuille et la photo rendent TOUT inerte,
     la conversation rend la liste inerte quand elle la recouvre (jusqu'à 1 099 px) */
  const largeBureau = matchMedia('(min-width: 1100px)');
  function synchroInert() {
    $('app').inert = !!(etat.groupe.ouvert || etat.photo);
    $('contenu').inert = !!(etat.conv && !largeBureau.matches);
  }
  if (largeBureau.addEventListener) largeBureau.addEventListener('change', synchroInert);

  document.addEventListener('click', e => {
    const a = e.target.closest('a[data-vue]');
    if (a) {
      e.preventDefault();
      const r = { vue: a.dataset.vue, conv: null, feuille: false, photo: null };
      if (memeRoute(etat.route, r)) window.scrollTo(0, 0); else pousser(r);
      return;
    }
    const o = e.target.closest('[data-ouvrir]');
    if (o) ouvrirDepuisListe(o.dataset.ouvrir, o);
  });

  /* ═══ 7. LA CONVERSATION ════════════════════════════════════════════════════════════════════════════════════════════════════ */
  function majBadge() {
    const n = etat.conversations.filter(c => c.id !== etat.conv && c.nonLu).length;
    const b = $('conv-badge');
    b.hidden = n === 0; b.textContent = n;
    $('conv-retour').setAttribute('aria-label', n ? 'Retour aux conversations, ' + n + (n === 1 ? ' autre conversation non lue' : ' autres conversations non lues') : 'Retour aux conversations');
  }
  function ouvrirDepuisListe(id, declencheurEl) {
    etat.declencheurConv = declencheurEl;
    const r = Object.assign({}, etat.route, { vue: 'messages', conv: id, feuille: false, photo: null });
    if (etat.conv) remplacer(r); else pousser(r);
  }
  function rendreEntete(c) {
    $('conv-titre').innerHTML = avatar(c) + '<span class="conv-titre-nom"><span>' + esc(c.nom) + '</span>' + CHEVRON + '</span>';
    $('conv-titre').setAttribute('aria-label', c.nom + ' — infos du ' + (c.type === 'groupe' ? 'groupe' : 'contact') + ' (bientôt)');
  }
  const nomAuteur = id => { const c = contactDe(id); return c ? prenom(c) : '?'; };

  /* un message rend { h, st } : h = son balisage SANS le statut, st = « Lu 14:06 » / « Envoyé » / null. Le statut change seul (la lecture arrive après l'envoi) :
     il se met à jour EN PLACE, sans refaire la bulle ni recréer sa photo (peindreMessages) */
  function htmlMessage(c, m, premier, estDernierEnvoye) {
    const moi = m.auteur === MOI.id;
    const sens = moi ? 'envoyee' : 'recue';
    let h = '<div class="msg ' + (moi ? 'de-moi' : 'de-autre') + (premier ? '' : ' suite') + '" data-mid="' + esc(m.id) + '">';
    if (!moi && c.type === 'groupe' && premier) h += '<span class="msg-nom">' + esc(nomAuteur(m.auteur)) + '</span>';
    if (m.photos) {
      h += '<span class="photos' + (m.photos.length === 1 ? ' une' : '') + '">' + m.photos.map((p, i) => blob(p.url) ?
        '<button type="button" class="photo presse" data-photo="' + esc(m.id) + '|' + i + '" aria-label="Agrandir la photo ' + (i + 1) + ' sur ' + m.photos.length + '"><img src="' + esc(p.url) + '" alt="Photo envoyée par ' + esc(moi ? 'vous' : nomAuteur(m.auteur)) + '"></button>' :
        '<span class="photo" role="img" aria-label="Photo d\'exemple">' + icone('i-image') + '</span>').join('') + '</span>';
    } else if (m.vocal) {
      h += '<button type="button" class="vocal ' + sens + ' presse" data-lire="' + esc(m.id) + '" aria-label="Lire le message vocal de ' + duree(m.vocal.dur) + '">' +
        '<span class="vocal-disque">' + icone('i-play', 'plein play') + icone('i-pause', 'plein pause') + '</span>' +
        '<span class="onde" aria-hidden="true">' + (m.vocal.bars && m.vocal.bars.length ? m.vocal.bars : [8, 14, 18, 10, 16, 6, 12, 18, 9, 14]).map(n => '<i style="height:' + Math.max(4, Math.min(20, n | 0)) + 'px"></i>').join('') + '</span>' +
        '<span class="vocal-duree">' + duree(m.vocal.dur) + '</span></button>';
    } else {
      h += '<span class="bulle ' + sens + '" dir="auto">' + esc(m.texte) + '</span>';
    }
    return { h: h + '</div>', st: estDernierEnvoye ? (m.lu ? 'Lu ' + FMT_HEURE.format(m.lu) : 'Envoyé') : null };
  }
  function partiesMessages(c) {
    const P = []; let prec = null;
    const dernierEnvoye = c.messages.filter(m => m.auteur === MOI.id && !m.systeme).pop();
    c.messages.forEach(m => {
      const coupure = !prec || m.t - prec.t >= 3600000 || debutDeJour(m.t) !== debutDeJour(prec.t);
      if (coupure) P.push({ h: '<div class="datage">' + esc(libelleDatage(m.t)) + '</div>', st: null });
      if (m.systeme) { P.push({ h: '<div class="systeme">' + esc(m.texte) + '</div>', st: null }); prec = m; return; }
      const serie = !coupure && prec && !prec.systeme && prec.auteur === m.auteur && m.t - prec.t < 300000;
      P.push(htmlMessage(c, m, !serie, dernierEnvoye && m.id === dernierEnvoye.id));
      prec = m;
    });
    if (c.saisie) P.push({ h: '<div class="saisie-ind" role="img" aria-label="' + esc(nomAuteur(c.saisie.contact)) + ' est en train d\'écrire"><i></i><i></i><i></i></div>', st: null });
    return P;

  function majStatut(el, st) {
    let s = el.querySelector(':scope > .statut');

    if (s.textContent !== st) s.textContent = st;

  /* ⛔ on ne refait pas le fil à chaque événement : refaire `innerHTML` recréait les photos (scintillement), perdait le focus d'une bulle et la sélection d'un

  function peindreMessages(parts) {

    const actif = document.activeElement, cle = actif && col.contains(actif) ? (actif.dataset.lire ? 'lire' : actif.dataset.photo ? 'photo' : null) : null, val = cle ? actif.dataset[cle] : null;
    for (let i = 0; i < parts.length; i++) {

      tpl.innerHTML = parts[i].h; const neuf = tpl.content.firstElementChild; neuf.__h = parts[i].h; majStatut(neuf, parts[i].st);
      if (vieux) col.replaceChild(neuf, vieux); else col.appendChild(neuf);

    if (cle && !col.contains(document.activeElement)) { const b = col.querySelector('[data-' + cle + '="' + val.replace(/"/g, '') + '"]'); if (b) b.focus({ preventScroll: true }); }
  }
  function rendreConv(c, force) {
    const fil = $('conv-fil');
    const colle = force || etat.forcerBas || (fil.scrollHeight - fil.scrollTop - fil.clientHeight < 80);
    etat.forcerBas = false;
    etat.convDonnees = c;
    rendreEntete(c);
    peindreMessages(partiesMessages(c));
    $('conv-messages').setAttribute('aria-busy', 'false');
    /* « Seuls les admins écrivent » : une personne qui n'est pas admin lit, elle n'écrit pas */
    const ferme = c.annoncesSeulement && c.admins.indexOf(MOI.id) < 0;
    $('compo').hidden = ferme || !!enr.etat && enr.etat !== 'repos'; $('compo-ferme').hidden = !ferme;
    appliquerLecture();
    if (colle) defilerBas();
  }
  function defilerBas() { const f = $('conv-fil'); f.scrollTop = f.scrollHeight; }
  const trouverMessage = mid => etat.convDonnees && etat.convDonnees.messages.find(m => m.id === mid);

  async function ouvrirConv(id) {
    const jeton = ++etat.jeton;
    /* ⛔ passer d'une conversation à l'autre (maître-détail) ne passe PAS par fermerConv : la prise de son et la lecture de l'ancienne se coupent ici,
       sinon le vocal enregistré chez Camille partait chez Hugo (mesuré au bureau, 1er octobre 2026) */
    if (etat.conv && etat.conv !== id) { arreterLecture(); annulerEnregistrement(); }
    if (!etat.conv) etat.scrollListe = window.scrollY;
    etat.conv = id; etat.convDonnees = null;
    document.documentElement.dataset.conv = '1';
    const resume = etat.conversations.find(c => c.id === id);
    if (resume) rendreEntete(resume);
    $('conv-messages').innerHTML = ''; $('conv-messages').setAttribute('aria-busy', 'true');
    $('saisie').value = etat.brouillons[id] || ''; ajusterSaisie(); majBoutons(); masquerAvis();
    rendreListe();
    let c = null; try { c = await source.ouvrir(id); } catch (e) { c = null; }
    if (jeton !== etat.jeton) return;                       // une autre conversation (ou la liste) a pris la place pendant l'attente
    if (!c) { remplacer({ vue: 'messages', conv: null, feuille: false, photo: null }); mot('Cette conversation n\'existe plus.'); return; }
    rendreConv(c, true);
    synchroInert();
    if (matchMedia('(pointer: fine)').matches) $('saisie').focus({ preventScroll: true }); else $('conv-ecran').focus({ preventScroll: true });
    try { await source.marquerLu(id); } catch (e) { /* la source le dira par ecouter */ }
  }
  function fermerConv() {
    etat.jeton++;
    const id = etat.conv;
    if (id) etat.brouillons[id] = $('saisie').value;
    etat.conv = null; etat.convDonnees = null;
    delete document.documentElement.dataset.conv;
    arreterLecture(); annulerEnregistrement();
    rendreListe();
    synchroInert();
    const dec = etat.declencheurConv; etat.declencheurConv = null;
    requestAnimationFrame(() => {
      if (etat.route && etat.route.vue === 'messages') window.scrollTo(0, etat.scrollListe);
      const ligne = id && document.querySelector('[data-ouvrir="' + id.replace(/"/g, '') + '"]');
      if (ligne) ligne.focus({ preventScroll: true }); else if (dec && dec.isConnected && dec.focus) dec.focus({ preventScroll: true });
    });
  }
  async function rafraichirConv() {
    const id = etat.conv; if (!id) return;
    const jeton = etat.jeton;
    const c = await source.ouvrir(id);
    if (jeton !== etat.jeton || !c) return;
    /* ce qui est arrivé d'un AUTRE depuis le dernier rendu : annoncé au lecteur d'écran, et lu (la conversation est sous les yeux) — sinon le point « non lu »
       restait à côté de la conversation affichée. Jamais au premier rendu (ouvrirConv le marque lu lui-même). */
    const avant = etat.convDonnees ? new Set(etat.convDonnees.messages.map(m => m.id)) : null;
    const recus = avant ? c.messages.filter(m => !avant.has(m.id) && m.auteur !== MOI.id && !m.systeme) : [];
    rendreConv(c, false);
    if (recus.length) {
      annoncer(recus[recus.length - 1]);
      if (document.visibilityState === 'visible') { try { await source.marquerLu(id); } catch (e) { /* la source le dira par ecouter */ } }
    }
  }
  function annoncer(m) {
    const corps = m.texte || (m.photos ? (m.photos.length > 1 ? m.photos.length + ' photos' : 'une photo') : m.vocal ? 'un message vocal de ' + duree(m.vocal.dur) : '');
    const r = $('conv-annonce'); r.textContent = '';
    setTimeout(() => { r.textContent = nomAuteur(m.auteur) + ' : ' + corps; }, 60);
  }
  $('conv-retour').addEventListener('click', () => { if (!retap()) fermerCouche(); });
  $('conv-cam').addEventListener('click', () => { if (!retap()) pousser({ vue: 'appels', conv: null, feuille: false, photo: null }); });
  $('conv-titre').addEventListener('click', () => retap() || mot('Les infos du ' + (etat.convDonnees && etat.convDonnees.type === 'groupe' ? 'groupe' : 'contact') + ' arrivent bientôt'));

  /* ── la saisie : un VRAI champ, qui grandit jusqu'à 5 lignes ── */
  function ajusterSaisie() {
    const ta = $('saisie');
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, parseFloat(getComputedStyle(ta).maxHeight) || 124) + 'px';
  }
  function majBoutons() {
    const a = $('saisie').value.trim().length > 0;
    $('envoyer').hidden = !a; $('compo-micro').hidden = a;
  }
  const MESSAGES_ERREUR = { interdit: 'Seuls les admins peuvent écrire dans ce groupe.', 'trop-long': 'Ce message est trop long (4 000 signes au plus).', introuvable: 'Cette conversation n\'existe plus.' };
  let minAvis = 0;
  function avis(texte) {
    clearTimeout(minAvis);
    const a = $('avis'); a.textContent = texte; a.hidden = false;
    minAvis = setTimeout(masquerAvis, 7000);
  }
  function masquerAvis() { clearTimeout(minAvis); $('avis').hidden = true; $('avis').textContent = ''; }
  /* `cible` : la conversation POUR laquelle le geste a commencé (un vocal démarré chez Camille part chez Camille, même si l'on a changé de conversation entre-temps) */
  async function envoi(brouillon, cible) {
    const id = cible || etat.conv; if (!id) return false;
    if (id === etat.conv) etat.forcerBas = true;
    try { await source.envoyer(id, brouillon); return true; }
    catch (e) { etat.forcerBas = false; avis(MESSAGES_ERREUR[e && e.code] || 'Le message n\'a pas pu être envoyé.'); return false; }
  }
  async function envoyerTexte() {
    if (etat.envoiEnCours) return;                         // deux clics dans le même instant ne postent pas deux messages
    const ta = $('saisie'), t = ta.value.replace(/\s+$/, '');
    if (!t.trim()) return;
    if (t.length > TEXTE_MAX) { avis(texteTropLong(t.length)); return; }
    etat.envoiEnCours = true;
    try {
      const id = etat.conv, ok = await envoi({ texte: t });
      if (!ok) return;
      ta.value = ''; delete etat.brouillons[id]; ajusterSaisie(); majBoutons(); masquerAvis();
    } finally { etat.envoiEnCours = false; }
  }
  /* ⛔ un texte plus long que la limite ne se COUPE pas en silence (le champ garde ce qu'on a collé, la fin comprise) : on le dit tout de suite, et l'envoi attend */
  const texteTropLong = n => 'Ce message est trop long : ' + (n - TEXTE_MAX).toLocaleString('fr-FR') + ' signes en trop (' + TEXTE_MAX.toLocaleString('fr-FR') + ' au plus).';
  $('saisie').addEventListener('input', () => {
    ajusterSaisie(); majBoutons(); if (etat.conv) etat.brouillons[etat.conv] = $('saisie').value;
    const n = $('saisie').value.length;
    if (n > TEXTE_MAX) avis(texteTropLong(n)); else if (/trop long/.test($('avis').textContent)) masquerAvis();
  });
  /* un second toucher qui suit de près le premier tombe sur ce que le premier a LAISSÉ à sa place : la flèche d'envoi disparue, c'est le micro qui reçoit le
     toucher (et démarre une prise de son) ; la croix de la photo fermée, c'est la caméra. Pendant 400 ms après un geste qui change ce qu'il y a sous le doigt,
     ces commandes ne répondent pas (mesuré : double toucher sur la flèche → enregistrement lancé, sur iPhone, Android et au bureau). */
  let retapJusqua = 0;
  const armerRetap = () => { retapJusqua = Date.now() + 400; };
  const retap = () => Date.now() < retapJusqua;
  $('saisie').addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.isComposing) return;
    /* au bureau (une souris) : Entrée envoie, Maj+Entrée va à la ligne ; au doigt, Entrée va à la ligne (la flèche envoie) ;
       Ctrl/Cmd+Entrée envoie partout */
    if ((matchMedia('(pointer: fine)').matches && !e.shiftKey && !e.altKey) || e.ctrlKey || e.metaKey) { e.preventDefault(); envoyerTexte(); }
  });
  $('envoyer').addEventListener('mousedown', e => e.preventDefault());        // la flèche ne vole pas le focus (le clavier reste ouvert)
  $('envoyer').addEventListener('click', () => { armerRetap(); envoyerTexte(); });

  /* ── une photo : réduite par un canvas (le fichier d'origine ne part nulle part), validée par son décodage ── */
  /* un fichier INCOMPLET (téléchargement interrompu) se décode quand même en partie : on en envoyait la moitié, grise. Là où la fin d'un format est sans ambiguïté
     (PNG : le morceau IEND ; GIF : l'octet 0x3B ; WebP : la taille annoncée), on la vérifie. Pas pour le JPEG : des octets peuvent suivre légitimement son marqueur de fin
     (photos « en mouvement », vignettes) et on refuserait de vraies photos. */
  async function fichierTronque(f) {
    const oct = async (a, b) => new Uint8Array(await f.slice(a, b).arrayBuffer()), egal = (t, m, o) => m.every((x, i) => t[o + i] === x);
    const tete = await oct(0, 12), fin = await oct(Math.max(0, f.size - 12), f.size);
    if (egal(tete, [0x89, 0x50, 0x4e, 0x47], 0)) return !(fin.length >= 8 && egal(fin, [0x49, 0x45, 0x4e, 0x44, 0xae, 0x42, 0x60, 0x82], fin.length - 8));
    if (egal(tete, [0x47, 0x49, 0x46], 0)) return fin[fin.length - 1] !== 0x3b;
    if (egal(tete, [0x52, 0x49, 0x46, 0x46], 0) && egal(tete, [0x57, 0x45, 0x42, 0x50], 8)) return (tete[4] | tete[5] << 8 | tete[6] << 16 | tete[7] << 24) + 8 > f.size;
    return false;
  }
  async function reduireImage(fichier, cote, qualite) {
    if (!fichier || fichier.size > 40 * 1048576) throw new Error('trop-lourd');
    if (await fichierTronque(fichier)) throw new Error('illisible');
    let img;
    try { img = await createImageBitmap(fichier, { imageOrientation: 'from-image' }); }
    catch (e) {
      /* ⛔ `onload` suffit à une image dont l'EN-TÊTE est bon et le corps abîmé : elle « charge », mesure 300 × 200, et ne dessine RIEN — une photo blanche partait
         comme si de rien n'était (mesuré le 1er octobre 2026). `decode()` rejette, lui, une image qu'on ne peut pas décoder. */
      img = await new Promise((ok, ko) => {
        const u = URL.createObjectURL(fichier), i = new Image(), fini = bon => { URL.revokeObjectURL(u); if (bon) ok(i); else ko(new Error('illisible')); };
        i.src = u;
        if (i.decode) i.decode().then(() => fini(true), () => fini(false)); else { i.onload = () => fini(true); i.onerror = () => fini(false); }
      });
    }
    const w0 = img.width || img.naturalWidth, h0 = img.height || img.naturalHeight;
    if (!w0 || !h0 || w0 * h0 > 100e6) throw new Error('illisible');       // une image « vide » ou démesurée (bombe de décompression)
    const k = Math.min(1, cote / Math.max(w0, h0)), w = Math.max(1, Math.round(w0 * k)), h = Math.max(1, Math.round(h0 * k));
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const cx = cv.getContext('2d'); cx.drawImage(img, 0, 0, w, h);
    if (img.close) img.close();
    /* la preuve qu'il y avait une image : le dessin a posé au moins un point (le fond blanc, lui, se pose APRÈS — un JPEG n'a pas de transparence à garder) */
    const px = cx.getImageData(0, 0, w, h).data; let dessine = false;
    for (let i = 3; i < px.length; i += 4 * 29) if (px[i]) { dessine = true; break; }
    if (!dessine) throw new Error('illisible');
    cx.globalCompositeOperation = 'destination-over'; cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h);
    const b = await new Promise(r => cv.toBlob(r, 'image/jpeg', qualite));
    if (!b) throw new Error('illisible');
    return { blob: b, w, h };
  }

  function nettoyerFlux() {

    if (n === 'NotFoundError' || n === 'OverconstrainedError') return 'Aucun micro n\'a été trouvé sur cet appareil.';
    if (n === 'NotReadableError' || n === 'AbortError') return 'Le micro est utilisé par une autre application : fermez-la, puis réessayez.';

    enr.etat = 'demande'; enr.annule = false; enr.conv = etat.conv;

    catch (e) { enr.etat = 'repos'; avis(messageMicro(e)); return; }

  $('g-puces').addEventListener('click', e => {
    const b = e.target.closest('[data-retirer]'); if (!b) return;
    const id = b.dataset.retirer; basculer(id);
    const ligne = document.querySelector('#g-contacts .contact[data-id="' + id.replace(/"/g, '') + '"]');
    if (ligne && !ligne.hidden) ligne.focus({ preventScroll: true });
  });
  $('g-nom').addEventListener('input', e => { g().nom = e.target.value; });
  $('g-nom').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
  $('g-recherche').addEventListener('input', e => { g().recherche = e.target.value; synchroFeuille(); });
  $('g-ephemeres').addEventListener('click', () => { const G = g(); const i = EPHEMERES.findIndex(e => e[0] === G.ephemeres); G.ephemeres = EPHEMERES[(i + 1) % EPHEMERES.length][0]; synchroFeuille(); });
  $('g-annonces').addEventListener('click', () => { g().annonces = !g().annonces; synchroFeuille(); });
  /* la photo du groupe : réduite à 512 px par un canvas et VALIDÉE par son décodage — une image illisible laisse la pastille de repli, et le dit */
  $('g-photo-fichier').addEventListener('change', async e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    let r = null;
    try { r = await reduireImage(f, 512, .85); } catch (er) { r = null; }
    if (!etat.groupe.ouvert) return;                          // la feuille s'est fermée pendant le décodage
    if (!r) { e.target.value = ''; mot(g().photo ? 'Cette image n\'a pas pu être lue : la photo choisie avant est conservée.' : 'Cette image n\'a pas pu être lue : le groupe garde sa pastille.'); return; }
    if (g().photo) URL.revokeObjectURL(g().photo);
    g().photo = URL.createObjectURL(r.blob); synchroFeuille();
  });
  $('recherche-conv').addEventListener('input', e => { etat.recherche = e.target.value; rendreListe(); });
  $('btn-modifier').addEventListener('click', () => mot('« Modifier » arrive bientôt'));

  /* ── glisser la feuille vers le bas (téléphone) : elle suit le doigt 1:1, et à la fin on PROJETTE où le geste allait
        (apple-design §6) au lieu de juger la seule position de relâchement. Le relâchement rend la main au CSS, qui repart
        de la valeur visible : un geste repris au vol ne saute pas. ── */
  (function () {
    const tete = $('feuille-tete'), f = $('feuille'), mobile = matchMedia('(max-width: 699.98px)');
    let d = null;
    tete.addEventListener('pointerdown', e => {
      if (!mobile.matches || !etat.groupe.ouvert || e.target.closest('button')) return;
      d = { y0: e.clientY, h: [[e.timeStamp, e.clientY]], dy: 0 };
      tete.setPointerCapture(e.pointerId); f.style.transition = 'none';
    });
    tete.addEventListener('pointermove', e => {
      if (!d) return;
      const dy = e.clientY - d.y0;
      d.dy = dy > 0 ? dy : dy * 0.15;                      // au-dessus du point de départ : une résistance, pas un mur
      f.style.transform = 'translateY(' + d.dy + 'px)';
      d.h.push([e.timeStamp, e.clientY]); if (d.h.length > 6) d.h.shift();
    });
    const fin = e => {
      if (!d) return;
      const a = d.h[0], b = d.h[d.h.length - 1], dt = Math.max(1, b[0] - a[0]);
      const v = (b[1] - a[1]) / dt * 1000;                  // px/s au relâché
      const projete = d.dy + (v / 1000) * 0.99 / (1 - 0.99);
      const ferme = e.type !== 'pointercancel' && projete > f.offsetHeight * 0.35;
      d = null; f.style.transition = ''; f.style.transform = '';
      if (ferme) fermerFeuille(false);
    };
    tete.addEventListener('pointerup', fin); tete.addEventListener('pointercancel', fin);
  })();

  /* sur iOS, :active ne se pose qu'avec un écouteur de toucher quelque part : sans lui, la réponse au doigt attend le relâché */
  document.addEventListener('touchstart', function () {}, { passive: true });

  /* le clavier d'un iPhone ne rétrécit pas la page, il rétrécit la fenêtre VISUELLE : la conversation suit celle-là, sinon le champ
     de saisie reste caché derrière (mesuré impossible dans ce navigateur de test : écrit d'après la spécification, dit dans le rapport) */
  if (window.visualViewport) {
    const vv = window.visualViewport, root = document.documentElement.style;
    const suivre = () => {
      if (vv.scale <= 1.01 && vv.height < window.innerHeight - 80) { root.setProperty('--vvh', vv.height + 'px'); root.setProperty('--vvt', vv.offsetTop + 'px'); if (etat.conv) defilerBas(); }
      else { root.removeProperty('--vvh'); root.removeProperty('--vvt'); }
    };
    vv.addEventListener('resize', suivre); vv.addEventListener('scroll', suivre);
  }

  /* « maintenant » n'est vrai qu'une minute : la liste ne se refait que sur événement, donc l'heure de chaque ligne se remet à jour toute seule */
  setInterval(() => { document.querySelectorAll('#liste-conv .conv-heure[data-t]').forEach(e => { const x = libelleListe(+e.dataset.t); if (e.textContent !== x) e.textContent = x; }); }, 20000);

  /* ═══ 10. LE DÉMARRAGE ═══════════════════════════════════════════════════════════════════════════════════════════════════════ */
  async function demarrer() {
    $('moi-avatar').textContent = MOI.initiales; $('moi-nom').textContent = MOI.nom;
    construireNavigation();
    construireContacts();
    ['appels', 'reunions', 'reglages'].forEach(rendreCoquille);
    etat.conversations = await source.lister();
    const r0 = routeDepuisHash();
    history.replaceState({ opmsg: 1, n: 0, r: r0, p: null }, '', urlDe(r0));
    rendreListe();
    appliquer(r0);
    /* la source dit quand quelque chose change : la liste et la conversation ouverte se refont, rien d'autre */
    source.ecouter(ev => {
      if (ev.type === 'liste') rafraichirListe();
      if (ev.type === 'conversation' && ev.id === etat.conv) rafraichirConv();
    });
  }
  demarrer();
})();
</script>

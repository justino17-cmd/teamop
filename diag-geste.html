<!doctype html><html lang="fr"><head>
<meta charset="utf-8"><title>Diagnostic du glissement — TEAM OP</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<!-- Page de DIAGNOSTIC, pas un écran de l'application. Elle ne lit aucune donnée, ne parle à
     aucun serveur, n'écrit rien : elle enregistre la suite d'événements que le navigateur
     envoie pendant un glissement, et rejoue la MÊME machine à états que la barre d'onglets
     d'OP GESTION (mêmes seuils). But : savoir ce que fait Safari sur un vrai iPhone, ce qu'un
     navigateur émulé ne peut pas dire. -->
<style>
:root{--bg:#0D1624;--c:#16203A;--t:#eef2fa;--t3:#9fb0c9;--ok:#34c98a;--ko:#ff6b6b;--acc:#7cc6ff}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--t);
  padding:max(16px,env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));}
h1{font-size:19px;margin:0 0 4px;letter-spacing:-.02em}
p.s{margin:0 0 14px;color:var(--t3);font-size:13.5px}
#zone{background:var(--c);border:1px solid #243154;border-radius:16px;height:46vh;min-height:230px;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;
  color:var(--t3);font-size:15px;user-select:none;-webkit-user-select:none;margin-bottom:14px}
#zone.go{outline:2px solid var(--ok)}
.v{font-size:22px;font-weight:700;margin:10px 0 6px}
.ok{color:var(--ok)}.ko{color:var(--ko)}
pre{background:var(--c);border:1px solid #243154;border-radius:12px;padding:12px;font-size:12.5px;
  white-space:pre-wrap;word-break:break-word;margin:0 0 12px;color:var(--t3)}
button{appearance:none;border:1px solid #243154;background:var(--c);color:var(--t);font:inherit;
  font-weight:600;padding:12px 16px;border-radius:12px;min-height:44px;width:100%}
</style></head><body>
<h1>Diagnostic du glissement</h1>
<p class="s">Glisse le doigt <b>horizontalement</b> dans le cadre, comme pour changer d'onglet. Puis lis le verdict, et envoie-le.</p>
<div id="zone">Glisse ici, de droite à gauche</div>
<div class="v" id="verdict">—</div>
<pre id="det">en attente d'un geste…</pre>
<button onclick="copier()">Copier le rapport</button>
<script>
/* Les seuils RÉELS de la barre d'onglets d'OP GESTION — recopiés pour que le verdict soit
   comparable. S'ils changent là-bas, cette page dira « engagé » quand l'application dit non. */
var ENGAGE=12, DOMINANCE=1.3;
var z=document.getElementById('zone'), V=document.getElementById('verdict'), D=document.getElementById('det');
var ev=[], x0=0,y0=0, actif=false, engage=false, dernier=0, annule=false, t0=0, pmove=0, tmove=0;

function contexte(){
  var sa=getComputedStyle(document.documentElement).getPropertyValue('--x')||'';
  return [
    'page   : ' + location.host + location.pathname,
    'nav    : ' + navigator.userAgent,
    'points : ' + (navigator.maxTouchPoints||0) + ' · pointer=' + ('onpointerdown' in window) + ' · touch=' + ('ontouchstart' in window),
    'mode   : ' + (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone ? 'APPLICATION INSTALLÉE' : 'onglet du navigateur'),
    'écran  : ' + innerWidth + '×' + innerHeight + ' · dpr=' + (devicePixelRatio||1),
    'sobre  : ' + (window.matchMedia('(prefers-reduced-motion: reduce)').matches)
  ].join('\n');
}
function rendu(){
  var seq=ev.reduce(function(a,n){ var d=a[a.length-1];
    if(d && d.n===n) d.c++; else a.push({n:n,c:1}); return a; },[])
    .map(function(d){ return d.n + (d.c>1?'×'+d.c:''); }).join(' · ');
  var dx=dernier-x0;
  var ok = engage && !annule && Math.abs(dx)>=48;
  V.textContent = ok ? '✅ le geste aboutirait' : '⛔ le geste est perdu';
  V.className = 'v ' + (ok?'ok':'ko');
  D.textContent = [
    'verdict      : ' + (ok?'ABOUTIT':'PERDU'),
    'raison       : ' + (annule ? 'touchcancel — le navigateur a repris la main'
                      : !engage ? 'jamais engagé (seuil ' + ENGAGE + ' px non franchi, ou trop vertical)'
                      : Math.abs(dx)<48 ? 'trop court (' + Math.round(dx) + ' px, il en faut 48)'
                      : 'aucune'),
    'distance     : ' + Math.round(dx) + ' px en ' + (Date.now()-t0) + ' ms',
    'touchmove    : ' + tmove + '   ·   pointermove : ' + pmove,
    'séquence     : ' + (seq||'(rien)'),
    '',
    contexte()
  ].join('\n');
}
function debut(x,y){ annule=false; engage=false; actif=true; x0=x; y0=y; dernier=x;
  t0=Date.now(); pmove=0; tmove=0; z.classList.remove('go'); }
function bouger(x,y){ if(!actif) return; var dx=x-x0, dy=y-y0, ax=Math.abs(dx), ay=Math.abs(dy);
  if(!engage){ if(ax<ENGAGE && ay<ENGAGE) return;
    if(ay>=ENGAGE && ay>ax*DOMINANCE){ actif=false; return; }
    if(ax<ENGAGE || ax<ay*DOMINANCE) return; engage=true; z.classList.add('go'); }
  dernier=x; }

/* On écoute les DEUX familles, comme l'application, et on compte séparément :
   c'est la comparaison des deux colonnes qui dit qui a repris la main. */
z.addEventListener('touchstart',function(e){ ev=[]; ev.push('touchstart'); var t=e.touches[0]; if(t) debut(t.clientX,t.clientY); },{passive:true});
z.addEventListener('touchmove',function(e){ ev.push('touchmove'); tmove++; var t=e.touches[0]; if(t) bouger(t.clientX,t.clientY); },{passive:true});
z.addEventListener('touchend',function(){ ev.push('touchend'); actif=false; rendu(); },{passive:true});
z.addEventListener('touchcancel',function(){ ev.push('TOUCHCANCEL'); annule=true; actif=false; rendu(); },{passive:true});
z.addEventListener('pointerdown',function(e){ if(e.pointerType==='mouse') ev=[];   /* à la souris il n'y a pas de touchstart pour remettre à zéro */
  ev.push('pointerdown('+e.pointerType+')'); if(e.pointerType==='mouse') debut(e.clientX,e.clientY); },{passive:true});
z.addEventListener('pointermove',function(e){ ev.push('pointermove'); pmove++; if(e.pointerType==='mouse') bouger(e.clientX,e.clientY); },{passive:true});
z.addEventListener('pointerup',function(){ ev.push('pointerup'); if(!ev.some(function(n){return n==='touchend';})) rendu(); },{passive:true});
z.addEventListener('pointercancel',function(){ ev.push('pointercancel'); },{passive:true});

function copier(){ var t=D.textContent;
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(function(){ alert('Rapport copié — colle-le dans la conversation.'); },
    function(){ alert('Copie refusée : fais une capture d\'écran.'); });
  else alert('Fais une capture d\'écran.'); }
D.textContent = 'en attente d\'un geste…\n\n' + contexte();
</script></body></html>

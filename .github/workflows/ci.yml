name: Vérifications

# Le dépôt est public et le serveur est exposé sur Internet. Ce workflow
# vérifie à chaque poussée qu'aucun secret n'est parti avec le code et
# qu'aucune dépendance de production ne porte de faille grave.

on:
  push:
    branches: ['**']
  pull_request:

# Lecture seule : le workflow n'a aucun droit d'écriture sur le dépôt.
permissions:
  contents: read

concurrency:
  group: verifications-${{ github.ref }}
  cancel-in-progress: true

jobs:
  securite:
    name: Secrets et dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Un jeton GitHub et un mot de passe d'équipe ont déjà fuité une fois.
      # Cette étape échoue si un secret réapparaît dans les fichiers suivis.
      - name: Recherche de secrets
        run: bash scripts/verif-secrets.sh --suivis

      # Les dépendances de production du serveur ne doivent porter aucune
      # faille connue de niveau élevé ou critique.
      - name: Failles connues (dépendances du serveur)
        run: npm audit --omit=dev --audit-level=high --prefix server

  # ⛔ CE JOB N'EXISTAIT PAS, ET C'EST LE PLUS COÛTEUX DES MANQUES. Un push sur `main` touchant
  # `server/**` DÉPLOIE LE VPS automatiquement — sans qu'une seule ligne de test ait tourné.
  # La CI ne vérifiait que les secrets et les failles de dépendances : pas même la syntaxe. Un
  # bug LOGIQUE dans `espacePaye()`, dans une route de promo ou dans l'anti-abus partait donc
  # chez tous les clients en deux minutes, et on l'apprenait par un appel.
  # Les 83 suites tournent sans installation ni dépendance : il n'y avait aucune raison de
  # s'en priver. Elles sautent d'elles-mêmes ce qui exige `server/node_modules`, d'où le
  # `npm ci` ci-dessous — sans lui, les six suites qui lancent le VRAI serveur (641, 716, 722,
  # 723, 724, 725, 726) se déclareraient vertes sans rien avoir exécuté.
  tests:
    name: Syntaxe et bancs d'essai
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ⚠️ Les suites serveur montent le vrai `server/index.js` : sans ses dépendances, elles
      # sautent leur partie exécutée et passent au vert sans rien prouver.
      - name: Dépendances du serveur
        run: npm ci --omit=dev --no-audit --no-fund --prefix server

      # La syntaxe du JavaScript embarqué dans les 27 pages, que `node --check` ne voit pas.
      - name: Syntaxe des pages
        run: node scripts/verifier-syntaxe.js

      - name: Syntaxe des fichiers serveur
        run: for f in server/*.js; do node --check "$f" || exit 1; done

      # ⛔ LE COMPTEUR VIT DANS UN SEUL FICHIER, ET C'EST VOULU. `deploiement.yml` lance le
      # MÊME script avant de toucher au VPS : deux copies d'un compteur divergent toujours, et
      # c'est précisément un compteur recopié qui a fait écrire « 2 598 » pour 2 989 dans
      # CLAUDE.md. Le fichier porte aussi les deux pièges du comptage (bandeaux d'un autre
      # format, banc qui meurt après son total).
      - name: Les bancs d'essai
        run: BANCS_PLANCHER=$(sed -n 's/^#plancher //p' scripts/bancs-serveur.liste) bash scripts/bancs-ci.sh $(grep -vE '^[[:space:]]*(#|$)' scripts/bancs-serveur.liste)

# Déploiement du serveur TeamOP sur le VPS.
#
# Pourquoi ce fichier existe : le 2 septembre 2026, publier une correction a demandé six
# tentatives — mot de passe root retapé à chaque fois, une commande collée par erreur dans
# l'invite « Username for github », deux erreurs 401, et un serveur resté sur l'ancien code
# sans que ça se voie. Le 3 septembre, une faille de sécurité corrigée est restée ouverte
# en production plusieurs heures pour la même raison. Ce workflow supprime cette étape
# manuelle : tout merge sur main qui touche server/ met le VPS à jour tout seul.
name: Déploiement du serveur

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/deploiement.yml']
  workflow_dispatch: {}      # lancement manuel : onglet Actions → « Déploiement du serveur » → Run workflow

concurrency:
  group: deploiement-vps     # jamais deux déploiements en même temps
  cancel-in-progress: false  # et on ne coupe pas un déploiement en cours

permissions:
  contents: read

jobs:
  # ⛔ LE VPS NE PART PLUS SANS QU'UN BANC AIT RENDU SON VERDICT, ET C'EST UN JOB D'ICI, PAS
  # D'AILLEURS. Le job « tests » de `ci.yml` existe depuis le 19 septembre 2026 — mais c'est un
  # WORKFLOW SÉPARÉ : sur la même poussée, les deux partaient EN PARALLÈLE, et le déploiement
  # finissait 50 à 100 secondes AVANT les bancs. Le serveur atteignait donc les clients pendant
  # que les tests tournaient encore, et un échec ne rattrapait rien : c'était déjà en ligne.
  # GitHub Actions n'a pas de `needs` entre workflows ; `workflow_run` existe mais ne porte ni
  # les filtres de chemin ni le SHA de la poussée sans contorsion. La porte est donc ICI, dans
  # le workflow qui déploie : il ne peut pas se faire contourner par une modification de
  # `ci.yml`, et il reste lisible d'un seul fichier.
  # Le coût est de rejouer les bancs (~70 s) sur une poussée serveur. C'est le prix d'une
  # publication, et il se compare à une journée de terrain perdue.
  bancs:
    name: Bancs d'essai (avant de toucher au VPS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # ⚠️ Sans les dépendances, les suites qui montent le VRAI serveur SAUTENT d'elles-mêmes
      # et se déclarent vertes sans rien avoir exécuté — le pire des faux verts.
      - name: Dépendances du serveur
        run: npm ci --omit=dev --no-audit --no-fund --prefix server
      - name: Syntaxe des pages
        run: node scripts/verifier-syntaxe.js
      - name: Syntaxe des fichiers serveur
        run: for f in server/*.js; do node --check "$f" || exit 1; done
      - name: Les bancs d'essai
        run: BANCS_PLANCHER=$(sed -n 's/^#plancher //p' scripts/bancs-serveur.liste) bash scripts/bancs-ci.sh $(grep -vE '^[[:space:]]*(#|$)' scripts/bancs-serveur.liste)

  deployer:
    needs: bancs
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      # La clé de déploiement vient des secrets du dépôt ; l'empreinte de l'hôte, elle, est
      # écrite en clair ici — une clé publique d'hôte n'est pas un secret, et la voir dans le
      # diff est précisément ce qui permet de vérifier qu'elle n'a pas changé en douce.
      # Empreinte attendue : SHA256:roC/SIeqnxPTGhAe/88vEXbcn7oNWQWC0T26mBDv1vQ
      - name: Préparer l'accès SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          cat > ~/.ssh/known_hosts <<'EOF'
          api.teamop.fr ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOx14gh/gaXmkrB1xVioeWjc2MHduIP9T5WRQZntZ+Sn
          217.154.6.139 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOx14gh/gaXmkrB1xVioeWjc2MHduIP9T5WRQZntZ+Sn
          EOF
          chmod 600 ~/.ssh/known_hosts

      - name: Mettre à jour et redémarrer
        run: |
          # ⚠️ Le SHA passe en ARGUMENT de `bash -s`, pas par interpolation dans le heredoc :
          # celui-ci est protégé (<<'DISTANT') exprès, pour que `$AVANT`, `$APRES` et les autres
          # soient évalués SUR LE VPS et non ici. Un seul endroit où la valeur entre.
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=15 \
              root@api.teamop.fr "bash -euo pipefail -s ${{ github.sha }}" <<'DISTANT'
            # ⛔ PAS D’APOSTROPHE DANS LE MOT DE `${var:?mot}` — bash y RE-INTERPRÈTE les
            # quotes, y compris entre guillemets doubles. « n'a pas été transmis » ouvrait donc
            # une simple quote qui ne se refermait jamais : le corps entier ne se parsait plus
            # (`unexpected EOF while looking for matching '"'`), et AUCUNE commande ne
            # s’exécutait sur le VPS. Un correctif serveur poussé sur `main` n’arrivait nulle
            # part, en silence. Mesuré le 19 septembre 2026 : `bash -n` rc=2 avec l’apostrophe,
            # rc=0 sans. Garder ce mot sans apostrophe, et le relire à chaque modification.
            ATTENDU="${1:?SHA attendu non transmis}"
            cd /opt/teamop/repo

            # Les trois pannes du 2 septembre, neutralisées : adresse de dépôt remise au propre,
            # identifiant mémorisé ignoré, et aucune invite possible — en cas de souci, la
            # commande échoue avec un message au lieu de rester suspendue.
            # Le dépôt a été renommé « elangestion.github.io » → « teamop » le 7 septembre 2026.
            # GitHub redirige l'ancienne adresse, mais on ne s'appuie pas sur une redirection
            # pour déployer : on écrit le vrai nom.
            git remote set-url origin https://github.com/justino17-cmd/teamop.git
            export GIT_TERMINAL_PROMPT=0
            AVANT=$(git rev-parse HEAD)
            git -c credential.helper= fetch --prune --quiet origin main
            # --ff-only : si l'arbre du serveur a divergé, on veut le savoir, pas l'écraser en silence.
            git -c credential.helper= merge --ff-only --quiet origin/main
            APRES=$(git rev-parse HEAD)
            echo "dépôt : ${AVANT:0:8} → ${APRES:0:8}"

            # ⛔ LE VPS EST-IL VRAIMENT SUR LE COMMIT QU'ON DÉPLOIE ? C'est la question que
            # l'étape finale croyait poser et ne posait pas : elle comparait ANNONCE.version à
            # elle-même (666 = 666), un nombre qui ne change qu'à la main — donc elle ne
            # pouvait RIEN détecter, ni un `merge --ff-only` refusé, ni un arbre divergent.
            # Ici on compare au SHA que GitHub Actions a en main : il change à CHAQUE commit,
            # et personne ne peut l'oublier.
            # ⛔ « AU MOINS CE COMMIT », PAS « EXACTEMENT CE COMMIT ». Deux poussées serveur à
            # quelques secondes d'intervalle : le workflow de la PREMIÈRE fait un `fetch` qui
            # ramène les DEUX commits, donc `$APRES` vaut le SHA de la seconde. Une égalité
            # stricte sortait alors en 1 ICI — c'est-à-dire APRÈS le merge et AVANT le
            # `systemctl restart` : le VPS se retrouvait avec le code neuf sur le DISQUE et
            # l'ancien EN MÉMOIRE, ce qui est le pire des deux états. On demande donc ce qu'on
            # veut vraiment savoir : le commit déployé est-il dans l'histoire du VPS ?
            if ! git merge-base --is-ancestor "$ATTENDU" "$APRES"; then
              echo "le VPS est sur ${APRES:0:8}, qui ne descend PAS de ${ATTENDU:0:8} — arbre divergent, fetch incomplet, ou merge --ff-only refusé"
              exit 1
            fi
            if [ "$APRES" != "$ATTENDU" ]; then
              echo "le VPS porte ${APRES:0:8}, plus récent que ${ATTENDU:0:8} — une poussée suivante est déjà là, on redémarre dessus"
            fi
            echo "commit vérifié : ${APRES:0:8}"

            # Dépendances : seulement si le verrou a bougé, sinon on ne perd pas 40 s à chaque fois.
            if ! git diff --quiet "$AVANT" "$APRES" -- server/package-lock.json server/package.json; then
              echo "dépendances modifiées → npm ci"
              cd server && npm ci --omit=dev --no-audit --no-fund && cd ..
            fi

            systemctl restart teamop-api
            sleep 3
            # ⛔ PAS DE journalctl ICI. Ce dépôt est PUBLIC, et les journaux d'un run GitHub
            # Actions sont lisibles par n'importe qui et conservés 90 jours. Le journal du VPS
            # porte des identifiants d'espace : les recopier ici, c'est publier qui sont nos
            # clients. Le journal se lit SUR le VPS, par quelqu'un qui y a accès.
            systemctl is-active --quiet teamop-api || { echo "le service n'est pas actif — lire le journal SUR le VPS : journalctl -u teamop-api -n 50"; exit 1; }
            echo "--- /health ---"
            curl -sf --max-time 10 localhost:8080/health || { echo "health injoignable"; exit 1; }
            echo
            echo "--- journal ---"
            echo "démarré. Journal : journalctl -u teamop-api -n 50 (sur le VPS — voir plus haut)"
          DISTANT

      # ⛔ CE CONTRÔLE COMPARAIT 666 À 666, ET NE POUVAIT DONC RIEN DÉTECTER. Il lisait
      # `ANNONCE.version` dans le dépôt et la même valeur sur /health — un nombre qui ne bouge
      # qu'à la main, et qui n'a pas bougé depuis des mois. Le `merge --ff-only` pouvait
      # échouer, systemd redémarrer sur l'ancien code, l'arbre du VPS diverger : l'étape
      # passait au vert. C'est exactement la panne du 2 septembre qu'elle était censée
      # empêcher. La comparaison de commit se fait désormais SUR LE VPS (voir l'étape
      # précédente), contre un SHA qui change à chaque poussée.
      # Ici on ne vérifie plus que ce que le VPS ne peut pas vérifier lui-même : que l'API
      # répond bien depuis l'EXTÉRIEUR, à travers nginx.
      - name: Vérifier que l'API répond de l'extérieur
        run: |
          SANTE=$(curl -sf --max-time 10 https://api.teamop.fr/health) || { echo "::error::api.teamop.fr ne répond pas après le déploiement."; exit 1; }
          echo "$SANTE" | grep -q '"ok":true' || { echo "::error::api.teamop.fr répond, mais pas ok:true."; exit 1; }
          # Deux capacités qu'un mauvais déploiement éteint en silence — et qu'on ne découvre
          # sinon que le jour où un client s'en plaint.
          echo "$SANTE" | grep -q '"stripe":true' || echo "::warning::stripe:false — les paiements ne marchent pas."
          echo "$SANTE" | grep -q '"email":true'  || echo "::warning::email:false — aucun courriel ne part."
          echo "API en ligne et saine."

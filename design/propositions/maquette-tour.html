<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Maquette Tour TeamOP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Plan : la Tour d'aujourd'hui (v2.97), gardée telle quelle pour son style : bascule GESTION / MESSAGES, sections Tour, Clients, Support, Administration, accueil « Bonjour… »,
   bandeau d'état du serveur, mêmes couleurs (jour #F2F2F7 / blanc / bleu #0071E3, nuit bleu #0F1A30), mêmes polices (SF Pro) et même échelle.
   Ce que j'ajoute pour une vraie société est marqué « Nouveau » dans le menu : Facturation, Incidents, Juridique et signature, Agents et rapport du jour, Journal.
   Le courrier est OP Courrier (dossiers, liste, lecture, suivi). Mise en page : fenêtre de Mac, barre latérale 232 px. */
:root{--fs:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;--ft:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;--bg:#f2f2f7;--side:#f7f7fa;--surface:#ffffff;--inset:rgba(118,118,128,.12);--hover:rgba(0,0,0,.04);--line:rgba(60,60,67,.16);--hair:rgba(60,60,67,.12);--text:#000000;--muted:rgba(60,60,67,.78);--dim:rgba(60,60,67,.62);--acc:#007aff;--accfill:#0071e3;--acctxt:#0060c0;--accbg:rgba(0,122,255,.12);--on:#ffffff;--gest:#34c759;--gesttxt:#1c7a3a;--gestbg:rgba(52,199,89,.16);--vert:#1c7a3a;--ambre:#8a5300;--ambrebg:rgba(255,149,0,.16);--rouge:#b3261e;--rougebg:rgba(255,59,48,.12);--verre:rgba(249,249,249,.85);--ombre:0 0 0 .5px rgba(60,60,67,.1)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a30;--side:#0c1528;--surface:rgba(255,255,255,.08);--inset:rgba(118,118,128,.24);--hover:rgba(255,255,255,.06);--line:rgba(255,255,255,.13);--hair:rgba(255,255,255,.08);--text:#ffffff;--muted:rgba(220,228,245,.72);--dim:rgba(220,228,245,.58);--acc:#7fb2ff;--accfill:#0a84ff;--acctxt:#7fb2ff;--accbg:rgba(127,178,255,.16);--gesttxt:#6fd49b;--gestbg:rgba(52,199,89,.2);--vert:#6fd49b;--ambre:#f2c26b;--ambrebg:rgba(255,159,10,.18);--rouge:#ff9a92;--rougebg:rgba(255,69,58,.2);--verre:rgba(15,26,48,.82);--ombre:0 0 0 .5px rgba(255,255,255,.1)}}
*{box-sizing:border-box}
button,input,select,textarea{font-family:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--fs);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-synthesis:none;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
h1,h2,h3,p{margin:0}
.scene{display:flex;justify-content:center;padding:12px 12px 16px}
.fenetre{position:relative;width:var(--W,1280px);height:var(--h,860px);zoom:var(--z,1);border-radius:12px;overflow:hidden;background:var(--bg);box-shadow:0 18px 60px rgba(0,0,0,.28);border:1px solid var(--line)}
.titre-fen{position:absolute;top:0;left:0;right:0;height:30px;display:flex;align-items:center;gap:7px;padding:0 13px;background:var(--verre);border-bottom:1px solid var(--hair);z-index:3}
.titre-fen i{width:11px;height:11px;border-radius:50%;background:#ff5f57}.titre-fen i:nth-child(2){background:#febc2e}.titre-fen i:nth-child(3){background:#28c840}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%;padding-top:30px}
aside{background:var(--side);border-right:1px solid var(--hair);display:flex;flex-direction:column;min-height:0}
.haut{padding:14px 12px 4px;display:flex;flex-direction:column;gap:12px}
.marque{display:flex;align-items:center;gap:10px;padding:0 4px}
.logo{width:34px;height:34px;border-radius:9px;background:#0f172a;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#f1f4f9;line-height:1;flex:none}
.logo small{font-size:5.5px;letter-spacing:.2em;font-weight:600;opacity:.85;margin:0 0 1px .2em}.logo b{font-family:var(--ft);font-size:14px;letter-spacing:-.02em;font-weight:700}
.marque>div:last-child b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em}.marque>div:last-child small{color:var(--muted);font-size:12px}
.bascule{display:flex;background:var(--inset);border-radius:9px;padding:2px}
.bascule button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;min-height:30px;border-radius:7px;cursor:pointer}
.bascule button::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--gest)}
.bascule button:nth-child(2)::before{background:var(--acc)}
.bascule button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.menu{flex:1;overflow:auto;padding:0 8px 12px;min-height:0}
.rub-t{display:block;color:var(--muted);font-size:11.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:12px 10px 4px}
.entree{white-space:nowrap;display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--text);font-size:14.5px;font-weight:400;padding:0 10px;min-height:34px;border-radius:8px;cursor:pointer;text-align:left}
.entree svg{width:17px;height:17px;flex:none;stroke:var(--acc);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.entree:hover{background:var(--hover)}
.entree[aria-current="page"]{background:var(--accbg);font-weight:600}
.cnt{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.cnt.rg{background:var(--accfill);color:#fff;border-radius:999px;padding:0 7px;min-width:20px;text-align:center}
.nv{margin-left:auto;white-space:nowrap;font-size:10.5px;font-weight:600;color:var(--acctxt);background:var(--accbg);border-radius:999px;padding:1px 7px}
.pied{padding:9px 14px;border-top:1px solid var(--hair);color:var(--muted);font-size:11.5px;line-height:1.35}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.droite{display:flex;flex-direction:column;min-width:0;min-height:0}
.bandeau{display:flex;align-items:center;gap:14px;padding:0 22px;min-height:46px;border-bottom:1px solid var(--hair);background:var(--verre);flex:none}
.fil-b{font-size:13.5px;color:var(--muted)}.fil-b b{color:var(--text);font-weight:500}
.bandeau .sp{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--muted)}
.srv{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border-radius:999px;padding:4px 11px;box-shadow:var(--ombre);color:var(--text);font-weight:500}
.srv::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gest)}
.srv.ko::before{background:#ff3b30}
.srv.btn-pal{cursor:pointer;border:0;font-size:12.5px;color:var(--muted)}
.srv.btn-pal::before{display:none}
.srv kbd{font:600 11px var(--fs);background:var(--inset);border-radius:5px;padding:1px 6px;margin-left:6px}
main{overflow:auto;min-width:0;position:relative;flex:1}
.page{padding:22px max(26px,2.4vw) 40px;max-width:1160px;margin:0 auto}
.fil{color:var(--muted);font-size:13px;margin:0 0 4px}
h1{font-family:var(--ft);font-size:34px;line-height:1.1;letter-spacing:-.025em;font-weight:700;text-wrap:balance}
.date{color:var(--muted);font-size:15.5px;margin-top:3px}
.th{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.pill{display:inline-block;background:var(--inset);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:500}
.pill.alerte{background:var(--rougebg);color:var(--rouge)}
.sous{color:var(--muted);margin:3px 0 0;font-size:15px;max-width:72ch}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px}
@media(max-width:1200px){.cols{grid-template-columns:1fr}}
.st{display:flex;align-items:baseline;gap:10px;margin:20px 2px 9px}
.st h2{font-family:var(--ft);font-size:19px;font-weight:600;letter-spacing:-.018em}
.st span{color:var(--muted);font-size:13px}
.st a{margin-left:auto;font-size:13px;color:var(--acctxt);cursor:pointer;font-weight:500}
.card{background:var(--surface);border-radius:12px;box-shadow:var(--ombre);overflow:hidden}
.rang{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 15px;min-height:50px;border-top:1px solid var(--hair);flex-wrap:wrap}
.rang:first-child{border-top:0}
.rang .t{min-width:0;flex:1 1 240px;overflow-wrap:anywhere;font-weight:500}
.rang .t small{display:block;color:var(--muted);font-size:13px;margin-top:1px;font-weight:400}
.rang.clic{cursor:pointer}.rang.clic:hover{background:var(--hover)}
.tile{width:34px;height:34px;border-radius:9px;background:var(--accbg);display:grid;place-items:center;flex:none}
.tile svg{width:18px;height:18px;stroke:var(--acctxt);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.val{font-family:var(--ft);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.val i{font-style:normal;color:var(--dim);font-size:15px}
.etat{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;white-space:nowrap}
.etat::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.ok{color:var(--vert)}.att{color:var(--ambre)}.ko{color:var(--rouge)}.neutre{color:var(--muted)}
.btn{font-size:13.5px;font-weight:600;min-height:34px;padding:0 14px;border-radius:8px;border:0;background:var(--accbg);color:var(--acctxt);cursor:pointer;white-space:nowrap}
.btn.p{background:var(--accfill);color:#fff}
.vide{padding:24px 16px;text-align:center;color:var(--muted);font-size:14px}
.pg{color:var(--muted);font-size:13px;margin:7px 4px 0;max-width:76ch}
.texte{background:var(--surface);border-radius:12px;box-shadow:var(--ombre);padding:13px 16px}
.texte p+p{margin-top:8px}
.flux{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:13px 15px}
.etape{background:var(--accbg);color:var(--acctxt);padding:5px 12px;border-radius:999px;font-size:13px;font-weight:500}
.fl{color:var(--dim)}
.tuiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.tuile{background:var(--surface);border-radius:12px;box-shadow:var(--ombre);padding:12px 15px;text-align:left;border:0;color:inherit}
button.tuile{cursor:pointer}button.tuile:hover{background:var(--hover)}
.tuile b{display:block;font-family:var(--ft);font-size:24px;line-height:1.1;letter-spacing:-.02em;font-weight:600;font-variant-numeric:tabular-nums}
.tuile span{color:var(--muted);font-size:12.5px}
.rap{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:10px 15px;border-top:1px solid var(--hair)}
.rap:first-child{border-top:0}
.rap .t{min-width:0;font-weight:500;overflow-wrap:anywhere}.rap .t small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.att-t{text-align:right;font-size:12.5px;color:var(--muted);white-space:nowrap}.att-t b{display:block;font-size:14px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.att-t b.late{color:var(--rouge)}

/* agents : qui fait quoi */
.rag{display:grid;grid-template-columns:auto minmax(170px,260px) minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:10px 15px;border-top:1px solid var(--hair)}
.rag:first-child{border-top:0}
.rag .t b{display:block;font-weight:600}.rag .t small{color:var(--muted);font-size:12.5px}
.enc{min-width:0;font-size:13.5px;overflow-wrap:anywhere}.enc small{display:block;color:var(--muted);font-size:12px}
.ava{width:32px;height:32px;border-radius:50%;background:var(--accbg);color:var(--acctxt);display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
.ava.p{width:28px;height:28px;font-size:12px}.ava.g{border-radius:8px}
/* messagerie des agents */
.msgr{display:grid;grid-template-columns:250px minmax(0,1fr) 280px;height:100%}
.mc{border-right:1px solid var(--hair);background:var(--side);overflow:auto;padding:12px 8px}
.mc-h{padding:2px 8px 6px}.mc-h h1{font-size:19px;font-weight:600;letter-spacing:-.018em}.mc-h p{color:var(--muted);font-size:12.5px}
.mc-t{font-size:11.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 8px 4px}
.cv{display:flex;gap:9px;align-items:center;width:100%;border:0;background:transparent;color:inherit;text-align:left;padding:7px 8px;border-radius:8px;cursor:pointer}
.cv:hover{background:var(--hover)}.cv[aria-current="true"]{background:var(--accbg)}
.cv .cc{min-width:0;flex:1}.cv .l1{display:flex;justify-content:space-between;gap:6px}.cv .l1 b{font-size:14px;font-weight:600}.cv .l1 small{color:var(--muted);font-size:11.5px}
.cv .l3{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt-e{width:9px;height:9px;border-radius:50%;flex:none}.pt-e.libre{background:#34c759}.pt-e.occupe{background:#ff9f0a}.pt-e.arret{background:var(--inset)}
.fil-m{display:flex;flex-direction:column;min-height:0;min-width:0}
.fm-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-bottom:1px solid var(--hair);background:var(--verre)}
.fm-h h2{font-family:var(--ft);font-size:17px;font-weight:600}.fm-h p{color:var(--muted);font-size:12.5px}
.pont{margin:10px 18px 0;background:var(--accbg);border-radius:10px;padding:10px 13px;font-size:13.5px}.pont b{color:var(--acctxt)}.pont p{margin-top:3px}
.flux-m{flex:1;overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:12px}
.bul{display:flex;gap:9px;align-items:flex-start;max-width:640px}
.bul.moi{align-self:flex-end;flex-direction:row-reverse}
.bc{background:var(--surface);box-shadow:var(--ombre);border-radius:12px;padding:8px 12px;min-width:0}
.bul.moi .bc{background:var(--accfill);color:#fff}.bul.moi .bh small{color:rgba(255,255,255,.8)}
.bh{display:flex;gap:8px;align-items:baseline}.bh b{font-size:13.5px;font-weight:600}.bh small{color:var(--muted);font-size:11.5px}
.bc p{margin-top:2px;overflow-wrap:anywhere}
.tc{margin-top:6px;font-size:12.5px;font-weight:500;background:var(--accbg);color:var(--acctxt);border-radius:7px;padding:3px 8px}
.sysm{align-self:center;font-size:12.5px;color:var(--muted);background:var(--inset);border-radius:999px;padding:3px 12px;text-align:center}
.regle{margin:0;padding:6px 18px;font-size:12px;color:var(--muted);border-top:1px solid var(--hair)}
.comp{border-top:1px solid var(--hair);padding:9px 18px 12px;background:var(--verre)}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}
.chips button{border:0;background:var(--inset);color:var(--text);font-size:12px;font-weight:500;padding:0 9px;min-height:24px;border-radius:999px;cursor:pointer}
.cr2{display:flex;gap:8px;align-items:flex-end}
.cr2 textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);font-size:14.5px;padding:8px 11px;line-height:1.4}
.mt{border-left:1px solid var(--hair);overflow:auto;padding:14px 12px;background:var(--side)}
.mt h3{font-size:11.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 4px 8px}
.tq{background:var(--surface);box-shadow:var(--ombre);border-radius:10px;padding:9px 11px;margin-bottom:8px}
.th2{display:flex;align-items:center;gap:7px}.th2 b{font-size:13.5px;font-weight:600}
.pr2{margin-left:auto;font-size:11px;font-weight:600;border-radius:999px;padding:1px 7px;background:var(--inset)}
.pr2.urgente{background:var(--rougebg);color:var(--rouge)}.pr2.haute{background:var(--ambrebg);color:var(--ambre)}
.tq p{font-size:13.5px;margin-top:5px}.tq small{color:var(--muted);font-size:12px}
/* OP Courrier */
.cour{display:grid;grid-template-columns:216px minmax(270px,330px) minmax(0,1fr);height:100%}
.cf{border-right:1px solid var(--hair);overflow:auto;padding:10px 8px;background:var(--side)}
.cf h3{font-size:11.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 9px 4px}
.cf h3:first-child{padding-top:2px}
.cf .entree{min-height:32px;font-size:14px}
.cl{border-right:1px solid var(--hair);display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.cl-h{padding:12px 14px 8px;border-bottom:1px solid var(--hair)}
.cl-h h1{font-size:19px;letter-spacing:-.018em;font-weight:600}
.cl-h p{color:var(--muted);font-size:12.5px;margin-top:1px}
.bo{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.bo button,.cats button{border:0;background:var(--inset);color:var(--text);font-size:12.5px;font-weight:500;padding:0 10px;min-height:26px;border-radius:999px;cursor:pointer}
.bo button[aria-pressed="true"],.cats button[aria-pressed="true"]{background:var(--accfill);color:#fff}
.cats{display:flex;gap:5px;padding:8px 14px 0;flex-wrap:wrap}
.lm{overflow:auto;flex:1;margin-top:6px}
.m{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;color:inherit;font-size:inherit;padding:9px 14px;border-bottom:1px solid var(--hair);cursor:pointer}
.m:hover{background:var(--hover)}
.m[aria-current="true"]{background:var(--accfill);color:#fff}
.m[aria-current="true"] .l3,.m[aria-current="true"] .dt{color:#fff;opacity:.85}
.pt{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.m.nl .pt{background:var(--acc)}.m[aria-current="true"] .pt{background:#fff}
.m .cc{min-width:0;flex:1}
.m .l1{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.m .de{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m .dt{font-size:12px;color:var(--muted);white-space:nowrap}
.m .l2{font-size:13.5px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m .l3{font-size:12.5px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:0 7px;border-radius:999px;margin-right:5px;background:var(--ambrebg);color:var(--ambre)}
.m[aria-current="true"] .badge{background:#fff;color:var(--accfill)}
.cr{overflow:auto;padding:16px 22px 30px;background:var(--bg)}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tb select{font-size:13px;font-weight:500;min-height:30px;border-radius:7px;border:0;background:var(--inset);color:var(--text);padding:0 8px}
.tb label{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.cr h2{font-family:var(--ft);font-size:20px;line-height:1.2;letter-spacing:-.018em;font-weight:600;margin:4px 0 8px;overflow-wrap:anywhere}
.ex{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.av{width:32px;height:32px;border-radius:50%;background:var(--accfill);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
.ex b{font-weight:600;display:block;font-size:14.5px}.ex small{color:var(--muted);font-size:12.5px}
.pil{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.pil span{background:var(--inset);border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:500}
.pil span.late{background:var(--rouge);color:#fff}
.corps{background:var(--surface);border-radius:12px;box-shadow:var(--ombre);padding:13px 16px}
.corps p+p{margin-top:9px}
.prep{background:var(--accbg);border-radius:12px;padding:11px 14px;margin:12px 0}
.prep h3{font-size:12.5px;font-weight:600;color:var(--acctxt);margin-bottom:5px}
.prep p{margin-bottom:8px}
.hist{margin-top:14px;color:var(--muted);font-size:13px}
.hist h3{font-size:12.5px;font-weight:600;margin-bottom:4px}
.hist ul{margin:0;padding:0}.hist li{margin:0 0 3px;list-style:none}

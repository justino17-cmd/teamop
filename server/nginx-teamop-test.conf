# ══════════════════════════════════════════════════════════════════════════════════════════════
#  test.teamop.fr — l'ESPACE DE TEST (pages + API de test), à côté d'api.teamop.fr et de teamop.fr
# ══════════════════════════════════════════════════════════════════════════════════════════════
#
#  Posé par `server/install-test.sh`, qui remplace les mots encadrés de deux arobases puis valide avec
#  `nginx -t` AVANT de recharger. Ne pas l'installer à la main : ces mots sont des trous, pas du nginx.
#  Ce fichier est LE SEUL que l'espace de test pose dans nginx : les blocs d'api.teamop.fr et de
#  teamop.fr ne sont pas touchés.
#
#  ── CE QU'IL FAIT ──────────────────────────────────────────────────────────────────────────
#  · les PAGES (@@PAGES@@ : un lien vers la dernière fabrication) sont derrière un mot de passe
#    (auth_basic) : l'espace de test montre des versions pas encore publiées, et une page de test
#    n'est pas faite pour être trouvée ;
#  · `/api/` et `/health` vont au serveur de test (127.0.0.1:@@PORT@@) — MÊME ORIGINE que les pages,
#    donc aucun CORS à ouvrir ;
#  · X-Robots-Tag: noindex partout : aucun moteur de recherche ne doit garder une page de test.
#
#  ⛔ `/api/` N'EST PAS DERRIÈRE auth_basic, ET C'EST TOUT LE POINT. Les pages parlent à l'API avec
#     `Authorization: Bearer …`. Si l'API demandait aussi le mot de passe de la page, le navigateur
#     remplacerait ce Bearer par l'identifiant d'authentification : tout tomberait en 401. Ce
#     qui protège les routes d'essai (`/api/essais/…`), c'est leur propre clé (`?cle=`), que le
#     serveur compare à temps constant.
#  ⛔ Et pour la même raison, un `Authorization: Basic …` que le navigateur ajouterait de lui-même
#     à une requête vers /api/ est RETIRÉ ici (map plus bas) : le serveur n'a pas à le lire, et un
#     mot de passe de page n'a rien à faire dans ses journaux ou ses refus. Un Bearer passe tel quel.
#  ⛔ Pas de HSTS : c'est une porte à sens unique, et un domaine d'essai n'en vaut pas la peine.
#
#  ⚠️ Un `add_header` posé dans un `location` REMPLACE ceux du `server` (nginx ne les cumule pas) :
#     les deux emplacements d'API répètent donc les deux en-têtes qui comptent (noindex, nosniff).

# Retire un `Authorization: Basic …` (le mot de passe de la page), garde tout le reste (Bearer, vide).
map $http_authorization $teamop_test_auth_api {
    default      $http_authorization;
    "~*^Basic "  "";
}

server {
    listen 80;
    listen [::]:80;
    server_name @@DOMAINE@@;

    # Let's Encrypt doit pouvoir écrire sa preuve même quand tout le reste redirige.
    location /.well-known/acme-challenge/ { root @@ACME@@; }
    location / { return 301 https://@@DOMAINE@@$request_uri; }
}

# ==== HTTPS (tout ce qui suit n'est posé qu'une fois le certificat obtenu) ====
server {
    listen 443 ssl@@H2_LISTEN@@;
    listen [::]:443 ssl@@H2_LISTEN@@;
@@H2_ON@@
    server_name @@DOMAINE@@;

    ssl_certificate     @@LETSENCRYPT@@/live/@@DOMAINE@@/fullchain.pem;
    ssl_certificate_key @@LETSENCRYPT@@/live/@@DOMAINE@@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root @@PAGES@@;
    index essais.html;
    charset utf-8;

    # Les pages : mot de passe (le fichier est écrit par l'installeur, jamais commité).
    auth_basic "Espace de test TeamOP";
    auth_basic_user_file @@HTPASSWD@@;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=(self), payment=()" always;
    # Les pages changent à chaque déploiement : revalider toujours (l'ETag fait un 304 quand rien n'a bougé).
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/manifest+json image/svg+xml;

    client_max_body_size 1m;

    location = / { return 302 /essais.html; }

    # ── L'API DE TEST : sans mot de passe de page (voir plus haut), avec ses propres gardes ────────
    location ^~ /api/ {
        auth_basic off;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Le plus gros corps que le serveur accepte (pièces jointes, photos) ; au-delà nginx répond 413.
        client_max_body_size 64m;
        proxy_pass http://127.0.0.1:@@PORT@@;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # X-Forwarded-For ÉCRASÉ par l'adresse vue ici, jamais complété (req.ip, trust proxy 1).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $teamop_test_auth_api;
        # Les flux (SSE) ne doivent pas être retenus dans un tampon.
        proxy_buffering off;
        proxy_read_timeout 3700s;
        proxy_send_timeout 120s;
    }

    location = /health {
        auth_basic off;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://127.0.0.1:@@PORT@@;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # ── Ce qui ne se sert pas ────────────────────────────────────────────────────────────────
    location ~ /\. { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/test.teamop.fr.access.log;
    error_log  /var/log/nginx/test.teamop.fr.error.log;
}

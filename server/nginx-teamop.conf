# ══════════════════════════════════════════════════════════════════════════════════════════════
#  teamop.fr servi depuis le VPS — ÉTAPE G du chantier « tout sur le serveur »
# ══════════════════════════════════════════════════════════════════════════════════════════════
#
#  ⛔ CE FICHIER N'EST PAS ENCORE EN SERVICE, ET IL NE DOIT PAS L'ÊTRE SANS LA MAIN DE JUSTIN.
#     Le site est servi par GitHub Pages aujourd'hui. Le basculer veut dire changer le DNS de
#     `teamop.fr`, ce qui n'est pas un geste d'agent : c'est une porte à sens unique pendant
#     le temps de propagation, et il n'y a qu'un seul nom de domaine.
#
#  ⛔ ET AVANT LE DNS, IL MANQUE UNE DÉCISION — CE QUI SE PASSE QUAND LE VPS TOMBE.
#     GitHub Pages, c'est le réseau de Microsoft : il ne tombe pas. Un VPS à 20 €, si. Tant que
#     le site est chez GitHub, une panne du VPS coupe l'API — les applications s'arrêtent de
#     synchroniser mais les pages s'affichent, les clients peuvent lire, le site commercial
#     vend encore. Une fois tout sur le VPS, une panne coupe TOUT d'un coup : le site, les
#     applications, l'espace client, la Tour. Trois réponses possibles, et c'est à Justin de
#     trancher : un second VPS avec bascule DNS, garder GitHub Pages en secours (le DNS pointe
#     sur le VPS, on le repointe à la main en cas de panne), ou accepter le risque et le dire.
#     Voir REPRISE.md.
#
#  ── CE QU'IL FAIT ──────────────────────────────────────────────────────────────────────────
#  Sert les fichiers du site depuis /opt/teamop/site (posés par `server/publier-site.sh`).
#  Il ne touche PAS au bloc `api.teamop.fr`, qui reste tel quel : les applications appellent
#  `https://api.teamop.fr` en dur, et le CORS du serveur autorise déjà `https://teamop.fr`.
#  Tout mélanger ferait un changement de plus au même moment, pour rien.
#
#  ── POSE ───────────────────────────────────────────────────────────────────────────────────
#     scp server/nginx-teamop.conf root@api.teamop.fr:/etc/nginx/sites-available/teamop.fr
#     ssh root@api.teamop.fr 'ln -sf /etc/nginx/sites-available/teamop.fr /etc/nginx/sites-enabled/'
#     ssh root@api.teamop.fr 'nginx -t'            # ⛔ TOUJOURS, avant de recharger
#     ssh root@api.teamop.fr 'systemctl reload nginx'
#  Le certificat s'obtient AVANT (sinon nginx refuse de démarrer, les chemins n'existent pas) :
#     ssh root@api.teamop.fr 'certbot certonly --nginx -d teamop.fr -d www.teamop.fr'
#  ⚠️ `certbot --nginx` valide par HTTP : il faut donc que le DNS pointe DÉJÀ sur le VPS. C'est
#     l'ordre qui coince — on ne peut pas tout préparer puis basculer d'un coup. La façon de
#     s'en sortir sans coupure est la validation DNS (`certbot --preferred-challenges dns`),
#     qui se fait avant le basculement.

server {
    listen 80;
    listen [::]:80;
    server_name teamop.fr www.teamop.fr;

    # Let's Encrypt doit pouvoir écrire sa preuve même quand tout le reste redirige.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://teamop.fr$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.teamop.fr;
    ssl_certificate     /etc/letsencrypt/live/teamop.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teamop.fr/privkey.pem;
    # Un seul nom canonique : deux origines pour le même site, ce sont deux service workers,
    # deux caches, deux `localStorage` — et un client qui « perd » son espace en tapant www.
    return 301 https://teamop.fr$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name teamop.fr;

    ssl_certificate     /etc/letsencrypt/live/teamop.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teamop.fr/privkey.pem;

    root /opt/teamop/site;
    index index.html;
    charset utf-8;

    # ── LA TAILLE ──────────────────────────────────────────────────────────────────────────
    # `app.html` fait plus de 2,6 Mo en un seul fichier, servi à des téléphones de terrain en
    # 4G. La compression n'est pas un confort ici, c'est la différence entre une ouverture et
    # un abandon. `gzip_comp_level 6` : au-delà, on paie du temps processeur pour quelques
    # pour-cent. ⚠️ `gzip_min_length` doit rester bas — les manifestes et le service worker
    # sont petits mais rechargés souvent.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/manifest+json image/svg+xml;
    # ⚠️ `gzip_types` ne contient PAS `text/html` : nginx compresse toujours le HTML, et le
    # nommer ici déclenche un avertissement « duplicate MIME type ».

    # ── LES EN-TÊTES DE SÉCURITÉ ───────────────────────────────────────────────────────────
    # ⚠️ HSTS est une PORTE À SENS UNIQUE : une fois qu'un navigateur l'a vu, il refuse le HTTP
    # sur ce domaine pendant `max-age`, même si on retire l'en-tête. On commence donc court
    # (un jour), et on ne monte à un an qu'une fois le HTTPS éprouvé plusieurs jours.
    # ⛔ PAS DE `preload` : il s'inscrit dans les navigateurs eux-mêmes et se retire en
    # plusieurs MOIS. On ne le pose pas « pour faire propre ».
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Le micro sert à la dictée des devis (`devisIAModal`) et la caméra aux photos
    # d'intervention : les autoriser sur notre propre origine, refuser tout le reste.
    add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=(self), payment=()" always;

    # ⛔ PAS DE CONTENT-SECURITY-POLICY ICI, ET C'EST DÉLIBÉRÉ.
    # Ces pages sont des fichiers uniques : tout le JavaScript et tout le CSS sont EN LIGNE.
    # Une CSP sans `'unsafe-inline'` les éteint entièrement — écran blanc, pour tout le monde,
    # d'un seul `reload nginx`. Une CSP AVEC `'unsafe-inline'` ne protège quasiment de rien.
    # La faire proprement demande des nonces, donc un gabarit, donc la fin du fichier unique :
    # c'est un chantier, pas une ligne de configuration. L'écrire au hasard serait exactement
    # « un commentaire n'est pas une garde », en pire — une garde qui casse le produit.

    # ── LE CACHE, LÀ OÙ TOUT SE JOUE ───────────────────────────────────────────────────────
    #
    # ⛔⛔ `sw.js` NE DOIT JAMAIS ÊTRE GARDÉ. C'est le défaut qui BRIQUE un parc entier : un
    # service worker gardé une heure, c'est une heure pendant laquelle aucun appareil ne peut
    # recevoir de mise à jour — et si la version gardée est celle qui plante, on ne peut plus
    # rien réparer à distance. Les navigateurs récents contournent le cache HTTP pour les
    # scripts de service worker de plus de 24 h, mais on ne construit pas une plateforme sur
    # une politesse du navigateur. `no-store` : il se retélécharge, toujours.
    location = /sw.js {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    # ⛔ LES PAGES NE SE GARDENT PAS NON PLUS SANS REVALIDATION. `app.html` EST l'application :
    # une page gardée, c'est une version périmée qui tourne chez un client, avec la base d'une
    # autre version. Ce dépôt a déjà payé ce genre de décalage (voir « les appareils d'abord,
    # la porte ensuite » dans CLAUDE.md). `no-cache` ne veut pas dire « ne garde pas » : il
    # veut dire « garde, mais demande-moi avant de servir » — l'ETag fait alors un 304 de
    # quelques octets quand rien n'a changé, donc on ne perd rien.
    location ~* \.(html|webmanifest|json)$ {
        add_header Cache-Control "no-cache" always;
    }
    location = / {
        add_header Cache-Control "no-cache" always;
    }

    # Les images et les sons ne portent PAS d'empreinte dans leur nom (`icon-192.png`, pas
    # `icon-192.a1b2c3.png`). Un `max-age` long voudrait donc dire qu'un logo changé n'arrive
    # jamais. Une heure plus revalidation : assez pour ne pas les retélécharger à chaque
    # navigation, assez court pour qu'une correction visuelle parte dans la journée.
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|mp3|woff2?)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    # ── CE QUI NE SE SERT PAS ──────────────────────────────────────────────────────────────
    # `publier-site.sh` ne copie déjà que ce qui doit être servi. Cette règle est la CEINTURE
    # en plus des bretelles : un fichier posé à la main, une copie de sauvegarde oubliée, un
    # `.env` égaré — et il ne sort pas. Le dépôt est public, donc ce n'est pas un secret qu'on
    # protège ici ; c'est l'habitude de ne servir que ce qu'on a décidé de servir.
    location ~ /\. { return 404; }
    location ~* \.(md|sh|yml|yaml|lock|log|bak|orig|rules)$ { return 404; }
    location ^~ /server/    { return 404; }
    location ^~ /tests/     { return 404; }
    location ^~ /scripts/   { return 404; }
    location ^~ /scratchpad/{ return 404; }
    location ^~ /.github/   { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; add_header Cache-Control "no-cache" always; }

    # Corps de requête : le site ne reçoit aucun envoi (tout passe par api.teamop.fr).
    client_max_body_size 1m;

    access_log /var/log/nginx/teamop.fr.access.log;
    error_log  /var/log/nginx/teamop.fr.error.log;
}
